name: Build ATEEM STORE APK — React Native (Native)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3. Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 4. Install dependencies
      - name: Install npm dependencies
        run: npm install

      # 5. Generate the native android/ project from the RN source
      #    (this replaces "npx cap add android" from the Capacitor pipeline —
      #    prebuild turns App.js + app.json into a real native Gradle project)
      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --no-install

      # 6. Restore release keystore
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/release.keystore

      # 7. Verify keystore
      - name: Verify keystore
        run: |
          test -s android/app/release.keystore
          ls -lh android/app/release.keystore
          file android/app/release.keystore

      # 8. Test release keystore
      - name: Test release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list \
            -keystore android/app/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

      # 9. Configure release signing
      - name: Configure release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle")
          text = path.read_text()
          MARKER = "ATEEM_RELEASE_SIGNING_CONFIG"
          if MARKER not in text:
              signing = """

          // """ + MARKER + """ - do not remove this marker comment

          android {

              signingConfigs {

                  ateemRelease {

                      storeFile file(
                          "release.keystore"
                      )

                      storePassword System.getenv(
                          "ATEEM_STORE_PASSWORD"
                      )

                      keyAlias System.getenv(
                          "ATEEM_KEY_ALIAS"
                      )

                      keyPassword System.getenv(
                          "ATEEM_KEY_PASSWORD"
                      )
                  }
              }

              buildTypes {

                  release {

                      signingConfig signingConfigs.ateemRelease

                      minifyEnabled false
                  }
              }
          }

          """
              text += signing
              path.write_text(text)
              print("Release signing config appended.")
          else:
              print("Marker already present - skipping.")
          print("---- build.gradle tail ----")
          print(path.read_text()[-1500:])
          PY

      # 10. Build release APK
      - name: Build release APK
        working-directory: android
        env:
          ATEEM_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ATEEM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ATEEM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Checking signing configuration..."
          test -n "$ATEEM_STORE_PASSWORD"
          test -n "$ATEEM_KEY_ALIAS"
          test -n "$ATEEM_KEY_PASSWORD"
          test -s app/release.keystore
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

      # 11. List build outputs
      - name: List build outputs
        run: |
          echo "=== Searching for any APK files produced ==="
          find android/app/build/outputs -type f -name "*.apk" 2>/dev/null || true

      # 12. Upload APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ateem-store-apk-native
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
