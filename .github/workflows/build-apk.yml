name: Build ATEEM STORE APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v4


      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18


      # 3. Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      # 4. Install dependencies
      - name: Install npm dependencies
        run: npm install


      # 5. Add Android
      - name: Add Android platform
        run: npx cap add android


      # 6. Generate app icons
      - name: Generate app icons
        run: |
          npm install -D @capacitor/assets

          mkdir -p resources

          cp www/assets/logo.png resources/icon.png

          npx capacitor-assets generate \
            --android \
            --iconBackgroundColor '#F5F0E8' \
            --iconBackgroundColorDark '#F5F0E8'

      # 7. Create Native Android shell (native header + native bottom nav + web chat panel)
      - name: Create native Android shell
        run: |

          mkdir -p android/app/src/main/java/com/ateem/store
          mkdir -p android/app/src/main/res/drawable

          # ==========================================
          # MainActivity.java
          # ==========================================

          cat > android/app/src/main/java/com/ateem/store/MainActivity.java << 'EOF'
          package com.ateem.store;

          import android.annotation.SuppressLint;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.WebView;

          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebViewClient;

          import java.io.BufferedReader;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends BridgeActivity {

              private NativeNavigation nativeNavigation;

              private NativeHeader nativeHeader;

              private WebView webView;

              private String ateemWidgetJs;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(
                  Bundle savedInstanceState
              ) {

                  super.onCreate(savedInstanceState);


                  /*
                   * Full screen.
                   */

                  Window window = getWindow();

                  window.addFlags(
                      WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
                  );


                  hideSystemUI();


                  /*
                   * WebView.
                   */

                  webView =
                      getBridge().getWebView();


                  if (webView != null) {

                      webView.setBackgroundColor(
                          Color.rgb(245, 240, 232)
                      );

                      webView.getSettings()
                          .setJavaScriptEnabled(true);


                      /*
                       * طھط­ظ…ظٹظ„ ظƒظˆط¯ ظ„ظˆط­ط© ط§ظ„ط´ط§طھ ط¨ظˆطھ ظپظ‚ط·
                       * (ط¨ط¯ظˆظ† ط§ظ„ظ‡ظٹط¯ط±طŒ ظ„ط£ظ† ط§ظ„ظ‡ظٹط¯ط± ط£طµط¨ط­ Native).
                       * ظٹطھظ… ط­ظ‚ظ†ظ‡ ط¨ط¹ط¯ ظƒظ„ طھط­ظ…ظٹظ„ طµظپط­ط©طŒ ظˆط²ط±
                       * ط§ظ„ط¨ظˆطھ ط§ظ„ظ€ native ظ‡ظˆ ط§ظ„ظ„ظٹ ط¨ظٹظپطھط­ظ‡.
                       */

                      ateemWidgetJs =
                          loadAsset(
                              "inject/ateem_widget_inject.js"
                          );

                      webView.setWebViewClient(
                          new BridgeWebViewClient(getBridge()) {

                              @Override
                              public void onPageFinished(
                                  WebView view,
                                  String url
                              ) {

                                  super.onPageFinished(
                                      view,
                                      url
                                  );

                                  injectAteemWidget(
                                      view
                                  );

                                  if (nativeNavigation != null) {

                                      nativeNavigation.syncActiveFromUrl(
                                          url
                                      );
                                  }
                              }
                          }
                      );
                  }


                  /*
                   * Bottom Navigation (native, pill/beam design).
                   */

                  nativeNavigation =
                      new NativeNavigation(
                          this,
                          webView
                      );

                  nativeNavigation.attach();


                  /*
                   * Header (native) + ط²ط± ط§ظ„ط¨ظˆطھ.
                   * ط§ظ„ط¨ط§ط± ط§ظ„ط³ظپظ„ظٹ ظپظˆظ‚طŒ ظˆط§ظ„ظ‡ظٹط¯ط± ظپظˆظ‚ ط§ظ„ط´ط§ط´ط©طŒ
                   * ط§ظ„ط§طھظ†ظٹظ† Views ط­ظ‚ظٹظ‚ظٹط© ط¬ظˆظ‡ ظ†ظپط³ rootContainer.
                   */

                  nativeHeader =
                      new NativeHeader(
                          this,
                          this::onAteemChatButtonClick
                      );

                  nativeHeader.attachTo(
                      nativeNavigation.getRootContainer()
                  );
              }


              public NativeNavigation getNativeNavigation() {
                  return nativeNavigation;
              }


              private void onAteemChatButtonClick() {

                  if (webView == null) {
                      return;
                  }

                  webView.evaluateJavascript(
                      "(function(){ if (typeof window.openAteemPanel === 'function') { window.openAteemPanel(); } })();",
                      null
                  );
              }


              @Override
              public void onWindowFocusChanged(
                  boolean hasFocus
              ) {

                  super.onWindowFocusChanged(
                      hasFocus
                  );

                  if (hasFocus) {
                      hideSystemUI();
                  }
              }


              private void hideSystemUI() {

                  View decorView =
                      getWindow().getDecorView();


                  decorView.setSystemUiVisibility(

                        View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY

                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE

                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION

                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN

                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION

                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                  );
              }


              private void injectAteemWidget(
                  WebView view
              ) {

                  if (
                      view == null
                      ||
                      ateemWidgetJs == null
                      ||
                      ateemWidgetJs.isEmpty()
                  ) {
                      return;
                  }

                  view.evaluateJavascript(
                      ateemWidgetJs,
                      null
                  );
              }


              private String loadAsset(
                  String path
              ) {

                  StringBuilder builder =
                      new StringBuilder();

                  try (
                      InputStream is =
                          getAssets().open(path);

                      BufferedReader reader =
                          new BufferedReader(
                              new InputStreamReader(
                                  is,
                                  StandardCharsets.UTF_8
                              )
                          )
                  ) {

                      String line;

                      while (
                          (line = reader.readLine())
                          != null
                      ) {
                          builder.append(line)
                                 .append('\n');
                      }

                  } catch (IOException e) {

                      e.printStackTrace();
                  }

                  return builder.toString();
              }
          }

