                  item.addView(
                      glowWrap,
                      new LinearLayout.LayoutParams(
                          dp(46),
                          dp(27)
                      )
                  );

                  icons.add(
                      icon
                  );


                  TextView labelView =
                      new TextView(
                          activity
                      );

                  labelView.setText(
                      label
                  );

                  labelView.setTextSize(
                      9.5f
                  );

                  labelView.setTextColor(
                      CREAM_FAINT
                  );

                  labelView.setGravity(
                      Gravity.CENTER
                  );

                  LinearLayout.LayoutParams labelParams =
                      new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      );

                  labelParams.topMargin =
                      dp(2);

                  item.addView(
                      labelView,
                      labelParams
                  );

                  labels.add(
                      labelView
                  );


                  return item;
              }


              private void onItemClick(
                  int index
              ) {

                  if (index == activeIndex) {
                      return;
                  }

                  setActiveIndex(
                      index,
                      true
                  );

                  navigate(
                      paths[index]
                  );
              }


              private void setActiveIndex(
                  int index,
                  boolean animate
              ) {

                  activeIndex =
                      index;

                  updateVisualState(
                      index,
                      animate
                  );

                  if (animate) {
                      animateBeamTo(index);
                  } else {
                      snapBeamTo(index);
                  }
              }


              private void updateVisualState(
                  int activeIdx,
                  boolean animate
              ) {

                  for (int i = 0; i < items.size(); i++) {

                      boolean isActive =
                          (i == activeIdx);

                      ImageView icon =
                          icons.get(i);

                      TextView label =
                          labels.get(i);

                      View glow =
                          glows.get(i);

                      LinearLayout item =
                          items.get(i);

                      int targetColor =
                          isActive
                              ? CREAM
                              : CREAM_FAINT;

                      icon.setColorFilter(
                          targetColor
                      );

                      label.setTextColor(
                          targetColor
                      );

                      label.setTypeface(
                          null,
                          isActive
                              ? Typeface.BOLD
                              : Typeface.NORMAL
                      );

                      float targetTranslationY =
                          isActive
                              ? -dp(3)
                              : 0f;

                      float targetGlowAlpha =
                          isActive
                              ? 1f
                              : 0f;

                      if (animate) {

                          item.animate()
                              .translationY(targetTranslationY)
                              .setDuration(300)
                              .start();

                          glow.animate()
                              .alpha(targetGlowAlpha)
                              .setDuration(300)
                              .start();

                      } else {

                          item.setTranslationY(
                              targetTranslationY
                          );

                          glow.setAlpha(
                              targetGlowAlpha
                          );
                      }
                  }
              }


              private void snapBeamTo(
                  int index
              ) {

                  if (
                      beam == null
                      ||
                      index < 0
                      ||
                      index >= items.size()
                  ) {
                      return;
                  }

                  LinearLayout item =
                      items.get(index);

                  int normalWidth =
                      Math.min(
                          dp(46),
                          (int) (item.getWidth() * 0.5f)
                      );

                  if (normalWidth <= 0) {
                      normalWidth = dp(46);
                  }

                  float itemCenter =
                      item.getLeft()
                      + item.getWidth() / 2f;

                  FrameLayout.LayoutParams params =
                      (FrameLayout.LayoutParams)
                      beam.getLayoutParams();

                  params.width =
                      normalWidth;

                  beam.setLayoutParams(
                      params
                  );

                  beam.setTranslationX(
                      itemCenter - normalWidth / 2f
                  );
              }


              private void animateBeamTo(
                  int index
              ) {

                  if (
                      beam == null
                      ||
                      index < 0
                      ||
                      index >= items.size()
                  ) {
                      return;
                  }

                  LinearLayout item =
                      items.get(index);

                  int normalWidth =
                      Math.min(
                          dp(46),
                          (int) (item.getWidth() * 0.5f)
                      );

                  if (normalWidth <= 0) {
                      normalWidth = dp(46);
                  }

                  float itemCenter =
                      item.getLeft()
                      + item.getWidth() / 2f;

                  float targetX =
                      itemCenter - normalWidth / 2f;

                  int startWidth =
                      beam.getLayoutParams().width;

                  float startX =
                      beam.getTranslationX();

                  final int finalNormalWidth =
                      normalWidth;

                  ValueAnimator animator =
                      ValueAnimator.ofFloat(
                          0f,
                          1f
                      );

                  animator.setDuration(
                      380
                  );

                  animator.setInterpolator(
                      new OvershootInterpolator(
                          0.6f
                      )
                  );

                  animator.addUpdateListener(
                      anim -> {

                          float fraction =
                              (float) anim.getAnimatedValue();

                          int currentWidth =
                              (int) (
                                  startWidth
                                  + (finalNormalWidth - startWidth)
                                  * fraction
                              );

                          float currentX =
                              startX
                              + (targetX - startX)
                              * fraction;

                          FrameLayout.LayoutParams params =
                              (FrameLayout.LayoutParams)
                              beam.getLayoutParams();

                          params.width =
                              currentWidth;

                          beam.setLayoutParams(
                              params
                          );

                          beam.setTranslationX(
                              currentX
                          );
                      }
                  );

                  animator.start();
              }


              /*
               * طھظڈط³طھط¯ط¹ظ‰ ظ…ظ† MainActivity ط¨ط¹ط¯ ظƒظ„ طھط­ظ…ظٹظ„ طµظپط­ط©
               * ط¹ط´ط§ظ† ظ†ط²ط§ظ…ظ† ط§ظ„ط¹ظ†طµط± ط§ظ„ظ†ط´ط· ظ…ط¹ ط§ظ„ط±ط§ط¨ط· ط§ظ„ط­ط§ظ„ظٹ ظپط¹ظ„ظٹط§ظ‹
               * (ظ…ط«ظ„ط§ظ‹ ظ„ظˆ ط§ظ„ظ…ط³طھط®ط¯ظ… ط¶ط؛ط· ط±ط§ط¨ط· ط¬ظˆظ‡ ط§ظ„ظ…ظˆظ‚ط¹ ظ†ظپط³ظ‡).
               */

              public void syncActiveFromUrl(
                  String url
              ) {

                  if (url == null) {
                      return;
                  }

                  String path;

                  try {

                      android.net.Uri uri =
                          android.net.Uri.parse(url);

                      path =
                          uri.getPath();

                      if (path == null) {
                          path = "/";
                      }

                  } catch (Exception e) {

                      path = "/";
                  }

                  if (
                      path.length() > 1
                      &&
                      path.endsWith("/")
                  ) {
                      path =
                          path.substring(
                              0,
                              path.length() - 1
                          );
                  }


                  int bestIndex = 0;

                  int bestLength = -1;

                  for (int i = 0; i < paths.length; i++) {

                      String p =
                          paths[i];

                      boolean matches =
                          path.equals(p)
                          ||
                          (
                              !p.equals("/")
                              &&
                              path.startsWith(p + "/")
                          )
                          ||
                          (
                              !p.equals("/")
                              &&
                              path.equals(p)
                          );

                      if (
                          matches
                          &&
                          p.length() > bestLength
                      ) {

                          bestIndex =
                              i;

                          bestLength =
                              p.length();
                      }
                  }

                  if (bestIndex != activeIndex) {

                      setActiveIndex(
                          bestIndex,
                          true
                      );

                  } else {

                      /*
                       * ظ†ظپط³ ط§ظ„ط¹ظ†طµط±طŒ ط¨ط³ طھط£ظƒظٹط¯
                       * ط§ظ„ط­ط§ظ„ط© ط§ظ„ط¨طµط±ظٹط© ط¨ط¯ظˆظ† ط£ظ†ظٹظ…ظٹط´ظ†.
                       */

                      updateVisualState(
                          activeIndex,
                          false
                      );
                  }
              }


              /*
               * طھظڈط³طھط¯ط¹ظ‰ ظ…ظ† ط¹ظ†ط§طµط± native ط®ط§ط±ط¬ظٹط©
               * (ط²ظٹ ط±ط§ط¨ط· SHOP ظپظٹ ط§ظ„ظ‡ظٹط¯ط±) ط¹ط´ط§ظ†
               * طھظ†ظ‚ظ„ ط§ظ„طµظپط­ط© ظˆطھط­ط¯ظ‘ط« ط§ظ„ط¹ظ†طµط± ط§ظ„ظ†ط´ط· ظ…ط¹ط§ظ‹.
               */

              public void navigateToPath(
                  String path
              ) {

                  int index =
                      indexForPath(
                          path
                      );

                  if (index != activeIndex) {

                      setActiveIndex(
                          index,
                          true
                      );
                  }

                  navigate(
                      path
                  );
              }


              private int indexForPath(
                  String path
              ) {

                  for (int i = 0; i < paths.length; i++) {

                      if (paths[i].equals(path)) {
                          return i;
                      }
                  }

                  return activeIndex;
              }


              private void navigate(
                  String path
              ) {

                  if (webView == null) {
                      return;
                  }

                  String current =
                      webView.getUrl();

                  String base =
                      "https://www.ateem-store.com";

                  String target =
                      base + path;

                  if (
                      current != null
                      &&
                      current.equals(target)
                  ) {

                      return;
                  }

                  webView.loadUrl(
                      target
                  );
              }


              private int dp(
                  int value
              ) {

                  float density =

                      activity
                          .getResources()
                          .getDisplayMetrics()
                          .density;

                  return (int)
                      (
                          value * density
                          + 0.5f
                      );
              }
          }

