name: Build ATEEM STORE APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v4


      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18


      # 3. Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      # 4. Install dependencies
      - name: Install npm dependencies
        run: npm install


      # 5. Add Android
      - name: Add Android platform
        run: npx cap add android


      # 6. Generate app icons
      - name: Generate app icons
        run: |
          npm install -D @capacitor/assets

          mkdir -p resources

          cp www/assets/logo.png resources/icon.png

          npx capacitor-assets generate \
            --android \
            --iconBackgroundColor '#F5F0E8' \
            --iconBackgroundColorDark '#F5F0E8'

      # 7. Create Native Android shell (native header + native bottom nav + web chat panel)
      - name: Create native Android shell
        run: |

          mkdir -p android/app/src/main/java/com/ateem/store
          mkdir -p android/app/src/main/res/drawable

          # ==========================================
          # MainActivity.java
          # ==========================================

          cat > android/app/src/main/java/com/ateem/store/MainActivity.java << 'EOF'
          package com.ateem.store;

          import android.annotation.SuppressLint;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewTreeObserver;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.WebView;
          import android.widget.FrameLayout;

          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebViewClient;

          import java.io.BufferedReader;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.nio.charset.StandardCharsets;

          /*
           * الشاشة الرئيسية بالكامل Native (هيدر + بانر +
           * شبكة + فوتر داخل NativeHomeScreen)، وباقي صفحات
           * المتجر/المنتجات/السلة/الحساب تُعرض في WebView حي
           * (مع الشات بوت الذكي المحقون). البار السفلي Native
           * وثابت فوق الاتنين، وهو اللي يتحكم بأيهما ظاهر.
           */

          public class MainActivity
              extends BridgeActivity
              implements NativeNavigation.OnNavTargetListener {

              private NativeNavigation nativeNavigation;

              private NativeHomeScreen nativeHomeScreen;

              private View nativeHomeScreenView;

              private WebView webView;

              private String ateemWidgetJs;

              private boolean pendingAutoOpenChat = false;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(
                  Bundle savedInstanceState
              ) {

                  super.onCreate(savedInstanceState);


                  /*
                   * Full screen.
                   */

                  Window window = getWindow();

                  window.addFlags(
                      WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
                  );


                  hideSystemUI();


                  /*
                   * WebView (تُستخدم فقط لصفحات المتجر/المنتجات
                   * /السلة/الحساب — الرئيسية أصبحت Native بالكامل).
                   */

                  webView =
                      getBridge().getWebView();


                  if (webView != null) {

                      webView.setBackgroundColor(
                          Color.rgb(245, 240, 232)
                      );

                      webView.getSettings()
                          .setJavaScriptEnabled(true);

                      webView.setVisibility(
                          View.GONE
                      );


                      ateemWidgetJs =
                          loadAsset(
                              "inject/ateem_widget_inject.js"
                          );

                      webView.setWebViewClient(
                          new BridgeWebViewClient(getBridge()) {

                              @Override
                              public void onPageFinished(
                                  WebView view,
                                  String url
                              ) {

                                  super.onPageFinished(
                                      view,
                                      url
                                  );

                                  injectAteemWidget(
                                      view
                                  );

                                  if (pendingAutoOpenChat) {

                                      pendingAutoOpenChat = false;

                                      openAteemChatPanel();
                                  }
                              }
                          }
                      );
                  }


                  /*
                   * Bottom Navigation (native, pill/beam design).
                   * هي المتحكم الرئيسي بالتبديل بين الشاشة
                   * الـ Native وWebView (عبر OnNavTargetListener).
                   */

                  nativeNavigation =
                      new NativeNavigation(
                          this,
                          webView
                      );

                  nativeNavigation.setOnNavTargetListener(
                      this
                  );

                  nativeNavigation.attach();


                  /*
                   * الشاشة الرئيسية Native (هيدر + بانر + شبكة
                   * + فوتر) — تُضاف فوق الـ WebView في نفس
                   * الحاوية الجذر، وتظهر هي فقط في البداية.
                   */

                  nativeHomeScreen =
                      new NativeHomeScreen(
                          this,
                          this::onAteemChatButtonClick,
                          this::onCategoryOrFooterLinkClick
                      );

                  nativeHomeScreenView =
                      nativeHomeScreen.build();

                  FrameLayout root =
                      nativeNavigation.getRootContainer();

                  if (root != null) {

                      FrameLayout.LayoutParams homeParams =
                          new FrameLayout.LayoutParams(
                              FrameLayout.LayoutParams.MATCH_PARENT,
                              FrameLayout.LayoutParams.MATCH_PARENT
                          );

                      root.addView(
                          nativeHomeScreenView,
                          homeParams
                      );

                      nativeHomeScreenView.bringToFront();

                      /*
                       * البار السفلي يظل فوق الكل دايمًا.
                       */

                      View navView =
                          nativeNavigation.getNavBarView();

                      if (navView != null) {
                          navView.bringToFront();
                      }
                  }

                  linkWebViewInsets();
              }


              /*
               * يحصر الـ WebView وقاع الشاشة الـ Native فوق
               * البار السفلي مباشرة (بدون هيدر عائم الآن،
               * لأن الهيدر أصبح جزء من محتوى الرئيسية الـ Native).
               */

              private void linkWebViewInsets() {

                  final FrameLayout root =
                      nativeNavigation.getRootContainer();

                  if (root == null) {
                      return;
                  }

                  root.getViewTreeObserver().addOnGlobalLayoutListener(
                      new ViewTreeObserver.OnGlobalLayoutListener() {

                          @Override
                          public void onGlobalLayout() {

                              View navView =
                                  nativeNavigation.getNavBarView();

                              if (
                                  navView == null
                                  || navView.getHeight() == 0
                              ) {
                                  return;
                              }

                              root.getViewTreeObserver()
                                  .removeOnGlobalLayoutListener(this);

                              int bottomInset =
                                  navView.getHeight()
                                  + nativeNavigation.getNavBottomMargin();

                              nativeNavigation.setWebViewInsets(
                                  0,
                                  bottomInset
                              );

                              if (nativeHomeScreenView != null) {

                                  nativeHomeScreenView.setPadding(
                                      0,
                                      0,
                                      0,
                                      bottomInset
                                  );
                              }
                          }
                      }
                  );
              }


              public NativeNavigation getNativeNavigation() {
                  return nativeNavigation;
              }


              /*
               * ============== NativeNavigation.OnNavTargetListener ==============
               */

              @Override
              public void onHomeSelected() {

                  showNativeHome();
              }


              @Override
              public void onWebPathSelected(
                  String path,
                  int index
              ) {

                  showWebView(
                      path
                  );
              }


              private void showNativeHome() {

                  if (webView != null) {
                      webView.setVisibility(
                          View.GONE
                      );
                  }

                  if (nativeHomeScreenView != null) {
                      nativeHomeScreenView.setVisibility(
                          View.VISIBLE
                      );
                  }
              }


              private void showWebView(
                  String path
              ) {

                  if (nativeHomeScreenView != null) {
                      nativeHomeScreenView.setVisibility(
                          View.GONE
                      );
                  }

                  if (webView != null) {
                      webView.setVisibility(
                          View.VISIBLE
                      );
                  }

                  nativeNavigation.loadWebUrl(
                      path
                  );
              }


              /*
               * زر البوت جوه الهيدر الـ Native (في الرئيسية):
               * يفتح WebView على الصفحة الرئيسية الحية ويشغّل
               * لوحة الشات تلقائياً بمجرد التحميل، مع إبقاء
               * تاب "الرئيسية" مضيء لأنه نفس السياق.
               */

              private void onAteemChatButtonClick() {

                  pendingAutoOpenChat = true;

                  if (nativeHomeScreenView != null) {
                      nativeHomeScreenView.setVisibility(
                          View.GONE
                      );
                  }

                  if (webView != null) {
                      webView.setVisibility(
                          View.VISIBLE
                      );
                  }

                  nativeNavigation.loadWebUrl(
                      "/"
                  );
              }


              /*
               * بطاقات شبكة "our collections" وروابط الفوتر:
               * تفتح WebView على مسار حر (مش بالضرورة موجود
               * في تابات البار السفلي)، وتضيء تاب "المتجر".
               */

              private void onCategoryOrFooterLinkClick(
                  String path
              ) {

                  if (nativeHomeScreenView != null) {
                      nativeHomeScreenView.setVisibility(
                          View.GONE
                      );
                  }

                  if (webView != null) {
                      webView.setVisibility(
                          View.VISIBLE
                      );
                  }

                  nativeNavigation.openWebPath(
                      path,
                      1
                  );
              }


              private void openAteemChatPanel() {

                  if (webView == null) {
                      return;
                  }

                  webView.evaluateJavascript(
                      "(function(){ if (typeof window.openAteemPanel === 'function') { window.openAteemPanel(); } })();",
                      null
                  );
              }


              @Override
              public void onWindowFocusChanged(
                  boolean hasFocus
              ) {

                  super.onWindowFocusChanged(
                      hasFocus
                  );

                  if (hasFocus) {
                      hideSystemUI();
                  }
              }


              private void hideSystemUI() {

                  View decorView =
                      getWindow().getDecorView();


                  decorView.setSystemUiVisibility(

                        View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY

                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE

                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION

                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN

                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION

                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                  );
              }


              private void injectAteemWidget(
                  WebView view
              ) {

                  if (
                      view == null
                      ||
                      ateemWidgetJs == null
                      ||
                      ateemWidgetJs.isEmpty()
                  ) {
                      return;
                  }

                  view.evaluateJavascript(
                      ateemWidgetJs,
                      null
                  );
              }


              private String loadAsset(
                  String path
              ) {

                  StringBuilder builder =
                      new StringBuilder();

                  try (
                      InputStream is =
                          getAssets().open(path);

                      BufferedReader reader =
                          new BufferedReader(
                              new InputStreamReader(
                                  is,
                                  StandardCharsets.UTF_8
                              )
                          )
                  ) {

                      String line;

                      while (
                          (line = reader.readLine())
                          != null
                      ) {
                          builder.append(line)
                                 .append('\n');
                      }

                  } catch (IOException e) {

                      e.printStackTrace();
                  }

                  return builder.toString();
              }
          }

          EOF

          # ==========================================
          # NativeHeader.java
          # ==========================================

          cat > android/app/src/main/java/com/ateem/store/NativeHeader.java << 'EOF'
          package com.ateem.store;

          import android.app.Activity;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.graphics.drawable.RippleDrawable;
          import android.content.res.ColorStateList;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class NativeHeader {

              public interface OnChatClickListener {
                  void onChatClick();
              }

              private final Activity activity;

              private final OnChatClickListener chatClickListener;

              private LinearLayout headerRow;


              private final int INK_DARK  = Color.parseColor("#1A1A1A");
              private final int INK_MUTED = Color.parseColor("#7A6850");
              private final int GOLD      = Color.parseColor("#C9A84C");
              private final int NAVY      = Color.parseColor("#1B263B");
              private final int PAGE_BG   = Color.parseColor("#F5F0E8");

              private Typeface logoTypeface;
              private Typeface labelTypeface;


              public NativeHeader(
                  Activity activity,
                  OnChatClickListener chatClickListener
              ) {

                  this.activity =
                      activity;

                  this.chatClickListener =
                      chatClickListener;

                  this.logoTypeface =
                      Typeface.create(
                          "serif",
                          Typeface.BOLD
                      );

                  this.labelTypeface =
                      Typeface.create(
                          "sans-serif-light",
                          Typeface.NORMAL
                      );
              }


              public View getHeaderView() {
                  return headerRow;
              }


              public void attachTo(
                  FrameLayout container
              ) {

                  if (container == null) {
                      return;
                  }


                  headerRow =
                      new LinearLayout(
                          activity
                      );

                  headerRow.setOrientation(
                      LinearLayout.HORIZONTAL
                  );

                  /*
                   * نضبط اتجاه الهيدر يدويًا على LTR بشكل صريح
                   * (بدل الاعتماد على لغة الجهاز/التطبيق) عشان
                   * يضمن دائمًا نفس الترتيب المطلوب: SHOP + زر
                   * البوت على اليسار، وشعار ATEEM على أقصى اليمين،
                   * بغض النظر عن أي إعداد RTL عام على مستوى التطبيق.
                   */

                  headerRow.setLayoutDirection(
                      View.LAYOUT_DIRECTION_LTR
                  );

                  headerRow.setGravity(
                      Gravity.CENTER_VERTICAL
                  );

                  /*
                   * نفرض اتجاه RTL صراحة على صف الهيدر
                   * بدل ما نعتمد على لغة الجهاز، عشان
                   * العنصر الأول المضاف يظهر دايمًا
                   * أقصى اليمين مهما كانت إعدادات النظام.
                   */

                  headerRow.setLayoutDirection(
                      View.LAYOUT_DIRECTION_RTL
                  );

                  headerRow.setPadding(
                      dp(22),
                      dp(16),
                      dp(22),
                      dp(10)
                  );

                  headerRow.setBackgroundColor(
                      PAGE_BG
                  );


                  /*
                   * SHOP + زر البوت على اليسار،
                   * والشعار (ATEEM) على اليمين.
                   */

                  /*
                   * الشعار (ATEEM) أقصى اليمين أولاً،
                   * ثم SHOP + زر البوت على اليسار.
                   */

                  View brand =
                      buildBrand();

                  LinearLayout.LayoutParams brandParams =
                      new LinearLayout.LayoutParams(
                          0,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          1f
                      );

                  headerRow.addView(
                      brand,
                      brandParams
                  );


                  View actions =
                      buildActions();

                  headerRow.addView(
                      actions,
                      new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  );


                  FrameLayout.LayoutParams headerParams =
                      new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.TOP
                      );

                  container.addView(
                      headerRow,
                      headerParams
                  );

                  headerRow.bringToFront();
              }


              /*
               * تبني نفس صف الهيدر لكن كعنصر عادي (مو عائم)
               * يُستخدم داخل الصفحة الرئيسية الـ Native، حيث
               * يتمرر الهيدر مع باقي المحتوى بدل ما يكون ثابت.
               */

              public View buildStandalone() {

                  headerRow =
                      new LinearLayout(
                          activity
                      );

                  headerRow.setOrientation(
                      LinearLayout.HORIZONTAL
                  );

                  headerRow.setGravity(
                      Gravity.CENTER_VERTICAL
                  );

                  headerRow.setLayoutDirection(
                      View.LAYOUT_DIRECTION_RTL
                  );

                  headerRow.setPadding(
                      dp(22),
                      dp(20),
                      dp(22),
                      dp(10)
                  );

                  headerRow.setBackgroundColor(
                      PAGE_BG
                  );

                  View brand =
                      buildBrand();

                  LinearLayout.LayoutParams brandParams =
                      new LinearLayout.LayoutParams(
                          0,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          1f
                      );

                  headerRow.addView(
                      brand,
                      brandParams
                  );

                  View actions =
                      buildActions();

                  headerRow.addView(
                      actions,
                      new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  );

                  return headerRow;
              }


              private View buildBrand() {

                  LinearLayout wrap =
                      new LinearLayout(
                          activity
                      );

                  wrap.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  wrap.setGravity(
                      Gravity.END
                  );


                  TextView logo =
                      new TextView(
                          activity
                      );

                  logo.setText(
                      "ATEEM"
                  );

                  logo.setTextSize(
                      20
                  );

                  logo.setTypeface(
                      logoTypeface
                  );

                  logo.setTextColor(
                      INK_DARK
                  );

                  if (
                      android.os.Build.VERSION.SDK_INT
                      >= android.os.Build.VERSION_CODES.LOLLIPOP
                  ) {
                      logo.setLetterSpacing(
                          0.20f
                      );
                  }

                  wrap.addView(
                      logo
                  );


                  /*
                   * خط ذهبي رفيع تحت الشعار.
                   */

                  View underline =
                      new View(
                          activity
                      );

                  GradientDrawable underlineBg =
                      new GradientDrawable(
                          GradientDrawable.Orientation.LEFT_RIGHT,
                          new int[] {
                              GOLD,
                              Color.TRANSPARENT
                          }
                      );

                  underline.setBackground(
                      underlineBg
                  );

                  LinearLayout.LayoutParams underlineParams =
                      new LinearLayout.LayoutParams(
                          dp(32),
                          dp(1)
                      );

                  underlineParams.topMargin =
                      dp(4);

                  wrap.addView(
                      underline,
                      underlineParams
                  );

                  return wrap;
              }


              private View buildActions() {

                  LinearLayout row =
                      new LinearLayout(
                          activity
                      );

                  row.setOrientation(
                      LinearLayout.HORIZONTAL
                  );

                  row.setGravity(
                      Gravity.CENTER_VERTICAL
                  );

                  row.setLayoutDirection(
                      View.LAYOUT_DIRECTION_RTL
                  );


                  TextView shop =
                      new TextView(
                          activity
                      );

                  shop.setText(
                      "SHOP"
                  );

                  shop.setTextSize(
                      11
                  );

                  shop.setTextColor(
                      INK_MUTED
                  );

                  shop.setTypeface(
                      labelTypeface
                  );

                  if (
                      android.os.Build.VERSION.SDK_INT
                      >= android.os.Build.VERSION_CODES.LOLLIPOP
                  ) {
                      shop.setLetterSpacing(
                          0.15f
                      );
                  }

                  LinearLayout.LayoutParams shopParams =
                      new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      );

                  shopParams.leftMargin =
                      dp(16);

                  shop.setPadding(
                      dp(4), dp(6), dp(4), dp(6)
                  );

                  row.addView(
                      shop,
                      shopParams
                  );

                  shop.setOnClickListener(
                      v -> {

                          if (
                              activity
                              instanceof
                              MainActivity
                          ) {

                              ((MainActivity) activity)
                                  .getNativeNavigation()
                                  .navigateToPath(
                                      "/shop"
                                  );
                          }
                      }
                  );


                  /*
                   * زر البوت الدائري (نفس شكل النسخة الويب).
                   */

                  FrameLayout chatBtn =
                      new FrameLayout(
                          activity
                      );

                  GradientDrawable chatBg =
                      new GradientDrawable();

                  chatBg.setShape(
                      GradientDrawable.OVAL
                  );

                  chatBg.setColor(
                      NAVY
                  );

                  chatBtn.setBackground(
                      chatBg
                  );

                  if (
                      android.os.Build.VERSION.SDK_INT
                      >= android.os.Build.VERSION_CODES.LOLLIPOP
                  ) {

                      RippleDrawable ripple =
                          new RippleDrawable(
                              ColorStateList.valueOf(
                                  Color.argb(60, 212, 169, 122)
                              ),
                              chatBg,
                              null
                          );

                      chatBtn.setBackground(
                          ripple
                      );
                  }

                  chatBtn.setElevation(
                      dp(4)
                  );

                  ImageView chatIcon =
                      new ImageView(
                          activity
                      );

                  chatIcon.setImageResource(
                      R.drawable.ic_header_chat
                  );

                  FrameLayout.LayoutParams iconParams =
                      new FrameLayout.LayoutParams(
                          dp(15),
                          dp(15),
                          Gravity.CENTER
                      );

                  chatBtn.addView(
                      chatIcon,
                      iconParams
                  );

                  LinearLayout.LayoutParams chatBtnParams =
                      new LinearLayout.LayoutParams(
                          dp(36),
                          dp(36)
                      );

                  row.addView(
                      chatBtn,
                      chatBtnParams
                  );

                  chatBtn.setOnClickListener(
                      v -> {

                          if (chatClickListener != null) {
                              chatClickListener.onChatClick();
                          }
                      }
                  );

                  return row;
              }


              private int dp(
                  int value
              ) {

                  float density =

                      activity
                          .getResources()
                          .getDisplayMetrics()
                          .density;

                  return (int)
                      (
                          value * density
                          + 0.5f
                      );
              }
          }

