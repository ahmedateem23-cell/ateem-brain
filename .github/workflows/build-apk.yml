name: Build ATEEM STORE APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. تحميل المشروع
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. إعداد Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3. إعداد Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 4. تثبيت Dependencies
      - name: Install npm dependencies
        run: npm install

      # 5. إضافة Android
      - name: Add Android platform
        run: npx cap add android

      # 6. إنشاء أيقونات التطبيق
      - name: Generate app icons from logo
        run: |
          npm install -D @capacitor/assets
          mkdir -p resources
          cp www/assets/logo.png resources/icon.png
          npx capacitor-assets generate --android --iconBackgroundColor '#F8F6F2'

      # 7. إعداد Fullscreen
      - name: Apply fullscreen MainActivity patch
        run: |
          mkdir -p android/app/src/main/java/com/ateem/store

          cat > android/app/src/main/java/com/ateem/store/MainActivity.java << 'EOF'
          package com.ateem.store;

          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);

              getWindow().addFlags(
                  WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
              );

              hideSystemUI();
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);

              if (hasFocus) {
                hideSystemUI();
              }
            }

            private void hideSystemUI() {
              View decorView = getWindow().getDecorView();

              decorView.setSystemUiVisibility(
                    View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                  | View.SYSTEM_UI_FLAG_FULLSCREEN
              );
            }
          }
          EOF

      # 8. مزامنة Capacitor
      - name: Sync Capacitor
        run: npx cap sync android

      # 9. استعادة Keystore من GitHub Secret
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

          if [ ! -s android/app/release.keystore ]; then
            echo "ERROR: Keystore was not created correctly."
            exit 1
          fi

          echo "Keystore restored successfully."

      # 10. إعداد توقيع Release
      - name: Configure release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          text = p.read_text()

          text += '''

          android {
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          '''

          p.write_text(text)
          PY

      # 11. التأكد من وجود القيم المطلوبة
      - name: Verify signing configuration
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS secret is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD secret is missing."
            exit 1
          fi

          echo "Signing secrets are available."

      # 12. جعل Gradle قابلاً للتنفيذ
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # 13. بناء APK Release
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      # 14. التحقق من وجود APK
      - name: Verify APK
        run: |
          if [ ! -f android/app/build/outputs/apk/release/app-release.apk ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          ls -lh android/app/build/outputs/apk/release/app-release.apk

      # 15. رفع APK كـ Artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ateem-store-apk
          path: android/app/build/outputs/apk/release/app-release.apk
