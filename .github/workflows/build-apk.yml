                          dp(46),
                          dp(3),
                          Gravity.TOP
                          | Gravity.START
                      );

                  bar.addView(
                      beam,
                      beamParams
                  );


                  for (int i = 0; i < paths.length; i++) {

                      final int index = i;

                      LinearLayout item =
                          createItem(
                              iconRes[i],
                              labelText[i]
                          );

                      LinearLayout.LayoutParams itemParams =
                          new LinearLayout.LayoutParams(
                              0,
