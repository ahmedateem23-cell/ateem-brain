          package com.ateem.store;

          import android.app.Activity;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.graphics.drawable.RippleDrawable;
          import android.content.res.ColorStateList;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class NativeHeader {

              public interface OnChatClickListener {
                  void onChatClick();
              }

              private final Activity activity;

              private final OnChatClickListener chatClickListener;

              private LinearLayout headerRow;


              private final int INK_DARK  = Color.parseColor("#1A1A1A");
              private final int INK_MUTED = Color.parseColor("#7A6850");
              private final int GOLD      = Color.parseColor("#B8936A");
              private final int NAVY      = Color.parseColor("#1B263B");


              public NativeHeader(
                  Activity activity,
                  OnChatClickListener chatClickListener
              ) {

                  this.activity =
                      activity;

                  this.chatClickListener =
                      chatClickListener;
              }


              public void attachTo(
                  FrameLayout container
              ) {

                  if (container == null) {
                      return;
                  }


                  headerRow =
                      new LinearLayout(
                          activity
                      );

                  headerRow.setOrientation(
                      LinearLayout.HORIZONTAL
                  );

                  headerRow.setGravity(
                      Gravity.CENTER_VERTICAL
                  );

                  headerRow.setPadding(
                      dp(22),
                      dp(16),
                      dp(22),
                      dp(10)
                  );


                  /*
                   * ط§ظ„ط´ط¹ط§ط± (ATEEM) ط¹ظ„ظ‰ ط§ظ„ظٹظ…ظٹظ†طŒ
                   * ظˆSHOP + ط²ط± ط§ظ„ط¨ظˆطھ ط¹ظ„ظ‰ ط§ظ„ظٹط³ط§ط±طŒ
                   * ط¨ظ†ظپط³ طھط±طھظٹط¨ ط§ظ„ظ†ط³ط®ط© ط§ظ„ظˆظٹط¨ (RTL).
                   */

                  View brand =
                      buildBrand();

                  LinearLayout.LayoutParams brandParams =
                      new LinearLayout.LayoutParams(
                          0,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
