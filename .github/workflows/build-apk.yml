                              ((MainActivity) activity)
                                  .getNativeNavigation()
                                  .navigateToPath(
                                      "/shop"
                                  );
                          }
                      }
                  );


                  /*
                   * ط²ط± ط§ظ„ط¨ظˆطھ ط§ظ„ط¯ط§ط¦ط±ظٹ (ظ†ظپط³ ط´ظƒظ„ ط§ظ„ظ†ط³ط®ط© ط§ظ„ظˆظٹط¨).
                   */

                  FrameLayout chatBtn =
                      new FrameLayout(
                          activity
                      );

                  GradientDrawable chatBg =
                      new GradientDrawable();

                  chatBg.setShape(
                      GradientDrawable.OVAL
                  );

                  chatBg.setColor(
                      NAVY
                  );

                  chatBtn.setBackground(
                      chatBg
                  );

                  if (
                      android.os.Build.VERSION.SDK_INT
                      >= android.os.Build.VERSION_CODES.LOLLIPOP
                  ) {

                      RippleDrawable ripple =
                          new RippleDrawable(
                              ColorStateList.valueOf(
                                  Color.argb(60, 212, 169, 122)
                              ),
                              chatBg,
                              null
                          );

                      chatBtn.setBackground(
                          ripple
                      );
                  }

                  chatBtn.setElevation(
                      dp(4)
                  );

                  ImageView chatIcon =
                      new ImageView(
                          activity
                      );

                  chatIcon.setImageResource(
                      R.drawable.ic_header_chat
                  );

                  FrameLayout.LayoutParams iconParams =
                      new FrameLayout.LayoutParams(
                          dp(15),
                          dp(15),
                          Gravity.CENTER
                      );

                  chatBtn.addView(
                      chatIcon,
                      iconParams
                  );

                  LinearLayout.LayoutParams chatBtnParams =
                      new LinearLayout.LayoutParams(
                          dp(36),
                          dp(36)
                      );

                  row.addView(
                      chatBtn,
                      chatBtnParams
                  );

                  chatBtn.setOnClickListener(
                      v -> {

                          if (chatClickListener != null) {
                              chatClickListener.onChatClick();
                          }
                      }
                  );

                  return row;
              }


              private int dp(
                  int value
              ) {

                  float density =

                      activity
                          .getResources()
                          .getDisplayMetrics()
                          .density;

                  return (int)
                      (
                          value * density
                          + 0.5f
                      );
              }
          }

