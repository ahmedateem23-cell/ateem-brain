          package com.ateem.store;

          import android.animation.ValueAnimator;
          import android.app.Activity;
          import android.content.res.ColorStateList;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.graphics.drawable.RippleDrawable;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.ViewTreeObserver;
          import android.view.animation.OvershootInterpolator;
          import android.webkit.WebView;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import java.util.ArrayList;
          import java.util.List;

          public class NativeNavigation {

              private final Activity activity;

              private final WebView webView;

              private FrameLayout rootContainer;

              private FrameLayout navBar;

              private View beam;

              private final List<LinearLayout> items = new ArrayList<>();

              private final List<ImageView> icons = new ArrayList<>();

              private final List<TextView> labels = new ArrayList<>();

              private final List<View> glows = new ArrayList<>();

              private final String[] paths = {
                  "/", "/shop", "/shop/cart", "/my/account"
              };

              private final int[] iconRes = {
                  R.drawable.ic_nav_home,
                  R.drawable.ic_nav_shop,
                  R.drawable.ic_nav_cart,
                  R.drawable.ic_nav_account
              };

              private final String[] labelText = {
                  "ط§ظ„ط±ط¦ظٹط³ظٹط©", "ط§ظ„ظ…طھط¬ط±", "ط§ظ„ط³ظ„ط©", "ط­ط³ط§ط¨ظٹ"
              };

              private int activeIndex = 0;


              private final int NAVY        = Color.parseColor("#1B2A3D");
              private final int CREAM       = Color.parseColor("#F0EAE0");
              private final int CREAM_FAINT = Color.argb(97, 240, 234, 224); // ~38%


              public NativeNavigation(
                  Activity activity,
                  WebView webView
              ) {

                  this.activity =
                      activity;

                  this.webView =
                      webView;
              }


              public FrameLayout getRootContainer() {
                  return rootContainer;
              }


              public void attach() {

                  if (webView == null) {
                      return;
                  }


                  ViewGroup webViewParent =
                      (ViewGroup)
                      webView.getParent();


                  if (webViewParent == null) {
                      return;
                  }


                  rootContainer =
                      new FrameLayout(
                          activity
                      );


                  ViewGroup.LayoutParams rootParams =
                      new ViewGroup.LayoutParams(

                          ViewGroup.LayoutParams.MATCH_PARENT,

                          ViewGroup.LayoutParams.MATCH_PARENT
                      );


                  webViewParent.removeView(
                      webView
                  );


                  webViewParent.addView(
                      rootContainer,
                      rootParams
                  );


                  FrameLayout.LayoutParams webParams =
                      new FrameLayout.LayoutParams(

                          ViewGroup.LayoutParams.MATCH_PARENT,

                          ViewGroup.LayoutParams.MATCH_PARENT
                      );


                  rootContainer.addView(
                      webView,
                      webParams
                  );


                  navBar =
                      createNavigationBar();


                  FrameLayout.LayoutParams navParams =
                      new FrameLayout.LayoutParams(

                          dpMax(),

                          dp(66),

                          Gravity.BOTTOM
                          | Gravity.CENTER_HORIZONTAL
                      );

                  navParams.bottomMargin =
                      dp(14);


                  rootContainer.addView(
                      navBar,
                      navParams
                  );


                  navBar.bringToFront();


                  /*
                   * ظ†ظ†طھط¸ط± ط£ظˆظ„ layout ط¹ط´ط§ظ† ظ†ط­ط¯ط¯
                   * ظ…ظƒط§ظ† ط§ظ„ظ€ beam ظپظˆظ‚ ط§ظ„ط¹ظ†طµط± ط§ظ„ظ†ط´ط·
                   * ط¨ط¯ظˆظ† ط£ظ†ظٹظ…ظٹط´ظ† (snap).
                   */

                  navBar.getViewTreeObserver().addOnGlobalLayoutListener(
                      new ViewTreeObserver.OnGlobalLayoutListener() {

                          @Override
                          public void onGlobalLayout() {

                              navBar.getViewTreeObserver()
                                    .removeOnGlobalLayoutListener(this);

                              snapBeamTo(
                                  activeIndex
                              );

                              updateVisualState(
                                  activeIndex,
                                  false
                              );
                          }
                      }
                  );
              }


              /*
               * ط£ظ‚طµظ‰ ط¹ط±ط¶ ظ„ظ„ط¨ط§ط± = min(88% ظ…ظ† ط§ظ„ط´ط§ط´ط©, 380dp)
               * ط¨ظ†ظپط³ ظ…ظ†ط·ظ‚ ط§ظ„ظ†ط³ط®ط© ط§ظ„ظˆظٹط¨.
               */

              private int dpMax() {

                  int screenWidth =
                      activity
                          .getResources()
                          .getDisplayMetrics()
                          .widthPixels;

                  int eightyEightPercent =
                      (int) (screenWidth * 0.88f);

                  int maxWidthPx =
                      dp(380);

                  return Math.min(
                      eightyEightPercent,
                      maxWidthPx
                  );
              }


              private FrameLayout createNavigationBar() {

                  FrameLayout bar =
