              public View build() {

                  NestedScrollView scroll =
                      new NestedScrollView(
                          activity
                      );

                  scroll.setFillViewport(
                      true
                  );

                  scroll.setBackgroundColor(
                      PAGE_BG
                  );

                  LinearLayout column =
                      new LinearLayout(
                          activity
                      );

                  column.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  column.setBackgroundColor(
                      PAGE_BG
                  );

                  scroll.addView(
                      column,
                      new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  );


                  /*
                   * 1) الهيدر — نفس مكوّن NativeHeader لكن
                   * كعنصر عادي داخل التمرير (buildStandalone).
                   */

                  NativeHeader header =
                      new NativeHeader(
                          activity,
                          () -> {
                              if (chatClickListener != null) {
                                  chatClickListener.onChatClick();
                              }
                          }
                      );

                  column.addView(
                      header.buildStandalone(),
                      new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  );


                  /*
                   * 2) البانر (سلايدر صور تلقائي).
                   */

                  column.addView(
                      buildBanner(),
                      bannerContainerParams()
                  );


                  /*
                   * 3) عنوان "our collections" + شبكة 2×2.
                   */

                  column.addView(
                      buildCollectionsHeader()
                  );

                  column.addView(
                      buildCollectionsGrid()
                  );


                  /*
                   * 4) الفوتر.
                   */

                  column.addView(
                      buildFooter()
                  );


                  return scroll;
              }


