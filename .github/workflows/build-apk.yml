              public NativeHomeScreen(
                  Activity activity,
                  OnChatClickListener chatClickListener,
                  OnCategoryClickListener categoryClickListener
              ) {

                  this.activity =
                      activity;

                  this.chatClickListener =
                      chatClickListener;

                  this.categoryClickListener =
                      categoryClickListener;
