name: Build ATEEM STORE APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install npm dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons
        run: |
          npm install -D @capacitor/assets
          mkdir -p resources
          cp www/assets/logo.png resources/icon.png
          cp www/assets/logo.png resources/splash.png
          npx capacitor-assets generate \
            --android \
            --iconBackgroundColor '#F5F0E8' \
            --iconBackgroundColorDark '#F5F0E8' \
            --splashBackgroundColor '#F5F0E8' \
            --splashBackgroundColorDark '#F5F0E8'

      - name: Apply fullscreen MainActivity patch
        run: |
          mkdir -p android/app/src/main/java/com/ateem/store

          cat > android/app/src/main/java/com/ateem/store/MainActivity.java << 'EOF'
          package com.ateem.store;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);

              getWindow().addFlags(
                  WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
              );

              hideSystemUI();
              requestMicPermission();
              enableWebViewMic();
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);

              if (hasFocus) {
                hideSystemUI();
              }
            }

            private void hideSystemUI() {
              View decorView = getWindow().getDecorView();

              decorView.setSystemUiVisibility(
                    View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                  | View.SYSTEM_UI_FLAG_FULLSCREEN
              );
            }

            private void requestMicPermission() {
              if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO)
                  != PackageManager.PERMISSION_GRANTED) {
                ActivityCompat.requestPermissions(
                    this,
                    new String[]{Manifest.permission.RECORD_AUDIO},
                    1001
                );
              }
            }

            private void enableWebViewMic() {
              this.bridge.getWebView().setWebChromeClient(new WebChromeClient() {
                @Override
                public void onPermissionRequest(final PermissionRequest request) {
                  runOnUiThread(() -> request.grant(request.getResources()));
                }
              });
            }
          }
          EOF

      - name: Add microphone permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          if "RECORD_AUDIO" not in text:
              text = text.replace(
                  "<manifest",
                  '<uses-permission android:name="android.permission.RECORD_AUDIO" />\n<manifest',
                  1
              )
              path.write_text(text)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Verify keystore
        run: |
          ls -lh android/app/release.keystore
          file android/app/release.keystore
      - name: Test release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -list \
            -keystore android/app/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias ateemrelease
      - name: Configure release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          signing = r'''
          android {
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword System.getenv("ATEEM_STORE_PASSWORD")
                      keyAlias System.getenv("ATEEM_KEY_ALIAS")
                      keyPassword System.getenv("ATEEM_KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          '''

          text += "\n" + signing
          path.write_text(text)
          PY

      - name: Build release APK
        working-directory: android
        env:
          ATEEM_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ATEEM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ATEEM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Checking signing configuration..."
          test -n "$ATEEM_STORE_PASSWORD"
          test -n "$ATEEM_KEY_ALIAS"
          test -n "$ATEEM_KEY_PASSWORD"
          test -s app/release.keystore

          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ateem-store-apk
          path: android/app/build/outputs/apk/release/app-release.apk
