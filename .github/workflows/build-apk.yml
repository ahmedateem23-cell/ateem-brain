                  row.setGravity(
                      Gravity.CENTER
                  );

                  row.setPadding(
                      dp(6), 0, dp(6), 0
                  );

                  bar.addView(
                      row,
                      new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  );


                  /*
                   * ط§ظ„ط´ط¹ط§ط¹ (beam) ظپظٹ ط£ط¹ظ„ظ‰ ط§ظ„ط´ط±ظٹط·.
                   */

                  beam =
                      new View(
                          activity
                      );

                  GradientDrawable beamBg =
                      new GradientDrawable();

                  beamBg.setColor(
                      CREAM
                  );

                  beamBg.setCornerRadii(
                      new float[] {
                          0, 0, 0, 0, dp(4), dp(4), dp(4), dp(4)
                      }
                  );

                  beam.setBackground(
