name: Build ATEEM STORE APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v4


      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18


      # 3. Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      # 4. Install dependencies
      - name: Install npm dependencies
        run: npm install


      # 5. Add Android
      - name: Add Android platform
        run: npx cap add android


      # 6. Generate app icons and splash
      - name: Generate app icons
        run: |
          npm install -D @capacitor/assets

          mkdir -p resources

          cp www/assets/logo.png resources/icon.png
          cp www/assets/logo.png resources/splash.png

          npx capacitor-assets generate \
            --android \
            --iconBackgroundColor '#F5F0E8' \
            --iconBackgroundColorDark '#F5F0E8' \
            --splashBackgroundColor '#F5F0E8' \
            --splashBackgroundColorDark '#F5F0E8'


      # 7. Create Native Android shell
      - name: Create native Android shell
        run: |

          mkdir -p android/app/src/main/java/com/ateem/store


          # ================================
          # MainActivity.java
          # ================================

          cat > android/app/src/main/java/com/ateem/store/MainActivity.java << 'EOF'
          package com.ateem.store;

          import android.annotation.SuppressLint;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              private NativeNavigation nativeNavigation;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              public void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  Window window = getWindow();

                  window.addFlags(
                      WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
                  );

                  hideSystemUI();

                  WebView webView =
                      getBridge().getWebView();

                  if (webView != null) {

                      webView.setBackgroundColor(
                          Color.rgb(245, 240, 232)
                      );

                      webView.getSettings()
                          .setJavaScriptEnabled(true);
                  }

                  nativeNavigation =
                      new NativeNavigation(
                          this,
                          webView
                      );

                  nativeNavigation.attach();

                  if (webView != null) {

                      webView.setWebViewClient(
                          new WebViewClient() {

                              @Override
                              public void onPageFinished(
                                  WebView view,
                                  String url
                              ) {

                                  super.onPageFinished(
                                      view,
                                      url
                                  );

                                  view.postDelayed(
                                      () -> {

                                          if (
                                              nativeNavigation
                                              != null
                                          ) {

                                              nativeNavigation
                                                  .showSmoothly();
                                          }

                                      },
                                      500
                                  );
                              }
                          }
                      );
                  }
              }


              @Override
              public void onWindowFocusChanged(
                  boolean hasFocus
              ) {

                  super.onWindowFocusChanged(
                      hasFocus
                  );

                  if (hasFocus) {
                      hideSystemUI();
                  }
              }


              private void hideSystemUI() {

                  View decorView =
                      getWindow().getDecorView();

                  decorView.setSystemUiVisibility(

                        View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY

                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE

                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION

                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN

                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION

                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                  );
              }
          }
          EOF


          # ================================
          # NativeNavigation.java
          # ================================

          cat > android/app/src/main/java/com/ateem/store/NativeNavigation.java << 'EOF'
          package com.ateem.store;

          import android.app.Activity;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.WebView;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class NativeNavigation {

              private final Activity activity;

              private final WebView webView;

              private LinearLayout navigationBar;

              private final int NAVY =
                  Color.rgb(27, 42, 61);

              private final int CREAM =
                  Color.rgb(240, 234, 224);


              public NativeNavigation(
                  Activity activity,
                  WebView webView
              ) {

                  this.activity =
                      activity;

                  this.webView =
                      webView;
              }


              public void attach() {

                  if (webView == null) {
                      return;
                  }


                  ViewGroup parent =
                      (ViewGroup)
                      webView.getParent();


                  if (parent == null) {
                      return;
                  }


                  navigationBar =
                      createNavigationBar();


                  ViewGroup.LayoutParams params =
                      new ViewGroup.LayoutParams(

                          ViewGroup.LayoutParams.MATCH_PARENT,

                          dp(66)
                      );


                  parent.addView(
                      navigationBar,
                      params
                  );


                  /*
                   * Bottom Navigation مخفي بالكامل
                   * أثناء Splash.
                   */

                  navigationBar.setVisibility(
                      View.GONE
                  );


                  positionNavigation(
                      parent
                  );


                  webView.addOnLayoutChangeListener(
                      (
                          v,
                          left,
                          top,
                          right,
                          bottom,
                          oldLeft,
                          oldTop,
                          oldRight,
                          oldBottom
                      ) -> {

                          positionNavigation(
                              parent
                          );
                      }
                  );
              }


              public void showSmoothly() {

                  if (navigationBar == null) {
                      return;
                  }


                  if (
                      navigationBar.getVisibility()
                      == View.VISIBLE
                  ) {

                      return;
                  }


                  navigationBar.setVisibility(
                      View.VISIBLE
                  );


                  navigationBar.setAlpha(
                      0f
                  );


                  navigationBar.animate()
                      .alpha(1f)
                      .setDuration(350)
                      .start();
              }


              private LinearLayout
              createNavigationBar() {

                  LinearLayout bar =
                      new LinearLayout(
                          activity
                      );


                  bar.setOrientation(
                      LinearLayout.HORIZONTAL
                  );


                  bar.setGravity(
                      Gravity.CENTER
                  );


                  bar.setPadding(
                      dp(6),
                      0,
                      dp(6),
                      0
                  );


                  GradientDrawable background =
                      new GradientDrawable();


                  background.setColor(
                      NAVY
                  );


                  background.setCornerRadius(
                      dp(24)
                  );


                  bar.setBackground(
                      background
                  );


                  bar.setElevation(
                      dp(12)
                  );


                  addItem(
                      bar,
                      "⌂",
                      "الرئيسية",
                      "/"
                  );


                  addItem(
                      bar,
                      "▢",
                      "المتجر",
                      "/shop"
                  );


                  addItem(
                      bar,
                      "🛒",
                      "السلة",
                      "/shop/cart"
                  );


                  addItem(
                      bar,
                      "○",
                      "حسابي",
                      "/my/account"
                  );


                  return bar;
              }


              private void addItem(

                  LinearLayout bar,

                  String icon,

                  String label,

                  String path

              ) {

                  LinearLayout item =
                      new LinearLayout(
                          activity
                      );


                  item.setOrientation(
                      LinearLayout.VERTICAL
                  );


                  item.setGravity(
                      Gravity.CENTER
                  );


                  item.setClickable(
                      true
                  );


                  LinearLayout.LayoutParams itemParams =

                      new LinearLayout.LayoutParams(

                          0,

                          ViewGroup.LayoutParams.MATCH_PARENT,

                          1
                      );


                  bar.addView(
                      item,
                      itemParams
                  );


                  TextView iconView =
                      new TextView(
                          activity
                      );


                  iconView.setText(
                      icon
                  );


                  iconView.setTextSize(
                      20
                  );


                  iconView.setGravity(
                      Gravity.CENTER
                  );


                  iconView.setTextColor(
                      CREAM
                  );


                  item.addView(

                      iconView,

                      new LinearLayout.LayoutParams(

                          ViewGroup.LayoutParams.MATCH_PARENT,

                          dp(27)
                      )
                  );


                  TextView labelView =
                      new TextView(
                          activity
                      );


                  labelView.setText(
                      label
                  );


                  labelView.setTextSize(
                      9
                  );


                  labelView.setGravity(
                      Gravity.CENTER
                  );


                  labelView.setTextColor(
                      CREAM
                  );


                  item.addView(

                      labelView,

                      new LinearLayout.LayoutParams(

                          ViewGroup.LayoutParams.MATCH_PARENT,

                          dp(20)
                      )
                  );


                  item.setOnClickListener(
                      v -> navigate(path)
                  );
              }


              private void navigate(
                  String path
              ) {

                  if (webView == null) {
                      return;
                  }


                  String current =
                      webView.getUrl();


                  String base =
                      "https://www.ateem-store.com";


                  String target =
                      base + path;


                  if (
                      current != null
                      &&
                      current.equals(target)
                  ) {

                      return;
                  }


                  webView.loadUrl(
                      target
                  );
              }


              private void positionNavigation(
                  ViewGroup parent
              ) {

                  if (navigationBar == null) {
                      return;
                  }


                  navigationBar.bringToFront();


                  navigationBar.setTranslationY(
                      -dp(14)
                  );
              }


              private int dp(
                  int value
              ) {

                  float density =

                      activity
                          .getResources()
                          .getDisplayMetrics()
                          .density;


                  return (int)
                      (
                          value * density
                          + 0.5f
                      );
              }
          }
          EOF


      # 8. Sync Capacitor
      - name: Sync Capacitor
        run: npx cap sync android


      # 9. Restore release keystore
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/release.keystore


      # 10. Verify keystore
      - name: Verify keystore
        run: |

          test -s android/app/release.keystore

          ls -lh android/app/release.keystore

          file android/app/release.keystore


      # 11. Test release keystore
      - name: Test release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |

          keytool -list \
            -keystore android/app/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias ateemrelease


      # 12. Configure release signing
      - name: Configure release signing
        run: |

          python3 - <<'PY'

          from pathlib import Path

          path = Path(
              "android/app/build.gradle"
          )

          text = path.read_text()

          if "signingConfigs" not in text:

              signing = """

          android {

              signingConfigs {

                  release {

                      storeFile file(
                          "release.keystore"
                      )

                      storePassword System.getenv(
                          "ATEEM_STORE_PASSWORD"
                      )

                      keyAlias System.getenv(
                          "ATEEM_KEY_ALIAS"
                      )

                      keyPassword System.getenv(
                          "ATEEM_KEY_PASSWORD"
                      )
                  }
              }

              buildTypes {

                  release {

                      signingConfig
                          signingConfigs.release

                      minifyEnabled false
                  }
              }
          }

          """

              text += signing

              path.write_text(
                  text
              )

          PY


      # 13. Build release APK
      - name: Build release APK
        working-directory: android

        env:

          ATEEM_STORE_PASSWORD:
            ${{ secrets.KEYSTORE_PASSWORD }}

          ATEEM_KEY_ALIAS:
            ${{ secrets.KEY_ALIAS }}

          ATEEM_KEY_PASSWORD:
            ${{ secrets.KEY_PASSWORD }}

        run: |

          echo "Checking signing configuration..."

          test -n "$ATEEM_STORE_PASSWORD"

          test -n "$ATEEM_KEY_ALIAS"

          test -n "$ATEEM_KEY_PASSWORD"

          test -s app/release.keystore


          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace


      # 14. Verify APK
      - name: Verify APK
        run: |

          echo "Checking generated APK..."

          test -s \
            android/app/build/outputs/apk/release/app-release.apk

          ls -lh \
            android/app/build/outputs/apk/release/app-release.apk


      # 15. Upload APK artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4

        with:

          name: ateem-store-apk

          path: android/app/build/outputs/apk/release/app-release.apk

          if-no-files-found: error

          retention-days: 7


      # 16. Final build information
      - name: Build completed
        run: |

          echo ""
          echo "=========================================="
          echo "       ATEEM STORE APK SUCCESS"
          echo "=========================================="
          echo ""
          echo "APK successfully built."
          echo ""
          echo "Artifact:"
          echo "ateem-store-apk"
          echo ""
          echo "Open the completed GitHub Actions run"
          echo "and check the Artifacts section."
          echo ""
          echo "=========================================="
