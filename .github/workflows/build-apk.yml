      # 7.5 Create chat-panel injection asset (header removed - now native)
      - name: Create ATEEM widget injection asset
        run: |

          mkdir -p android/app/src/main/assets/inject

          cat > android/app/src/main/assets/inject/ateem_widget_inject.js << 'EOF'
          (function ATEEM_WIDGET_INJECT(){
            if (window.__ateemWidgetInjected) { return; }
            window.__ateemWidgetInjected = true;

            var path = window.location.pathname.replace(/\/+$/, "");
            var isHome    = (path === "" || path === "/");
            var isProduct = /^\/shop\/[a-z0-9-]+$/i.test(path);
            window.ATEEM_SHOULD_SHOW = isHome || isProduct;
            window.ATEEM_PAGE_TYPE   = isHome ? "home" : (isProduct ? "product" : "other");
            if (isProduct) window.ATEEM_PRODUCT_SLUG = path.replace("/shop/", "");

            var fontLink = document.createElement('link');
            fontLink.rel = 'stylesheet';
            fontLink.href = "https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,600&family=Montserrat:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500&display=swap";
            document.head.appendChild(fontLink);

            var style = document.createElement('style');
            style.id = 'ateem-widget-style';
            style.textContent = `
          :root {
            --ateem-cream:      #F5F0E8;
            --ateem-cream-deep: #EDE7DC;
            --ateem-gold:       #B8936A;
            --ateem-gold-light: #D4A97A;
            --ateem-gold-pale:  #E8D5C0;
            --ateem-ink-soft:   #3D3020;
            --ateem-ink-muted:  #7A6850;
            --ateem-ink-faint:  #B5A99A;
            --ateem-navy:       #1B263B;
            --ateem-navy-light: #2D3E56;
            --ateem-white:      #FFFFFF;
            --ateem-white-soft: #FAF8F5;
          }

          /* ═══ Panel Animations — دخول/خروج سينمائي من اليسار ═══ */
          @keyframes ateem-panelIn {
            0%   { opacity:0; transform:translateX(-100%) scale(0.96); }
            70%  { transform:translateX(3%) scale(1.01); }
            100% { opacity:1; transform:translateX(0) scale(1); }
          }
          @keyframes ateem-panelOut {
            0%   { opacity:1; transform:translateX(0) scale(1); }
            100% { opacity:0; transform:translateX(-100%) scale(0.96); }
          }
          @keyframes ateem-backdropIn {
            from { opacity:0; }
            to   { opacity:1; }
          }
          @keyframes ateem-backdropOut {
            from { opacity:1; }
            to   { opacity:0; }
          }
          @keyframes ateem-typingDot {
            0%,80%,100% { transform:scale(.6); opacity:.3; }
            40%          { transform:scale(1);  opacity:1; }
          }
          @keyframes ateem-recPulse {
            0%,100% { box-shadow:0 0 0 0 rgba(220,60,60,0.4); }
            50%      { box-shadow:0 0 0 8px rgba(220,60,60,0); }
          }
          @keyframes ateem-statusPulse {
            0%,100% { opacity:1; transform:scale(1); }
            50%      { opacity:.6; transform:scale(0.85); }
          }
          @keyframes ateem-msgAppear {
            from { opacity:0; transform:translateY(10px) scale(0.96); }
            to   { opacity:1; transform:translateY(0) scale(1); }
          }

          /* ═══ Backdrop Overlay ═══ */
          #ateem-backdrop {
            position:fixed; inset:0; background:rgba(27,38,59,0.25); backdrop-filter:blur(2px);
            z-index:2147483645; display:none; opacity:0;
          }
          #ateem-backdrop.active {
            display:block; animation:ateem-backdropIn 0.25s ease forwards;
          }
          #ateem-backdrop.closing {
            display:block; animation:ateem-backdropOut 0.2s ease forwards;
          }

          /* ═══ PANEL — درج فاخر يدخل من اليسار + رشيق الحجم ═══ */
          #ateem-panel {
            position:fixed;
            left:0; right:auto; top:16px; bottom:16px;
            width:88%; max-width:360px; height:auto;
            margin:0;
            background:var(--ateem-white-soft);
            backdrop-filter:blur(32px) saturate(140%);
            -webkit-backdrop-filter:blur(32px) saturate(140%);
            border-radius:0 24px 24px 0;
            overflow:hidden;
            z-index:2147483646;
            display:none; flex-direction:column;
            border:none;
            box-shadow:12px 0 60px rgba(27,38,59,0.15), 4px 0 20px rgba(27,38,59,0.08);
            font-family:'IBM Plex Sans Arabic',sans-serif;
            transform:translateX(-110%);
            transform-origin:center left;
            will-change:transform, opacity;
            padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
          }
          #ateem-panel.active  { display:flex; animation:ateem-panelIn 0.38s cubic-bezier(0.22,1,0.36,1) forwards; }
          #ateem-panel.closing { display:flex; animation:ateem-panelOut 0.28s cubic-bezier(0.55,0,1,0.45) forwards; }

          /* ═══ قفل تمرير الصفحة خلف الشات ═══ */
          body.ateem-panel-open { overflow:hidden; }

          /* ═══ CHAT HEADER ═══ */
          #ateem-panel .ateem-chat-header {
            position:relative; overflow:hidden;
            background:linear-gradient(135deg, var(--ateem-navy) 0%, var(--ateem-navy-light) 100%);
            padding:14px 16px; min-height:64px;
            display:flex; align-items:center; justify-content:space-between;
            border-bottom:1px solid rgba(184,147,106,0.20);
            flex-shrink:0;
          }
          #ateem-panel .ateem-chat-header-glow {
            position:absolute; width:140px; height:140px; border-radius:50%;
            background:radial-gradient(circle, rgba(184,147,106,.15) 0%, transparent 70%);
            top:-50px; left:-30px; pointer-events:none;
          }
          #ateem-panel .ateem-chat-header::after {
            content:''; position:absolute; bottom:0; left:0; right:0; height:1px;
            background:linear-gradient(90deg,transparent,rgba(184,147,106,0.50),transparent);
          }
          #ateem-panel .ateem-chat-header-content {
            display:flex; align-items:center; gap:10px; position:relative; z-index:1;
          }
          #ateem-panel .ateem-chat-logo-wrap {
            width:42px; height:42px; border-radius:50%;
            background:rgba(255,255,255,0.08);
            display:flex; align-items:center; justify-content:center;
            border:2px solid rgba(184,147,106,0.45);
            box-shadow:0 2px 12px rgba(0,0,0,0.20), inset 0 1px 0 rgba(255,255,255,0.08);
            flex-shrink:0; overflow:hidden;
          }
          #ateem-panel .ateem-chat-logo-img {
            width:100%; height:100%;
            object-fit:cover;
            object-position:center center;
            border-radius:50%;
            display:block;
          }
          #ateem-panel .ateem-chat-title {
            font-family:'Montserrat',sans-serif; font-size:12.5px; font-weight:600;
            color:var(--ateem-white); letter-spacing:.4px;
            text-shadow:0 1px 3px rgba(0,0,0,0.20);
          }
          #ateem-panel .ateem-chat-status-dot {
            display:inline-block; width:6px; height:6px; border-radius:50%;
            background:#5DDB7A; margin-right:5px;
            box-shadow:0 0 6px rgba(93,219,122,0.50);
            animation:ateem-statusPulse 2s ease-in-out infinite;
          }
          #ateem-panel .ateem-chat-sub {
            font-size:9px; color:var(--ateem-gold-light); margin-top:2px;
            letter-spacing:1px; font-family:'Montserrat',sans-serif; opacity:0.90;
          }
          #ateem-panel .ateem-chat-close {
            width:28px; height:28px; border:1.5px solid rgba(184,147,106,0.35); border-radius:50%;
            background:rgba(255,255,255,0.10); color:var(--ateem-white-soft); font-size:11px;
            cursor:pointer; position:relative; z-index:1; transition:.3s ease;
            backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center;
          }
          #ateem-panel .ateem-chat-close:hover {
            background:rgba(184,147,106,0.20);
            border-color:rgba(184,147,106,0.60);
            transform:rotate(90deg) scale(1.05);
            color:var(--ateem-gold-light);
          }

          /* ═══ CHAT AREA ═══ */
          #ateem-panel #ateem-chat {
            flex:1 1 auto;
            min-height:0;
            overflow-y:auto;
            overscroll-behavior:contain;
            padding:16px 14px;
            display:flex; flex-direction:column; gap:10px;
            scrollbar-width:thin; scrollbar-color:rgba(184,147,106,.22) transparent;
            background:linear-gradient(180deg, var(--ateem-white-soft) 0%, var(--ateem-cream) 100%);
            scroll-behavior:smooth;
          }
          #ateem-panel #ateem-chat::-webkit-scrollbar { width:3px; }
          #ateem-panel #ateem-chat::-webkit-scrollbar-thumb { background:rgba(184,147,106,.25); border-radius:10px; }
          #ateem-panel #ateem-chat::-webkit-scrollbar-track { background:transparent; }

          /* ═══ MESSAGES ═══ */
          #ateem-panel .ateem-msg-wrap {
            display:flex; flex-direction:column; gap:3px;
            max-width:88%; animation:ateem-msgAppear .4s cubic-bezier(0.22,1,0.36,1) both;
          }
          #ateem-panel .ateem-msg-wrap.ateem-user { align-self:flex-start; margin-left:auto; }
          #ateem-panel .ateem-msg-wrap.ateem-bot  { align-self:flex-end; margin-right:auto; }
          #ateem-panel .ateem-msg-time {
            font-size:8.5px; color:var(--ateem-ink-faint); padding:0 5px; opacity:.65;
            font-family:'Montserrat',sans-serif; letter-spacing:.3px;
          }

          /* ═══ WELCOME ═══ */
          #ateem-panel .ateem-welcome-banner { text-align:center; padding:6px 0 2px; }
          #ateem-panel .ateem-welcome-banner .ateem-welcome-text {
            font-family:'Cormorant Garamond', serif; font-style:italic; font-size:14px;
            color:var(--ateem-ink-muted); letter-spacing:.5px; line-height:1.6;
          }
          #ateem-panel .ateem-welcome-banner .ateem-welcome-time {
            font-size:8.5px; color:var(--ateem-ink-faint); margin-top:4px;
            font-family:'Montserrat',sans-serif;
          }

          /* ═══ BOT MESSAGE ═══ */
          #ateem-panel .ateem-bot-msg {
            background:var(--ateem-white); color:var(--ateem-ink-soft);
            padding:11px 14px; border-radius:18px 18px 18px 5px;
            line-height:1.8; max-width:100%;
            border:1px solid rgba(184,147,106,0.12);
            box-shadow:0 2px 10px rgba(90,60,20,0.05), 0 1px 3px rgba(90,60,20,0.03);
            font-size:12.5px; direction:rtl; position:relative;
          }
          #ateem-panel .ateem-bot-msg::before {
            content:''; position:absolute; top:0; left:0; right:0; bottom:0;
            border-radius:18px 18px 18px 5px;
            background:linear-gradient(180deg, rgba(255,255,255,0.80) 0%, rgba(245,240,232,0.30) 100%);
            pointer-events:none;
          }

          /* ═══ USER MESSAGE ═══ */
          #ateem-panel .ateem-user-msg {
            background:linear-gradient(135deg, #C8A87A 0%, #B8936A 50%, #9A7650 100%);
            color:rgba(255,250,240,0.98);
            padding:11px 14px; border-radius:18px 18px 5px 18px;
            max-width:100%; font-size:12.5px; direction:rtl;
            box-shadow:0 4px 14px rgba(184,147,106,0.22), 0 2px 6px rgba(90,60,20,0.08);
            border:1px solid rgba(255,255,255,0.18); position:relative;
          }
          #ateem-panel .ateem-user-msg::after {
            content:''; position:absolute; inset:0;
            border-radius:18px 18px 5px 18px;
            background:linear-gradient(180deg, rgba(255,255,255,0.12) 0%, transparent 50%);
            pointer-events:none;
          }

          /* ═══ QUICK REPLIES ═══ */
          #ateem-panel .ateem-quick-replies {
            display:flex; flex-wrap:wrap; gap:6px; margin-top:3px; padding:0 3px; direction:rtl;
          }
          #ateem-panel .ateem-quick-chip {
            font-size:10.5px; font-weight:500; color:var(--ateem-navy);
            background:var(--ateem-white);
            border:1.5px solid rgba(184,147,106,0.22);
            padding:6px 12px; border-radius:22px; cursor:pointer; white-space:nowrap;
            font-family:'IBM Plex Sans Arabic',sans-serif; transition:.25s ease;
            box-shadow:0 2px 6px rgba(90,60,20,0.04);
          }
          #ateem-panel .ateem-quick-chip:hover {
            background:linear-gradient(135deg, var(--ateem-gold-pale), var(--ateem-cream));
            border-color:rgba(184,147,106,0.45);
            transform:translateY(-2px);
            box-shadow:0 4px 12px rgba(184,147,106,0.15);
          }
          #ateem-panel .ateem-quick-chip:active { transform:translateY(0) scale(0.96); }

          /* ═══ PRODUCT CARDS ═══ */
          #ateem-panel .ateem-products-wrap { display:flex; flex-direction:column; gap:8px; max-width:100%; margin-top:3px; }
          #ateem-panel .ateem-product-card {
            display:flex; align-items:center; gap:10px;
            background:var(--ateem-white);
            border:1px solid rgba(184,147,106,0.14);
            border-radius:16px; padding:10px;
            box-shadow:0 3px 12px rgba(90,60,20,0.05), 0 1px 3px rgba(90,60,20,0.03);
            direction:rtl; text-decoration:none; transition:.25s ease;
            position:relative; overflow:hidden;
          }
          #ateem-panel .ateem-product-card::before {
            content:''; position:absolute; top:0; left:0; right:0; height:2.5px;
            background:linear-gradient(90deg, var(--ateem-gold-light), var(--ateem-gold), var(--ateem-gold-light));
            opacity:0.5;
          }
          #ateem-panel .ateem-product-card:hover {
            transform:translateY(-2px);
            box-shadow:0 6px 20px rgba(90,60,20,0.08), 0 2px 6px rgba(90,60,20,0.04);
            border-color:rgba(184,147,106,0.25);
          }
          #ateem-panel .ateem-product-card:active { transform:scale(0.98); }
          #ateem-panel .ateem-product-img {
            width:50px; height:50px; border-radius:10px; object-fit:cover; flex-shrink:0;
            border:1.5px solid rgba(184,147,106,0.16); background:#eee;
            box-shadow:0 2px 6px rgba(0,0,0,0.05);
          }
          #ateem-panel .ateem-product-info { flex:1; min-width:0; }
          #ateem-panel .ateem-product-name {
            font-size:12px; font-weight:600; color:var(--ateem-ink-soft);
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
          }
          #ateem-panel .ateem-product-cat { font-size:9.5px; color:var(--ateem-ink-muted); margin-top:1px; }
          #ateem-panel .ateem-product-price {
            font-size:12px; font-weight:700; color:var(--ateem-gold); margin-top:3px;
            font-family:'Montserrat',sans-serif;
          }
          #ateem-panel .ateem-product-btn {
            font-size:9.5px; font-weight:600;
            background:linear-gradient(135deg, var(--ateem-navy), var(--ateem-navy-light));
            color:var(--ateem-gold-light);
            border:1px solid rgba(184,147,106,0.28);
            padding:6px 10px; border-radius:8px;
            white-space:nowrap; flex-shrink:0; transition:.2s ease;
          }
          #ateem-panel .ateem-product-btn:hover {
            background:linear-gradient(135deg, var(--ateem-navy-light), var(--ateem-navy));
            color:var(--ateem-white);
          }

          /* ═══ ERROR ═══ */
          #ateem-panel .ateem-error-msg {
            background:rgba(220,60,60,0.04); color:#a04040;
            padding:11px 14px; border-radius:18px 18px 18px 5px;
            border:1.5px solid rgba(220,60,60,0.12);
            font-size:12px; line-height:1.7; direction:rtl;
            background:linear-gradient(135deg, rgba(220,60,60,0.04), rgba(220,60,60,0.01));
          }
          #ateem-panel .ateem-error-retry {
            display:inline-flex; align-items:center; gap:5px; margin-top:6px;
            padding:6px 11px; background:rgba(220,60,60,0.08);
            border:1.5px solid rgba(220,60,60,0.18);
            border-radius:8px; color:#a04040;
            font-size:10.5px; font-weight:500; cursor:pointer; transition:.2s ease;
          }
          #ateem-panel .ateem-error-retry:hover { background:rgba(220,60,60,0.15); transform:translateY(-1px); }

          /* ═══ SCROLL BOTTOM ═══ */
          #ateem-panel .ateem-scroll-bottom {
            position:absolute; bottom:12px; left:50%; transform:translateX(-50%);
            width:32px; height:32px; border-radius:50%;
            background:var(--ateem-white);
            border:1.5px solid rgba(184,147,106,0.22);
            box-shadow:0 4px 14px rgba(90,60,20,0.10);
            display:flex; align-items:center; justify-content:center; cursor:pointer;
            opacity:0; pointer-events:none; transition:.3s ease; z-index:5;
            color:var(--ateem-gold); font-size:13px;
          }
          #ateem-panel .ateem-scroll-bottom.visible { opacity:1; pointer-events:auto; }
          #ateem-panel .ateem-scroll-bottom:hover {
            transform:translateX(-50%) translateY(-3px);
            box-shadow:0 6px 18px rgba(90,60,20,0.14);
            color:var(--ateem-navy);
          }

          /* ═══ INPUT — مؤشر مخفي افتراضياً ═══ */
          #ateem-panel .ateem-input-wrap {
            display:flex; align-items:center; gap:8px;
            padding:10px 12px max(12px, env(safe-area-inset-bottom));
            background:var(--ateem-white);
            border-top:1px solid rgba(184,147,106,0.12);
            flex-shrink:0;
            position:relative;
          }
          #ateem-panel .ateem-input-wrap::before {
            content:''; position:absolute; top:-8px; left:0; right:0; height:8px;
            background:linear-gradient(180deg, transparent, rgba(255,255,255,0.80));
            pointer-events:none;
          }
