name: Build ATEEM STORE APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. تحميل المشروع
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 4. تثبيت مكتبات المشروع
      - name: Install npm dependencies
        run: npm install

      # 5. إضافة Android
      - name: Add Android platform
        run: npx cap add android

      # 6. إنشاء أيقونات التطبيق
      - name: Generate app icons from logo
        run: |
          npm install -D @capacitor/assets
          mkdir -p resources
          cp www/assets/logo.png resources/icon.png
          npx capacitor-assets generate --android --iconBackgroundColor '#1B263B'

      # 7. تعديل MainActivity
      - name: Apply fullscreen MainActivity patch
        run: |
          mkdir -p android/app/src/main/java/com/ateem/store

          cat > android/app/src/main/java/com/ateem/store/MainActivity.java << 'EOF'
          package com.ateem.store;

          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);

              getWindow().addFlags(
                  WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
              );

              hideSystemUI();
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);

              if (hasFocus) {
                hideSystemUI();
              }
            }

            private void hideSystemUI() {
              View decorView = getWindow().getDecorView();

              decorView.setSystemUiVisibility(
                    View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                  | View.SYSTEM_UI_FLAG_FULLSCREEN
              );
            }
          }
          EOF

      # 8. مزامنة Capacitor
      - name: Sync Capacitor
        run: npx cap sync android

      # 9. استعادة ملف التوقيع من GitHub Secret
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      # 10. التأكد أن ملف التوقيع موجود
      - name: Verify keystore
        run: |
          ls -lh android/app/release.keystore
          file android/app/release.keystore

      # 11. إعداد توقيع Release
      - name: Configure release signing
        env:
          ATEEM_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ATEEM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ATEEM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat >> android/app/build.gradle << 'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword System.getenv("ATEEM_STORE_PASSWORD")
                      keyAlias System.getenv("ATEEM_KEY_ALIAS")
                      keyPassword System.getenv("ATEEM_KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF

      # 12. إعطاء صلاحية تشغيل Gradle
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # 13. بناء APK
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      # 14. رفع APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ateem-store-apk
          path: android/app/build/outputs/apk/release/app-release.apk
