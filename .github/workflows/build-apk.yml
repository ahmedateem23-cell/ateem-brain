            const uniqueIds = [...new Set(idsFound)];
            if (uniqueIds.length) {
              const cards = uniqueIds.map(id => ATEEM_PRODUCTS.find(p => p.id === id)).filter(Boolean).map(renderProductCard).join("");
              html += `<div class="ateem-products-wrap">${cards}</div>`;
            }
            if (includeQuickReplies) html += renderQuickChips();
            return html;
          }

          function renderUserMsg(text) {
            return `<div class="ateem-msg-wrap ateem-user">
              <div class="ateem-user-msg">${text.replace(/\n/g,'<br>')}</div>
              <div class="ateem-msg-time">${nowTime()}</div>
            </div>`;
          }

          function renderError(errMsg) {
            return `<div class="ateem-msg-wrap ateem-bot">
              <div class="ateem-error-msg">
                ⚠️ تعذّر الاتصال بالخادم<br>
                <small style="opacity:.6; font-size:10.5px">${errMsg}</small>
