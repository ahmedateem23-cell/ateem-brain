          package com.ateem.store;

          import android.animation.ValueAnimator;
          import android.app.Activity;
          import android.content.res.ColorStateList;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.graphics.drawable.RippleDrawable;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.ViewTreeObserver;
          import android.view.animation.OvershootInterpolator;
          import android.webkit.WebView;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import java.util.ArrayList;
          import java.util.List;

          public class NativeNavigation {

              /*
               * يسمح لـ MainActivity بمعرفة متى يضغط المستخدم
               * "الرئيسية" (فيعرض الشاشة الـ Native) أو أي تاب
               * آخر / رابط داخلي (فيعرض WebView على المسار المطلوب).
               */

              public interface OnNavTargetListener {

                  void onHomeSelected();

                  void onWebPathSelected(
                      String path,
                      int index
                  );
              }

              private OnNavTargetListener navTargetListener;

              public void setOnNavTargetListener(
                  OnNavTargetListener listener
              ) {
                  this.navTargetListener = listener;
              }


              private final Activity activity;

              private final WebView webView;

              private FrameLayout rootContainer;

              private FrameLayout navBar;

              private View beam;

              private final List<LinearLayout> items = new ArrayList<>();

              private final List<ImageView> icons = new ArrayList<>();

              private final List<TextView> labels = new ArrayList<>();

              private final List<View> glows = new ArrayList<>();

              /*
               * الترتيب هنا مقصود: أول عنصر في المصفوفة هو
               * "الرئيسية"، وبما أن الشريط نفسه RTL (انظر
               * row.setLayoutDirection أدناه)، فأول عنصر يُضاف
               * يظهر أقصى اليمين. لذلك يظهر الترتيب البصري من
               * اليمين لليسار: الرئيسية، المتجر، السلة، حسابي.
               */

              private final String[] paths = {
                  "/", "/shop", "/shop/cart", "/my/account"
              };

              private final int[] iconRes = {
                  R.drawable.ic_nav_home,
                  R.drawable.ic_nav_shop,
                  R.drawable.ic_nav_cart,
                  R.drawable.ic_nav_account
              };

              private final String[] labelText = {
                  "الرئيسية", "المتجر", "السلة", "حسابي"
              };

              private int activeIndex = 0;


              private final int NAVY        = Color.parseColor("#1B2A3D");
              private final int CREAM       = Color.parseColor("#F0EAE0");
              private final int CREAM_FAINT = Color.argb(97, 240, 234, 224); // ~38%
              private final int GOLD        = Color.parseColor("#C9A84C");

              private final int NAV_BOTTOM_MARGIN_DP = 14;

              private final Typeface labelTypefaceNormal =
                  Typeface.create("sans-serif-light", Typeface.NORMAL);

              private final Typeface labelTypefaceActive =
                  Typeface.create("sans-serif-medium", Typeface.NORMAL);


              public NativeNavigation(
                  Activity activity,
                  WebView webView
              ) {

                  this.activity =
                      activity;

                  this.webView =
                      webView;
              }


              public FrameLayout getRootContainer() {
                  return rootContainer;
              }


              public View getNavBarView() {
                  return navBar;
              }


              public int getNavBottomMargin() {
                  return dp(NAV_BOTTOM_MARGIN_DP);
              }


              /*
               * يحصر الـ WebView بين الهيدر (فوق) والبار
               * السفلي (تحت) بدل ما يمتد تحتهم بالكامل.
               */

              public void setWebViewInsets(
                  int topInset,
                  int bottomInset
              ) {

                  if (webView == null) {
                      return;
                  }

                  ViewGroup.LayoutParams rawParams =
                      webView.getLayoutParams();

                  if (
                      !(rawParams instanceof FrameLayout.LayoutParams)
                  ) {
                      return;
                  }

                  FrameLayout.LayoutParams params =
                      (FrameLayout.LayoutParams) rawParams;

                  params.topMargin =
                      topInset;

                  params.bottomMargin =
                      bottomInset;

                  webView.setLayoutParams(
                      params
                  );
              }


              public void attach() {

                  if (webView == null) {
                      return;
                  }


                  ViewGroup webViewParent =
                      (ViewGroup)
                      webView.getParent();


                  if (webViewParent == null) {
                      return;
                  }


                  rootContainer =
                      new FrameLayout(
                          activity
                      );


                  ViewGroup.LayoutParams rootParams =
                      new ViewGroup.LayoutParams(

                          ViewGroup.LayoutParams.MATCH_PARENT,

                          ViewGroup.LayoutParams.MATCH_PARENT
                      );


                  webViewParent.removeView(
                      webView
                  );


                  webViewParent.addView(
                      rootContainer,
                      rootParams
                  );


                  FrameLayout.LayoutParams webParams =
                      new FrameLayout.LayoutParams(

                          ViewGroup.LayoutParams.MATCH_PARENT,

                          ViewGroup.LayoutParams.MATCH_PARENT
                      );


                  rootContainer.addView(
                      webView,
                      webParams
                  );


                  navBar =
                      createNavigationBar();


                  FrameLayout.LayoutParams navParams =
                      new FrameLayout.LayoutParams(

                          dpMax(),

                          dp(66),

                          Gravity.BOTTOM
                          | Gravity.CENTER_HORIZONTAL
                      );

                  navParams.bottomMargin =
                      dp(NAV_BOTTOM_MARGIN_DP);


                  rootContainer.addView(
                      navBar,
                      navParams
                  );


                  navBar.bringToFront();


                  /*
                   * ننتظر أول layout عشان نحدد
                   * مكان الـ beam فوق العنصر النشط
                   * بدون أنيميشن (snap).
                   */

                  navBar.getViewTreeObserver().addOnGlobalLayoutListener(
                      new ViewTreeObserver.OnGlobalLayoutListener() {

                          @Override
                          public void onGlobalLayout() {

                              navBar.getViewTreeObserver()
                                    .removeOnGlobalLayoutListener(this);

                              snapBeamTo(
                                  activeIndex
                              );

                              updateVisualState(
                                  activeIndex,
                                  false
                              );
                          }
                      }
                  );
              }


              /*
               * أقصى عرض للبار = min(88% من الشاشة, 380dp)
               * بنفس منطق النسخة الويب.
               */

              private int dpMax() {

                  int screenWidth =
                      activity
                          .getResources()
                          .getDisplayMetrics()
                          .widthPixels;

                  int eightyEightPercent =
                      (int) (screenWidth * 0.88f);

                  int maxWidthPx =
                      dp(380);

                  return Math.min(
                      eightyEightPercent,
                      maxWidthPx
                  );
              }


              private FrameLayout createNavigationBar() {

                  FrameLayout bar =
                      new FrameLayout(
                          activity
                      );


                  GradientDrawable background =
                      new GradientDrawable();

                  background.setColor(
                      NAVY
                  );

                  background.setCornerRadius(
                      dp(24)
                  );

                  background.setStroke(
                      1,
                      Color.argb(20, 240, 234, 224)
                  );

                  bar.setBackground(
                      background
                  );

                  bar.setElevation(
                      dp(12)
                  );

                  bar.setClipToPadding(
                      false
                  );

                  bar.setClipChildren(
                      false
                  );


                  LinearLayout row =
                      new LinearLayout(
                          activity
                      );

                  row.setOrientation(
                      LinearLayout.HORIZONTAL
                  );

                  row.setGravity(
                      Gravity.CENTER
                  );

                  row.setPadding(
                      dp(6), 0, dp(6), 0
                  );

                  /*
                   * RTL صريح عشان يبدأ الترتيب البصري من
                   * اليمين بـ"الرئيسية" دائمًا، بغض النظر عن
                   * لغة الجهاز.
                   */

                  row.setLayoutDirection(
                      View.LAYOUT_DIRECTION_RTL
                  );

                  bar.addView(
                      row,
                      new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  );


                  /*
                   * الشعاع (beam) في أعلى الشريط.
                   */

                  beam =
                      new View(
                          activity
                      );

                  GradientDrawable beamBg =
                      new GradientDrawable();

                  beamBg.setColor(
                      GOLD
                  );

                  beamBg.setCornerRadius(
                      dp(3)
                  );

                  beam.setBackground(
                      beamBg
                  );

                  FrameLayout.LayoutParams beamParams =
                      new FrameLayout.LayoutParams(
                          dp(46),
                          dp(3),
                          Gravity.TOP
                          | Gravity.START
                      );

                  bar.addView(
                      beam,
                      beamParams
                  );


                  for (int i = 0; i < paths.length; i++) {

                      final int index = i;

                      LinearLayout item =
                          createItem(
                              iconRes[i],
                              labelText[i]
                          );

                      LinearLayout.LayoutParams itemParams =
                          new LinearLayout.LayoutParams(
                              0,
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              1f
                          );

                      row.addView(
                          item,
                          itemParams
                      );

                      items.add(
                          item
                      );

                      item.setOnClickListener(
                          v -> onItemClick(index)
                      );
                  }


                  return bar;
              }


              private LinearLayout createItem(
                  int iconResId,
                  String label
              ) {

                  LinearLayout item =
                      new LinearLayout(
                          activity
                      );

                  item.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  item.setGravity(
                      Gravity.CENTER
                  );

                  item.setClickable(
                      true
                  );

                  item.setClipChildren(
                      false
                  );


                  /*
                   * هالة الإضاءة خلف الأيقونة (تظهر فقط عند التفعيل).
                   */

                  View glow =
                      new View(
                          activity
                      );

                  GradientDrawable glowBg =
                      new GradientDrawable();

                  glowBg.setShape(
                      GradientDrawable.OVAL
                  );

                  glowBg.setColor(
                      Color.argb(70, 240, 234, 224)
                  );

                  glow.setBackground(
                      glowBg
                  );

                  glow.setAlpha(
                      0f
                  );

                  FrameLayout glowWrap =
                      new FrameLayout(
                          activity
                      );

                  glowWrap.addView(
                      glow,
                      new FrameLayout.LayoutParams(
                          dp(46),
                          dp(46),
                          Gravity.CENTER
                      )
                  );

                  glows.add(
                      glow
                  );


                  if (
                      android.os.Build.VERSION.SDK_INT
                      >= android.os.Build.VERSION_CODES.LOLLIPOP
                  ) {

                      RippleDrawable ripple =
                          new RippleDrawable(
                              ColorStateList.valueOf(
                                  Color.argb(40, 240, 234, 224)
                              ),
                              null,
                              null
                          );

                      item.setBackground(
                          ripple
                      );
                  }


                  ImageView icon =
                      new ImageView(
                          activity
                      );

                  icon.setImageResource(
                      iconResId
                  );

                  icon.setColorFilter(
                      CREAM_FAINT
                  );

                  FrameLayout.LayoutParams iconParams =
                      new FrameLayout.LayoutParams(
                          dp(21),
                          dp(21),
                          Gravity.CENTER
                      );

                  glowWrap.addView(
                      icon,
                      iconParams
                  );

                  item.addView(
                      glowWrap,
                      new LinearLayout.LayoutParams(
                          dp(46),
                          dp(27)
                      )
                  );

                  icons.add(
                      icon
                  );


                  TextView labelView =
                      new TextView(
                          activity
                      );

                  labelView.setText(
                      label
                  );

                  labelView.setTextSize(
                      9.5f
                  );

                  labelView.setTextColor(
                      CREAM_FAINT
                  );

                  labelView.setGravity(
                      Gravity.CENTER
                  );

                  LinearLayout.LayoutParams labelParams =
                      new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      );

                  labelParams.topMargin =
                      dp(2);

                  item.addView(
                      labelView,
                      labelParams
                  );

                  labels.add(
                      labelView
                  );


                  return item;
              }


              private void onItemClick(
                  int index
              ) {

                  if (index == activeIndex) {

                      if (
                          index == 0
                          &&
                          navTargetListener != null
                      ) {
                          navTargetListener.onHomeSelected();
                      }

                      return;
                  }

                  setActiveIndex(
                      index,
                      true
                  );

                  dispatchTarget(
                      index
                  );
              }


              /*
               * يوجّه الضغطة على أي تاب لمستمع MainActivity:
               * "الرئيسية" (index 0) تعرض الشاشة الـ Native،
               * وأي تاب تاني يعرض WebView على مساره.
               */

              private void dispatchTarget(
                  int index
              ) {

                  if (navTargetListener == null) {

                      navigate(
                          paths[index]
                      );

                      return;
                  }

                  if (index == 0) {

                      navTargetListener.onHomeSelected();

                  } else {

                      navTargetListener.onWebPathSelected(
                          paths[index],
                          index
                      );
                  }
              }


              private void setActiveIndex(
                  int index,
                  boolean animate
              ) {

                  activeIndex =
                      index;

                  updateVisualState(
                      index,
                      animate
                  );

                  if (animate) {
                      animateBeamTo(index);
                  } else {
                      snapBeamTo(index);
                  }
              }


              private void updateVisualState(
                  int activeIdx,
                  boolean animate
              ) {

                  for (int i = 0; i < items.size(); i++) {

                      boolean isActive =
                          (i == activeIdx);

                      ImageView icon =
                          icons.get(i);

                      TextView label =
                          labels.get(i);

                      View glow =
                          glows.get(i);

                      LinearLayout item =
                          items.get(i);

                      int targetColor =
                          isActive
                              ? CREAM
                              : CREAM_FAINT;

                      icon.setColorFilter(
                          targetColor
                      );

                      label.setTextColor(
                          targetColor
                      );

                      label.setTypeface(
                          isActive
                              ? labelTypefaceActive
                              : labelTypefaceNormal
                      );

                      float targetTranslationY =
                          isActive
                              ? -dp(3)
                              : 0f;

                      float targetGlowAlpha =
                          isActive
                              ? 1f
                              : 0f;

                      if (animate) {

                          item.animate()
                              .translationY(targetTranslationY)
                              .setDuration(300)
                              .start();

                          glow.animate()
                              .alpha(targetGlowAlpha)
                              .setDuration(300)
                              .start();

                      } else {

                          item.setTranslationY(
                              targetTranslationY
                          );

                          glow.setAlpha(
                              targetGlowAlpha
                          );
                      }
                  }
              }


              private void snapBeamTo(
                  int index
              ) {

                  if (
                      beam == null
                      ||
                      index < 0
                      ||
                      index >= items.size()
                  ) {
                      return;
                  }

                  LinearLayout item =
                      items.get(index);

                  int normalWidth =
                      Math.min(
                          dp(46),
                          (int) (item.getWidth() * 0.5f)
                      );

                  if (normalWidth <= 0) {
                      normalWidth = dp(46);
                  }

                  float itemCenter =
                      item.getLeft()
                      + item.getWidth() / 2f;

                  FrameLayout.LayoutParams params =
                      (FrameLayout.LayoutParams)
                      beam.getLayoutParams();

                  params.width =
                      normalWidth;

                  beam.setLayoutParams(
                      params
                  );

                  beam.setTranslationX(
                      itemCenter - normalWidth / 2f
                  );
              }


              private void animateBeamTo(
                  int index
              ) {

                  if (
                      beam == null
                      ||
                      index < 0
                      ||
                      index >= items.size()
                  ) {
                      return;
                  }

                  LinearLayout item =
                      items.get(index);

                  int normalWidth =
                      Math.min(
                          dp(46),
                          (int) (item.getWidth() * 0.5f)
                      );

                  if (normalWidth <= 0) {
                      normalWidth = dp(46);
                  }

                  float itemCenter =
                      item.getLeft()
                      + item.getWidth() / 2f;

                  float targetX =
                      itemCenter - normalWidth / 2f;

                  int startWidth =
                      beam.getLayoutParams().width;

                  float startX =
                      beam.getTranslationX();

                  final int finalNormalWidth =
                      normalWidth;

                  ValueAnimator animator =
                      ValueAnimator.ofFloat(
                          0f,
                          1f
                      );

                  animator.setDuration(
                      380
                  );

                  animator.setInterpolator(
                      new OvershootInterpolator(
                          0.6f
                      )
                  );

                  animator.addUpdateListener(
                      anim -> {

                          float fraction =
                              (float) anim.getAnimatedValue();

                          int currentWidth =
                              (int) (
                                  startWidth
                                  + (finalNormalWidth - startWidth)
                                  * fraction
                              );

                          float currentX =
                              startX
                              + (targetX - startX)
                              * fraction;

                          FrameLayout.LayoutParams params =
                              (FrameLayout.LayoutParams)
                              beam.getLayoutParams();

                          params.width =
                              currentWidth;

                          beam.setLayoutParams(
                              params
                          );

                          beam.setTranslationX(
                              currentX
                          );
                      }
                  );

                  animator.start();
              }


              /*
               * تُستدعى من MainActivity بعد كل تحميل صفحة
               * عشان نزامن العنصر النشط مع الرابط الحالي فعلياً
               * (مثلاً لو المستخدم ضغط رابط جوه الموقع نفسه).
               */

              public void syncActiveFromUrl(
                  String url
              ) {

                  if (url == null) {
                      return;
                  }

                  String path;

                  try {

                      android.net.Uri uri =
                          android.net.Uri.parse(url);

                      path =
                          uri.getPath();

                      if (path == null) {
                          path = "/";
                      }

                  } catch (Exception e) {

                      path = "/";
                  }

                  if (
                      path.length() > 1
                      &&
                      path.endsWith("/")
                  ) {
                      path =
                          path.substring(
                              0,
                              path.length() - 1
                          );
                  }


                  int bestIndex = 0;

                  int bestLength = -1;

                  for (int i = 0; i < paths.length; i++) {

                      String p =
                          paths[i];

                      boolean matches =
                          path.equals(p)
                          ||
                          (
                              !p.equals("/")
                              &&
                              path.startsWith(p + "/")
                          )
                          ||
                          (
                              !p.equals("/")
                              &&
                              path.equals(p)
                          );

                      if (
                          matches
                          &&
                          p.length() > bestLength
                      ) {

                          bestIndex =
                              i;

                          bestLength =
                              p.length();
                      }
                  }

                  if (bestIndex != activeIndex) {

                      setActiveIndex(
                          bestIndex,
                          true
                      );

                  } else {

                      /*
                       * نفس العنصر، بس تأكيد
                       * الحالة البصرية بدون أنيميشن.
                       */

                      updateVisualState(
                          activeIndex,
                          false
                      );
                  }
              }


              /*
               * تُستدعى من عناصر native خارجية
               * (زي رابط SHOP في الهيدر) عشان
               * تنقل الصفحة وتحدّث العنصر النشط معاً.
               */

              public void navigateToPath(
                  String path
              ) {

                  int index =
                      indexForPath(
                          path
                      );

                  if (index != activeIndex) {

                      setActiveIndex(
                          index,
                          true
                      );
                  }

                  dispatchTarget(
                      index
                  );
              }


              /*
               * تُستدعى من عناصر native حرة زي بطاقات
               * شبكة "our collections" أو روابط الفوتر،
               * واللي مساراتها مش موجودة أصلاً في مصفوفة
               * paths الثابتة (مثال: /shop/category/shirts-9).
               * بتفتح WebView على المسار وتضيء التاب المناسب
               * (عادةً "المتجر") بدون ما تغيّر paths نفسها.
               */

              public void openWebPath(
                  String fullPath,
                  int highlightIndex
              ) {

                  if (highlightIndex != activeIndex) {

                      setActiveIndex(
                          highlightIndex,
                          true
                      );
                  }

                  if (navTargetListener != null) {

                      navTargetListener.onWebPathSelected(
                          fullPath,
                          highlightIndex
                      );

                  } else {

                      navigate(
                          fullPath
                      );
                  }
              }


              private int indexForPath(
                  String path
              ) {

                  for (int i = 0; i < paths.length; i++) {

                      if (paths[i].equals(path)) {
                          return i;
                      }
                  }

                  return activeIndex;
              }


              /*
               * واجهة عامة يستخدمها MainActivity لتحميل مسار
               * داخل الـ WebView بعد ما يقرر هو (مش NativeNavigation)
               * إظهار الـ WebView أو الشاشة الـ Native.
               */

              public void loadWebUrl(
                  String path
              ) {

                  navigate(
                      path
                  );
              }


              private void navigate(
                  String path
              ) {

                  if (webView == null) {
                      return;
                  }

                  String current =
                      webView.getUrl();

                  String base =
                      "https://www.ateem-store.com";

                  String target =
                      base + path;

                  if (
                      current != null
                      &&
                      current.equals(target)
                  ) {

                      return;
                  }

                  webView.loadUrl(
                      target
                  );
              }


              private int dp(
                  int value
              ) {

                  float density =

                      activity
                          .getResources()
                          .getDisplayMetrics()
                          .density;

                  return (int)
                      (
                          value * density
                          + 0.5f
                      );
              }
          }

