          function renderQuickChips() {
            const replies = ATEEM_QUICK_REPLIES[pageType] || ATEEM_QUICK_REPLIES.home;
            const chips = replies.map(r =>
              `<span class="ateem-quick-chip" onclick="quickAteemReply('${r.replace(/'/g, "\\'")}')">${r}</span>`
