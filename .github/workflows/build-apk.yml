      # 8. Sync Capacitor
      - name: Sync Capacitor
        run: npx cap sync android


      # 9. Restore release keystore
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/release.keystore


      # 10. Verify keystore
      - name: Verify keystore
        run: |

          test -s android/app/release.keystore

          ls -lh android/app/release.keystore

          file android/app/release.keystore


      # 11. Test release keystore
      - name: Test release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |

          keytool -list \
            -keystore android/app/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias ateemrelease


      # 12. Configure release signing
      - name: Configure release signing
        run: |

          python3 - <<'PY'

          from pathlib import Path

          path = Path(
              "android/app/build.gradle"
          )

          text = path.read_text()

          if "signingConfigs" not in text:

              signing = """

          android {

              signingConfigs {

                  release {

                      storeFile file(
                          "release.keystore"
                      )

                      storePassword System.getenv(
                          "ATEEM_STORE_PASSWORD"
                      )

                      keyAlias System.getenv(
                          "ATEEM_KEY_ALIAS"
                      )

                      keyPassword System.getenv(
                          "ATEEM_KEY_PASSWORD"
                      )
                  }
              }


              buildTypes {

                  release {

                      signingConfig
                          signingConfigs.release

                      minifyEnabled false
                  }
              }
          }

          """

              text += signing

              path.write_text(
                  text
              )

          PY


      # 13. Build release APK
      - name: Build release APK
        working-directory: android

        env:

          ATEEM_STORE_PASSWORD:
            ${{ secrets.KEYSTORE_PASSWORD }}

          ATEEM_KEY_ALIAS:
            ${{ secrets.KEY_ALIAS }}

          ATEEM_KEY_PASSWORD:
            ${{ secrets.KEY_PASSWORD }}

        run: |

          echo "Checking signing configuration..."

          test -n "$ATEEM_STORE_PASSWORD"

          test -n "$ATEEM_KEY_ALIAS"

          test -n "$ATEEM_KEY_PASSWORD"

          test -s app/release.keystore


          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace


      # 14. Upload APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4

        with:

          name: ateem-store-apk

          path: android/app/build/outputs/apk/release/app-release.apk
