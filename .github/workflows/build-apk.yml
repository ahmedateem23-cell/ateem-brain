name: Build ATEEM STORE APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install npm dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons from logo
        run: |
          npm install -D @capacitor/assets
          mkdir -p resources
          cp www/assets/logo.png resources/icon.png
          npx capacitor-assets generate --android --iconBackgroundColor '#F8F6F2'

      - name: Apply fullscreen MainActivity patch
        run: |
          mkdir -p android/app/src/main/java/com/ateem/store

          cat > android/app/src/main/java/com/ateem/store/MainActivity.java << 'EOF'
          package com.ateem.store;

          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);

              getWindow().addFlags(
                  WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
              );

              hideSystemUI();
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);

              if (hasFocus) {
                hideSystemUI();
              }
            }

            private void hideSystemUI() {
              View decorView = getWindow().getDecorView();

              decorView.setSystemUiVisibility(
                    View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                  | View.SYSTEM_UI_FLAG_FULLSCREEN
              );
            }
          }
          EOF

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

          if [ ! -s android/app/release.keystore ]; then
            echo "ERROR: release.keystore was not created."
            exit 1
          fi

          echo "Keystore restored successfully."

      - name: Configure release signing
        run: |
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword project.findProperty("ATEEM_STORE_PASSWORD")
                      keyAlias project.findProperty("ATEEM_KEY_ALIAS")
                      keyPassword project.findProperty("ATEEM_KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        env:
          ATEEM_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ATEEM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ATEEM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PATEEM_STORE_PASSWORD="$ATEEM_STORE_PASSWORD" \
            -PATEEM_KEY_ALIAS="$ATEEM_KEY_ALIAS" \
            -PATEEM_KEY_PASSWORD="$ATEEM_KEY_PASSWORD" \
            --no-daemon

      - name: Verify APK
        run: |
          if [ ! -f android/app/build/outputs/apk/release/app-release.apk ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          ls -lh android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ateem-store-apk
          path: android/app/build/outputs/apk/release/app-release.apk
