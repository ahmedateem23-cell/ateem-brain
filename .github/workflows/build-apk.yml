              private void applySlide(
                  int index
              ) {

                  Slide slide =
                      slides[index];

                  bannerBrandLabel.setText(
                      slide.brand.toUpperCase()
                  );

                  bannerTitle.setText(
                      slide.title
                  );

                  bannerDesc.setText(
                      slide.desc
                  );

                  Glide.with(
                          activity
                      )
                      .load(
                          slide.imageUrl
                      )
                      .diskCacheStrategy(
                          DiskCacheStrategy.ALL
                      )
                      .centerCrop()
                      .into(
                          bannerImage
                      );

                  for (int i = 0; i < dots.size(); i++) {

                      View dot =
                          dots.get(i);

                      GradientDrawable dotBg =
                          new GradientDrawable();

                      dotBg.setShape(
                          GradientDrawable.OVAL
                      );

                      boolean isActive =
                          (i == index);

                      dotBg.setColor(
                          isActive
                              ? Color.WHITE
                              : Color.argb(90, 255, 255, 255)
                      );

                      dot.setBackground(
                          dotBg
                      );

                      ViewGroup.LayoutParams lp =
                          dot.getLayoutParams();

                      if (lp instanceof LinearLayout.LayoutParams) {

                          ((LinearLayout.LayoutParams) lp).width =
                              isActive ? dp(14) : dp(5);

                          dot.setLayoutParams(
                              lp
                          );
                      }
                  }
              }


              private void goToSlide(
                  int index
              ) {

                  currentSlide = index;

                  applySlide(
                      currentSlide
                  );

                  restartAutoSlide();
              }


              private void startAutoSlide() {

                  bannerRunnable = () -> {

                      currentSlide =
                          (currentSlide + 1) % slides.length;

                      applySlide(
                          currentSlide
                      );

                      bannerHandler.postDelayed(
                          bannerRunnable,
                          4500
                      );
                  };

                  bannerHandler.postDelayed(
                      bannerRunnable,
                      4500
                  );
              }


              private void restartAutoSlide() {

                  if (bannerRunnable != null) {

                      bannerHandler.removeCallbacks(
                          bannerRunnable
                      );
                  }

                  startAutoSlide();
              }


