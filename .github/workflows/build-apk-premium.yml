                  LinearLayout content = new LinearLayout(activity);
                  content.setOrientation(LinearLayout.VERTICAL);
                  content.setGravity(Gravity.CENTER);
                  content.setPadding(dp(36), dp(40), dp(36), dp(40));

                  FrameLayout iconCircle = new FrameLayout(activity);
                  GradientDrawable circleBg = new GradientDrawable();
                  circleBg.setShape(GradientDrawable.OVAL);
                  circleBg.setColor(SUCCESS_SOFT());
                  iconCircle.setBackground(circleBg);
                  TextView check = new TextView(activity);
                  check.setText("\u2713");
                  check.setTextSize(34);
                  check.setTypeface(sansBold);
                  check.setTextColor(SUCCESS);
