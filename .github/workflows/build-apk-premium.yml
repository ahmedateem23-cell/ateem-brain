                  sortScrim.animate().alpha(1f).setDuration(160).start();
                  sortPanel.setPivotX(sortPanel.getWidth());
                  sortPanel.setPivotY(0f);
                  sortPanel.setScaleY(0.92f);
                  sortPanel.setAlpha(0f);
                  sortPanel.animate().alpha(1f).scaleY(1f).setDuration(160).start();
              }
          
