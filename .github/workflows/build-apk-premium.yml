                  borderBg.setColor(Color.TRANSPARENT);
                  borderBg.setStroke(dp(1), Color.argb(100, 200, 196, 186));
                  borderBg.setCornerRadius(dp(20));
                  borderView.setBackground(borderBg);
                  frame.addView(borderView, new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  /* Text column */
                  LinearLayout textCol = new LinearLayout(activity);
                  textCol.setOrientation(LinearLayout.VERTICAL);
                  textCol.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);
                  textCol.setPadding(dp(22), dp(14), dp(22), dp(22));

                  bannerBrandLabel = new TextView(activity);
                  bannerBrandLabel.setTextSize(9);
                  bannerBrandLabel.setTextColor(Color.argb(180, 240, 236, 228));
                  bannerBrandLabel.setTypeface(sansMedium);
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.LOLLIPOP)
                      bannerBrandLabel.setLetterSpacing(0.2f);
                  bannerBrandLabel.setShadowLayer(dp(3), 0, dp(1), Color.argb(90, 0, 0, 0));
                  textCol.addView(bannerBrandLabel);

                  bannerTitle = new TextView(activity);
                  bannerTitle.setTextSize(24);
                  bannerTitle.setTextColor(WHITE);
                  bannerTitle.setTypeface(serifBold);
                  bannerTitle.setLineSpacing(0f, 1.05f);
                  bannerTitle.setShadowLayer(dp(6), 0, dp(2), Color.argb(110, 0, 0, 0));
                  LinearLayout.LayoutParams titleParams = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  titleParams.topMargin = dp(6);
                  textCol.addView(bannerTitle, titleParams);

                  bannerDesc = new TextView(activity);
                  bannerDesc.setTextSize(12);
                  bannerDesc.setTextColor(Color.argb(180, 255, 255, 255));
                  bannerDesc.setLineSpacing(dp(2), 1f);
                  bannerDesc.setShadowLayer(dp(4), 0, dp(1), Color.argb(90, 0, 0, 0));
                  LinearLayout.LayoutParams descParams = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  descParams.topMargin = dp(5);
                  descParams.bottomMargin = dp(14);
                  textCol.addView(bannerDesc, descParams);

                  /* Quiet CTA Button — Olive pill */
                  TextView button = new TextView(activity);
                  button.setText("تسوق الآن");
                  button.setTextSize(10);
                  button.setTextColor(WHITE);
                  button.setTypeface(sansMedium);
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.LOLLIPOP)
                      button.setLetterSpacing(0.06f);
                  GradientDrawable btnBg = new GradientDrawable();
                  btnBg.setColor(OLIVE);
                  btnBg.setCornerRadius(dp(20));
                  button.setBackground(btnBg);
                  button.setPadding(dp(18), dp(8), dp(18), dp(8));
                  LinearLayout.LayoutParams btnParams = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  textCol.addView(button, btnParams);

                  FrameLayout.LayoutParams textColParams = new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.BOTTOM);
                  frame.addView(textCol, textColParams);

                  /* Dots indicator */
                  dotsRow = new LinearLayout(activity);
                  dotsRow.setOrientation(LinearLayout.HORIZONTAL);
                  dotsRow.setGravity(Gravity.CENTER_HORIZONTAL);
                  for (int i = 0; i < slides.length; i++) {
                      View dot = new View(activity);
                      GradientDrawable dotBg = new GradientDrawable();
                      dotBg.setShape(GradientDrawable.OVAL);
                      dotBg.setColor(Color.argb(70, 255, 255, 255));
                      dot.setBackground(dotBg);
                      LinearLayout.LayoutParams dotParams = new LinearLayout.LayoutParams(dp(5), dp(5));
                      dotParams.leftMargin = dp(3); dotParams.rightMargin = dp(3);
                      dotsRow.addView(dot, dotParams);
                      dots.add(dot);
                      final int index = i;
                      dot.setOnClickListener(v -> goToSlide(index));
                  }
                  LinearLayout.LayoutParams dotsParams = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  dotsParams.topMargin = dp(12);
                  dotsParams.gravity = Gravity.CENTER_HORIZONTAL;
                  textCol.addView(dotsRow, dotsParams);

                  wrap.addView(frame, new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));

                  applySlide(0);
                  startAutoSlide();

                  return wrap;
              }

              private void applySlide(int index) {
                  Slide slide = slides[index];
                  bannerBrandLabel.setText(slide.brand.toUpperCase());
                  bannerTitle.setText(slide.title);
                  bannerDesc.setText(slide.desc);
                  Glide.with(activity).load(slide.imageUrl)
                      .diskCacheStrategy(DiskCacheStrategy.ALL).centerCrop().into(bannerImage);

                  for (int i = 0; i < dots.size(); i++) {
                      View dot = dots.get(i);
                      GradientDrawable dotBg = new GradientDrawable();
                      dotBg.setShape(GradientDrawable.OVAL);
                      boolean isActive = (i == index);
                      dotBg.setColor(isActive ? OLIVE : Color.argb(50, 255, 255, 255));
                      dot.setBackground(dotBg);
                      ViewGroup.LayoutParams lp = dot.getLayoutParams();
                      if (lp instanceof LinearLayout.LayoutParams) {
                          ((LinearLayout.LayoutParams) lp).width = isActive ? dp(14) : dp(5);
                          dot.setLayoutParams(lp);
                      }
                  }
              }

              private void goToSlide(int index) {
                  currentSlide = index;
                  applySlide(currentSlide);
                  restartAutoSlide();
              }

              private void startAutoSlide() {
                  bannerRunnable = () -> {
                      currentSlide = (currentSlide + 1) % slides.length;
                      applySlide(currentSlide);
                      bannerHandler.postDelayed(bannerRunnable, 5000);
                  };
                  bannerHandler.postDelayed(bannerRunnable, 5000);
              }

              private void restartAutoSlide() {
                  if (bannerRunnable != null) bannerHandler.removeCallbacks(bannerRunnable);
                  startAutoSlide();
              }

