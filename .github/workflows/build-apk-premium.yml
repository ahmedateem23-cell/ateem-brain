name: Build ATEEM STORE APK — Premium Quiet Luxury Edition

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v4


      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18


      # 3. Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      # 4. Install dependencies
      - name: Install npm dependencies
        run: npm install


      # 5. Add Android
      - name: Add Android platform
        run: npx cap add android

      # 5.5 Ensure the keyboard resizes the window (not pans over it) so the
      # chat header always stays visible and the panel/input reflow above
      # the keyboard instead of being covered by it.
      - name: Ensure adjustResize for MainActivity
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if grep -q 'android:windowSoftInputMode' "$MANIFEST"; then
            echo "windowSoftInputMode already present — leaving as-is."
          else
            perl -0777 -pi -e 's/(android:name="\.MainActivity")/$1\n            android:windowSoftInputMode="adjustResize"/' "$MANIFEST"
          fi
          grep -n "windowSoftInputMode" "$MANIFEST"

      # 5.6 Add microphone permission — the in-app chat's voice input (Web
      # Speech API) runs inside an embedded WebView, which needs both this
      # manifest permission and, on Android 6+, a runtime grant (added in
      # MainActivity.java below).
      - name: Add microphone permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if grep -q 'android.permission.RECORD_AUDIO' "$MANIFEST"; then
            echo "RECORD_AUDIO permission already present — leaving as-is."
          else
            perl -0777 -pi -e 's/(<manifest[^>]*>)/$1\n    <uses-permission android:name="android.permission.RECORD_AUDIO" \/>/' "$MANIFEST"
          fi
          grep -n "uses-permission" "$MANIFEST"

      # 6. Generate app icon + splash (ivory background, standard system-sized icon)
      - name: Generate app icons and splash
        run: |
          npm install -D @capacitor/assets
          mkdir -p resources
          curl -L "https://i.ibb.co/XfcxMrhC/file-00000000333c824684f0dc4c0dc2955d.png" -o resources/source-logo.png

          # Auto-trim any transparent margin from the source so the logo
          # isn't double-cropped or left with big empty gaps once Android
          # composes it inside the icon/splash safe zone.
          sudo apt-get update -y && sudo apt-get install -y imagemagick
          convert resources/source-logo.png -trim +repage resources/source-logo-trimmed.png

          # This source has no background of its own, so the icon just needs
          # generous, even padding to sit small and centered inside the
          # rounded-square mask instead of crowding its edges. Border % was
          # tuned down from 32% to grow the mark ~12% versus the prior pass,
          # per the brand refinement request, while staying clear of the edge.
          convert resources/source-logo-trimmed.png -bordercolor none -border 23%x23% resources/icon.png

          # Splash gets even more breathing room so the mark floats calmly
          # in the middle of the screen.
          convert resources/source-logo-trimmed.png -bordercolor none -border 48%x48% resources/splash.png
          cp resources/splash.png resources/splash-dark.png

          npx capacitor-assets generate \
            --android \
            --iconBackgroundColor '#F5F1E8' \
            --iconBackgroundColorDark '#F5F1E8' \
            --splashBackgroundColor '#F5F1E8' \
            --splashBackgroundColorDark '#F5F1E8'

          # Also drop the flat, uncomposited logo PNG straight into
          # res/drawable under its own name so the default splash icon can
          # reference the exact same bitmap directly. Reusing the mipmap
          # ic_launcher resource for the splash pulls in Android's
          # adaptive-icon masking/safe-zone inset, which shrinks and dims
          # the mark — that's what was making the splash icon look
          # pale/"faded".
          mkdir -p android/app/src/main/res/drawable
          cp resources/icon.png android/app/src/main/res/drawable/ateem_splash_logo.png

      # 6.5 Shrink the generated icon/splash PNGs losslessly so the new
      # source image doesn't bloat the APK across all density buckets.
      - name: Optimize generated icon and splash assets
        run: |
          sudo apt-get install -y optipng
          find android/app/src/main/res -iname '*.png' -print -exec optipng -o4 -quiet {} \;

      # 6.6 Default splash screen only — no custom SplashActivity, no
      # extra delay screen. We just size the icon shown by Android's own
      # built-in splash (the system's automatic launch icon on Android 12+,
      # and the plain themed window background on older versions) by
      # wrapping our logo in an inset drawable, then point the app's real
      # theme at it. MainActivity stays the one and only launcher activity.
      - name: Size the default splash icon
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          # 1) Inset drawable — controls how large the icon reads inside
          #    the system splash circle/canvas. Increase the inset values
          #    below for a smaller icon, decrease for a larger one.
          drawable_dir = Path("android/app/src/main/res/drawable")
          drawable_dir.mkdir(parents=True, exist_ok=True)
          inset_xml = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<inset xmlns:android="http://schemas.android.com/apk/res/android"\n'
              '    android:drawable="@drawable/ateem_splash_logo"\n'
              '    android:insetLeft="25%"\n'
              '    android:insetRight="25%"\n'
              '    android:insetTop="25%"\n'
              '    android:insetBottom="25%" />\n'
          )
          (drawable_dir / "ateem_splash_icon_sized.xml").write_text(inset_xml)

          # 2) Find the app's real application-level theme so we extend it
          #    rather than guessing its name or contents.
          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          manifest_text = manifest_path.read_text()

          app_match = re.search(r'<application\b[^>]*>', manifest_text)
          if not app_match:
              raise SystemExit("<application> tag not found in AndroidManifest.xml")
          app_tag = app_match.group(0)

          theme_match = re.search(r'android:theme="@style/([^"]+)"', app_tag)
          base_theme_name = theme_match.group(1) if theme_match else "AppTheme"

          # 3) Add a style that extends the app's real theme with just the
          #    splash-icon attributes layered on top (ignored by every
          #    other screen — these items are only read for the very first
          #    frame Android draws at cold start).
          styles_path = Path("android/app/src/main/res/values/styles.xml")
          MARKER = "AteemDefaultSplash"

          style_lines = [
              '',
              '    <style name="AteemDefaultSplash" parent="' + base_theme_name + '">',
              '        <item name="android:windowSplashScreenBackground" tools:targetApi="31">#F5F1E8</item>',
              '        <item name="android:windowSplashScreenAnimatedIcon" tools:targetApi="31">@drawable/ateem_splash_icon_sized</item>',
              '        <item name="android:windowSplashScreenIconBackgroundColor" tools:targetApi="31">#F5F1E8</item>',
              '    </style>',
              '',
          ]
          style_block = "\n".join(style_lines)

          if styles_path.exists():
              text = styles_path.read_text()
          else:
              text = "<resources>\n</resources>\n"

          if "xmlns:tools=" not in text:
              text = re.sub(r'<resources\b', '<resources xmlns:tools="http://schemas.android.com/tools"', text, count=1)

          if MARKER not in text:
              text = text.replace("</resources>", style_block + "</resources>")
              styles_path.parent.mkdir(parents=True, exist_ok=True)
              styles_path.write_text(text)
              print("AteemDefaultSplash style added.")
          else:
              print("AteemDefaultSplash style already present - skipping.")

          # 4) Point the <application> theme at our new style so the system
          #    splash actually picks it up.
          if 'AteemDefaultSplash' not in app_tag:
              if theme_match:
                  new_app_tag = app_tag.replace(theme_match.group(0), 'android:theme="@style/AteemDefaultSplash"')
              else:
                  new_app_tag = app_tag[:-1] + ' android:theme="@style/AteemDefaultSplash">'
              manifest_text = manifest_text.replace(app_tag, new_app_tag)
              manifest_path.write_text(manifest_text)
              print("Application theme now points at AteemDefaultSplash.")
          else:
              print("Application theme already points at AteemDefaultSplash - skipping.")
          PY


      # 7. Create Native Android shell (Premium Quiet Luxury Design)
      - name: Create native Android shell
        run: |

          mkdir -p android/app/src/main/java/com/ateem/store
          mkdir -p android/app/src/main/res/drawable

          # ==========================================
          # MainActivity.java — Premium Quiet Luxury
          # ==========================================

          cat > android/app/src/main/java/com/ateem/store/MainActivity.java << 'EOF'
          package com.ateem.store;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewTreeObserver;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.WebView;
          import android.widget.FrameLayout;

          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebViewClient;

          import java.io.BufferedReader;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.nio.charset.StandardCharsets;

          /*
           * ATEEM STORE — Premium Quiet Luxury Edition
           * هوية بصرية هادئة: عاجي دافئ + رمادي دافئ + زيتوني أنيق
           * تصميم بسيط وراقٍ بدون تأثيرات مبالغ فيها
           */

          public class MainActivity
              extends BridgeActivity
              implements NativeNavigation.OnNavTargetListener {

              private NativeNavigation nativeNavigation;
              private NativeHomeScreen nativeHomeScreen;
              private View nativeHomeScreenView;
              private NativeShopScreen nativeShopScreen;
              private View nativeShopScreenView;
              private NativeProductDetailScreen nativeProductDetailScreen;
              private View nativeProductDetailScreenView;
              private NativeChatOverlay nativeChatOverlay;
              private WebView webView;
              private String ateemContextFlagsJs;
              private String ateemTouchPolishJs;
              private boolean pendingRevealWebView = false;

              /* Quiet Luxury Palette */
              private final int IVORY_BG    = Color.parseColor("#F5F1E8");
              private final int CHARCOAL    = Color.parseColor("#3D3B36");

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  /* RECORD_AUDIO is now requested only when the user taps
                     the mic/record button inside the chat (see
                     NativeChatOverlay.JsBridge#requestMicPermission), not
                     eagerly here on app launch. */

                  /* Full screen immersive */
                  Window window = getWindow();
                  window.addFlags(WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS);
                  window.setStatusBarColor(Color.TRANSPARENT);
                  window.setNavigationBarColor(IVORY_BG);
                  hideSystemUI();

                  /* WebView setup */
                  webView = getBridge().getWebView();
                  if (webView != null) {
                      webView.setBackgroundColor(IVORY_BG);
                      webView.getSettings().setJavaScriptEnabled(true);
                      webView.setVisibility(View.GONE);

                      ateemContextFlagsJs = loadAsset("inject/ateem_widget_inject.js");
                      ateemTouchPolishJs  = loadAsset("inject/ateem_touch_polish.js");
                      webView.setWebViewClient(new BridgeWebViewClient(getBridge()) {
                          @Override
                          public void onPageStarted(WebView view, String url, android.graphics.Bitmap favicon) {
                              super.onPageStarted(view, url, favicon);
                              /* Must run BEFORE the page's own inline script reads
                                 window.ATEEM_SHOULD_SHOW, or the site's real chat
                                 widget hides itself permanently for that page. */
                              injectAteemContextFlags(view);
                          }

                          @Override
                          public void onPageFinished(WebView view, String url) {
                              super.onPageFinished(view, url);
                              injectAteemContextFlags(view);
                              injectAteemTouchPolish(view);
                              revealWebViewIfPending();
                          }
                      });
                  }

                  /* Bottom Navigation — Quiet Floating Bar */
                  nativeNavigation = new NativeNavigation(this, webView);
                  nativeNavigation.setOnNavTargetListener(this);
                  nativeNavigation.attach();

                  /* Native Home Screen — Premium Quiet */
                  nativeHomeScreen = new NativeHomeScreen(
                      this,
                      this::onAteemChatButtonClick,
                      this::onCategoryOrFooterLinkClick
                  );
                  nativeHomeScreenView = nativeHomeScreen.build();

                  /* Native Shop Screen — products pulled live from Odoo */
                  nativeShopScreen = new NativeShopScreen(this, this::onProductClick);
                  nativeShopScreenView = nativeShopScreen.build();

                  /* Native Product Detail Screen — same quiet-luxury style,
                     opened on top of the shop screen when a product card
                     is tapped. */
                  nativeProductDetailScreen = new NativeProductDetailScreen(this, this::onProductDetailBack);
                  nativeProductDetailScreen.setOnAddToCartListener(this::onAddToCart);
                  nativeProductDetailScreen.setOnBuyNowListener(this::onBuyNow);
                  nativeProductDetailScreenView = nativeProductDetailScreen.build();

                  FrameLayout root = nativeNavigation.getRootContainer();
                  if (root != null) {
                      FrameLayout.LayoutParams homeParams = new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                      );
                      root.addView(nativeHomeScreenView, homeParams);
                      nativeHomeScreenView.bringToFront();

                      nativeShopScreenView.setVisibility(View.GONE);
                      root.addView(nativeShopScreenView, homeParams);
                      nativeShopScreenView.bringToFront();

                      nativeProductDetailScreenView.setVisibility(View.GONE);
                      root.addView(nativeProductDetailScreenView, homeParams);
                      nativeProductDetailScreenView.bringToFront();

                      View navView = nativeNavigation.getNavBarView();
                      if (navView != null) navView.bringToFront();

                      /* ATEEM Chat — fully in-app, loaded from a local asset.
                         Sits above everything (including the bottom nav bar)
                         so it opens the same way no matter what screen is
                         behind it. */
                      nativeChatOverlay = new NativeChatOverlay(this);
                      View chatOverlayView = nativeChatOverlay.build();
                      root.addView(chatOverlayView, homeParams);
                      chatOverlayView.bringToFront();
                  }

                  linkWebViewInsets();
              }

              private void linkWebViewInsets() {
                  final FrameLayout root = nativeNavigation.getRootContainer();
                  if (root == null) return;

                  root.getViewTreeObserver().addOnGlobalLayoutListener(
                      new ViewTreeObserver.OnGlobalLayoutListener() {
                          @Override
                          public void onGlobalLayout() {
                              View navView = nativeNavigation.getNavBarView();
                              if (navView == null || navView.getHeight() == 0) return;
                              root.getViewTreeObserver().removeOnGlobalLayoutListener(this);

                              int bottomInset = navView.getHeight() + nativeNavigation.getNavBottomMargin();
                              nativeNavigation.setWebViewInsets(0, bottomInset);

                              if (nativeChatOverlay != null) {
                                  nativeChatOverlay.setBottomInset(bottomInset);
                              }

                              if (nativeHomeScreenView != null) {
                                  nativeHomeScreenView.setPadding(0, 0, 0, bottomInset);
                              }
                              if (nativeShopScreenView != null) {
                                  nativeShopScreenView.setPadding(0, 0, 0, bottomInset);
                              }
                          }
                      }
                  );

                  /* Product detail is a full-screen overlay (its own sticky
                     cart bar), so it intentionally does not take the bottom
                     nav inset — it sits above the nav bar entirely. */

                  if (nativeHomeScreen != null) {
                      View headerView = nativeHomeScreen.getHeaderView();
                      if (headerView != null) {
                          headerView.getViewTreeObserver().addOnGlobalLayoutListener(
                              new ViewTreeObserver.OnGlobalLayoutListener() {
                                  @Override
                                  public void onGlobalLayout() {
                                      int headerHeight = headerView.getHeight();
                                      if (headerHeight == 0) return;
                                      headerView.getViewTreeObserver().removeOnGlobalLayoutListener(this);
                                      if (nativeChatOverlay != null) {
                                          nativeChatOverlay.setTopInset(headerHeight);
                                      }
                                  }
                              }
                          );
                      }
                  }
              }

              private static final int MIC_PERMISSION_REQUEST_CODE = 4801;

              private void ensureMicPermission() {
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO)
                          != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(
                          this,
                          new String[]{ Manifest.permission.RECORD_AUDIO },
                          MIC_PERMISSION_REQUEST_CODE
                      );
                  }
              }

              public NativeNavigation getNativeNavigation() { return nativeNavigation; }

              @Override
              public void onHomeSelected() { showNativeHome(); }

              @Override
              public void onWebPathSelected(String path, int index) {
                  /* Shop tab (index 1) is now fully native — pulls live
                     products from Odoo via the Worker proxy, no WebView. */
                  if (index == 1) {
                      showNativeShop();
                  } else {
                      showWebView(path);
                  }
              }

              private void showNativeHome() {
                  if (webView != null) webView.setVisibility(View.GONE);
                  if (nativeShopScreenView != null) nativeShopScreenView.setVisibility(View.GONE);
                  if (nativeHomeScreenView != null) nativeHomeScreenView.setVisibility(View.VISIBLE);
              }

              private void showNativeShop() {
                  if (webView != null) webView.setVisibility(View.GONE);
                  if (nativeHomeScreenView != null) nativeHomeScreenView.setVisibility(View.GONE);
                  if (nativeShopScreenView != null) nativeShopScreenView.setVisibility(View.VISIBLE);
                  /* Nudge the fade-up check now that the screen is actually
                     visible — fixes products staying invisible when they
                     finished loading while this screen was still GONE. */
                  if (nativeShopScreen != null) nativeShopScreen.onScreenShown();
              }

              private void onProductClick(int id, String name, double price, String image, String description) {
                  if (nativeProductDetailScreen == null || nativeProductDetailScreenView == null) return;
                  nativeProductDetailScreen.setProduct(id, name, price, image, description);

                  if (webView != null) webView.setVisibility(View.GONE);
                  if (nativeHomeScreenView != null) nativeHomeScreenView.setVisibility(View.GONE);
                  if (nativeShopScreenView != null) nativeShopScreenView.setVisibility(View.GONE);
                  nativeProductDetailScreenView.setVisibility(View.VISIBLE);
                  nativeProductDetailScreenView.bringToFront();

                  /* Product detail owns its own sticky cart bar at the
                     bottom, so the floating bottom nav steps aside while
                     it's open. */
                  View navView = nativeNavigation.getNavBarView();
                  if (navView != null) navView.setVisibility(View.GONE);
              }

              private void onProductDetailBack() {
                  if (nativeProductDetailScreenView != null) {
                      nativeProductDetailScreenView.setVisibility(View.GONE);
                  }
                  View navView = nativeNavigation.getNavBarView();
                  if (navView != null) navView.setVisibility(View.VISIBLE);
                  /* Product cards live on the Shop tab, so returning always
                     lands back there. */
                  showNativeShop();
              }

              private void onAddToCart(int id, String name, double price, String image, int quantity) {
                  /* Cart wiring is the next step — quiet confirmation so
                     the tap isn't silent while that's built out. */
                  android.widget.Toast.makeText(this, "أُضيف إلى السلة", android.widget.Toast.LENGTH_SHORT).show();
              }

              private void onBuyNow(int id, String name, double price, String image, int quantity) {
                  /* Checkout flow is the next step — quiet confirmation so
                     the tap isn't silent while that's built out. */
                  android.widget.Toast.makeText(this, "جاري التوجيه لإتمام الشراء", android.widget.Toast.LENGTH_SHORT).show();
              }

              private void showWebView(String path) {
                  pendingRevealWebView = true;
                  if (nativeHomeScreenView != null) nativeHomeScreenView.setVisibility(View.GONE);
                  if (nativeShopScreenView != null) nativeShopScreenView.setVisibility(View.GONE);
                  nativeNavigation.loadWebUrl(path);
              }

              private void onAteemChatButtonClick() {
                  /* Fully in-app now — no WebView navigation, no dependency
                     on any page having loaded. Just toggle the local
                     overlay, which is always ready. */
                  if (nativeChatOverlay == null) return;
                  if (nativeChatOverlay.isVisible()) {
                      nativeChatOverlay.hide();
                  } else {
                      nativeChatOverlay.show();
                  }
              }

              @Override
              public void onBackPressed() {
                  if (nativeChatOverlay != null && nativeChatOverlay.isVisible()) {
                      nativeChatOverlay.hide();
                      return;
                  }
                  if (nativeProductDetailScreenView != null
                          && nativeProductDetailScreenView.getVisibility() == View.VISIBLE) {
                      onProductDetailBack();
                      return;
                  }
                  super.onBackPressed();
              }

              private void onCategoryOrFooterLinkClick(String path) {
                  pendingRevealWebView = true;
                  nativeNavigation.openWebPath(path, 1);
              }

              private void revealWebViewIfPending() {
                  if (!pendingRevealWebView) return;
                  pendingRevealWebView = false;
                  if (nativeHomeScreenView != null) nativeHomeScreenView.setVisibility(View.GONE);
                  if (nativeShopScreenView != null) nativeShopScreenView.setVisibility(View.GONE);
                  if (webView != null) webView.setVisibility(View.VISIBLE);
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemUI();
              }

              private void hideSystemUI() {
                  View decorView = getWindow().getDecorView();
                  decorView.setSystemUiVisibility(
                        View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                  );
              }

              private void injectAteemContextFlags(WebView view) {
                  if (view == null || ateemContextFlagsJs == null || ateemContextFlagsJs.isEmpty()) return;
                  view.evaluateJavascript(ateemContextFlagsJs, null);
              }

              private void injectAteemTouchPolish(WebView view) {
                  if (view == null || ateemTouchPolishJs == null || ateemTouchPolishJs.isEmpty()) return;
                  view.evaluateJavascript(ateemTouchPolishJs, null);
              }

              private String loadAsset(String path) {
                  StringBuilder builder = new StringBuilder();
                  try (
                      InputStream is = getAssets().open(path);
                      BufferedReader reader = new BufferedReader(
                          new InputStreamReader(is, StandardCharsets.UTF_8)
                      )
                  ) {
                      String line;
                      while ((line = reader.readLine()) != null) {
                          builder.append(line).append('\n');
                      }
                  } catch (IOException e) { e.printStackTrace(); }
                  return builder.toString();
              }
          }
          EOF

          # ==========================================
          # NativeHeader.java — Premium Minimal Header
          # ==========================================

          cat > android/app/src/main/java/com/ateem/store/NativeHeader.java << 'EOF'
          package com.ateem.store;

          import android.app.Activity;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.graphics.drawable.RippleDrawable;
          import android.content.res.ColorStateList;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import com.bumptech.glide.Glide;
          import com.bumptech.glide.load.engine.DiskCacheStrategy;
          import com.bumptech.glide.load.resource.bitmap.CircleCrop;

          public class NativeHeader {

              /* Bot avatar — used for the header chat button */
              private static final String BOT_AVATAR_URL =
                  "https://i.ibb.co/F4vhYp7Y/file-00000000b6f081f490aa2899443132bd.png";

              public interface OnChatClickListener {
                  void onChatClick();
              }

              private final Activity activity;
              private final OnChatClickListener chatClickListener;
              private View headerRow;

              /* Quiet Luxury Palette — Ivory / Olive / Gold */
              private final int IVORY_BG    = Color.parseColor("#F5F1E8");
              private final int WARM_WHITE  = Color.parseColor("#FEFCF8");
              private final int CHARCOAL    = Color.parseColor("#3D3B36");
              private final int WARM_GRAY   = Color.parseColor("#8A8680");
              private final int OLIVE       = Color.parseColor("#8A9A5B");
              private final int OLIVE_DEEP  = Color.parseColor("#6B7A45");
              private final int GOLD        = Color.parseColor("#B8936A");
              private final int OLIVE_MUTED = Color.parseColor("#E8EBE0");
              private final int DIVIDER     = Color.parseColor("#E8E4DC");

              private Typeface logoTypeface;
              private Typeface labelTypeface;

              public NativeHeader(Activity activity, OnChatClickListener chatClickListener) {
                  this.activity = activity;
                  this.chatClickListener = chatClickListener;
                  this.logoTypeface = Typeface.create("sans-serif-light", Typeface.BOLD);
                  this.labelTypeface = Typeface.create("sans-serif-medium", Typeface.NORMAL);
              }

              public View getHeaderView() { return headerRow; }

              public void attachTo(FrameLayout container) {
                  if (container == null) return;
                  LinearLayout headerLayout = new LinearLayout(activity);
                  headerLayout.setOrientation(LinearLayout.HORIZONTAL);
                  headerLayout.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);
                  headerLayout.setGravity(Gravity.CENTER_VERTICAL);
                  headerLayout.setPadding(dp(20), dp(14), dp(20), dp(10));

                  /* Subtle warm background */
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(Color.argb(245, 254, 252, 248));
                  headerLayout.setBackground(bg);

                  View brand = buildBrand();
