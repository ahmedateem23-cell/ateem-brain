      # 7.5 Create chat-panel injection asset — Premium Quiet Luxury Edition
      - name: Create ATEEM context-flags + touch-polish assets
        run: |

          mkdir -p android/app/src/main/assets/inject

          cat > android/app/src/main/assets/inject/ateem_widget_inject.js << 'EOF'
          (function ATEEM_CONTEXT_FLAGS(){
            /* This ONLY sets the page-context flags the site's own ATEEM chat
               widget reads (window.ATEEM_SHOULD_SHOW / ATEEM_PAGE_TYPE /
               ATEEM_PRODUCT_SLUG). The chat widget itself already lives on
               ateem-store.com — we must never recreate it here, since a
               second copy with the same element ids (#ateem-panel,
               #ateem-header-chat, etc.) collides with the real one and is
               exactly why the bot broke. */
            var path = window.location.pathname.replace(/\/+$/, "");
            var isHome    = (path === "" || path === "/");
            var isProduct = /^\/shop\/[a-z0-9-]+$/i.test(path);
            window.ATEEM_SHOULD_SHOW = isHome || isProduct;
            window.ATEEM_PAGE_TYPE   = isHome ? "home" : (isProduct ? "product" : "other");
            if (isProduct) window.ATEEM_PRODUCT_SLUG = path.replace("/shop/", "");
          })();
          EOF

          cat > android/app/src/main/assets/inject/ateem_touch_polish.js << 'EOF'
          (function ATEEM_TOUCH_POLISH(){
            if (window.__ateemTouchPolishInjected) return;
            window.__ateemTouchPolishInjected = true;
            var style = document.createElement('style');
            style.id = 'ateem-touch-polish-style';
            /* Quiet touch feedback across the real site — removes the large
               default Android tap-highlight flash on section/category cards
               and links, without touching the site's own colors or the
               chat widget's markup in any way. */
            style.textContent = "html,body,a,button,[role='button']{-webkit-tap-highlight-color:transparent;}"
              + "a:active,button:active,[role='button']:active{opacity:.94;transform:scale(0.985);transition:transform .12s ease,opacity .12s ease;}";
            document.head.appendChild(style);
          })();
          EOF

      # 7.6 Create the fully in-app ATEEM chat widget (local asset, no website dependency)
      - name: Create local ATEEM chat widget asset
        run: |

          mkdir -p android/app/src/main/assets/ateem_chat

          cat > android/app/src/main/assets/ateem_chat/chat.html << 'EOF'
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
          <title>ATEEM Assistant</title>
          <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,600&family=Montserrat:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500&display=swap" rel="stylesheet">
          <style>
          html, body { margin:0; padding:0; background:transparent; height:100%; }
          html, body, button, a, input, [role='button'] { -webkit-tap-highlight-color:transparent; }
          button, a { touch-action:manipulation; }
          :root {
            --ateem-cream:      #F5F0E8;
            --ateem-cream-deep: #EDE7DC;
            /* Single unified gold — same shade as the native app's GOLD
               constant (#B8936A), used sparingly for accents only. */
            --ateem-gold:       #B8936A;
            --ateem-gold-light: #D2B592;
            --ateem-gold-deep:  #93714F;
            --ateem-gold-pale:  #E8DCC9;
            --ateem-ink-soft:   #201C14;
            --ateem-ink-muted:  #55503F;
            --ateem-ink-faint:  #9A8F76;
            --ateem-navy:       #6B7A45;
            --ateem-navy-light: #8A9A5B;
            /* Quiet olive header gradient — no black stop, to stay clear of
               the "black + gold" luxury cliché the brand explicitly avoids. */
            --ateem-olive:      #6B7A45;
            --ateem-olive-dark: #4A5530;
            --ateem-white:      #FFFFFF;
            --ateem-white-soft: #FAF8F5;
          }

          @keyframes ateem-panelIn {
            0%   { opacity:0; transform:translateY(24px) scale(0.96); }
            100% { opacity:1; transform:translateY(0) scale(1); }
          }
          @keyframes ateem-panelOut {
            0%   { opacity:1; transform:translateY(0) scale(1); }
            100% { opacity:0; transform:translateY(16px) scale(0.97); }
          }
          @keyframes ateem-backdropIn { from { opacity:0; } to { opacity:1; } }
          @keyframes ateem-backdropOut { from { opacity:1; } to { opacity:0; } }
          @keyframes ateem-typingDot {
            0%,80%,100% { transform:scale(.6); opacity:.3; }
            40%          { transform:scale(1);  opacity:1; }
          }
          @keyframes ateem-recPulse {
            0%,100% { box-shadow:0 0 0 0 rgba(220,60,60,0.4); }
            50%      { box-shadow:0 0 0 8px rgba(220,60,60,0); }
          }
          @keyframes ateem-statusPulse {
            0%,100% { opacity:1; transform:scale(1); }
            50%      { opacity:.6; transform:scale(0.85); }
          }
          @keyframes ateem-msgAppear {
            from { opacity:0; transform:translateY(10px) scale(0.96); }
            to   { opacity:1; transform:translateY(0) scale(1); }
          }

          #ateem-backdrop {
            /* Full blur across the whole screen was removed earlier because
               it repainted every frame near the keyboard/typing caret. This
               backdrop is a separate, non-animating fixed layer that never
               sits behind the input or keyboard, so a small-radius blur here
               is safe — it composites once on open, not on every keystroke.
               @supports keeps a flat scrim as the fallback everywhere else. */
            position:fixed; inset:0; background:rgba(43,51,32,0.32);
            z-index:1; display:none; opacity:0;
          }
          @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
            #ateem-backdrop {
              background:rgba(43,51,32,0.20);
              backdrop-filter: blur(4px);
              -webkit-backdrop-filter: blur(4px);
            }
          }
          #ateem-backdrop.active  { display:block; animation:ateem-backdropIn 0.4s ease forwards; }
          #ateem-backdrop.closing { display:block; animation:ateem-backdropOut 0.3s ease forwards; }

          #ateem-panel {
            position:fixed; left:14px; right:14px; top:52px;
            bottom:calc(max(var(--ateem-bottom-inset, 34px), var(--ateem-kb-inset, 0px)) + 16px);
            max-width:360px; margin:auto;
            background:var(--ateem-white-soft);
            border-radius:26px; overflow:hidden; z-index:2;
            display:none; flex-direction:column;
            border:1px solid rgba(184,147,106,0.22);
            box-shadow:0 20px 48px rgba(20,19,15,0.16), 0 2px 8px rgba(20,19,15,0.06);
            font-family:'IBM Plex Sans Arabic',sans-serif;
            transform-origin:top center;
            will-change:transform, opacity;
          }
          /* Cheap glass sheen — a static gradient, not a blur, so it reads as
             soft luxury glass without the keyboard-adjacent repaint cost. */
          #ateem-panel::before {
            content:''; position:absolute; inset:0; pointer-events:none; z-index:3;
            background:linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 22%);
          }
          #ateem-panel.active  { display:flex; animation:ateem-panelIn 0.5s cubic-bezier(0.22,1,0.36,1) both; }
          #ateem-panel.closing { display:flex; animation:ateem-panelOut 0.35s cubic-bezier(0.22,1,0.36,1) forwards; }

          /* ═══ Slim header — quiet olive gradient with a thin gold
             hairline accent, instead of a heavy solid-color block ═══ */
          #ateem-panel .ateem-chat-header {
            position:relative; overflow:hidden;
            background:linear-gradient(135deg, var(--ateem-navy-light) 0%, var(--ateem-olive) 100%);
            padding:9px 12px; min-height:46px;
            display:flex; align-items:center; justify-content:space-between;
            border-bottom:1px solid rgba(201,164,100,0.35);
          }
          #ateem-panel .ateem-chat-header::before {
            content:''; position:absolute; top:0; left:0; right:0; height:2px;
            background:linear-gradient(90deg, transparent, var(--ateem-gold), transparent);
            opacity:0.8;
          }
          #ateem-panel .ateem-chat-header-content { display:flex; align-items:center; gap:8px; position:relative; z-index:1; }
          #ateem-panel .ateem-chat-logo-wrap {
            width:32px; height:32px; border-radius:50%;
            background:var(--ateem-olive-dark);
            display:flex; align-items:center; justify-content:center;
            border:1.5px solid rgba(255,255,255,0.55);
            box-shadow:0 2px 6px rgba(0,0,0,0.20);
            flex-shrink:0; overflow:hidden;
          }
          #ateem-panel .ateem-chat-logo-img { width:100%; height:100%; object-fit:cover; object-position:center center; border-radius:50%; display:block; }
          #ateem-panel .ateem-chat-title {
            font-family:'Montserrat',sans-serif; font-size:11.5px; font-weight:600;
            color:var(--ateem-white); letter-spacing:.3px;
          }
          #ateem-panel .ateem-chat-status-dot {
            display:inline-block; width:5px; height:5px; border-radius:50%;
            background:#5DAA5A; margin-right:4px; box-shadow:0 0 5px rgba(93,170,90,0.45);
            animation:ateem-statusPulse 2s ease-in-out infinite;
          }
          #ateem-panel .ateem-chat-sub {
            font-size:8px; color:var(--ateem-gold-pale); margin-top:1px;
            letter-spacing:.8px; font-family:'Montserrat',sans-serif; opacity:0.9;
          }
          #ateem-panel .ateem-chat-close {
            width:24px; height:24px; border:1.5px solid rgba(201,164,100,0.45); border-radius:50%;
            background:rgba(255,255,255,0.06); color:var(--ateem-gold-light); font-size:10px;
            cursor:pointer; position:relative; z-index:1; transition:transform .18s ease, background .18s ease;
            display:flex; align-items:center; justify-content:center;
          }
          #ateem-panel .ateem-chat-close:active { transform:scale(0.88); background:rgba(255,255,255,0.14); }

          #ateem-panel #ateem-chat {
            flex:1; overflow-y:auto; padding:14px 14px;
            display:flex; flex-direction:column; gap:10px;
            scrollbar-width:thin; scrollbar-color:rgba(184,147,106,.22) transparent;
            background:linear-gradient(180deg, var(--ateem-white-soft) 0%, var(--ateem-cream) 100%);
            scroll-behavior:smooth; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
          }
          #ateem-panel #ateem-chat::-webkit-scrollbar { width:3px; }
          #ateem-panel #ateem-chat::-webkit-scrollbar-thumb { background:rgba(184,147,106,.25); border-radius:10px; }
          #ateem-panel #ateem-chat::-webkit-scrollbar-track { background:transparent; }

          #ateem-panel .ateem-msg-wrap { display:flex; flex-direction:column; gap:3px; max-width:88%; animation:ateem-msgAppear .4s cubic-bezier(0.22,1,0.36,1) both; }
          #ateem-panel .ateem-msg-wrap.ateem-user { align-self:flex-start; margin-left:auto; }
          #ateem-panel .ateem-msg-wrap.ateem-bot  { align-self:flex-end; margin-right:auto; }
          #ateem-panel .ateem-msg-time { font-size:8.5px; color:var(--ateem-ink-faint); padding:0 5px; opacity:.65; font-family:'Montserrat',sans-serif; letter-spacing:.3px; }

          #ateem-panel .ateem-welcome-banner { text-align:center; padding:6px 0 2px; }
          #ateem-panel .ateem-welcome-banner .ateem-welcome-text {
            font-family:'Cormorant Garamond', serif; font-style:normal; font-size:14px;
            color:var(--ateem-ink-muted); letter-spacing:.5px; line-height:1.6;
          }
          #ateem-panel .ateem-welcome-banner .ateem-welcome-time { font-size:8.5px; color:var(--ateem-ink-faint); margin-top:4px; font-family:'Montserrat',sans-serif; }

          #ateem-panel .ateem-bot-msg {
            background:var(--ateem-cream); color:var(--ateem-ink-soft);
            padding:11px 14px; border-radius:18px 18px 18px 5px; line-height:1.9; max-width:100%;
            border:1px solid rgba(201,164,100,0.20);
            box-shadow:0 2px 8px rgba(20,19,15,0.05);
            font-size:13.5px; direction:rtl; position:relative;
          }

          /* Sent bubbles use the app's everyday olive accent, not gold —
             gold is reserved for occasional highlights, not a repeating
             element that appears on every message the user sends. */
          #ateem-panel .ateem-user-msg {
            background:linear-gradient(135deg, var(--ateem-navy-light) 0%, var(--ateem-navy) 100%);
            color:var(--ateem-white);
            padding:11px 14px; border-radius:18px 18px 5px 18px; max-width:100%; font-size:13.5px; line-height:1.7; direction:rtl;
            font-weight:500;
            box-shadow:0 3px 10px rgba(107,122,69,0.22);
            border:1px solid rgba(255,255,255,0.18); position:relative;
          }

          #ateem-panel .ateem-quick-replies { display:flex; flex-wrap:wrap; gap:6px; margin-top:3px; padding:0 3px; direction:rtl; }
          #ateem-panel .ateem-quick-chip {
            font-size:10.5px; font-weight:500; color:var(--ateem-ink-soft); background:var(--ateem-white);
            border:1.5px solid rgba(201,164,100,0.35); padding:6px 12px; border-radius:22px; cursor:pointer; white-space:nowrap;
            font-family:'IBM Plex Sans Arabic',sans-serif; transition:.25s ease; box-shadow:0 2px 6px rgba(20,19,15,0.04);
          }
          #ateem-panel .ateem-quick-chip:active { transform:translateY(0) scale(0.96); }

          #ateem-panel .ateem-products-wrap { display:flex; flex-direction:column; gap:8px; max-width:100%; margin-top:3px; }
          #ateem-panel .ateem-product-card {
            display:flex; align-items:center; gap:10px; background:var(--ateem-cream);
            border:1px solid rgba(201,164,100,0.22); border-radius:16px; padding:10px;
            box-shadow:0 2px 8px rgba(20,19,15,0.05);
            direction:rtl; text-decoration:none; transition:.25s ease; position:relative; overflow:hidden;
          }
          #ateem-panel .ateem-product-card::before {
            content:''; position:absolute; top:0; left:0; right:0; height:2.5px;
            background:linear-gradient(90deg, var(--ateem-gold-light), var(--ateem-gold), var(--ateem-gold-light)); opacity:0.7;
          }
          #ateem-panel .ateem-product-card:active { transform:scale(0.98); }
          #ateem-panel .ateem-product-img { width:50px; height:50px; border-radius:10px; object-fit:cover; flex-shrink:0; border:1.5px solid rgba(201,164,100,0.20); background:#eee; box-shadow:0 2px 6px rgba(0,0,0,0.05); }
          #ateem-panel .ateem-product-info { flex:1; min-width:0; }
          #ateem-panel .ateem-product-name { font-size:12px; font-weight:600; color:var(--ateem-ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
          #ateem-panel .ateem-product-cat { font-size:9.5px; color:var(--ateem-ink-muted); margin-top:1px; }
          #ateem-panel .ateem-product-price { font-size:12px; font-weight:700; color:var(--ateem-gold-deep); margin-top:3px; font-family:'Montserrat',sans-serif; }
          #ateem-panel .ateem-product-btn {
            font-size:9.5px; font-weight:600; background:var(--ateem-navy);
            color:var(--ateem-white); border:1px solid var(--ateem-navy-light); padding:6px 10px; border-radius:8px;
            white-space:nowrap; flex-shrink:0; transition:.2s ease;
          }

          #ateem-panel .ateem-error-msg {
            background:rgba(220,60,60,0.04); color:#a04040; padding:11px 14px; border-radius:18px 18px 18px 5px;
            border:1.5px solid rgba(220,60,60,0.12); font-size:12px; line-height:1.7; direction:rtl;
            background:linear-gradient(135deg, rgba(220,60,60,0.04), rgba(220,60,60,0.01));
          }
          #ateem-panel .ateem-error-retry {
            display:inline-flex; align-items:center; gap:5px; margin-top:6px; padding:6px 11px; background:rgba(220,60,60,0.08);
            border:1.5px solid rgba(220,60,60,0.18); border-radius:8px; color:#a04040; font-size:10.5px; font-weight:500; cursor:pointer; transition:.2s ease;
          }

          #ateem-panel .ateem-scroll-bottom {
            position:absolute; bottom:12px; left:50%; transform:translateX(-50%);
            width:32px; height:32px; border-radius:50%; background:var(--ateem-white);
            border:1.5px solid rgba(184,147,106,0.22); box-shadow:0 4px 14px rgba(90,60,20,0.10);
            display:flex; align-items:center; justify-content:center; cursor:pointer;
            opacity:0; pointer-events:none; transition:.3s ease; z-index:5; color:var(--ateem-gold); font-size:13px;
          }
          #ateem-panel .ateem-scroll-bottom.visible { opacity:1; pointer-events:auto; }

          #ateem-panel .ateem-input-wrap {
            display:flex; align-items:center; gap:8px; padding:10px 12px 12px; background:var(--ateem-white);
            border-top:1px solid rgba(184,147,106,0.12); flex-shrink:0; position:relative;
          }
          #ateem-panel #ateem-input {
            flex:1; min-width:0; height:36px; border:1.5px solid rgba(184,147,106,0.16); border-radius:12px; padding:0 12px;
            background:var(--ateem-white-soft); color:var(--ateem-ink-soft); font-family:'IBM Plex Sans Arabic',sans-serif;
            font-size:13.5px; outline:none; direction:rtl; transition:.25s ease; box-sizing:border-box;
          }
          #ateem-panel #ateem-input::placeholder { color:rgba(90,60,20,0.30); font-weight:300; }
          #ateem-panel #ateem-input:disabled { opacity:.50; cursor:not-allowed; }
          #ateem-panel .ateem-send {
            width:34px; height:34px; min-width:34px; flex-shrink:0; border-radius:10px;
            background:linear-gradient(135deg, var(--ateem-navy-light) 0%, var(--ateem-navy) 100%);
            color:var(--ateem-white);
            cursor:pointer; display:flex; align-items:center; justify-content:center; transition:.25s ease;
            box-shadow:0 3px 8px rgba(107,122,69,0.22); border:1.5px solid rgba(255,255,255,0.18);
            padding:0; touch-action:manipulation; position:relative; z-index:10;
          }
          #ateem-panel .ateem-send:active { transform:scale(0.93) translateY(0); }
          #ateem-panel .ateem-send svg { width:15px; height:15px; pointer-events:none; }
          #ateem-panel .ateem-voice {
            width:34px; height:34px; min-width:34px; flex-shrink:0; border-radius:10px;
            background:linear-gradient(135deg, var(--ateem-navy-light) 0%, var(--ateem-navy) 100%);
            color:var(--ateem-white); cursor:pointer; display:flex;
            align-items:center; justify-content:center; border:1.5px solid rgba(255,255,255,0.18); transition:.25s ease;
            box-shadow:0 3px 8px rgba(107,122,69,0.22); padding:0; touch-action:manipulation; position:relative; z-index:10;
          }
          #ateem-panel .ateem-voice.recording {
            background:linear-gradient(135deg,#e85555,#c93030); color:white; border-color:rgba(255,100,100,0.40);
            animation:ateem-recPulse 1s ease infinite;
          }
          #ateem-panel .ateem-voice svg { width:14px; height:14px; pointer-events:none; }

          #ateem-panel .ateem-typing {
            display:flex; gap:4px; padding:10px 14px; background:var(--ateem-white);
            border-radius:18px 18px 18px 5px; max-width:60px; border:1px solid rgba(184,147,106,0.10);
            box-shadow:0 2px 8px rgba(90,60,20,0.04);
          }
          #ateem-panel .ateem-typing span {
            width:5.5px; height:5.5px; border-radius:50%; background:var(--ateem-gold); opacity:.4;
            animation:ateem-typingDot 1.4s ease infinite;
          }
          #ateem-panel .ateem-typing span:nth-child(2) { animation-delay:.2s; }
          #ateem-panel .ateem-typing span:nth-child(3) { animation-delay:.4s; }

          @media (prefers-reduced-motion: reduce) {
            #ateem-panel *, #ateem-panel *::before, #ateem-panel *::after {
              animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;
            }
          }
          </style>
          </head>
          <body>

          <div id="ateem-backdrop"></div>

          <div id="ateem-panel">
            <div class="ateem-chat-header">
              <div class="ateem-chat-header-content">
                <div class="ateem-chat-logo-wrap">
                  <img class="ateem-chat-logo-img" src="https://i.ibb.co/F4vhYp7Y/file-00000000b6f081f490aa2899443132bd.png" alt="ATEEM" loading="lazy">
                </div>
                <div>
                  <div class="ateem-chat-title">ATEEM Assistant <span class="ateem-chat-status-dot"></span></div>
                  <div class="ateem-chat-sub">✦ Luxury AI Concierge ✦</div>
                </div>
              </div>
              <button onclick="closeAteemPanel()" class="ateem-chat-close" aria-label="إغلاق">✕</button>
            </div>

            <div style="position:relative; flex:1; overflow:hidden; display:flex; flex-direction:column;">
              <div id="ateem-chat"></div>
              <div class="ateem-scroll-bottom" id="ateem-scroll-bottom" onclick="scrollAteemToBottom()">↓</div>
            </div>

            <div class="ateem-input-wrap">
              <button id="ateem-voice-btn" class="ateem-voice" onclick="toggleVoice()" aria-label="تسجيل صوتي">
                <svg viewBox="0 0 24 24" fill="none">
                  <rect x="9" y="2" width="6" height="12" rx="3" fill="currentColor"></rect>
                  <path d="M5 10a7 7 0 0 0 14 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
                  <line x1="12" y1="19" x2="12" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
                </svg>
              </button>
              <input type="text" id="ateem-input" placeholder="اكتب رسالتك هنا..." autocomplete="off" aria-label="رسالتك">
              <button onclick="sendAteemMessage()" class="ateem-send" aria-label="إرسال">
                <svg viewBox="0 0 24 24" fill="none">
                  <polygon points="5,12 19,4 19,20" fill="currentColor"></polygon>
                </svg>
              </button>
            </div>
          </div>

          <script>
          /* Fully in-app — always uses the "home" welcome/quick-replies since
             this overlay isn't tied to a specific product page. */
          window.ATEEM_PAGE_TYPE = "home";
          const pageType = "home";

          const ATEEM_PAGE_CONFIG = {
            home: { welcome:"✦ أهلاً بك في ATEEM، كيف يمكنني خدمتك؟" }
          };
          const pageCfg = ATEEM_PAGE_CONFIG.home;

          const ATEEM_QUICK_REPLIES = {
            home: ["عطور فاخرة", "بدلات رسمية", "أحذية رياضية", "سياسة التوصيل"]
          };

          const ATEEM_PRODUCTS = [
            { id:"far-away-glamour-11", name:"Far Away Glamour", category:"عطور", price:68000, currency:"SDG", img:"https://i.ibb.co/0jqnkzLd/Gemini-Generated-Image-tndg97tndg97tndg.png", url:"https://ateem-store.odoo.com/shop/far-away-glamour-11" },
            { id:"dior-sauvage-8", name:"Dior Sauvage", category:"عطور", price:385000, currency:"SDG", img:"https://i.ibb.co/gFm2Kvpz/Gemini-Generated-Image-yq7holyq7holyq7h.png", url:"https://ateem-store.odoo.com/shop/dior-sauvage-8" },
            { id:"chance-chanel-13", name:"Chance Chanel", category:"عطور", price:60000, currency:"SDG", img:"https://i.ibb.co/TxsHb2L5/Gemini-Generated-Image-dd1b0ldd1b0ldd1b.png", url:"https://ateem-store.odoo.com/shop/chance-chanel-13" },
            { id:"seoul-12", name:"Seoul", category:"عطور", price:75000, currency:"SDG", img:"https://i.ibb.co/b539RH5w/Gemini-Generated-Image-54lzu254lzu254lz.png", url:"https://ateem-store.odoo.com/shop/seoul-12" },
            { id:"navy-motion-runner-15", name:"Navy Motion Runner", category:"أحذية", price:130000, currency:"SDG", img:"https://i.ibb.co/NdhXGwMy/Gemini-Generated-Image-mp73glmp73glmp73.png", url:"https://ateem-store.odoo.com/shop/navy-motion-runner-15" },
            { id:"urban-mint-air-sneakers-14", name:"Urban Mint Air Sneakers", category:"أحذية", price:94000, currency:"SDG", img:"https://i.ibb.co/W4VCnsMh/file-000000009718724398109ae77dfa02a0.png", url:"https://ateem-store.odoo.com/shop/urban-mint-air-sneakers-14" },
            { id:"pure-white-chunky-runner-17", name:"Pure White Chunky Runner", category:"أحذية", price:115000, currency:"SDG", img:"https://i.ibb.co/Kz9p3R3n/file-00000000a4fc471fba6dd74fc5eb45986.png", url:"https://ateem-store.odoo.com/shop/pure-white-chunky-runner-17" },
            { id:"forest-classic-street-16", name:"Forest Classic Street", category:"أحذية", price:105000, currency:"SDG", img:"https://i.ibb.co/GmrTzxn/Gemini-Generated-Image-w4rqzdw4rqzdw4rq.png", url:"https://ateem-store.odoo.com/shop/forest-classic-street-16" },
            { id:"royal-tailored-suit-19", name:"Royal Tailored Suit", category:"بدلات", price:330000, currency:"SDG", img:"https://i.ibb.co/hJDmt2p4/file-000000009cd071f498b65799d5b81db8.png", url:"https://ateem-store.odoo.com/shop/royal-tailored-suit-19" },
            { id:"midnight-royal-suit-20", name:"Midnight Royal Suit", category:"بدلات", price:330000, currency:"SDG", img:"https://i.ibb.co/xtrVVgrK/file-0000000020fc720a94ed27307981a08d.png", url:"https://ateem-store.odoo.com/shop/midnight-royal-suit-20" },
            { id:"silver-prestige-suit-21", name:"Silver Prestige Suit", category:"بدلات", price:330000, currency:"SDG", img:"https://i.ibb.co/cKfTv4WW/file-000000004e207246924306b0c6106f88.png", url:"https://ateem-store.odoo.com/shop/silver-prestige-suit-21" },
            { id:"black-elite-tuxedo-22", name:"Black Elite Tuxedo", category:"بدلات", price:330000, currency:"SDG", img:"https://i.ibb.co/MyJKyWn2/file-00000000bae071f499b75926be1ffeeb.png", url:"https://ateem-store.odoo.com/shop/black-elite-tuxedo-22" },
            { id:"pure-elegance-shirt-18", name:"Pure Elegance Shirt", category:"قمصان", price:60000, currency:"SDG", img:"https://i.ibb.co/DHR9VbjS/file-00000000719471f49d51c75a76277a0f.png", url:"https://ateem-store.odoo.com/shop/pure-elegance-shirt-18" },
            { id:"summer-linen-shirt-24", name:"Summer Linen Shirt", category:"قمصان", price:72000, currency:"SDG", img:"https://i.ibb.co/DgWfmj3K/file-00000000c59071f4b369894585670f81.png", url:"https://ateem-store.odoo.com/shop/summer-linen-shirt-24" },
            { id:"tropical-breeze-shirt-25", name:"Tropical Breeze Shirt", category:"قمصان", price:55000, currency:"SDG", img:"https://i.ibb.co/4wDp1dNm/file-00000000830c71f48af8c852c4e333a4.png", url:"https://ateem-store.odoo.com/shop/tropical-breeze-shirt-25" },
            { id:"olive-botanica-shirt-29", name:"Olive Botanica Shirt", category:"قمصان", price:95000, currency:"SDG", img:"https://i.ibb.co/SDsmMp3Y/file-000000006e8471f4abdb0224e3744601.png", url:"https://ateem-store.odoo.com/shop/olive-botanica-shirt-29" },
            { id:"prestige-olive-tee-28", name:"Prestige Olive Tee", category:"تيشيرتات", price:70000, currency:"SDG", img:"https://i.ibb.co/LzQ1Vq1D/file-00000000e44871f48226a06acb6d5829.png", url:"https://ateem-store.odoo.com/shop/prestige-olive-tee-28" },
            { id:"modern-tee-26", name:"Modern Tee", category:"تيشيرتات", price:48000, currency:"SDG", img:"https://i.ibb.co/4gS6fshQ/file-000000008ffc71f4a6651f40a6dcee06.png", url:"https://ateem-store.odoo.com/shop/modern-tee-26" },
            { id:"botanical-luxe-tee-30", name:"Botanical Luxe Tee", category:"تيشيرتات", price:70000, currency:"SDG", img:"https://i.ibb.co/Kj3sX5JJ/file-00000000681871f48d2db3d9a7aecfa4.png", url:"https://ateem-store.odoo.com/shop/botanical-luxe-tee-30" },
            { id:"elite-performance-tee-27", name:"Elite Performance Tee", category:"تيشيرتات", price:66000, currency:"SDG", img:"https://i.ibb.co/cSY6t7m5/file-00000000ce0871f4afa59ce040de4e8c.png", url:"https://ateem-store.odoo.com/shop/elite-performance-tee-27" },
            { id:"luxury-men-s-watch-32", name:"Luxury Men's Watch", category:"إكسسوارات", price:110000, currency:"SDG", img:"https://i.ibb.co/7Np7jwyy/file-00000000aaa072439c6791af42215f0d.png", url:"https://ateem-store.odoo.com/shop/luxury-men-s-watch-32" },
            { id:"luxury-men-s-sunglasses-31", name:"Luxury Men's Sunglasses", category:"إكسسوارات", price:36000, currency:"SDG", img:"https://i.ibb.co/8nxYSGv1/file-000000003158724396a2ced32048b52a.png", url:"https://ateem-store.odoo.com/shop/luxury-men-s-sunglasses-31" }
          ];

          const ATEEM_POLICY_TEXT = `
          سياسات متجر ATEEM:
          - التوصيل: داخل المدن الرئيسية 2-4 أيام عمل، وباقي المناطق 4-7 أيام عمل.
          - الاستبدال: خلال 14 يومًا من تاريخ الاستلام بشرط الحالة الأصلية مع الفاتورة.
          - الترجيع: خلال 7 أيام من الاستلام للمنتجات غير المستخدمة.
          `;

          const ATEEM_PROXY_URL = "https://ateem-proxy.ahmedateem23.workers.dev/";
          const GROQ_MODEL = "openai/gpt-oss-120b";

          function fmtPrice(p) { return p.price.toLocaleString('en-US') + " " + p.currency; }
          function nowTime() { return new Date().toLocaleTimeString('ar-SA', { hour:'2-digit', minute:'2-digit' }); }

          function buildSystemPrompt() {
            const productLines = ATEEM_PRODUCTS.map(p =>
              `- [${p.id}] ${p.name} | الفئة: ${p.category} | السعر: ${fmtPrice(p)}`
            ).join("\n");
            return `أنت مساعد ذكي فاخر لمتجر ATEEM للأزياء الراقية.
          تتحدث باللغة العربية بأسلوب راقٍ ومحترف ودافئ.
          اجعل ردودك موجزة وأنيقة — لا تتجاوز 3-4 أسطر عادةً.
          قائمة المنتجات:
          ${productLines}
          ${ATEEM_POLICY_TEXT}
          تعليمات: عند ترشيح منتج اذكر رمزه [id] بين أقواس مربعة. لا تخترع منتجات غير موجودة.`;
          }

          let panelIsOpen = false;
          let lastFailedMsg = null;
          const conversationHistory = [];
          const panel     = document.getElementById('ateem-panel');
          const chat      = document.getElementById('ateem-chat');
          const inputEl   = document.getElementById('ateem-input');
          const scrollBtn = document.getElementById('ateem-scroll-bottom');
          const voiceBtn  = document.getElementById('ateem-voice-btn');
          const backdrop  = document.getElementById('ateem-backdrop');

          function notifyNativeClosed() {
            if (window.AteemNative && window.AteemNative.onCloseRequested) {
              window.AteemNative.onCloseRequested();
            }
          }

          /* Called by the native Android side (NativeChatOverlay.show()) every
             time the WebView is revealed — this is the ONLY way the panel
             opens, there is no in-page button since the native header owns
             that button. */
          /* Keep the panel's real bottom edge locked to the visible viewport
             (not just the nav-bar inset from native), so the keyboard can
             never push the header off the top of the screen. */
          if (window.visualViewport) {
            const vv = window.visualViewport;
            let vvTicking = false;
            function syncKeyboardInset() {
              vvTicking = false;
              const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
              document.documentElement.style.setProperty('--ateem-kb-inset', kb + 'px');
            }
            function queueSync() { if (!vvTicking) { vvTicking = true; requestAnimationFrame(syncKeyboardInset); } }
            vv.addEventListener('resize', queueSync);
            vv.addEventListener('scroll', queueSync);
            syncKeyboardInset();
          }

          function openPanel() {
            panelIsOpen = true;
            panel.classList.remove('closing');
            panel.classList.add('active');
            if (backdrop) { backdrop.classList.remove('closing'); backdrop.classList.add('active'); }
            setTimeout(() => { inputEl.focus(); scrollAteemToBottom(true); }, 300);
          }
          window.ateemOpenPanel = openPanel;

          function closeAteemPanel() {
            panelIsOpen = false;
            panel.classList.remove('active');
            panel.classList.add('closing');
            if (backdrop) { backdrop.classList.remove('active'); backdrop.classList.add('closing'); }
            window.speechSynthesis && window.speechSynthesis.cancel();
            setTimeout(() => {
              panel.classList.remove('closing');
              if (backdrop) backdrop.classList.remove('closing');
              notifyNativeClosed();
            }, 350);
          }
          window.closeAteemPanel = closeAteemPanel;

          if (backdrop) backdrop.addEventListener('click', () => { if (panelIsOpen) closeAteemPanel(); });
          panel.addEventListener('click', (e) => e.stopPropagation());
          document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && panelIsOpen) closeAteemPanel(); });

          function scrollAteemToBottom(instant) {
            chat.scrollTo({ top: chat.scrollHeight, behavior: instant ? 'auto' : 'smooth' });
          }
          window.scrollAteemToBottom = scrollAteemToBottom;
          chat.addEventListener('scroll', () => {
            const nearBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 50;
            if (scrollBtn) scrollBtn.classList.toggle('visible', !nearBottom);
          });

          function renderProductCard(p) {
            return `<a href="${p.url}" class="ateem-product-card" target="_blank" rel="noopener">
              <img class="ateem-product-img" src="${p.img}" alt="${p.name}" loading="lazy" onerror="this.style.visibility='hidden'">
              <div class="ateem-product-info">
                <div class="ateem-product-name">${p.name}</div>
                <div class="ateem-product-cat">${p.category}</div>
                <div class="ateem-product-price">${fmtPrice(p)}</div>
              </div>
              <div class="ateem-product-btn">عرض المنتج</div>
            </a>`;
          }

          function renderQuickChips() {
            const replies = ATEEM_QUICK_REPLIES.home;
            const chips = replies.map(r =>
              `<span class="ateem-quick-chip" onclick="quickAteemReply('${r.replace(/'/g, "\\'")}')">${r}</span>`
            ).join('');
            return `<div class="ateem-quick-replies">${chips}</div>`;
          }
          window.quickAteemReply = function (text) {
            inputEl.value = text;
            sendAteemMessage();
          };

          function renderBotReply(text, includeQuickReplies) {
            const idsFound = [];
            const cleanText = text.replace(/\[([a-z0-9-]+)\]/gi, (m, id) => {
              if (ATEEM_PRODUCTS.find(p => p.id === id)) idsFound.push(id);
              return "";
            }).replace(/\s{2,}/g, " ").trim();

            let html = `<div class="ateem-msg-wrap ateem-bot">
              <div class="ateem-bot-msg">${cleanText.replace(/\n/g,'<br>')}</div>
              <div class="ateem-msg-time">${nowTime()}</div>
            </div>`;

            const uniqueIds = [...new Set(idsFound)];
            if (uniqueIds.length) {
              const cards = uniqueIds.map(id => ATEEM_PRODUCTS.find(p => p.id === id)).filter(Boolean).map(renderProductCard).join("");
              html += `<div class="ateem-products-wrap">${cards}</div>`;
            }
            if (includeQuickReplies) html += renderQuickChips();
            return html;
          }

          function renderUserMsg(text) {
            return `<div class="ateem-msg-wrap ateem-user">
              <div class="ateem-user-msg">${text.replace(/\n/g,'<br>')}</div>
              <div class="ateem-msg-time">${nowTime()}</div>
            </div>`;
          }

          function renderError(errMsg) {
            return `<div class="ateem-msg-wrap ateem-bot">
              <div class="ateem-error-msg">
                ⚠️ تعذّر الاتصال بالخادم<br>
                <small style="opacity:.6; font-size:10.5px">${errMsg}</small>
                <div class="ateem-error-retry" onclick="retryAteemLast()">إعادة المحاولة</div>
              </div>
            </div>`;
          }
          window.retryAteemLast = function () {
            if (lastFailedMsg) { inputEl.value = lastFailedMsg; sendAteemMessage(); }
          };

          async function askGroq(userMessage) {
            conversationHistory.push({ role:"user", content:userMessage });
            const MAX_HISTORY = 8;
            const trimmedHistory = conversationHistory.slice(-MAX_HISTORY);

            const response = await fetch(ATEEM_PROXY_URL, {
              method:"POST",
              headers:{ "Content-Type":"application/json" },
              body:JSON.stringify({ model:GROQ_MODEL,
                messages:[{ role:"system", content:buildSystemPrompt() }, ...trimmedHistory],
                max_tokens:350, temperature:0.7 })
            });
            if (!response.ok) { const e=await response.json().catch(()=>({})); throw new Error(e.error?.message||`HTTP ${response.status}`); }
            const data  = await response.json();
            const reply = data.choices?.[0]?.message?.content?.trim() || "عذراً، لم أتمكن من الرد الآن.";
            conversationHistory.push({ role:"assistant", content:reply });
            return reply;
          }

          async function sendAteemMessage() {
            const msg = inputEl.value.trim();
            if (!msg) return;
            inputEl.value = "";
            lastFailedMsg = msg;
            inputEl.disabled = true;

            chat.insertAdjacentHTML('beforeend', renderUserMsg(msg));
            scrollAteemToBottom();

            const tid = "t_" + Date.now();
            chat.insertAdjacentHTML('beforeend', `<div id="${tid}" class="ateem-typing"><span></span><span></span><span></span></div>`);
            scrollAteemToBottom();

            try {
              const reply = await askGroq(msg);
              document.getElementById(tid)?.remove();
              chat.insertAdjacentHTML('beforeend', renderBotReply(reply, false));
              speakText(reply);
            } catch(e) {
              document.getElementById(tid)?.remove();
              chat.insertAdjacentHTML('beforeend', renderError(e.message));
            }
            scrollAteemToBottom();
            inputEl.disabled = false; inputEl.focus();
          }
          window.sendAteemMessage = sendAteemMessage;

          inputEl.addEventListener('keypress', e => { if (e.key === 'Enter') sendAteemMessage(); });
          const ateemSendBtn = document.querySelector('.ateem-send');
          if (ateemSendBtn) ateemSendBtn.addEventListener('click', sendAteemMessage);

          let recognition = null;
          let isRecording  = false;

          function toggleVoice() { isRecording ? stopVoice() : startVoice(); }
          window.toggleVoice = toggleVoice;

          function startVoice() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) { alert('متصفحك لا يدعم التسجيل الصوتي'); return; }
            recognition = new SR();
            recognition.lang = 'ar-SA';
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.onstart = () => {
              isRecording = true;
              if (voiceBtn) voiceBtn.classList.add('recording');
              inputEl.placeholder = '🎙 جارٍ التسجيل...';
            };
            recognition.onresult = (e) => {
              inputEl.value = e.results[0][0].transcript;
              stopVoice();
              sendAteemMessage();
            };
            recognition.onerror = () => stopVoice();
            recognition.onend   = () => stopVoice();
            recognition.start();
          }

          function stopVoice() {
            isRecording = false;
            if (recognition) { recognition.stop(); recognition = null; }
            if (voiceBtn) voiceBtn.classList.remove('recording');
            inputEl.placeholder = 'اكتب رسالتك هنا...';
          }

          async function speakText(text) {
            const clean = text.replace(/<[^>]+>/g, '').replace(/[✦◆\[\]]/g, '').trim();
            if (!clean) return;
            try {
              const response = await fetch(ATEEM_PROXY_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ type: "tts", text: clean })
              });
              if (!response.ok) {
                const errText = await response.text();
                throw new Error("TTS HTTP " + response.status + ": " + errText);
              }
              const audioBlob = await response.blob();
              const audioUrl  = URL.createObjectURL(audioBlob);
              const audio     = new Audio(audioUrl);
              audio.play().catch(err => console.warn("Audio play blocked:", err));
              audio.onended = () => URL.revokeObjectURL(audioUrl);
            } catch (err) {
              console.warn("ElevenLabs TTS failed:", err);
            }
          }

          function initAteemWelcome() {
            chat.innerHTML = `
              <div class="ateem-welcome-banner">
                <div class="ateem-welcome-text">${pageCfg.welcome}</div>
                <div class="ateem-welcome-time">${nowTime()}</div>
              </div>
            ` + renderQuickChips();
          }
          initAteemWelcome();
          </script>
          </body>
          </html>
          EOF

      # 8. Sync Capacitor
      - name: Sync Capacitor
        run: npx cap sync android


      # 8.5 Add Glide dependency
      - name: Add Glide dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle")
          text = path.read_text()
          MARKER = "ATEEM_GLIDE_DEPENDENCY"
          if MARKER not in text:
              addition = """

          // """ + MARKER + """ - do not remove this marker comment

          dependencies {

              implementation 'com.github.bumptech.glide:glide:4.16.0'

              annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

              implementation 'androidx.core:core:1.12.0'
          }

          """
              text += addition
              path.write_text(text)
              print("Glide dependency appended.")
          else:
              print("Marker already present - skipping.")
          PY


      # 9. Restore release keystore
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/release.keystore


      # 10. Verify keystore
      - name: Verify keystore
        run: |
          test -s android/app/release.keystore
          ls -lh android/app/release.keystore
          file android/app/release.keystore


      # 11. Test release keystore
      - name: Test release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -list \
            -keystore android/app/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias ateemrelease


      # 12. Configure release signing
      - name: Configure release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle")
          text = path.read_text()
          MARKER = "ATEEM_RELEASE_SIGNING_CONFIG"
          if MARKER not in text:
              signing = """

          // """ + MARKER + """ - do not remove this marker comment

          android {

              signingConfigs {

                  ateemRelease {

                      storeFile file(
                          "release.keystore"
                      )

                      storePassword System.getenv(
                          "ATEEM_STORE_PASSWORD"
                      )

                      keyAlias System.getenv(
                          "ATEEM_KEY_ALIAS"
                      )

                      keyPassword System.getenv(
                          "ATEEM_KEY_PASSWORD"
                      )
                  }
              }


              buildTypes {

                  release {

                      signingConfig signingConfigs.ateemRelease

                      minifyEnabled false
                  }
              }
          }

          """
              text += signing
              path.write_text(text)
              print("Release signing config appended.")
          else:
              print("Marker already present - skipping.")
          print("---- build.gradle tail ----")
          print(path.read_text()[-1500:])
          PY


      # 13. Build release APK
      - name: Build release APK
        working-directory: android
        env:
          ATEEM_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ATEEM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ATEEM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Checking signing configuration..."
          test -n "$ATEEM_STORE_PASSWORD"
          test -n "$ATEEM_KEY_ALIAS"
          test -n "$ATEEM_KEY_PASSWORD"
          test -s app/release.keystore
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace


      # 13.5 List build outputs
      - name: List build outputs
        run: |
          echo "=== Searching for any APK files produced ==="
          find android/app/build/outputs -type f -name "*.apk" 2>/dev/null || true
          echo "=== Full outputs directory tree ==="
          find android/app/build/outputs -type f 2>/dev/null || echo "outputs directory does not exist or is empty"


      # 14. Upload APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ateem-store-apk-premium
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
