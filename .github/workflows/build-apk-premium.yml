              /* Called every time this screen is shown (from MainActivity.onCartCheckout)
                 so the order summary + total always reflect the live cart — same
                 refresh-on-show pattern as NativeCartScreen.onScreenShown(). */
              public void onScreenShown(double total) {
                  currentTotal = total;
                  renderSummary();
                  resetPaymentSelection();
                  clearErrors();
                  resetConfirmButton();
                  if (successOverlay != null) successOverlay.setVisibility(View.GONE);
                  if (nameInput != null) nameInput.setText("");
                  if (phoneInput != null) phoneInput.setText("");
                  if (addressInput != null) addressInput.setText("");
                  if (citySpinner != null) citySpinner.setSelection(0);
