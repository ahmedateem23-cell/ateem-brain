              /* iconType is "back" or "heart" — each gets its own real shape
                 now (previously every header button silently rendered the
                 arrow, which is why the heart never actually appeared).
                 Contrast against the ivory page background was also raised
                 (darker stroke + visible elevation) so both the back button
                 and the heart button are clearly visible, not just present. */
              private ImageView buildHeaderIconButton(FrameLayout btn, String iconType) {
                  return buildHeaderIconButton(btn, iconType, dp(12));
              }

              /* Radius-aware variant — clips the button to its own rounded-rect
                 outline BEFORE elevation is applied, so the system shadow (and,
                 for the wishlist button, the gold fill/stroke once liked) is
                 masked to the pill shape instead of bleeding into square
                 corners outside the visible button. Elevation shadows are cast
                 from the view's outline, not its background drawable, so
                 without this the shadow — and the gold background peeking
                 through it — always followed the full rectangular bounds. */
              private ImageView buildHeaderIconButton(FrameLayout btn, String iconType, int radiusPx) {
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(WARM_WHITE);
                  bg.setCornerRadius(radiusPx);
                  bg.setStroke(dp(1), Color.argb(50, 138, 148, 116));
                  btn.setBackground(bg);
                  roundCorners(btn, radiusPx);
                  /* A faint, quiet lift instead of the heavier default shadow
                     — enough to read as a tappable surface without looking
                     smudged against the ivory background. */
                  btn.setElevation(dp(1));
                  ImageView icon = new ImageView(activity);
                  /* FIT_XY forces the ImageView to hand the drawable its full
                     pixel bounds with no internal source-rect matrix — the
                     drawable below draws itself against those bounds
                     directly, so nothing here depends on an intrinsic
                     width/height being reported correctly. */
                  icon.setScaleType(ImageView.ScaleType.FIT_XY);
                  icon.setImageDrawable(makeStrokeIcon(iconType, false));
                  icon.setTag(iconType);
                  FrameLayout.LayoutParams iconParams = new FrameLayout.LayoutParams(dp(20), dp(20));
                  iconParams.gravity = Gravity.CENTER;
                  btn.addView(icon, iconParams);
                  return icon;
              }

              private View buildHeaderIconButton(String iconType) {
                  FrameLayout btn = new FrameLayout(activity);
                  buildHeaderIconButton(btn, iconType);
                  return btn;
              }

              /* A hand-drawn Drawable instead of ShapeDrawable+PathShape.
                 It reads its own getBounds() at draw time and scales/paints
                 the path itself with Canvas.drawPath — this sidesteps the
                 intrinsic-size/scale-matrix computation ImageView normally
                 does for a Drawable, which is what was silently zeroing the
                 icon out (button box drew fine, glyph never did). */
              private android.graphics.drawable.Drawable makeStrokeIcon(String iconType, boolean filled) {
                  final boolean isHeart = "heart".equals(iconType);
                  final int color = filled ? GOLD : CHARCOAL;
                  return new android.graphics.drawable.Drawable() {
                      private final android.graphics.Paint paint = new android.graphics.Paint();
                      {
                          paint.setAntiAlias(true);
                          paint.setColor(color);
                          paint.setStyle(filled
                              ? android.graphics.Paint.Style.FILL_AND_STROKE
                              : android.graphics.Paint.Style.STROKE);
                          paint.setStrokeCap(android.graphics.Paint.Cap.ROUND);
                          paint.setStrokeJoin(android.graphics.Paint.Join.ROUND);
                      }

                      @Override
                      public void draw(android.graphics.Canvas canvas) {
                          android.graphics.Rect b = getBounds();
                          if (b.width() <= 0 || b.height() <= 0) return;
                          float scale = Math.min(b.width(), b.height()) / 24f;
                          paint.setStrokeWidth(2.4f * scale);
                          android.graphics.Path base = isHeart ? buildHeartPath() : buildArrowPath();
                          android.graphics.Matrix m = new android.graphics.Matrix();
                          m.setScale(scale, scale);
                          m.postTranslate(b.left, b.top);
                          android.graphics.Path scaled = new android.graphics.Path();
                          base.transform(m, scaled);
                          canvas.drawPath(scaled, paint);
                      }

                      @Override public void setAlpha(int alpha) { paint.setAlpha(alpha); }
                      @Override public void setColorFilter(android.graphics.ColorFilter cf) { paint.setColorFilter(cf); }
                      @Override public int getOpacity() { return android.graphics.PixelFormat.TRANSLUCENT; }
                  };
              }

              private android.graphics.Path buildArrowPath() {
                  android.graphics.Path p = new android.graphics.Path();
                  p.moveTo(15, 6);
                  p.lineTo(9, 12);
                  p.lineTo(15, 18);
                  return p;
              }

              /* Classic two-lobe heart, drawn with cubic curves inside the
                 same 24x24 box as the other icons. */
              private android.graphics.Path buildHeartPath() {
                  android.graphics.Path p = new android.graphics.Path();
                  p.moveTo(12, 21);
                  p.cubicTo(3, 14, 1, 9.5f, 4.5f, 6.2f);
                  p.cubicTo(7.2f, 3.7f, 11, 5, 12, 8.3f);
                  p.cubicTo(13, 5, 16.8f, 3.7f, 19.5f, 6.2f);
                  p.cubicTo(23, 9.5f, 21, 14, 12, 21);
                  p.close();
                  return p;
              }

