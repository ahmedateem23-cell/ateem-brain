              private void refreshColorSwatches() {
                  for (int i = 0; i < colorSwatches.size(); i++) {
                      FrameLayout wrap = (FrameLayout) colorSwatches.get(i);
                      boolean active = (i == selectedColorIndex);
                      GradientDrawable ring = new GradientDrawable();
                      ring.setShape(GradientDrawable.OVAL);
                      ring.setColor(Color.TRANSPARENT);
                      ring.setStroke(dp(2), active ? GOLD : Color.TRANSPARENT);
                      wrap.setBackground(ring);
                  }
                  if (colorNameLabel != null && selectedColorIndex < COLOR_NAMES.length) {
                      colorNameLabel.setText(COLOR_NAMES[selectedColorIndex]);
                  }
              }

