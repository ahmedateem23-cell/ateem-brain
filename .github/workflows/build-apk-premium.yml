      # 7.5 Create chat-panel injection asset — Premium Quiet Luxury Edition
      - name: Create ATEEM context-flags + touch-polish assets
        run: |

          mkdir -p android/app/src/main/assets/inject

          cat > android/app/src/main/assets/inject/ateem_widget_inject.js << 'EOF'
          (function ATEEM_CONTEXT_FLAGS(){
            /* This ONLY sets the page-context flags the site's own ATEEM chat
               widget reads (window.ATEEM_SHOULD_SHOW / ATEEM_PAGE_TYPE /
               ATEEM_PRODUCT_SLUG). The chat widget itself already lives on
               ateem-store.com — we must never recreate it here, since a
               second copy with the same element ids (#ateem-panel,
               #ateem-header-chat, etc.) collides with the real one and is
               exactly why the bot broke. */
            var path = window.location.pathname.replace(/\/+$/, "");
            var isHome    = (path === "" || path === "/");
            var isProduct = /^\/shop\/[a-z0-9-]+$/i.test(path);
            window.ATEEM_SHOULD_SHOW = isHome || isProduct;
            window.ATEEM_PAGE_TYPE   = isHome ? "home" : (isProduct ? "product" : "other");
            if (isProduct) window.ATEEM_PRODUCT_SLUG = path.replace("/shop/", "");
          })();
          EOF

          cat > android/app/src/main/assets/inject/ateem_touch_polish.js << 'EOF'
          (function ATEEM_TOUCH_POLISH(){
            if (window.__ateemTouchPolishInjected) return;
            window.__ateemTouchPolishInjected = true;
            var style = document.createElement('style');
            style.id = 'ateem-touch-polish-style';
            /* Quiet touch feedback across the real site — removes the large
               default Android tap-highlight flash on section/category cards
               and links, without touching the site's own colors or the
               chat widget's markup in any way. */
            style.textContent = "html,body,a,button,[role='button']{-webkit-tap-highlight-color:transparent;}"
              + "a:active,button:active,[role='button']:active{opacity:.94;transform:scale(0.985);transition:transform .12s ease,opacity .12s ease;}";
            document.head.appendChild(style);
          })();
          EOF

      # 7.6 Create the fully in-app ATEEM chat widget (local asset, no website dependency)
      - name: Create local ATEEM chat widget asset
        run: |

          mkdir -p android/app/src/main/assets/ateem_chat

          cat > android/app/src/main/assets/ateem_chat/chat.html << 'EOF'
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
          <title>ATEEM Assistant</title>
          <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,600&family=Montserrat:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500&display=swap" rel="stylesheet">
          <style>
          html, body { margin:0; padding:0; background:transparent; height:100%; }
          html, body, button, a, input, [role='button'] { -webkit-tap-highlight-color:transparent; }
          button, a { touch-action:manipulation; }
          :root {
            --ateem-cream:      #F5F0E8;
            --ateem-cream-deep: #EDE7DC;
            /* Single unified gold — same shade as the native app's GOLD
               constant (#B8936A), used sparingly for accents only. */
            --ateem-gold:       #B8936A;
            --ateem-gold-light: #D2B592;
            --ateem-gold-deep:  #93714F;
            --ateem-gold-pale:  #E8DCC9;
            --ateem-ink-soft:   #201C14;
            --ateem-ink-muted:  #55503F;
            --ateem-ink-faint:  #9A8F76;
            --ateem-navy:       #6B7A45;
            --ateem-navy-light: #8A9A5B;
            /* Quiet olive header gradient — no black stop, to stay clear of
               the "black + gold" luxury cliché the brand explicitly avoids. */
            --ateem-olive:      #6B7A45;
            --ateem-olive-dark: #4A5530;
            --ateem-white:      #FFFFFF;
            --ateem-white-soft: #FAF8F5;
          }

          @keyframes ateem-panelIn {
            0%   { opacity:0; transform:translateY(24px) scale(0.96); }
            100% { opacity:1; transform:translateY(0) scale(1); }
          }
          @keyframes ateem-panelOut {
            0%   { opacity:1; transform:translateY(0) scale(1); }
            100% { opacity:0; transform:translateY(16px) scale(0.97); }
          }
          @keyframes ateem-backdropIn { from { opacity:0; } to { opacity:1; } }
          @keyframes ateem-backdropOut { from { opacity:1; } to { opacity:0; } }
          @keyframes ateem-typingDot {
            0%,80%,100% { transform:scale(.6); opacity:.3; }
            40%          { transform:scale(1);  opacity:1; }
          }
          @keyframes ateem-recPulse {
            0%,100% { box-shadow:0 0 0 0 rgba(220,60,60,0.4); }
            50%      { box-shadow:0 0 0 8px rgba(220,60,60,0); }
          }
          @keyframes ateem-statusPulse {
            0%,100% { opacity:1; transform:scale(1); }
            50%      { opacity:.6; transform:scale(0.85); }
          }
          @keyframes ateem-msgAppear {
            from { opacity:0; transform:translateY(10px) scale(0.96); }
            to   { opacity:1; transform:translateY(0) scale(1); }
          }

          #ateem-backdrop {
            /* Flat, non-blurred dim scrim only — no backdrop-filter/glass
               effect, per the brand's request to drop the blur on open. */
            position:fixed; inset:0; background:rgba(43,51,32,0.32);
            z-index:1; display:none; opacity:0;
          }
          #ateem-backdrop.active  { display:block; animation:ateem-backdropIn 0.4s ease forwards; }
          #ateem-backdrop.closing { display:block; animation:ateem-backdropOut 0.3s ease forwards; }

          #ateem-panel {
            position:fixed; left:14px; right:14px;
            top:var(--ateem-top-inset, 64px);
            bottom:calc(max(var(--ateem-bottom-inset, 34px), var(--ateem-kb-inset, 0px)) + 16px);
            max-width:360px; margin:auto;
            background:var(--ateem-white-soft);
            border-radius:26px; overflow:hidden; z-index:2;
            display:none; flex-direction:column;
            border:1px solid rgba(184,147,106,0.22);
            box-shadow:0 20px 48px rgba(20,19,15,0.16), 0 2px 8px rgba(20,19,15,0.06);
            font-family:'IBM Plex Sans Arabic',sans-serif;
            transform-origin:top center;
            will-change:transform, opacity;
          }
          #ateem-panel.active  { display:flex; animation:ateem-panelIn 0.5s cubic-bezier(0.22,1,0.36,1) both; }
          #ateem-panel.closing { display:flex; animation:ateem-panelOut 0.35s cubic-bezier(0.22,1,0.36,1) forwards; }

          /* ═══ Slim header — quiet olive gradient with a thin gold
             hairline accent, instead of a heavy solid-color block ═══ */
          #ateem-panel .ateem-chat-header {
            position:relative; overflow:hidden;
            background:linear-gradient(135deg, var(--ateem-navy-light) 0%, var(--ateem-olive) 100%);
            padding:9px 12px; min-height:46px;
            display:flex; align-items:center; justify-content:space-between;
            border-bottom:1px solid rgba(201,164,100,0.35);
          }
          #ateem-panel .ateem-chat-header::before {
            content:''; position:absolute; top:0; left:0; right:0; height:2px;
            background:linear-gradient(90deg, transparent, var(--ateem-gold), transparent);
            opacity:0.8;
          }
          #ateem-panel .ateem-chat-header-content { display:flex; align-items:center; gap:8px; position:relative; z-index:1; }
          #ateem-panel .ateem-chat-logo-wrap {
            width:32px; height:32px; border-radius:50%;
            background:var(--ateem-olive-dark);
            display:flex; align-items:center; justify-content:center;
            border:1.5px solid rgba(255,255,255,0.55);
            box-shadow:0 2px 6px rgba(0,0,0,0.20);
            flex-shrink:0; overflow:hidden;
          }
          #ateem-panel .ateem-chat-logo-img { width:100%; height:100%; object-fit:cover; object-position:center center; border-radius:50%; display:block; }
          #ateem-panel .ateem-chat-title {
            font-family:'Montserrat',sans-serif; font-size:11.5px; font-weight:600;
            color:var(--ateem-white); letter-spacing:.3px;
          }
          #ateem-panel .ateem-chat-status-dot {
            display:inline-block; width:5px; height:5px; border-radius:50%;
            background:#5DAA5A; margin-right:4px; box-shadow:0 0 5px rgba(93,170,90,0.45);
            animation:ateem-statusPulse 2s ease-in-out infinite;
          }
          #ateem-panel .ateem-chat-sub {
            font-size:8px; color:var(--ateem-gold-pale); margin-top:1px;
            letter-spacing:.8px; font-family:'Montserrat',sans-serif; opacity:0.9;
          }
          #ateem-panel .ateem-chat-close {
            width:24px; height:24px; border:1.5px solid rgba(201,164,100,0.45); border-radius:50%;
            background:rgba(255,255,255,0.06); color:var(--ateem-gold-light); font-size:10px;
            cursor:pointer; position:relative; z-index:1; transition:transform .18s ease, background .18s ease;
            display:flex; align-items:center; justify-content:center;
          }
          #ateem-panel .ateem-chat-close:active { transform:scale(0.88); background:rgba(255,255,255,0.14); }

          #ateem-panel #ateem-chat {
            flex:1; overflow-y:auto; padding:14px 14px;
            display:flex; flex-direction:column; gap:10px;
            scrollbar-width:thin; scrollbar-color:rgba(184,147,106,.22) transparent;
            background:linear-gradient(180deg, var(--ateem-white-soft) 0%, var(--ateem-cream) 100%);
            scroll-behavior:smooth; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
          }
          #ateem-panel #ateem-chat::-webkit-scrollbar { width:3px; }
          #ateem-panel #ateem-chat::-webkit-scrollbar-thumb { background:rgba(184,147,106,.25); border-radius:10px; }
          #ateem-panel #ateem-chat::-webkit-scrollbar-track { background:transparent; }

          #ateem-panel .ateem-msg-wrap { display:flex; flex-direction:column; gap:3px; max-width:88%; animation:ateem-msgAppear .4s cubic-bezier(0.22,1,0.36,1) both; }
          #ateem-panel .ateem-msg-wrap.ateem-user { align-self:flex-start; margin-left:auto; }
          #ateem-panel .ateem-msg-wrap.ateem-bot  { align-self:flex-end; margin-right:auto; }
          #ateem-panel .ateem-msg-time { font-size:8.5px; color:var(--ateem-ink-faint); padding:0 5px; opacity:.65; font-family:'Montserrat',sans-serif; letter-spacing:.3px; }

          #ateem-panel .ateem-welcome-banner { text-align:center; padding:6px 0 2px; }
          #ateem-panel .ateem-welcome-banner .ateem-welcome-text {
            font-family:'Cormorant Garamond', serif; font-style:normal; font-size:14px;
            color:var(--ateem-ink-muted); letter-spacing:.5px; line-height:1.6;
          }
          #ateem-panel .ateem-welcome-banner .ateem-welcome-time { font-size:8.5px; color:var(--ateem-ink-faint); margin-top:4px; font-family:'Montserrat',sans-serif; }

          #ateem-panel .ateem-bot-msg {
            background:var(--ateem-cream); color:var(--ateem-ink-soft);
            padding:11px 14px; border-radius:18px 18px 18px 5px; line-height:1.9; max-width:100%;
            border:1px solid rgba(201,164,100,0.20);
            box-shadow:0 2px 8px rgba(20,19,15,0.05);
            font-size:13.5px; direction:rtl; position:relative;
          }

          /* Sent bubbles use the app's everyday olive accent, not gold —
             gold is reserved for occasional highlights, not a repeating
             element that appears on every message the user sends. */
          #ateem-panel .ateem-user-msg {
            background:linear-gradient(135deg, var(--ateem-navy-light) 0%, var(--ateem-navy) 100%);
            color:var(--ateem-white);
            padding:11px 14px; border-radius:18px 18px 5px 18px; max-width:100%; font-size:13.5px; line-height:1.7; direction:rtl;
            font-weight:500;
            box-shadow:0 3px 10px rgba(107,122,69,0.22);
            border:1px solid rgba(255,255,255,0.18); position:relative;
          }

          #ateem-panel .ateem-quick-replies { display:flex; flex-wrap:wrap; gap:6px; margin-top:3px; padding:0 3px; direction:rtl; }
          #ateem-panel .ateem-quick-chip {
            font-size:10.5px; font-weight:500; color:var(--ateem-ink-soft); background:var(--ateem-white);
            border:1.5px solid rgba(201,164,100,0.35); padding:6px 12px; border-radius:22px; cursor:pointer; white-space:nowrap;
            font-family:'IBM Plex Sans Arabic',sans-serif; transition:.25s ease; box-shadow:0 2px 6px rgba(20,19,15,0.04);
          }
          #ateem-panel .ateem-quick-chip:active { transform:translateY(0) scale(0.96); }

          #ateem-panel .ateem-products-wrap { display:flex; flex-direction:column; gap:8px; max-width:100%; margin-top:3px; }
          #ateem-panel .ateem-product-card {
            display:flex; align-items:center; gap:10px; background:var(--ateem-cream);
            border:1px solid rgba(201,164,100,0.22); border-radius:16px; padding:10px;
            box-shadow:0 2px 8px rgba(20,19,15,0.05);
            direction:rtl; text-decoration:none; transition:.25s ease; position:relative; overflow:hidden;
          }
          #ateem-panel .ateem-product-card::before {
            content:''; position:absolute; top:0; left:0; right:0; height:2.5px;
