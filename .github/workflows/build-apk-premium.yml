                  TextView title = new TextView(activity);
                  title.setText("تم استلام طلبك بنجاح");
                  title.setTextSize(19);
                  title.setTypeface(sansBold);
                  title.setTextColor(CHARCOAL);
                  title.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams titleParams = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  titleParams.bottomMargin = dp(8);
                  content.addView(title, titleParams);

                  successOrderIdView = new TextView(activity);
                  successOrderIdView.setTextSize(13.5f);
                  successOrderIdView.setTypeface(sansMedium);
                  successOrderIdView.setTextColor(OLIVE);
                  successOrderIdView.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams idParams = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  idParams.bottomMargin = dp(10);
                  content.addView(successOrderIdView, idParams);

                  successDescView = new TextView(activity);
                  successDescView.setText("سنقوم بالتواصل معك قريباً لتأكيد التفاصيل وترتيب التوصيل");
                  successDescView.setTextSize(13.5f);
                  successDescView.setTextColor(WARM_GRAY);
                  successDescView.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams descParams = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  descParams.bottomMargin = dp(26);
                  content.addView(successDescView, descParams);

                  TextView continueBtn = new TextView(activity);
                  continueBtn.setText("متابعة التسوق");
                  continueBtn.setTextSize(14.5f);
                  continueBtn.setTypeface(sansBold);
                  continueBtn.setTextColor(WARM_WHITE);
                  continueBtn.setGravity(Gravity.CENTER);
                  continueBtn.setPadding(dp(34), dp(14), dp(34), dp(14));
                  GradientDrawable continueBg = new GradientDrawable();
                  continueBg.setColor(OLIVE);
                  continueBg.setCornerRadius(dp(24));
                  continueBtn.setBackground(continueBg);
                  roundCorners(continueBtn, dp(24));
                  continueBtn.setElevation(dp(2));
                  continueBtn.setOnClickListener(v -> { if (backListener != null) backListener.onBack(); });
                  content.addView(continueBtn);

                  overlay.addView(content, new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.CENTER));

                  return overlay;
              }

              private int SUCCESS_SOFT() {
                  return Color.parseColor("#E0EBDC");
              }

              /* ============== HELPERS ============== */
              private String formatPrice(double price) {
                  DecimalFormat formatter = new DecimalFormat("#,###",
                      new DecimalFormatSymbols(Locale.US));
                  return formatter.format(price);
              }

              private void roundCorners(View view, int radiusPx) {
                  view.setClipToOutline(true);
                  view.setOutlineProvider(new ViewOutlineProvider() {
                      @Override
                      public void getOutline(View v, Outline outline) {
                          outline.setRoundRect(0, 0, v.getWidth(), v.getHeight(), radiusPx);
                      }
                  });
              }

              private int dp(int value) {
                  float density = activity.getResources().getDisplayMetrics().density;
                  return (int)(value * density + 0.5f);
              }
          }
