name: Build ATEEM STORE APK — Premium Dark Edition

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v4


      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18


      # 3. Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      # 4. Install dependencies
      - name: Install npm dependencies
        run: npm install


      # 5. Add Android
      - name: Add Android platform
        run: npx cap add android


      # 6. Generate app icons
      - name: Generate app icons
        run: |
          npm install -D @capacitor/assets
          mkdir -p resources
          cp www/assets/logo.png resources/icon.png
          npx capacitor-assets generate \
            --android \
            --iconBackgroundColor '#8A9A5B' \
            --iconBackgroundColorDark '#8A9A5B'

      # 7. Create Native Android shell (Premium Dark Luxury Design)
      - name: Create native Android shell
        run: |

          mkdir -p android/app/src/main/java/com/ateem/store
          mkdir -p android/app/src/main/res/drawable

          # ==========================================
          # MainActivity.java — Premium Dark Edition
          # ==========================================

          cat > android/app/src/main/java/com/ateem/store/MainActivity.java << 'EOF'
          package com.ateem.store;

          import android.annotation.SuppressLint;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewTreeObserver;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.WebView;
          import android.widget.FrameLayout;

          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebViewClient;

          import java.io.BufferedReader;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.nio.charset.StandardCharsets;

          /*
           * ATEEM STORE — Premium Dark Luxury Edition
           * الشاشة الرئيسية Native بالكامل مع تصميم فاخر داكن
           * هيدر شفاف + بانر سينمائي + شبكة بطاقات زجاجية + فوتر أنيق
           * البار السفلي عائم بتأثير Glass Morphism
           */

          public class MainActivity
              extends BridgeActivity
              implements NativeNavigation.OnNavTargetListener {

              private NativeNavigation nativeNavigation;
              private NativeHomeScreen nativeHomeScreen;
              private View nativeHomeScreenView;
              private WebView webView;
              private String ateemWidgetJs;
              private boolean pendingAutoOpenChat = false;
              private boolean pendingRevealWebView = false;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  /* Full screen immersive */
                  Window window = getWindow();
                  window.addFlags(WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS);
                  window.setStatusBarColor(Color.TRANSPARENT);
                  window.setNavigationBarColor(Color.parseColor("#FAF7F0"));
                  hideSystemUI();

                  /* WebView setup */
                  webView = getBridge().getWebView();
                  if (webView != null) {
                      webView.setBackgroundColor(Color.parseColor("#FAF7F0"));
                      webView.getSettings().setJavaScriptEnabled(true);
                      webView.setVisibility(View.GONE);

                      ateemWidgetJs = loadAsset("inject/ateem_widget_inject.js");
                      webView.setWebViewClient(new BridgeWebViewClient(getBridge()) {
                          @Override
                          public void onPageFinished(WebView view, String url) {
                              super.onPageFinished(view, url);
                              injectAteemWidget(view);
                              revealWebViewIfPending();
                              if (pendingAutoOpenChat) {
                                  pendingAutoOpenChat = false;
                                  openAteemChatPanel();
                              }
                          }
                      });
                  }

                  /* Bottom Navigation — Glass Morphism Floating Bar */
                  nativeNavigation = new NativeNavigation(this, webView);
                  nativeNavigation.setOnNavTargetListener(this);
                  nativeNavigation.attach();

                  /* Native Home Screen — Premium Dark */
                  nativeHomeScreen = new NativeHomeScreen(
                      this,
                      this::onAteemChatButtonClick,
                      this::onCategoryOrFooterLinkClick
                  );
                  nativeHomeScreenView = nativeHomeScreen.build();

                  FrameLayout root = nativeNavigation.getRootContainer();
                  if (root != null) {
                      FrameLayout.LayoutParams homeParams = new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                      );
                      root.addView(nativeHomeScreenView, homeParams);
                      nativeHomeScreenView.bringToFront();

                      View navView = nativeNavigation.getNavBarView();
                      if (navView != null) navView.bringToFront();
                  }

                  linkWebViewInsets();
              }

              private void linkWebViewInsets() {
                  final FrameLayout root = nativeNavigation.getRootContainer();
                  if (root == null) return;

                  root.getViewTreeObserver().addOnGlobalLayoutListener(
                      new ViewTreeObserver.OnGlobalLayoutListener() {
                          @Override
                          public void onGlobalLayout() {
                              View navView = nativeNavigation.getNavBarView();
                              if (navView == null || navView.getHeight() == 0) return;
                              root.getViewTreeObserver().removeOnGlobalLayoutListener(this);

                              int bottomInset = navView.getHeight() + nativeNavigation.getNavBottomMargin();
                              nativeNavigation.setWebViewInsets(0, bottomInset);

                              if (nativeHomeScreenView != null) {
                                  nativeHomeScreenView.setPadding(0, 0, 0, bottomInset);
                              }
                          }
                      }
                  );
              }

              public NativeNavigation getNativeNavigation() { return nativeNavigation; }

              @Override
              public void onHomeSelected() { showNativeHome(); }

              @Override
              public void onWebPathSelected(String path, int index) { showWebView(path); }

              private void showNativeHome() {
                  if (webView != null) webView.setVisibility(View.GONE);
                  if (nativeHomeScreenView != null) nativeHomeScreenView.setVisibility(View.VISIBLE);
              }

              private void showWebView(String path) {
                  pendingRevealWebView = true;
                  nativeNavigation.loadWebUrl(path);
              }

              private void onAteemChatButtonClick() {
                  pendingAutoOpenChat = true;
                  pendingRevealWebView = true;
                  boolean willReload = nativeNavigation.loadWebUrl("/");
                  if (!willReload) {
                      /* WebView already on "/": no onPageFinished will fire, so reveal and open now */
                      pendingAutoOpenChat = false;
                      revealWebViewIfPending();
                      openAteemChatPanel();
                  }
              }

              private void onCategoryOrFooterLinkClick(String path) {
                  pendingRevealWebView = true;
                  nativeNavigation.openWebPath(path, 1);
              }

              private void revealWebViewIfPending() {
                  if (!pendingRevealWebView) return;
                  pendingRevealWebView = false;
                  if (nativeHomeScreenView != null) nativeHomeScreenView.setVisibility(View.GONE);
                  if (webView != null) webView.setVisibility(View.VISIBLE);
              }

              private void openAteemChatPanel() {
                  if (webView == null) return;
                  webView.evaluateJavascript(
                      "(function(){ if (typeof window.openAteemPanel === 'function') { window.openAteemPanel(); } })();",
                      null
                  );
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemUI();
              }

              private void hideSystemUI() {
                  View decorView = getWindow().getDecorView();
                  decorView.setSystemUiVisibility(
                        View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                  );
              }

              private void injectAteemWidget(WebView view) {
                  if (view == null || ateemWidgetJs == null || ateemWidgetJs.isEmpty()) return;
                  view.evaluateJavascript(ateemWidgetJs, null);
              }

              private String loadAsset(String path) {
                  StringBuilder builder = new StringBuilder();
                  try (
                      InputStream is = getAssets().open(path);
                      BufferedReader reader = new BufferedReader(
                          new InputStreamReader(is, StandardCharsets.UTF_8)
                      )
                  ) {
                      String line;
                      while ((line = reader.readLine()) != null) {
                          builder.append(line).append('\n');
                      }
                  } catch (IOException e) { e.printStackTrace(); }
                  return builder.toString();
              }
          }
          EOF

          # ==========================================
          # NativeHeader.java — Premium Glass Header
          # ==========================================

          cat > android/app/src/main/java/com/ateem/store/NativeHeader.java << 'EOF'
          package com.ateem.store;

          import android.app.Activity;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.graphics.drawable.RippleDrawable;
          import android.content.res.ColorStateList;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class NativeHeader {

              public interface OnChatClickListener {
                  void onChatClick();
              }

              private final Activity activity;
              private final OnChatClickListener chatClickListener;
              private View headerRow;

              /* Premium Light Luxury Palette */
              private final int DEEP_VOID   = Color.parseColor("#FAF7F0");
              private final int CARD_DARK   = Color.parseColor("#FFFFFF");
              private final int GOLD        = Color.parseColor("#B8923E");
              private final int GOLD_LIGHT  = Color.parseColor("#8A6B2C");
              private final int OLIVE       = Color.parseColor("#8A9A5B");
              private final int MUTED       = Color.parseColor("#8A8478");
              private final int WHITE       = Color.parseColor("#1C1A16");

              private Typeface logoTypeface;
              private Typeface labelTypeface;

              public NativeHeader(Activity activity, OnChatClickListener chatClickListener) {
                  this.activity = activity;
                  this.chatClickListener = chatClickListener;
                  this.logoTypeface = Typeface.create("serif", Typeface.BOLD);
                  this.labelTypeface = Typeface.create("sans-serif-light", Typeface.NORMAL);
              }

              public View getHeaderView() { return headerRow; }

              public void attachTo(FrameLayout container) {
                  if (container == null) return;
                  LinearLayout headerLayout = new LinearLayout(activity);
                  headerLayout.setOrientation(LinearLayout.HORIZONTAL);
                  headerLayout.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);
                  headerLayout.setGravity(Gravity.CENTER_VERTICAL);
                  headerLayout.setPadding(dp(22), dp(16), dp(22), dp(10));

                  /* Glass morphism background */
                  GradientDrawable glassBg = new GradientDrawable();
                  glassBg.setColor(Color.argb(235, 255, 255, 255));
                  headerLayout.setBackground(glassBg);

                  View brand = buildBrand();
                  LinearLayout.LayoutParams brandParams = new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f);
                  headerLayout.addView(brand, brandParams);

                  View actions = buildActions();
                  headerLayout.addView(actions, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT));

                  headerRow = headerLayout;

                  FrameLayout.LayoutParams headerParams = new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.TOP);
                  container.addView(headerRow, headerParams);
                  headerRow.bringToFront();
              }

              public View buildStandalone() {
                  FrameLayout headerFrame = new FrameLayout(activity);
                  headerRow = headerFrame;
                  headerFrame.setPadding(dp(22), dp(14), dp(22), dp(12));

                  /* Subtle gradient background */
                  GradientDrawable headerBg = new GradientDrawable(
                      GradientDrawable.Orientation.LEFT_RIGHT,
                      new int[] { Color.parseColor("#FAF7F0"), Color.parseColor("#FFFFFF"), Color.parseColor("#FAF7F0") }
                  );
                  headerFrame.setBackground(headerBg);

                  View actions = buildActions();
                  FrameLayout.LayoutParams actionsParams = new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT,
                      Gravity.LEFT | Gravity.CENTER_VERTICAL);
                  headerFrame.addView(actions, actionsParams);

                  View brand = buildBrand();
                  FrameLayout.LayoutParams brandParams = new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT,
                      Gravity.RIGHT | Gravity.CENTER_VERTICAL);
                  headerFrame.addView(brand, brandParams);

                  return headerFrame;
              }

              private View buildBrand() {
                  LinearLayout wrap = new LinearLayout(activity);
                  wrap.setOrientation(LinearLayout.VERTICAL);
                  wrap.setGravity(Gravity.RIGHT);

                  TextView logo = new TextView(activity);
                  logo.setText("ATEEM");
                  logo.setTextSize(22);
                  logo.setTypeface(logoTypeface);
                  logo.setTextColor(WHITE);
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.LOLLIPOP) {
                      logo.setLetterSpacing(0.25f);
                  }
                  wrap.addView(logo);

                  /* Subtitle */
                  TextView sub = new TextView(activity);
                  sub.setText("LUXURY");
                  sub.setTextSize(8);
                  sub.setTextColor(MUTED);
                  sub.setTypeface(labelTypeface);
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.LOLLIPOP) {
                      sub.setLetterSpacing(0.3f);
                  }
                  LinearLayout.LayoutParams subParams = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  subParams.topMargin = dp(4);
                  wrap.addView(sub, subParams);

                  return wrap;
              }

              private View buildActions() {
                  LinearLayout row = new LinearLayout(activity);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.CENTER_VERTICAL);
                  row.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);

                  /* SHOP label */
                  TextView shop = new TextView(activity);
                  shop.setText("SHOP");
                  shop.setTextSize(11);
                  shop.setTextColor(MUTED);
                  shop.setTypeface(labelTypeface);
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.LOLLIPOP) {
                      shop.setLetterSpacing(0.18f);
                  }
                  LinearLayout.LayoutParams shopParams = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  shopParams.leftMargin = dp(16);
                  shop.setPadding(dp(6), dp(8), dp(6), dp(8));
                  row.addView(shop, shopParams);

                  shop.setOnClickListener(v -> {
                      if (activity instanceof MainActivity) {
                          ((MainActivity) activity).getNativeNavigation().navigateToPath("/shop");
                      }
                  });

                  /* Premium Chat Button — Gold ring */
                  FrameLayout chatBtn = new FrameLayout(activity);
                  GradientDrawable chatBg = new GradientDrawable();
                  chatBg.setShape(GradientDrawable.OVAL);
                  chatBg.setColor(Color.parseColor("#1A1A24"));
                  chatBg.setStroke(dp(2), OLIVE);

                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.LOLLIPOP) {
                      RippleDrawable ripple = new RippleDrawable(
                          ColorStateList.valueOf(Color.argb(60, 138, 154, 91)), chatBg, null);
                      chatBtn.setBackground(ripple);
                  } else {
                      chatBtn.setBackground(chatBg);
                  }

                  chatBtn.setElevation(dp(6));

                  /* Glow effect behind */
                  View glow = new View(activity);
                  GradientDrawable glowBg = new GradientDrawable();
                  glowBg.setShape(GradientDrawable.OVAL);
                  glowBg.setColor(Color.argb(40, 138, 154, 91));
                  FrameLayout.LayoutParams glowParams = new FrameLayout.LayoutParams(dp(44), dp(44), Gravity.CENTER);
                  chatBtn.addView(glow, glowParams);

                  ImageView chatIcon = new ImageView(activity);
                  chatIcon.setImageResource(R.drawable.ic_header_chat);
                  FrameLayout.LayoutParams iconParams = new FrameLayout.LayoutParams(dp(16), dp(16), Gravity.CENTER);
                  chatBtn.addView(chatIcon, iconParams);

                  LinearLayout.LayoutParams chatBtnParams = new LinearLayout.LayoutParams(dp(38), dp(38));
                  row.addView(chatBtn, chatBtnParams);

                  chatBtn.setOnClickListener(v -> {
                      if (chatClickListener != null) chatClickListener.onChatClick();
                  });

                  return row;
              }

              private int dp(int value) {
                  float density = activity.getResources().getDisplayMetrics().density;
                  return (int)(value * density + 0.5f);
              }
          }
          EOF

          # ==========================================
          # NativeNavigation.java — Premium Glass Bar
          # ==========================================

          cat > android/app/src/main/java/com/ateem/store/NativeNavigation.java << 'EOF'
          package com.ateem.store;

          import android.app.Activity;
          import android.content.res.ColorStateList;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.graphics.drawable.RippleDrawable;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.ViewTreeObserver;
          import android.webkit.WebView;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import java.util.ArrayList;
          import java.util.List;

          public class NativeNavigation {

              public interface OnNavTargetListener {
                  void onHomeSelected();
                  void onWebPathSelected(String path, int index);
              }

              private OnNavTargetListener navTargetListener;
              public void setOnNavTargetListener(OnNavTargetListener listener) {
                  this.navTargetListener = listener;
              }

              private final Activity activity;
              private final WebView webView;
              private FrameLayout rootContainer;
              private FrameLayout navBar;
              private final List<LinearLayout> items = new ArrayList<>();
              private final List<ImageView> icons = new ArrayList<>();
              private final List<TextView> labels = new ArrayList<>();

              private final String[] paths = { "/", "/shop", "/shop/cart", "/my/account" };
              private final int[] iconRes = {
                  R.drawable.ic_nav_home, R.drawable.ic_nav_shop,
                  R.drawable.ic_nav_cart, R.drawable.ic_nav_account
              };
              private final String[] labelText = { "الرئيسية", "المتجر", "السلة", "حسابي" };
              private int activeIndex = 0;

              /* Premium Light Luxury Palette */
              private final int GLASS_BG      = Color.argb(240, 255, 255, 255);
              private final int GOLD          = Color.parseColor("#B8923E");
              private final int GOLD_GLOW     = Color.argb(60, 201, 168, 76);
              private final int OLIVE         = Color.parseColor("#8A9A5B");
              private final int INACTIVE      = Color.argb(140, 28, 26, 22);
              private final int ACTIVE_BG     = Color.argb(28, 138, 154, 91);
              private final int ACTIVE_BORDER = Color.argb(180, 138, 154, 91);
              private final int DEEP_SHADOW   = Color.argb(35, 0, 0, 0);

              private final int NAV_BOTTOM_MARGIN_DP = 20;
              private final Typeface labelTypeface = Typeface.create("sans-serif", Typeface.NORMAL);

              public NativeNavigation(Activity activity, WebView webView) {
                  this.activity = activity;
                  this.webView = webView;
              }

              public FrameLayout getRootContainer() { return rootContainer; }
              public View getNavBarView() { return navBar; }
              public int getNavBottomMargin() { return dp(NAV_BOTTOM_MARGIN_DP); }

              public void setWebViewInsets(int topInset, int bottomInset) {
                  if (webView == null) return;
                  ViewGroup.LayoutParams rawParams = webView.getLayoutParams();
                  if (!(rawParams instanceof FrameLayout.LayoutParams)) return;
                  FrameLayout.LayoutParams params = (FrameLayout.LayoutParams) rawParams;
                  params.topMargin = topInset;
                  params.bottomMargin = bottomInset;
                  webView.setLayoutParams(params);
              }

              public void attach() {
                  if (webView == null) return;
                  ViewGroup webViewParent = (ViewGroup) webView.getParent();
                  if (webViewParent == null) return;

                  rootContainer = new FrameLayout(activity);
                  ViewGroup.LayoutParams rootParams = new ViewGroup.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT);
                  webViewParent.removeView(webView);
                  webViewParent.addView(rootContainer, rootParams);

                  FrameLayout.LayoutParams webParams = new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT);
                  rootContainer.addView(webView, webParams);

                  navBar = createNavigationBar();

                  /* Floating glass bar with premium shadow */
                  FrameLayout.LayoutParams navParams = new FrameLayout.LayoutParams(
                      dpMax(), ViewGroup.LayoutParams.WRAP_CONTENT,
                      Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL);
                  navParams.bottomMargin = dp(NAV_BOTTOM_MARGIN_DP);
                  navParams.leftMargin = dp(12);
                  navParams.rightMargin = dp(12);

                  rootContainer.addView(navBar, navParams);
                  navBar.bringToFront();

                  navBar.getViewTreeObserver().addOnGlobalLayoutListener(
                      new ViewTreeObserver.OnGlobalLayoutListener() {
                          @Override
                          public void onGlobalLayout() {
                              navBar.getViewTreeObserver().removeOnGlobalLayoutListener(this);
                              updateVisualState(activeIndex);
                          }
                      }
                  );
              }

              private int dpMax() {
                  int screenWidth = activity.getResources().getDisplayMetrics().widthPixels;
                  int eightyEightPercent = (int)(screenWidth * 0.88f);
                  int maxWidthPx = dp(380);
                  return Math.min(eightyEightPercent, maxWidthPx);
              }

              private FrameLayout createNavigationBar() {
                  FrameLayout bar = new FrameLayout(activity);

                  /* Glass morphism background */
                  GradientDrawable barBg = new GradientDrawable();
                  barBg.setColor(GLASS_BG);
                  barBg.setCornerRadius(dp(26));
                  bar.setBackground(barBg);

                  /* Premium multi-layer shadow */
                  bar.setElevation(dp(20));

                  /* Gold subtle border */
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.LOLLIPOP) {
                      bar.setClipToOutline(true);
                      bar.setOutlineProvider(new android.view.ViewOutlineProvider() {
                          @Override
                          public void getOutline(View v, android.graphics.Outline outline) {
                              outline.setRoundRect(0, 0, v.getWidth(), v.getHeight(), dp(26));
                          }
                      });
                  }

                  /* Inner glow at top */
                  View topGlow = new View(activity);
                  GradientDrawable topGlowBg = new GradientDrawable(
                      GradientDrawable.Orientation.LEFT_RIGHT,
                      new int[] { Color.TRANSPARENT, Color.argb(60, 180, 178, 170), Color.TRANSPARENT }
                  );
                  topGlow.setBackground(topGlowBg);
                  FrameLayout.LayoutParams topGlowParams = new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, dp(1), Gravity.TOP);
                  topGlowParams.topMargin = dp(1);
                  bar.addView(topGlow, topGlowParams);

                  bar.setClipToPadding(false);
                  bar.setClipChildren(false);

                  LinearLayout row = new LinearLayout(activity);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.CENTER_VERTICAL);
                  row.setPadding(dp(10), dp(8), dp(10), dp(10));
                  row.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);

                  bar.addView(row, new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));

                  for (int i = 0; i < paths.length; i++) {
                      final int index = i;
                      LinearLayout item = createItem(iconRes[i], labelText[i]);
                      LinearLayout.LayoutParams itemParams = new LinearLayout.LayoutParams(
                          0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f);
                      row.addView(item, itemParams);
                      items.add(item);
                      item.setOnClickListener(v -> onItemClick(index));
                  }

                  return bar;
              }

              private LinearLayout createItem(int iconResId, String label) {
                  LinearLayout item = new LinearLayout(activity);
                  item.setOrientation(LinearLayout.VERTICAL);
                  item.setGravity(Gravity.CENTER);
                  item.setClickable(true);
                  item.setPadding(dp(14), dp(6), dp(14), dp(6));

                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.M) {
                      item.setForeground(new RippleDrawable(
                          ColorStateList.valueOf(Color.argb(40, 138, 154, 91)), null, null));
                  }

                  ImageView icon = new ImageView(activity);
                  icon.setImageResource(iconResId);
                  icon.setColorFilter(INACTIVE);
                  LinearLayout.LayoutParams iconParams = new LinearLayout.LayoutParams(dp(20), dp(20));
                  item.addView(icon, iconParams);
                  icons.add(icon);

                  TextView labelView = new TextView(activity);
                  labelView.setText(label);
                  labelView.setTextSize(10f);
                  labelView.setTypeface(labelTypeface);
                  labelView.setTextColor(INACTIVE);
                  labelView.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams labelParams = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  labelParams.topMargin = dp(3);
                  item.addView(labelView, labelParams);
                  labels.add(labelView);

                  return item;
              }

              private void onItemClick(int index) {
                  if (index == activeIndex) {
                      if (index == 0 && navTargetListener != null) navTargetListener.onHomeSelected();
                      return;
                  }
                  setActiveIndex(index);
                  dispatchTarget(index);
              }

              private void dispatchTarget(int index) {
                  if (navTargetListener == null) {
                      navigate(paths[index]);
                      return;
                  }
                  if (index == 0) navTargetListener.onHomeSelected();
                  else navTargetListener.onWebPathSelected(paths[index], index);
              }

              private void setActiveIndex(int index) {
                  activeIndex = index;
                  updateVisualState(index);
              }

              private void updateVisualState(int activeIdx) {
                  for (int i = 0; i < items.size(); i++) {
                      boolean isActive = (i == activeIdx);
                      ImageView icon = icons.get(i);
                      TextView label = labels.get(i);
                      LinearLayout item = items.get(i);

                      int targetColor = isActive ? OLIVE : INACTIVE;
                      icon.setColorFilter(targetColor);
                      label.setTextColor(targetColor);

                      if (isActive) {
                          /* Premium active state with gold glow */
                          GradientDrawable activeBg = new GradientDrawable();
                          activeBg.setColor(ACTIVE_BG);
                          activeBg.setStroke(dp(1), ACTIVE_BORDER);
                          activeBg.setCornerRadius(dp(14));
                          item.setBackground(activeBg);

                          /* Subtle elevation for active item */
                          item.setElevation(dp(4));
                      } else {
                          item.setBackground(null);
                          item.setElevation(0);
                      }
                  }
              }

              public void syncActiveFromUrl(String url) {
                  if (url == null) return;
                  String path;
                  try {
                      android.net.Uri uri = android.net.Uri.parse(url);
                      path = uri.getPath();
                      if (path == null) path = "/";
                  } catch (Exception e) { path = "/"; }

                  if (path.length() > 1 && path.endsWith("/"))
                      path = path.substring(0, path.length() - 1);

                  int bestIndex = 0, bestLength = -1;
                  for (int i = 0; i < paths.length; i++) {
                      String p = paths[i];
                      boolean matches = path.equals(p) ||
                          (!p.equals("/") && path.startsWith(p + "/")) ||
                          (!p.equals("/") && path.equals(p));
                      if (matches && p.length() > bestLength) {
                          bestIndex = i; bestLength = p.length();
                      }
                  }
                  if (bestIndex != activeIndex) setActiveIndex(bestIndex);
                  else updateVisualState(activeIndex);
              }

              public void navigateToPath(String path) {
                  int index = indexForPath(path);
                  if (index != activeIndex) setActiveIndex(index);
                  dispatchTarget(index);
              }

              public void openWebPath(String fullPath, int highlightIndex) {
                  if (highlightIndex != activeIndex) setActiveIndex(highlightIndex);
                  if (navTargetListener != null)
                      navTargetListener.onWebPathSelected(fullPath, highlightIndex);
                  else navigate(fullPath);
              }

              private int indexForPath(String path) {
                  for (int i = 0; i < paths.length; i++) if (paths[i].equals(path)) return i;
                  return activeIndex;
              }

              public boolean loadWebUrl(String path) { return navigate(path); }

              private boolean navigate(String path) {
                  if (webView == null) return false;
                  String current = webView.getUrl();
                  String base = "https://www.ateem-store.com";
                  String target = base + path;
                  if (current != null && current.equals(target)) return false;
                  webView.loadUrl(target);
                  return true;
              }

              private int dp(int value) {
                  float density = activity.getResources().getDisplayMetrics().density;
                  return (int)(value * density + 0.5f);
              }
          }
