              /* ============== HELPERS ============== */
              private void roundCorners(View view, int radiusPx) {
                  view.setClipToOutline(true);
                  view.setOutlineProvider(new ViewOutlineProvider() {
                      @Override
                      public void getOutline(View v, Outline outline) {
                          outline.setRoundRect(0, 0, v.getWidth(), v.getHeight(), radiusPx);
                      }
                  });
              }

              private int dp(int value) {
                  float density = activity.getResources().getDisplayMetrics().density;
                  return (int)(value * density + 0.5f);
              }

              private static class AspectFrameLayout extends FrameLayout {
                  private final float ratio;
                  AspectFrameLayout(Context context, float ratio) {
                      super(context);
                      this.ratio = ratio;
                  }
                  @Override
                  protected void onMeasure(int widthMeasureSpec, int heightMeasureSpec) {
                      int width = MeasureSpec.getSize(widthMeasureSpec);
                      int height = (int)(width / ratio);
                      super.onMeasure(widthMeasureSpec, MeasureSpec.makeMeasureSpec(height, MeasureSpec.EXACTLY));
                  }
              }
          }
