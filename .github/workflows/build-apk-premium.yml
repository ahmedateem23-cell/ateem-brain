                  card.setClickable(true);
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.M) {
                      card.setForeground(new RippleDrawable(
                          ColorStateList.valueOf(Color.argb(50, 201, 168, 76)), null, null));
                  }

                  card.setOnTouchListener((v, event) -> {
                      switch (event.getActionMasked()) {
                          case android.view.MotionEvent.ACTION_DOWN:
                              v.animate().scaleX(0.96f).scaleY(0.96f).translationY(-dp(2))
                                  .setDuration(120).start();
                              shine.setTranslationX(-dp(220));
                              shine.animate().translationX(0f).alpha(0.8f).setDuration(700)
                                  .withEndAction(() -> shine.animate().alpha(0f).setDuration(300).start())
                                  .start();
                              break;
                          case android.view.MotionEvent.ACTION_UP:
                          case android.view.MotionEvent.ACTION_CANCEL:
                              v.animate().scaleX(1f).scaleY(1f).translationY(0f).setDuration(200).start();
                              break;
                      }
                      return false;
                  });

                  card.setOnClickListener(v -> {
                      if (categoryClickListener != null)
                          categoryClickListener.onCategoryClick(category.path);
                  });

                  /* Elevation for depth */
                  card.setElevation(dp(12));

                  LinearLayout.LayoutParams cardParams = new LinearLayout.LayoutParams(
                      0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f);
                  if (parentRow.getChildCount() == 1) cardParams.rightMargin = dp(16);
                  parentRow.addView(card, cardParams);

                  if (verticalOffsetDp != 0f)
                      card.setTranslationY(dp((int) verticalOffsetDp));
              }

              /* ============== PREMIUM FOOTER ============== */
              private View buildFooter() {
                  LinearLayout wrap = new LinearLayout(activity);
                  wrap.setOrientation(LinearLayout.VERTICAL);
                  wrap.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams wrapParams = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  wrapParams.topMargin = dp(40); wrapParams.bottomMargin = dp(32);
                  wrap.setLayoutParams(wrapParams);

                  /* Gold separator line */
                  View sep = new View(activity);
                  GradientDrawable sepBg = new GradientDrawable(
                      GradientDrawable.Orientation.LEFT_RIGHT,
                      new int[] { Color.TRANSPARENT, Color.argb(60, 201, 168, 76), Color.TRANSPARENT });
                  sep.setBackground(sepBg);
                  LinearLayout.LayoutParams sepParams = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, dp(1));
                  sepParams.leftMargin = dp(40); sepParams.rightMargin = dp(40);
                  sepParams.bottomMargin = dp(20);
                  wrap.addView(sep, sepParams);

                  /* Links row */
                  LinearLayout linksRow = new LinearLayout(activity);
                  linksRow.setOrientation(LinearLayout.HORIZONTAL);
                  linksRow.setGravity(Gravity.CENTER);
                  linksRow.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);

                  addFooterLink(linksRow, "تواصل معنا", "/twsl-m-n");
                  addFooterDot(linksRow);
                  addFooterLink(linksRow, "الخصوصية", "/sys-lkhswsy");
                  addFooterDot(linksRow);
                  addFooterLink(linksRow, "الشروط", "/lshrwt-wlhkm");
                  wrap.addView(linksRow);

                  /* Brand mark */
                  TextView brand = new TextView(activity);
                  brand.setText("✦ ATEEM ✦");
                  brand.setTextSize(11);
                  brand.setTextColor(Color.argb(190, 184, 146, 62));
                  brand.setTypeface(serifBold);
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.LOLLIPOP)
                      brand.setLetterSpacing(0.3f);
                  LinearLayout.LayoutParams brandParams = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  brandParams.topMargin = dp(14);
                  wrap.addView(brand, brandParams);

                  /* Copyright */
                  TextView copy = new TextView(activity);
                  copy.setText("© 2026 ATEEM Luxury Store. All rights reserved.");
                  copy.setTextSize(9);
                  copy.setTextColor(Color.argb(150, 110, 104, 90));
                  LinearLayout.LayoutParams copyParams = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  copyParams.topMargin = dp(6);
                  wrap.addView(copy, copyParams);

                  return wrap;
              }

              private void addFooterLink(LinearLayout parent, String text, String path) {
                  TextView link = new TextView(activity);
                  link.setText(text);
                  link.setTextSize(12);
                  link.setTextColor(Color.argb(200, 42, 40, 34));
                  link.setPadding(dp(8), dp(5), dp(8), dp(5));
                  link.setOnClickListener(v -> {
                      if (categoryClickListener != null)
                          categoryClickListener.onCategoryClick(path);
                  });
                  parent.addView(link);
              }

              private void addFooterDot(LinearLayout parent) {
                  View dot = new View(activity);
                  GradientDrawable dotBg = new GradientDrawable();
                  dotBg.setShape(GradientDrawable.OVAL);
                  dotBg.setColor(Color.argb(100, 201, 168, 76));
                  dot.setBackground(dotBg);
                  LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(dp(3), dp(3));
                  params.leftMargin = dp(6); params.rightMargin = dp(6);
                  params.gravity = Gravity.CENTER_VERTICAL;
                  parent.addView(dot, params);
              }

              /* ============== HELPERS ============== */
              private void roundCorners(View view, int radiusPx) {
                  view.setClipToOutline(true);
                  view.setOutlineProvider(new ViewOutlineProvider() {
                      @Override
                      public void getOutline(View v, Outline outline) {
                          outline.setRoundRect(0, 0, v.getWidth(), v.getHeight(), radiusPx);
                      }
                  });
              }

              private int dp(int value) {
                  float density = activity.getResources().getDisplayMetrics().density;
                  return (int)(value * density + 0.5f);
              }

              private static class AspectFrameLayout extends FrameLayout {
                  private final float ratio;
                  AspectFrameLayout(Context context, float ratio) {
                      super(context);
                      this.ratio = ratio;
                  }
                  @Override
                  protected void onMeasure(int widthMeasureSpec, int heightMeasureSpec) {
                      int width = MeasureSpec.getSize(widthMeasureSpec);
                      int height = (int)(width / ratio);
                      super.onMeasure(widthMeasureSpec, MeasureSpec.makeMeasureSpec(height, MeasureSpec.EXACTLY));
                  }
              }
          }
