              private void addCategoryCard(LinearLayout parentRow, Category category, float verticalOffsetDp) {
                  /* Quiet card — warm white with soft shadow */
                  FrameLayout card = new FrameLayout(activity);
                  AspectFrameLayout aspectCard = new AspectFrameLayout(activity, 3f / 4f);
                  roundCorners(aspectCard, dp(18));

                  /* Warm white background */
                  GradientDrawable cardBg = new GradientDrawable();
                  cardBg.setColor(WARM_WHITE);
                  cardBg.setCornerRadius(dp(18));
                  aspectCard.setBackground(cardBg);

                  /* Subtle border */
                  View border = new View(activity);
                  GradientDrawable borderBg = new GradientDrawable();
                  borderBg.setColor(Color.TRANSPARENT);
                  borderBg.setStroke(dp(1), Color.argb(30, 180, 178, 170));
                  borderBg.setCornerRadius(dp(18));
                  border.setBackground(borderBg);
                  aspectCard.addView(border, new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  ImageView img = new ImageView(activity);
                  img.setScaleType(ImageView.ScaleType.CENTER_CROP);
                  Glide.with(activity).load(category.imageUrl)
                      .diskCacheStrategy(DiskCacheStrategy.ALL).centerCrop().into(img);
                  aspectCard.addView(img, new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  /* Soft dark overlay for text readability */
                  View overlay = new View(activity);
                  GradientDrawable overlayBg = new GradientDrawable(
                      GradientDrawable.Orientation.BOTTOM_TOP,
                      new int[] { Color.argb(180, 45, 43, 38), Color.argb(10, 45, 43, 38) });
                  aspectCard.addView(overlay, new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  /* Label column */
                  LinearLayout labelCol = new LinearLayout(activity);
                  labelCol.setOrientation(LinearLayout.VERTICAL);
                  labelCol.setGravity(Gravity.CENTER_HORIZONTAL);
                  labelCol.setPadding(dp(10), 0, dp(10), dp(16));

                  TextView label = new TextView(activity);
                  label.setText(category.label);
                  label.setTextSize(11);
                  label.setTextColor(WHITE);
                  label.setTypeface(sansBold);
                  label.setGravity(Gravity.CENTER);
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.LOLLIPOP)
                      label.setLetterSpacing(0.12f);
                  labelCol.addView(label);

                  /* Olive underline */
                  View underline = new View(activity);
                  GradientDrawable underlineBg = new GradientDrawable(
                      GradientDrawable.Orientation.LEFT_RIGHT,
                      new int[] { Color.TRANSPARENT, OLIVE, Color.TRANSPARENT });
                  underline.setBackground(underlineBg);
                  LinearLayout.LayoutParams underlineParams = new LinearLayout.LayoutParams(dp(24), dp(2));
                  underlineParams.topMargin = dp(6);
                  underlineParams.gravity = Gravity.CENTER_HORIZONTAL;
                  labelCol.addView(underline, underlineParams);

                  aspectCard.addView(labelCol, new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.BOTTOM));

                  card.addView(aspectCard, new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));

                  /* Quiet touch effect */
                  card.setClickable(true);
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.M) {
                      card.setForeground(new RippleDrawable(
                          ColorStateList.valueOf(Color.argb(16, 138, 154, 91)), null, null));
                  }

                  card.setOnTouchListener((v, event) -> {
                      switch (event.getActionMasked()) {
                          case android.view.MotionEvent.ACTION_DOWN:
                              v.animate().scaleX(0.97f).scaleY(0.97f).setDuration(100).start();
                              break;
                          case android.view.MotionEvent.ACTION_UP:
                          case android.view.MotionEvent.ACTION_CANCEL:
                              v.animate().scaleX(1f).scaleY(1f).setDuration(150).start();
                              break;
                      }
                      return false;
                  });

                  card.setOnClickListener(v -> {
                      if (categoryClickListener != null)
                          categoryClickListener.onCategoryClick(category.path);
                  });

                  /* Soft elevation */
                  card.setElevation(dp(6));

                  LinearLayout.LayoutParams cardParams = new LinearLayout.LayoutParams(
                      0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f);
                  if (parentRow.getChildCount() == 1) cardParams.rightMargin = dp(12);
                  parentRow.addView(card, cardParams);

                  if (verticalOffsetDp != 0f)
                      card.setTranslationY(dp((int) verticalOffsetDp));
              }

