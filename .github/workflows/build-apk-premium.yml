              /* ============== STICKY CART BAR — wishlist heart lives here only ============== */
              private View buildCartBar() {
                  LinearLayout bar = new LinearLayout(activity);
                  bar.setOrientation(LinearLayout.HORIZONTAL);
                  bar.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);
                  bar.setGravity(Gravity.CENTER_VERTICAL);
                  bar.setBackgroundColor(WARM_WHITE);
                  bar.setPadding(dp(20), dp(14), dp(20), dp(20));
                  bar.setElevation(dp(6));

                  FrameLayout wishlistFrame = new FrameLayout(activity);
                  wishlistIcon = buildHeaderIconButton(wishlistFrame, "heart");
                  wishlistBtn = wishlistFrame;
                  wishlistBtn.setOnClickListener(v -> {
                      liked = !liked;
                      GradientDrawable bg = new GradientDrawable();
                      bg.setCornerRadius(dp(16));
                      if (liked) {
                          bg.setColor(Color.parseColor("#F4E9D6"));
                          bg.setStroke(dp(1), GOLD);
                      } else {
                          bg.setColor(WARM_WHITE);
                          bg.setStroke(dp(1), Color.argb(90, 138, 148, 116));
                      }
                      wishlistBtn.setBackground(bg);
                      wishlistIcon.setImageDrawable(makeStrokeIcon("heart", liked));
                  });
                  LinearLayout.LayoutParams wishParams = new LinearLayout.LayoutParams(dp(52), dp(52));
                  wishParams.rightMargin = dp(14);
                  bar.addView(wishlistBtn, wishParams);

                  /* Both action buttons share one BUTTON_HEIGHT / BUTTON_RADIUS
                     constant and the same 0-width + weight=1f formula, so
                     "أضف إلى السلة" and "اشترِ الآن" are always pixel-identical
                     in width and height no matter how their label text
                     changes. maxLines(1) + ellipsize keeps a long label from
                     wrapping and silently growing that button's height. */
                  final int BUTTON_HEIGHT = dp(52);
                  final int BUTTON_RADIUS = dp(16);
                  final int BUTTON_GAP = dp(10);

                  TextView addToCart = new TextView(activity);
                  addToCart.setText("أضف إلى السلة");
                  addToCart.setTextSize(15);
                  addToCart.setTypeface(sansBold);
                  addToCart.setTextColor(WARM_WHITE);
                  addToCart.setGravity(Gravity.CENTER);
                  addToCart.setMaxLines(1);
                  addToCart.setEllipsize(android.text.TextUtils.TruncateAt.END);
                  GradientDrawable addBg = new GradientDrawable();
                  addBg.setColor(OLIVE);
                  addBg.setCornerRadius(BUTTON_RADIUS);
                  addToCart.setBackground(addBg);
                  addToCart.setOnClickListener(v -> {
                      if (addToCartListener != null) {
                          addToCartListener.onAddToCart(currentId, currentName, currentPrice, currentImage, quantity);
                      }
                  });
                  LinearLayout.LayoutParams addParams = new LinearLayout.LayoutParams(
                      0, BUTTON_HEIGHT, 1f);
                  bar.addView(addToCart, addParams);

                  /* Symmetric spacer instead of a one-sided margin, so the
                     gap reads identically from either button's side. */
                  View gap = new View(activity);
                  bar.addView(gap, new LinearLayout.LayoutParams(BUTTON_GAP, BUTTON_HEIGHT));

                  TextView buyNow = new TextView(activity);
                  buyNow.setText("اشترِ الآن");
                  buyNow.setTextSize(15);
                  buyNow.setTypeface(sansBold);
                  buyNow.setTextColor(WHITE);
                  buyNow.setGravity(Gravity.CENTER);
                  buyNow.setMaxLines(1);
                  buyNow.setEllipsize(android.text.TextUtils.TruncateAt.END);
                  GradientDrawable buyBg = new GradientDrawable();
                  buyBg.setColor(GOLD);
                  buyBg.setCornerRadius(BUTTON_RADIUS);
                  buyNow.setBackground(buyBg);
                  buyNow.setOnClickListener(v -> {
                      if (buyNowListener != null) {
                          buyNowListener.onBuyNow(currentId, currentName, currentPrice, currentImage, quantity);
                      }
                  });
                  LinearLayout.LayoutParams buyParams = new LinearLayout.LayoutParams(
                      0, BUTTON_HEIGHT, 1f);
                  bar.addView(buyNow, buyParams);

                  return bar;
              }

              /* ============== PUBLIC API ============== */
              public void setProduct(int id, String name, double price, String image, String description) {
                  this.currentId = id;
                  this.currentName = name != null ? name : "";
                  this.currentPrice = price;
                  this.currentImage = image;
                  this.quantity = 1;
                  this.liked = false;

                  if (nameLabel != null) nameLabel.setText(currentName);
                  if (priceLabel != null) priceLabel.setText(formatPrice(price) + " SDG");
                  if (descLabel != null) {
                      descLabel.setText(TextUtils.isEmpty(description) ? "" : description);
                      descLabel.setVisibility(TextUtils.isEmpty(description) ? View.GONE : View.VISIBLE);
                  }
                  if (qtyValue != null) qtyValue.setText("1");
                  if (productImage != null && image != null) {
                      Glide.with(activity).load(image)
                          .diskCacheStrategy(DiskCacheStrategy.ALL)
                          .centerCrop()
                          .into(productImage);
                  }
              }

              private String formatPrice(double price) {
                  DecimalFormat formatter = new DecimalFormat("#,###",
                      new java.text.DecimalFormatSymbols(Locale.US));
                  return formatter.format(price);
              }

              /* ============== HELPERS ============== */
              private void roundCorners(View view, int radiusPx) {
                  view.setClipToOutline(true);
                  view.setOutlineProvider(new ViewOutlineProvider() {
                      @Override
                      public void getOutline(View v, Outline outline) {
                          outline.setRoundRect(0, 0, v.getWidth(), v.getHeight(), radiusPx);
                      }
                  });
              }

              private int dp(int value) {
                  float density = activity.getResources().getDisplayMetrics().density;
                  return (int)(value * density + 0.5f);
              }
          }
          EOF

