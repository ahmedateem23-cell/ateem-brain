              private View buildAccordionItem(String title, View body, boolean openDefault) {
                  LinearLayout item = new LinearLayout(activity);
                  item.setOrientation(LinearLayout.VERTICAL);
                  item.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);

                  LinearLayout header = new LinearLayout(activity);
                  header.setOrientation(LinearLayout.HORIZONTAL);
                  header.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);
                  header.setGravity(Gravity.CENTER_VERTICAL);
                  header.setPadding(dp(18), dp(16), dp(18), dp(16));

                  TextView titleView = new TextView(activity);
                  titleView.setText(title);
                  titleView.setTextSize(14.5f);
                  titleView.setTypeface(sansBold);
                  titleView.setTextColor(CHARCOAL);
                  LinearLayout.LayoutParams titleParams = new LinearLayout.LayoutParams(
                      0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f);
                  header.addView(titleView, titleParams);

                  TextView toggle = new TextView(activity);
                  toggle.setText(openDefault ? "−" : "+");
                  toggle.setTextSize(17);
                  toggle.setTypeface(sansBold);
                  toggle.setTextColor(OLIVE);
                  toggle.setGravity(Gravity.CENTER);
                  toggle.setWidth(dp(24));
                  header.addView(toggle);

                  item.addView(header);

                  body.setVisibility(openDefault ? View.VISIBLE : View.GONE);
                  item.addView(body, new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));

                  header.setOnClickListener(v -> {
                      boolean isOpen = body.getVisibility() == View.VISIBLE;
                      body.setVisibility(isOpen ? View.GONE : View.VISIBLE);
                      toggle.setText(isOpen ? "+" : "−");
                  });

                  return item;
              }

