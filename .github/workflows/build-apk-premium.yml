          </head>
          <body>

          <div id="ateem-backdrop"></div>

          <div id="ateem-panel">
            <div class="ateem-chat-header">
              <div class="ateem-chat-header-content">
                <div class="ateem-chat-logo-wrap">
                  <img class="ateem-chat-logo-img" src="https://i.ibb.co/F4vhYp7Y/file-00000000b6f081f490aa2899443132bd.png" alt="ATEEM" loading="lazy">
