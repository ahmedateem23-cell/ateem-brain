          package com.ateem.store;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.graphics.Color;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          /*
           * ATEEM Chat — Fully In-App Edition
           * The chat panel (header avatar, messages, quick replies, product
           * cards, voice input, TTS) is bundled as a local HTML/CSS/JS asset
           * at android/app/src/main/assets/ateem_chat/chat.html and rendered
           * in a small transparent WebView that lives on top of the native
           * shell. It never loads anything from ateem-store.com, so it opens
           * instantly and works the same whether the user is on the native
           * home screen or browsing a shop page.
           */
          public class NativeChatOverlay {

              private final Activity activity;
              private WebView webView;
              private boolean isVisible = false;
              private boolean pageReady = false;
              private int bottomInsetPx = 0;

              public NativeChatOverlay(Activity activity) {
                  this.activity = activity;
              }

              @SuppressLint("SetJavaScriptEnabled")
              public View build() {
                  webView = new WebView(activity);
                  webView.setBackgroundColor(Color.TRANSPARENT);
                  /* Transparent hardware-accelerated WebViews can render behind
                     sibling native views regardless of add/bringToFront order —
                     a known WebView quirk. Forcing LAYER_TYPE_SOFTWARE used to
                     be the workaround here, but it made every scroll/keystroke
                     inside the bot render on the CPU instead of the GPU, which
                     is what made the bot feel heavy while browsing and typing.
                     Elevation solves the same stacking problem while keeping
                     the WebView hardware-accelerated. */
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.LOLLIPOP) {
                      webView.setElevation(9999f);
                  }
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          pageReady = true;
                          applyBottomInset();
                      }
                  });
                  webView.addJavascriptInterface(new JsBridge(), "AteemNative");
                  webView.setVisibility(View.GONE);
                  webView.loadUrl("file:///android_asset/ateem_chat/chat.html");
                  return webView;
              }

              public View getView() { return webView; }

              public boolean isVisible() { return isVisible; }

              /* Tells the panel exactly how tall the bottom nav bar is, so
                 its bottom edge always ends a comfortable margin above it
                 instead of a fixed guess that can overlap on some screens. */
              public void setBottomInset(int px) {
                  bottomInsetPx = px;
                  applyBottomInset();
              }

              private void applyBottomInset() {
                  if (webView == null || !pageReady) return;
                  webView.evaluateJavascript(
                      "(function(){ document.documentElement.style.setProperty('--ateem-bottom-inset','"
                          + bottomInsetPx + "px'); })();",
                      null
                  );
              }

              public void show() {
                  if (webView == null) return;
                  isVisible = true;
                  webView.bringToFront();
                  webView.setVisibility(View.VISIBLE);
                  webView.evaluateJavascript(
                      "(function(){ if (window.ateemOpenPanel) window.ateemOpenPanel(); })();",
                      null
                  );
              }

              public void hide() {
                  if (webView == null) return;
                  isVisible = false;
                  webView.setVisibility(View.GONE);
              }

              /* Called from the local chat.html once its own close
                 animation finishes, so the WebView is only hidden after
                 the panel/backdrop have visually faded out. */
              private class JsBridge {
                  @JavascriptInterface
                  public void onCloseRequested() {
                      activity.runOnUiThread(NativeChatOverlay.this::hide);
                  }
              }
          }
