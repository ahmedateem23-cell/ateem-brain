          package com.ateem.store;

          import android.content.Context;
          import android.graphics.Typeface;

          /*
           * Central typography loader for the ATEEM visual identity: IBM Plex
           * Sans Arabic for all Arabic UI text (headings, body, navigation,
           * prices), and Cormorant Garamond reserved strictly for the small
           * English "editorial" accents (e.g. "LUXURY COLLECTION") — never
           * for Arabic or for primary navigation/body text, per the brand
           * brief's rule that English stays a small secondary accent.
           *
           * Fonts are bundled as raw assets (assets/fonts/*.ttf) rather than
           * res/font/ resources on purpose: loading happens here at runtime
           * with a try/catch, so if a font file is missing (e.g. a network
           * hiccup during the CI build) the app quietly falls back to the
           * closest system font instead of crashing or failing to compile.
           */
          public final class AteemFonts {

              private AteemFonts() {}

              private static Typeface regular;
              private static Typeface medium;
              private static Typeface semiBold;
              private static Typeface bold;
              private static Typeface serifBoldCached;
              private static Typeface serifItalicCached;
              private static boolean regularTried, mediumTried, semiBoldTried, boldTried,
                                      serifBoldTried, serifItalicTried;

              private static Typeface fromAsset(Context context, String assetPath, int fallbackStyle) {
                  try {
                      return Typeface.createFromAsset(context.getAssets(), assetPath);
                  } catch (Exception e) {
                      return Typeface.create("sans-serif-medium", fallbackStyle);
                  }
              }

              private static Typeface fromAssetSerif(Context context, String assetPath, int fallbackStyle) {
                  try {
                      return Typeface.createFromAsset(context.getAssets(), assetPath);
                  } catch (Exception e) {
                      return Typeface.create("serif", fallbackStyle);
                  }
              }

              /* IBM Plex Sans Arabic — Regular. General-purpose body copy. */
              public static Typeface arabicRegular(Context context) {
                  if (!regularTried) {
                      regular = fromAsset(context, "fonts/ibm_plex_arabic_regular.ttf", Typeface.NORMAL);
                      regularTried = true;
                  }
                  return regular;
              }

              /* IBM Plex Sans Arabic — Medium. Labels, nav items, muted UI text. */
              public static Typeface arabicMedium(Context context) {
                  if (!mediumTried) {
                      medium = fromAsset(context, "fonts/ibm_plex_arabic_medium.ttf", Typeface.NORMAL);
                      mediumTried = true;
                  }
                  return medium;
              }

              /* IBM Plex Sans Arabic — SemiBold. Active nav state, emphasis text. */
              public static Typeface arabicSemiBold(Context context) {
                  if (!semiBoldTried) {
                      semiBold = fromAsset(context, "fonts/ibm_plex_arabic_semibold.ttf", Typeface.BOLD);
                      semiBoldTried = true;
                  }
                  return semiBold;
              }

              /* IBM Plex Sans Arabic — Bold. Headings, product names, prices, CTAs. */
              public static Typeface arabicBold(Context context) {
                  if (!boldTried) {
                      bold = fromAsset(context, "fonts/ibm_plex_arabic_bold.ttf", Typeface.BOLD);
                      boldTried = true;
                  }
                  return bold;
              }

              /* Cormorant Garamond — Bold. Small English editorial accents only. */
              public static Typeface serifBold(Context context) {
                  if (!serifBoldTried) {
                      serifBoldCached = fromAssetSerif(context, "fonts/cormorant_garamond_bold.ttf", Typeface.BOLD);
                      serifBoldTried = true;
                  }
                  return serifBoldCached;
              }

              /* Cormorant Garamond — Italic. Small English editorial accents only. */
              public static Typeface serifItalic(Context context) {
                  if (!serifItalicTried) {
                      serifItalicCached = fromAssetSerif(context, "fonts/cormorant_garamond_italic.ttf", Typeface.ITALIC);
                      serifItalicTried = true;
                  }
                  return serifItalicCached;
              }
          }
