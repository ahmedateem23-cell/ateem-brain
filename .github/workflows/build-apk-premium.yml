          import java.util.List;

          /*
           * ATEEM STORE — Premium Quiet Luxury Home Screen
           * تصميم هادئ وراقٍ: خلفية عاجية + بانر أنيق بسيط
           * + بطاقات ناعمة بدون تأثيرات مبالغ فيها
           */

          public class NativeHomeScreen {

              public interface OnChatClickListener { void onChatClick(); }
              public interface OnCategoryClickListener { void onCategoryClick(String path); }

              private final Activity activity;
              private final OnChatClickListener chatClickListener;
              private final OnCategoryClickListener categoryClickListener;
              private final Handler bannerHandler = new Handler(Looper.getMainLooper());
              private Runnable bannerRunnable;
              private int currentSlide = 0;
              private ImageView bannerImage;
              private TextView bannerBrandLabel, bannerTitle, bannerDesc;
              private LinearLayout dotsRow;
              private final List<View> dots = new ArrayList<>();
