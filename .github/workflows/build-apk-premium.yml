            animation:ateem-statusPulse 2.5s ease-in-out infinite;
          }
          #ateem-panel .ateem-chat-sub {
            font-size:9.5px; color:var(--ateem-gold-light); margin-top:3px;
            letter-spacing:1.2px; font-family:'Montserrat',sans-serif; opacity:0.85;
          }
          #ateem-panel .ateem-chat-close {
            width:30px; height:30px; border:1.5px solid rgba(201,168,76,0.3); border-radius:50%;
            background:rgba(255,255,255,0.05); color:var(--ateem-cream); font-size:12px;
            cursor:pointer; position:relative; z-index:1; transition:.3s ease;
            backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center;
          }
          #ateem-panel .ateem-chat-close:hover {
            background:rgba(201,168,76,0.15);
