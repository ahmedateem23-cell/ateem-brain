              private final Product[] newArrivals = new Product[] {
                  new Product("Essential Black Tee",
                      "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500&h=500&fit=crop&q=80",
                      "45,000", null),
                  new Product("Dior Sauvage",
                      "https://images.unsplash.com/photo-1594035910387-fea47794261f?w=500&h=500&fit=crop&q=80",
                      "85,000", "جديد"),
              };

              public NativeHomeScreen(Activity activity, OnChatClickListener chatClickListener,
                                      OnCategoryClickListener categoryClickListener) {
                  this.activity = activity;
                  this.chatClickListener = chatClickListener;
                  this.categoryClickListener = categoryClickListener;
                  this.serifItalic = AteemFonts.serifItalic(activity);
                  this.sansMedium = AteemFonts.arabicMedium(activity);
                  this.sansBold = AteemFonts.arabicBold(activity);
                  this.sansSemi = AteemFonts.arabicSemiBold(activity);
              }

              public View build() {
                  NestedScrollView scroll = new NestedScrollView(activity);
                  scroll.setFillViewport(true);
                  scroll.setBackgroundColor(IVORY);

                  LinearLayout column = new LinearLayout(activity);
                  column.setOrientation(LinearLayout.VERTICAL);
                  column.setBackgroundColor(IVORY);
                  scroll.addView(column, new ViewGroup.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));

                  headerView = buildHeader();
                  column.addView(headerView, new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));

                  column.addView(buildHero(), heroParams());
                  column.addView(buildSectionHeader("تصفح الفئات", null, dp(18)));
                  column.addView(buildCategoriesScroll());

                  column.addView(buildSectionHeader("الأكثر مبيعاً", "/shop", dp(26)));
                  column.addView(buildProductsGrid(bestSellers));

                  column.addView(buildSectionHeader("وصل حديثاً", "/shop", dp(26)));
                  column.addView(buildProductsGrid(newArrivals));

                  View bottomSpacer = new View(activity);
                  column.addView(bottomSpacer, new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, dp(24)));

                  return scroll;
              }

              /* ============== HEADER ============== */
              private View buildHeader() {
                  LinearLayout row = new LinearLayout(activity);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);
                  row.setGravity(Gravity.CENTER_VERTICAL);
                  row.setPadding(dp(20), dp(18), dp(20), dp(14));
                  row.setBackgroundColor(IVORY);
                  /* Let the cart badge sit slightly outside the button's own
                     bounds without being clipped by the row or the header
                     container — this is what was cutting the badge off. */
                  row.setClipChildren(false);
                  row.setClipToPadding(false);

                  /* Bot avatar — circular, olive-dark, doubles as chat entry
                     point (moved here from the old NativeHeader logo row). */
                  FrameLayout botBtn = new FrameLayout(activity);
                  GradientDrawable botBg = new GradientDrawable();
                  botBg.setShape(GradientDrawable.OVAL);
                  botBg.setColor(OLIVE_DARK);
                  botBg.setStroke(dp(1), Color.argb(90, 194, 164, 108));
                  botBtn.setBackground(botBg);
                  botBtn.setElevation(dp(4));
                  botBtn.setClickable(true);
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.M) {
                      botBtn.setForeground(new RippleDrawable(
                          ColorStateList.valueOf(Color.argb(60, 255, 255, 255)), null, null));
                  }
                  ImageView botImg = new ImageView(activity);
                  botImg.setScaleType(ImageView.ScaleType.CENTER_CROP);
                  Glide.with(activity).load(BOT_AVATAR_URL)
                      .diskCacheStrategy(DiskCacheStrategy.ALL)
                      .transform(new CircleCrop())
                      .into(botImg);
                  botBtn.addView(botImg, new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  botBtn.setOnClickListener(v -> {
                      if (chatClickListener != null) chatClickListener.onChatClick();
                  });

                  /* Tactile press feedback — a quick scale-down the instant a
                     finger touches the bot avatar, springing back on release,
                     layered on top of the ripple so the touch feels soft and
                     alive rather than a flat, instant click. */
                  botBtn.setOnTouchListener((v, event) -> {
                      switch (event.getAction()) {
                          case MotionEvent.ACTION_DOWN:
                              v.animate().scaleX(0.90f).scaleY(0.90f).setDuration(120).start();
                              break;
                          case MotionEvent.ACTION_UP:
                          case MotionEvent.ACTION_CANCEL:
                              v.animate().scaleX(1f).scaleY(1f).setDuration(180)
                                  .setInterpolator(new android.view.animation.OvershootInterpolator(3f))
                                  .start();
                              break;
                      }
                      return false; // let the click listener + ripple still fire normally
                  });

                  LinearLayout.LayoutParams botParams = new LinearLayout.LayoutParams(dp(42), dp(42));
                  row.addView(botBtn, botParams);

                  /* Search bar — a real, working search field now. Typing and
                     hitting the keyboard's search action (or tapping the
                     icon) filters the live Odoo product catalog on the Shop
                     tab by name, and switches to that tab to show results. */
                  FrameLayout searchWrap = new FrameLayout(activity);
                  final GradientDrawable searchBgRest = new GradientDrawable();
                  searchBgRest.setColor(WHITE);
                  searchBgRest.setCornerRadius(dp(22));
                  searchBgRest.setStroke(dp(1), Color.argb(30, 138, 154, 91));
                  final GradientDrawable searchBgFocused = new GradientDrawable();
                  searchBgFocused.setColor(WHITE);
                  searchBgFocused.setCornerRadius(dp(22));
                  searchBgFocused.setStroke(dp(2), Color.argb(210, 194, 164, 108)); // gold — quiet, deliberate focus ring
                  searchWrap.setBackground(searchBgRest);
                  searchWrap.setElevation(dp(2));

                  EditText searchInput = new EditText(activity);
                  searchInput.setHint("ابحث عن منتج...");
                  searchInput.setHintTextColor(TEXT_MUTED);
                  searchInput.setTextColor(TEXT);
                  searchInput.setTextSize(14);
                  searchInput.setTypeface(sansMedium);
                  searchInput.setSingleLine(true);
                  searchInput.setInputType(InputType.TYPE_CLASS_TEXT);
                  searchInput.setImeOptions(EditorInfo.IME_ACTION_SEARCH);
                  searchInput.setBackground(null);
                  searchInput.setPadding(dp(16), 0, dp(16), 0);
                  searchInput.setOnEditorActionListener((tv, actionId, event) -> {
                      if (actionId == EditorInfo.IME_ACTION_SEARCH
                              || (event != null && event.getKeyCode() == KeyEvent.KEYCODE_ENTER
                                  && event.getAction() == KeyEvent.ACTION_DOWN)) {
                          runSearch(tv.getText().toString());
                          return true;
                      }
                      return false;
                  });
                  /* Premium focus state — a quiet gold ring and a touch more
                     lift replace the plain default underline the instant the
                     field is tapped, and settle back to the resting olive
                     hairline once focus is lost. */
                  searchInput.setOnFocusChangeListener((v, hasFocus) -> {
                      searchWrap.setBackground(hasFocus ? searchBgFocused : searchBgRest);
                      searchWrap.animate().translationZ(hasFocus ? dp(3) : 0)
                          .setDuration(160).start();
                  });
                  searchWrap.addView(searchInput, new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, dp(44)));

                  LinearLayout.LayoutParams searchParams = new LinearLayout.LayoutParams(
                      0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f);
                  searchParams.leftMargin = dp(10); searchParams.rightMargin = dp(10);
                  row.addView(searchWrap, searchParams);

                  /* Cart button + gold badge showing the live item count */
                  FrameLayout cartBtn = new FrameLayout(activity);
                  GradientDrawable cartBg = new GradientDrawable();
                  cartBg.setColor(WHITE);
                  cartBg.setCornerRadius(dp(12));
                  cartBg.setStroke(dp(1), Color.argb(38, 138, 154, 91));
                  cartBtn.setBackground(cartBg);
                  cartBtn.setElevation(dp(2));
                  cartBtn.setClickable(true);
                  cartBtn.setClipChildren(false);
                  cartBtn.setClipToPadding(false);
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.M) {
                      cartBtn.setForeground(new RippleDrawable(
                          ColorStateList.valueOf(Color.argb(24, 138, 154, 91)), null, null));
                  }
                  ImageView cartIcon = new ImageView(activity);
                  cartIcon.setImageResource(R.drawable.ic_nav_cart);
                  cartIcon.setColorFilter(TEXT);
                  FrameLayout.LayoutParams cartIconParams = new FrameLayout.LayoutParams(dp(20), dp(20), Gravity.CENTER);
                  cartBtn.addView(cartIcon, cartIconParams);

                  cartBadge = new TextView(activity);
                  cartBadge.setText(String.valueOf(NativeCartScreen.getItemCount()));
                  cartBadge.setTextSize(10);
                  cartBadge.setTextColor(WHITE);
                  cartBadge.setTypeface(sansBold);
                  cartBadge.setGravity(Gravity.CENTER);
                  GradientDrawable badgeBg = new GradientDrawable();
                  badgeBg.setShape(GradientDrawable.OVAL);
                  badgeBg.setColor(GOLD);
                  cartBadge.setBackground(badgeBg);
                  FrameLayout.LayoutParams badgeParams = new FrameLayout.LayoutParams(dp(18), dp(18), Gravity.TOP | Gravity.LEFT);
                  badgeParams.topMargin = -dp(4); badgeParams.leftMargin = -dp(4);
                  cartBtn.addView(cartBadge, badgeParams);
                  cartBadge.setVisibility(NativeCartScreen.getItemCount() > 0 ? View.VISIBLE : View.GONE);

                  cartBtn.setOnClickListener(v -> {
                      if (categoryClickListener != null) categoryClickListener.onCategoryClick("/shop/cart");
                  });
                  row.addView(cartBtn, new LinearLayout.LayoutParams(dp(44), dp(44)));

                  return row;
              }

              /* Refreshes the header cart badge — call this whenever the
                 home screen becomes visible again so a just-added item
                 shows up without needing to rebuild the whole screen. */
              public void refreshCartBadge() {
                  if (cartBadge == null) return;
                  int count = NativeCartScreen.getItemCount();
                  cartBadge.setText(String.valueOf(count));
                  cartBadge.setVisibility(count > 0 ? View.VISIBLE : View.GONE);
              }

              /* Runs an actual search: hides the keyboard, hands the query
                 off so the Shop tab can filter the live product list, and
                 switches to that tab to show the results. Empty queries just
                 open the Shop tab with everything showing, same as before. */
              private void runSearch(String query) {
                  Object imService = activity.getSystemService(Context.INPUT_METHOD_SERVICE);
                  if (imService instanceof InputMethodManager && headerView != null) {
                      ((InputMethodManager) imService).hideSoftInputFromWindow(
                          headerView.getWindowToken(), 0);
                  }
                  if (searchListener != null) searchListener.onSearch(query == null ? "" : query.trim());
                  if (categoryClickListener != null) categoryClickListener.onCategoryClick("/shop");
              }

              /* ============== HERO ============== */
              private LinearLayout.LayoutParams heroParams() {
                  LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  params.leftMargin = dp(20); params.rightMargin = dp(20); params.topMargin = dp(6);
                  return params;
              }

              /* High-quality editorial menswear photo behind the hero copy —
                 replaces the old flat two-tone gradient with real imagery
                 while staying inside the brand's own palette (a warm olive
                 scrim sits on top so the photo never fights the identity or
                 the white/gold text on top of it). */
              private static final String HERO_BANNER_IMAGE_URL =
                  "https://images.unsplash.com/photo-1600091166971-7f9faad6c1e2?w=1200&h=900&fit=crop&q=85";

              private View buildHero() {
                  FrameLayout hero = new FrameLayout(activity);
                  roundCorners(hero, dp(24));
                  GradientDrawable heroBg = new GradientDrawable(
                      GradientDrawable.Orientation.TL_BR,
                      new int[] { OLIVE_DARK, OLIVE });
                  heroBg.setCornerRadius(dp(24));
                  hero.setBackground(heroBg);
                  hero.setElevation(dp(6));

                  /* Background photo — fills the card behind the scrim and
                     the copy. Loaded over the gradient above, which stays
                     visible as a placeholder color until the image is ready. */
                  ImageView heroPhoto = new ImageView(activity);
                  heroPhoto.setScaleType(ImageView.ScaleType.CENTER_CROP);
                  Glide.with(activity)
                      .load(HERO_BANNER_IMAGE_URL)
                      .diskCacheStrategy(DiskCacheStrategy.ALL)
                      .into(heroPhoto);
                  hero.addView(heroPhoto, new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  /* Warm olive scrim over the photo — darker toward the
                     reading side (right, RTL) so the title and CTA stay
                     legible without hiding the image entirely. */
                  View scrim = new View(activity);
                  GradientDrawable scrimBg = new GradientDrawable(
                      GradientDrawable.Orientation.LEFT_RIGHT,
                      new int[] { Color.argb(70, 107, 122, 69), Color.argb(215, 41, 41, 37) });
                  scrim.setBackground(scrimBg);
                  hero.addView(scrim, new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  LinearLayout content = new LinearLayout(activity);
                  content.setOrientation(LinearLayout.VERTICAL);
                  content.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);
                  content.setPadding(dp(28), dp(30), dp(28), dp(30));

                  /* Eyebrow — "LUXURY COLLECTION". The separate "وصول جديد"
                     badge chip that used to sit above this was removed: it
                     said essentially the same thing as this eyebrow and
                     just added one more shape to read before the headline. */
                  TextView eyebrow = new TextView(activity);
                  eyebrow.setText("LUXURY COLLECTION");
                  eyebrow.setTextSize(10);
                  eyebrow.setTextColor(Color.argb(200, 245, 241, 232));
                  eyebrow.setTypeface(sansSemi);
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.LOLLIPOP)
                      eyebrow.setLetterSpacing(0.18f);
                  content.addView(eyebrow, wrapParams());

                  /* Title — "كن الأفضل لتفوز" */
                  TextView title = new TextView(activity);
                  title.setText("كن الأفضل لتفوز");
                  title.setTextSize(28);
                  title.setTextColor(WHITE);
                  title.setTypeface(sansBold);
                  title.setLineSpacing(0f, 1.05f);
                  LinearLayout.LayoutParams titleParams = wrapParams();
                  titleParams.topMargin = dp(6);
                  content.addView(title, titleParams);

                  /* Description */
                  TextView desc = new TextView(activity);
                  desc.setText("أناقة رجالية فاخرة بأسلوب عصري تلائم ذوقك الرفيع");
                  desc.setTextSize(13);
                  desc.setTextColor(Color.argb(215, 255, 255, 255));
                  desc.setLineSpacing(dp(2), 1f);
                  LinearLayout.LayoutParams descParams = wrapParams();
                  descParams.topMargin = dp(8);
                  content.addView(desc, descParams);

                  /* CTA — "تسوق الآن" */
                  LinearLayout cta = new LinearLayout(activity);
                  cta.setOrientation(LinearLayout.HORIZONTAL);
                  cta.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);
                  cta.setGravity(Gravity.CENTER_VERTICAL);
                  cta.setClickable(true);
                  cta.setPadding(dp(20), dp(11), dp(20), dp(11));
                  GradientDrawable ctaBg = new GradientDrawable();
                  ctaBg.setColor(WHITE);
                  ctaBg.setCornerRadius(dp(22));
                  cta.setBackground(ctaBg);
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.M) {
                      cta.setForeground(new RippleDrawable(
                          ColorStateList.valueOf(Color.argb(30, 138, 154, 91)), null, null));
                  }
                  cta.setOnClickListener(v -> {
                      if (categoryClickListener != null) categoryClickListener.onCategoryClick("/shop");
                  });

                  ImageView bagIcon = new ImageView(activity);
                  bagIcon.setImageResource(R.drawable.ic_nav_shop);
                  bagIcon.setColorFilter(OLIVE_DARK);
                  LinearLayout.LayoutParams bagIconParams = new LinearLayout.LayoutParams(dp(15), dp(15));
                  bagIconParams.leftMargin = dp(7);
                  cta.addView(bagIcon, bagIconParams);

                  TextView ctaLabel = new TextView(activity);
                  ctaLabel.setText("تسوق الآن");
                  ctaLabel.setTextSize(12);
                  ctaLabel.setTextColor(OLIVE_DARK);
                  ctaLabel.setTypeface(sansBold);
                  cta.addView(ctaLabel);

                  LinearLayout.LayoutParams ctaParams = wrapParams();
                  ctaParams.topMargin = dp(18);
                  content.addView(cta, ctaParams);

                  hero.addView(content, new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));

                  return hero;
              }

              private LinearLayout.LayoutParams wrapParams() {
                  return new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
              }

              /* ============== SECTION HEADER ============== */
              private View buildSectionHeader(String title, String linkPath, int topMarginPx) {
                  LinearLayout row = new LinearLayout(activity);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);
                  row.setGravity(Gravity.CENTER_VERTICAL);
                  LinearLayout.LayoutParams rowParams = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  rowParams.leftMargin = dp(20); rowParams.rightMargin = dp(20); rowParams.topMargin = topMarginPx;
                  row.setLayoutParams(rowParams);

                  TextView titleView = new TextView(activity);
                  titleView.setText(title);
                  titleView.setTextSize(16);
                  titleView.setTextColor(TEXT);
                  titleView.setTypeface(sansBold);
                  LinearLayout.LayoutParams titleParams = new LinearLayout.LayoutParams(
                      0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f);
                  row.addView(titleView, titleParams);

                  TextView link = new TextView(activity);
                  link.setText(linkPath != null ? "عرض الكل" : "الكل");
                  link.setTextSize(12);
                  link.setTextColor(OLIVE);
                  link.setTypeface(sansMedium);
                  link.setPadding(dp(6), dp(4), dp(6), dp(4));
                  final String target = linkPath != null ? linkPath : "/shop";
                  link.setOnClickListener(v -> {
                      if (categoryClickListener != null) categoryClickListener.onCategoryClick(target);
                  });
                  row.addView(link);

                  return row;
              }

              /* ============== CATEGORIES ============== */
              private View buildCategoriesScroll() {
                  HorizontalScrollView scroll = new HorizontalScrollView(activity);
                  scroll.setHorizontalScrollBarEnabled(false);
                  scroll.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);
                  LinearLayout.LayoutParams scrollParams = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  scrollParams.topMargin = dp(12);
                  scroll.setLayoutParams(scrollParams);
                  scroll.setClipToPadding(false);
                  scroll.setPadding(dp(20), 0, dp(20), 0);

                  LinearLayout row = new LinearLayout(activity);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);

                  for (CategoryItem cat : categories) {
                      row.addView(buildCategoryCard(cat));
                  }
                  scroll.addView(row);
                  return scroll;
              }

              private View buildCategoryCard(CategoryItem cat) {
                  LinearLayout card = new LinearLayout(activity);
                  card.setOrientation(LinearLayout.VERTICAL);
                  card.setGravity(Gravity.CENTER);
                  card.setClickable(true);
                  LinearLayout.LayoutParams cardParams = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  cardParams.leftMargin = dp(10);
                  card.setLayoutParams(cardParams);
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.M) {
                      card.setForeground(new RippleDrawable(
                          ColorStateList.valueOf(Color.argb(20, 138, 154, 91)), null, null));
                  }
                  card.setOnClickListener(v -> {
                      if (categoryClickListener != null) categoryClickListener.onCategoryClick(cat.path);
                  });

                  FrameLayout iconWrap = new FrameLayout(activity);
                  GradientDrawable iconBg = new GradientDrawable();
                  iconBg.setShape(GradientDrawable.OVAL);
                  iconBg.setColor(WHITE);
                  iconBg.setStroke(dp(1), Color.argb(28, 138, 154, 91));
                  iconWrap.setBackground(iconBg);
                  iconWrap.setElevation(dp(2));

                  ImageView icon = new ImageView(activity);
                  icon.setImageResource(cat.iconRes);
                  icon.setColorFilter(OLIVE_DARK);
                  FrameLayout.LayoutParams iconParams = new FrameLayout.LayoutParams(dp(24), dp(24), Gravity.CENTER);
                  iconWrap.addView(icon, iconParams);

                  card.addView(iconWrap, new LinearLayout.LayoutParams(dp(58), dp(58)));

                  TextView label = new TextView(activity);
                  label.setText(cat.label);
                  label.setTextSize(11);
                  label.setTextColor(TEXT);
                  label.setTypeface(sansMedium);
                  label.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams labelParams = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  labelParams.topMargin = dp(7);
                  card.addView(label, labelParams);

                  return card;
              }

              /* ============== PRODUCTS GRID (2 columns) ============== */
              private View buildProductsGrid(Product[] products) {
                  LinearLayout grid = new LinearLayout(activity);
                  grid.setOrientation(LinearLayout.VERTICAL);
                  LinearLayout.LayoutParams gridParams = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  gridParams.leftMargin = dp(20); gridParams.rightMargin = dp(20); gridParams.topMargin = dp(14);
                  grid.setLayoutParams(gridParams);
                  grid.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);

                  for (int i = 0; i < products.length; i += 2) {
                      LinearLayout rowLayout = new LinearLayout(activity);
                      rowLayout.setOrientation(LinearLayout.HORIZONTAL);
                      rowLayout.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);
                      LinearLayout.LayoutParams rowParams = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                      if (i > 0) rowParams.topMargin = dp(14);
                      rowLayout.setLayoutParams(rowParams);

                      rowLayout.addView(buildProductCard(products[i]), productCardParams(true));
                      if (i + 1 < products.length) {
                          rowLayout.addView(buildProductCard(products[i + 1]), productCardParams(false));
                      } else {
                          View spacer = new View(activity);
                          rowLayout.addView(spacer, new LinearLayout.LayoutParams(0, 0, 1f));
                      }
                      grid.addView(rowLayout);
                  }
                  return grid;
              }

              private LinearLayout.LayoutParams productCardParams(boolean first) {
                  LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(
                      0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f);
                  if (first) params.leftMargin = dp(7); else params.rightMargin = dp(7);
                  return params;
              }

              private View buildProductCard(Product product) {
                  LinearLayout card = new LinearLayout(activity);
                  card.setOrientation(LinearLayout.VERTICAL);
                  card.setClickable(true);
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.M) {
                      card.setForeground(new RippleDrawable(
                          ColorStateList.valueOf(Color.argb(16, 138, 154, 91)), null, null));
                  }
                  card.setOnClickListener(v -> {
                      if (categoryClickListener != null) categoryClickListener.onCategoryClick("/shop");
                  });
                  card.setOnTouchListener((v, event) -> {
                      switch (event.getActionMasked()) {
                          case android.view.MotionEvent.ACTION_DOWN:
                              v.animate().scaleX(0.97f).scaleY(0.97f).setDuration(100).start();
                              break;
                          case android.view.MotionEvent.ACTION_UP:
                          case android.view.MotionEvent.ACTION_CANCEL:
                              v.animate().scaleX(1f).scaleY(1f).setDuration(150).start();
                              break;
                      }
                      return false;
                  });

                  FrameLayout imgWrap = new AspectFrameLayout(activity, 1f);
                  roundCorners(imgWrap, dp(16));
                  imgWrap.setBackgroundColor(IVORY_DEEP);
                  imgWrap.setElevation(dp(3));

                  ImageView img = new ImageView(activity);
                  img.setScaleType(ImageView.ScaleType.CENTER_CROP);
                  Glide.with(activity).load(product.imageUrl)
                      .diskCacheStrategy(DiskCacheStrategy.ALL).centerCrop().into(img);
                  imgWrap.addView(img, new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  if (product.badge != null) {
                      TextView badge = new TextView(activity);
                      badge.setText(product.badge);
                      badge.setTextSize(9);
                      badge.setTextColor(WHITE);
                      badge.setTypeface(sansBold);
                      badge.setPadding(dp(9), dp(4), dp(9), dp(4));
                      GradientDrawable badgeBg = new GradientDrawable();
                      badgeBg.setColor(OLIVE);
                      badgeBg.setCornerRadius(dp(10));
                      badge.setBackground(badgeBg);
                      FrameLayout.LayoutParams badgeParams = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.TOP | Gravity.RIGHT);
                      badgeParams.topMargin = dp(8); badgeParams.rightMargin = dp(8);
                      imgWrap.addView(badge, badgeParams);
                  }

                  card.addView(imgWrap, new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));

                  TextView title = new TextView(activity);
                  title.setText(product.title);
                  title.setTextSize(12.5f);
                  title.setTextColor(TEXT);
                  title.setTypeface(sansMedium);
                  title.setMaxLines(1);
                  title.setEllipsize(android.text.TextUtils.TruncateAt.END);
                  LinearLayout.LayoutParams titleParams = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  titleParams.topMargin = dp(8);
                  card.addView(title, titleParams);

                  LinearLayout priceRow = new LinearLayout(activity);
                  priceRow.setOrientation(LinearLayout.HORIZONTAL);
                  priceRow.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);
                  priceRow.setGravity(Gravity.CENTER_VERTICAL);
                  LinearLayout.LayoutParams priceRowParams = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  priceRowParams.topMargin = dp(3);
                  card.addView(priceRow, priceRowParams);

                  TextView price = new TextView(activity);
                  price.setText(product.price + " ");
                  price.setTextSize(13);
                  price.setTextColor(OLIVE_DARK);
                  price.setTypeface(sansBold);
                  priceRow.addView(price);

                  TextView currency = new TextView(activity);
                  currency.setText("SDG");
                  currency.setTextSize(9);
                  currency.setTextColor(TEXT_LIGHT);
                  priceRow.addView(currency);

                  return card;
              }

              /* ============== HELPERS ============== */
              private void roundCorners(View view, int radiusPx) {
                  view.setClipToOutline(true);
                  view.setOutlineProvider(new ViewOutlineProvider() {
                      @Override
                      public void getOutline(View v, Outline outline) {
                          outline.setRoundRect(0, 0, v.getWidth(), v.getHeight(), radiusPx);
                      }
                  });
              }

              private int dp(int value) {
                  float density = activity.getResources().getDisplayMetrics().density;
                  return (int)(value * density + 0.5f);
              }

              private static class AspectFrameLayout extends FrameLayout {
                  private final float ratio;
                  AspectFrameLayout(Context context, float ratio) {
                      super(context);
                      this.ratio = ratio;
                  }
                  @Override
                  protected void onMeasure(int widthMeasureSpec, int heightMeasureSpec) {
                      int width = MeasureSpec.getSize(widthMeasureSpec);
                      int height = (int)(width / ratio);
                      super.onMeasure(widthMeasureSpec, MeasureSpec.makeMeasureSpec(height, MeasureSpec.EXACTLY));
                  }
              }
          }
