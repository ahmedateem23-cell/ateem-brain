              /* Returns {optionRow, detailsPanel}; optionRow's tag holds its own
                 check-mark TextView so selectPayment() can flip it on/off. detailRows
                 is a flat {label, value, label, value, ...} list — pass null (or an
                 empty array) for a method with no transfer details, like COD, and
                 the details panel is simply left empty/collapsed. */
              private LinearLayout[] paymentOption(String title, String subtitle, String[] detailRows) {
                  LinearLayout row = new LinearLayout(activity);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);
                  row.setGravity(Gravity.CENTER_VERTICAL);
                  row.setPadding(dp(14), dp(14), dp(14), dp(14));
                  GradientDrawable rowBg = new GradientDrawable();
                  rowBg.setColor(IVORY_BG);
                  rowBg.setCornerRadius(dp(14));
                  rowBg.setStroke(dp(1), Color.argb(40, 138, 154, 91));
                  row.setBackground(rowBg);
                  roundCorners(row, dp(14));

                  TextView check = new TextView(activity);
                  check.setText("");
                  check.setTextSize(12);
                  check.setTypeface(sansBold);
                  check.setTextColor(WHITE);
                  check.setGravity(Gravity.CENTER);
                  GradientDrawable checkBg = new GradientDrawable();
                  checkBg.setShape(GradientDrawable.OVAL);
                  checkBg.setColor(SOFT_GRAY);
                  check.setBackground(checkBg);
                  row.addView(check, new LinearLayout.LayoutParams(dp(20), dp(20)));
                  row.setTag(check);

                  LinearLayout textCol = new LinearLayout(activity);
                  textCol.setOrientation(LinearLayout.VERTICAL);
                  TextView titleView = new TextView(activity);
                  titleView.setText(title);
                  titleView.setTextSize(14);
                  titleView.setTypeface(sansBold);
                  titleView.setTextColor(CHARCOAL);
                  textCol.addView(titleView);
                  TextView subtitleView = new TextView(activity);
                  subtitleView.setText(subtitle);
                  subtitleView.setTextSize(11);
                  subtitleView.setTextColor(WARM_GRAY);
                  textCol.addView(subtitleView);
                  LinearLayout.LayoutParams textColParams = new LinearLayout.LayoutParams(
                      0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f);
                  textColParams.setMarginEnd(dp(12));
                  row.addView(textCol, textColParams);

                  LinearLayout details = new LinearLayout(activity);
                  details.setOrientation(LinearLayout.VERTICAL);
                  details.setVisibility(View.GONE);
                  GradientDrawable detailsBg = new GradientDrawable();
                  detailsBg.setColor(WARM_WHITE);
                  detailsBg.setCornerRadius(dp(12));
                  details.setBackground(detailsBg);
                  details.setPadding(dp(14), dp(12), dp(14), dp(12));

                  if (detailRows != null && detailRows.length >= 2) {
                      TextView hint = new TextView(activity);
                      hint.setText("حوّل المبلغ الإجمالي على الحساب التالي، ثم اضغط \"تأكيد الطلب\". هنتواصل معاك بعد التأكد من وصول التحويل.");
                      hint.setTextSize(11.5f);
                      hint.setTextColor(WARM_GRAY);
                      hint.setLineSpacing(dp(2), 1f);
                      LinearLayout.LayoutParams hintParams = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                      hintParams.bottomMargin = dp(10);
                      details.addView(hint, hintParams);

                      for (int i = 0; i + 1 < detailRows.length; i += 2) {
                          String label = detailRows[i];
                          String value = detailRows[i + 1];
                          boolean isLast = (i + 2 >= detailRows.length);
                          details.addView(transferRow(label, value), transferRowParams(isLast));
                      }
                  }

                  return new LinearLayout[]{ row, details };
              }

              /* One "label / value + copy button" row inside a transfer-details
                 panel — matches the Bankak/Fawry rows in checkout_page.html. */
              private LinearLayout transferRow(String label, String value) {
                  LinearLayout row = new LinearLayout(activity);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);
                  row.setGravity(Gravity.CENTER_VERTICAL);

                  LinearLayout textCol = new LinearLayout(activity);
                  textCol.setOrientation(LinearLayout.VERTICAL);
                  TextView labelView = new TextView(activity);
                  labelView.setText(label);
                  labelView.setTextSize(11);
                  labelView.setTextColor(WARM_GRAY);
                  textCol.addView(labelView);
                  TextView valueView = new TextView(activity);
                  valueView.setText(value);
                  valueView.setTextSize(14.5f);
                  valueView.setTypeface(sansBold);
                  valueView.setTextColor(OLIVE_DARK);
                  LinearLayout.LayoutParams valueParams = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  valueParams.topMargin = dp(2);
                  textCol.addView(valueView, valueParams);
                  LinearLayout.LayoutParams textColParams = new LinearLayout.LayoutParams(
                      0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f);
                  row.addView(textCol, textColParams);

                  TextView copyBtn = new TextView(activity);
                  copyBtn.setText("نسخ");
                  copyBtn.setTextSize(12.5f);
                  copyBtn.setTypeface(sansBold);
                  copyBtn.setTextColor(WHITE);
                  copyBtn.setGravity(Gravity.CENTER);
                  copyBtn.setPadding(dp(14), dp(8), dp(14), dp(8));
                  GradientDrawable copyBg = new GradientDrawable();
                  copyBg.setColor(OLIVE);
                  copyBg.setCornerRadius(dp(10));
                  copyBtn.setBackground(copyBg);
                  roundCorners(copyBtn, dp(10));
                  copyBtn.setOnClickListener(v -> copyToClipboard(value, copyBtn));
                  row.addView(copyBtn);

                  return row;
              }

              private LinearLayout.LayoutParams transferRowParams(boolean isLast) {
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  if (!isLast) p.bottomMargin = dp(10);
                  return p;
              }

              private void copyToClipboard(String value, TextView btn) {
                  ClipboardManager clipboard =
                      (ClipboardManager) activity.getSystemService(Context.CLIPBOARD_SERVICE);
                  if (clipboard != null) {
                      clipboard.setPrimaryClip(ClipData.newPlainText("ATEEM", value));
                  }
                  String original = btn.getText().toString();
                  btn.setText("تم النسخ");
                  btn.postDelayed(() -> btn.setText(original), 1600);
              }

              private void selectPayment(String method) {
                  selectedPayment = method;
                  boolean isBankak = "bankak".equals(method);
                  boolean isCod = "cod".equals(method);
                  boolean isFawry = "fawry".equals(method);

                  applyOptionState(bankakOption, bankakCheck, isBankak);
                  applyOptionState(codOption, codCheck, isCod);
                  applyOptionState(fawryOption, fawryCheck, isFawry);
                  bankakDetails.setVisibility(isBankak ? View.VISIBLE : View.GONE);
                  codDetails.setVisibility(View.GONE);
                  fawryDetails.setVisibility(isFawry ? View.VISIBLE : View.GONE);
              }

              private void applyOptionState(LinearLayout option, TextView check, boolean active) {
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(active ? Color.argb(18, 138, 154, 91) : IVORY_BG);
                  bg.setCornerRadius(dp(14));
                  bg.setStroke(dp(active ? 2 : 1), active ? OLIVE : Color.argb(40, 138, 154, 91));
                  option.setBackground(bg);

                  GradientDrawable checkBg = new GradientDrawable();
                  checkBg.setShape(GradientDrawable.OVAL);
                  checkBg.setColor(active ? OLIVE : SOFT_GRAY);
                  check.setBackground(checkBg);
                  check.setText(active ? "\u2713" : "");
              }

              private void resetPaymentSelection() {
                  selectedPayment = "bankak";
                  if (bankakOption != null) selectPayment("bankak");
              }

