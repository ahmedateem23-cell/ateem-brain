              public View build() {
                  FrameLayout root = new FrameLayout(activity);
                  root.setBackgroundColor(IVORY_BG);

                  LinearLayout page = new LinearLayout(activity);
                  page.setOrientation(LinearLayout.VERTICAL);

                  page.addView(buildHeaderRow());

                  NestedScrollView scroll = new NestedScrollView(activity);
                  scroll.setFillViewport(true);
                  LinearLayout.LayoutParams scrollParams = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f);
                  page.addView(scroll, scrollParams);

                  LinearLayout column = new LinearLayout(activity);
                  column.setOrientation(LinearLayout.VERTICAL);
                  column.setPadding(dp(20), dp(12), dp(20), dp(150));
                  scroll.addView(column, new ViewGroup.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));

                  column.addView(buildDeliveryCard(), cardParams());
                  column.addView(buildSummaryCard(), cardParams());
                  column.addView(buildPaymentCard(), cardParams());

                  root.addView(page, new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  root.addView(buildConfirmBar(), new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.BOTTOM));

                  successOverlay = buildSuccessOverlay();
                  successOverlay.setVisibility(View.GONE);
                  root.addView(successOverlay, new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  return root;
