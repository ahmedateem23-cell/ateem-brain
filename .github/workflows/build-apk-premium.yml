                      }
                  }
                  if (headerCount != null) {
                      String word = count == 1 ? "منتج" : "منتجات";
                      headerCount.setText(count + " " + word);
                  }

                  recalcTotals();
              }

              private void recalcTotals() {
                  double subtotal = 0;
                  for (CartItem item : ITEMS) subtotal += item.price * item.qty;
                  double discount = Math.round(subtotal * discountRate);
                  double total = ITEMS.isEmpty() ? 0 : subtotal + shippingCost - discount;
                  currentTotal = total;

                  subtotalValue.setText(formatPrice(subtotal) + " SDG");
                  shippingValue.setText(formatPrice(shippingCost) + " SDG");
                  if (discount > 0) {
                      discountRow.setVisibility(View.VISIBLE);
                      discountValue.setText("\u2212" + formatPrice(discount) + " SDG");
                  } else {
                      discountRow.setVisibility(View.GONE);
                  }
                  totalValue.setText(formatPrice(total) + " SDG");
                  checkoutTotalValue.setText(formatPrice(total) + " SDG");
              }

