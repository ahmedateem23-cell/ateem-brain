      # 7.5 Create chat-panel injection asset — Premium Quiet Luxury Edition
      - name: Create ATEEM context-flags + touch-polish assets
        run: |

          mkdir -p android/app/src/main/assets/inject

          cat > android/app/src/main/assets/inject/ateem_widget_inject.js << 'EOF'
          (function ATEEM_CONTEXT_FLAGS(){
            /* This ONLY sets the page-context flags the site's own ATEEM chat
               widget reads (window.ATEEM_SHOULD_SHOW / ATEEM_PAGE_TYPE /
               ATEEM_PRODUCT_SLUG). The chat widget itself already lives on
               ateem-store.com — we must never recreate it here, since a
               second copy with the same element ids (#ateem-panel,
               #ateem-header-chat, etc.) collides with the real one and is
               exactly why the bot broke. */
            var path = window.location.pathname.replace(/\/+$/, "");
            var isHome    = (path === "" || path === "/");
            var isProduct = /^\/shop\/[a-z0-9-]+$/i.test(path);
            window.ATEEM_SHOULD_SHOW = isHome || isProduct;
            window.ATEEM_PAGE_TYPE   = isHome ? "home" : (isProduct ? "product" : "other");
            if (isProduct) window.ATEEM_PRODUCT_SLUG = path.replace("/shop/", "");
          })();
          EOF

          cat > android/app/src/main/assets/inject/ateem_touch_polish.js << 'EOF'
          (function ATEEM_TOUCH_POLISH(){
            if (window.__ateemTouchPolishInjected) return;
            window.__ateemTouchPolishInjected = true;
            var style = document.createElement('style');
            style.id = 'ateem-touch-polish-style';
            /* Quiet touch feedback across the real site — removes the large
               default Android tap-highlight flash on section/category cards
               and links, without touching the site's own colors or the
               chat widget's markup in any way. */
            style.textContent = "html,body,a,button,[role='button']{-webkit-tap-highlight-color:transparent;}"
              + "a:active,button:active,[role='button']:active{opacity:.94;transform:scale(0.985);transition:transform .12s ease,opacity .12s ease;}";
            document.head.appendChild(style);
          })();
          EOF

      # 8. Sync Capacitor
      - name: Sync Capacitor
        run: npx cap sync android


      # 8.5 Add Glide dependency
      - name: Add Glide dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle")
          text = path.read_text()
          MARKER = "ATEEM_GLIDE_DEPENDENCY"
          if MARKER not in text:
              addition = """

          // """ + MARKER + """ - do not remove this marker comment

          dependencies {

              implementation 'com.github.bumptech.glide:glide:4.16.0'

              annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

              implementation 'androidx.core:core:1.12.0'
          }

          """
              text += addition
              path.write_text(text)
              print("Glide dependency appended.")
          else:
              print("Marker already present - skipping.")
          PY


      # 9. Restore release keystore
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/release.keystore


      # 10. Verify keystore
      - name: Verify keystore
        run: |
          test -s android/app/release.keystore
          ls -lh android/app/release.keystore
          file android/app/release.keystore


      # 11. Test release keystore
      - name: Test release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -list \
            -keystore android/app/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias ateemrelease


      # 12. Configure release signing
      - name: Configure release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle")
          text = path.read_text()
          MARKER = "ATEEM_RELEASE_SIGNING_CONFIG"
          if MARKER not in text:
              signing = """

          // """ + MARKER + """ - do not remove this marker comment

          android {

              signingConfigs {

                  ateemRelease {

                      storeFile file(
                          "release.keystore"
                      )

                      storePassword System.getenv(
                          "ATEEM_STORE_PASSWORD"
                      )

                      keyAlias System.getenv(
                          "ATEEM_KEY_ALIAS"
                      )

                      keyPassword System.getenv(
                          "ATEEM_KEY_PASSWORD"
                      )
                  }
              }


              buildTypes {

                  release {

                      signingConfig signingConfigs.ateemRelease

                      minifyEnabled false
                  }
              }
          }

          """
              text += signing
              path.write_text(text)
              print("Release signing config appended.")
          else:
              print("Marker already present - skipping.")
          print("---- build.gradle tail ----")
          print(path.read_text()[-1500:])
          PY


      # 13. Build release APK
      - name: Build release APK
        working-directory: android
        env:
          ATEEM_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ATEEM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ATEEM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Checking signing configuration..."
          test -n "$ATEEM_STORE_PASSWORD"
          test -n "$ATEEM_KEY_ALIAS"
          test -n "$ATEEM_KEY_PASSWORD"
          test -s app/release.keystore
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace


      # 13.5 List build outputs
      - name: List build outputs
        run: |
          echo "=== Searching for any APK files produced ==="
          find android/app/build/outputs -type f -name "*.apk" 2>/dev/null || true
          echo "=== Full outputs directory tree ==="
          find android/app/build/outputs -type f 2>/dev/null || echo "outputs directory does not exist or is empty"


      # 14. Upload APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ateem-store-apk-premium
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
