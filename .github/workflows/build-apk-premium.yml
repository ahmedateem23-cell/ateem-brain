          /* ═══ BOT MESSAGE — Glass Dark ═══ */
          #ateem-panel .ateem-bot-msg {
            background:linear-gradient(135deg, #1E1E28 0%, #181820 100%);
            color:var(--ateem-cream);
            padding:12px 16px; border-radius:20px 20px 20px 6px;
