name: Build ATEEM STORE APK — Premium Quiet Luxury Edition

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v4


      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18


      # 3. Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      # 4. Install dependencies
      - name: Install npm dependencies
        run: npm install


      # 5. Add Android
      - name: Add Android platform
        run: npx cap add android

      # 5.5 Ensure the keyboard resizes the window (not pans over it) so the
      # chat header always stays visible and the panel/input reflow above
      # the keyboard instead of being covered by it.
      - name: Ensure adjustResize for MainActivity
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if grep -q 'android:windowSoftInputMode' "$MANIFEST"; then
            echo "windowSoftInputMode already present — leaving as-is."
          else
            perl -0777 -pi -e 's/(android:name="\.MainActivity")/$1\n            android:windowSoftInputMode="adjustResize"/' "$MANIFEST"
          fi
          grep -n "windowSoftInputMode" "$MANIFEST"

      # 6. Generate app icon + splash (ivory background, standard system-sized icon)
      - name: Generate app icons and splash
        run: |
          npm install -D @capacitor/assets
          mkdir -p resources
          curl -L "https://i.ibb.co/XfcxMrhC/file-00000000333c824684f0dc4c0dc2955d.png" -o resources/source-logo.png

          # Auto-trim any transparent margin from the source so the logo
          # isn't double-cropped or left with big empty gaps once Android
          # composes it inside the icon/splash safe zone.
          sudo apt-get update -y && sudo apt-get install -y imagemagick
          convert resources/source-logo.png -trim +repage resources/source-logo-trimmed.png

          # This source has no background of its own, so the icon just needs
          # generous, even padding to sit small and centered inside the
          # rounded-square mask instead of crowding its edges. Border % was
          # tuned down from 32% to grow the mark ~12% versus the prior pass,
          # per the brand refinement request, while staying clear of the edge.
          convert resources/source-logo-trimmed.png -bordercolor none -border 23%x23% resources/icon.png

          # Splash gets even more breathing room so the mark floats calmly
          # in the middle of the screen.
          convert resources/source-logo-trimmed.png -bordercolor none -border 48%x48% resources/splash.png
          cp resources/splash.png resources/splash-dark.png

          npx capacitor-assets generate \
            --android \
            --iconBackgroundColor '#F5F1E8' \
            --iconBackgroundColorDark '#F5F1E8' \
            --splashBackgroundColor '#F5F1E8' \
            --splashBackgroundColorDark '#F5F1E8'

      # 6.5 Shrink the generated icon/splash PNGs losslessly so the new
      # source image doesn't bloat the APK across all density buckets.
      - name: Optimize generated icon and splash assets
        run: |
          sudo apt-get install -y optipng
          find android/app/src/main/res -iname '*.png' -print -exec optipng -o4 -quiet {} \;

      # 6.6 Animated splash — slow fade-in, gentle scale, one very soft gold
      # shimmer sweep, then a soft fade-out into MainActivity. No particles,
      # no flash, no fast motion, per the brand's "quiet" splash requirement.
      - name: Create animated SplashActivity
        run: |
          mkdir -p android/app/src/main/java/com/ateem/store

          cat > android/app/src/main/java/com/ateem/store/SplashActivity.java << 'EOF'
          package com.ateem.store;

          import android.animation.Animator;
          import android.animation.AnimatorListenerAdapter;
          import android.animation.AnimatorSet;
          import android.animation.ObjectAnimator;
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.View;
          import android.view.Window;
          import android.view.animation.DecelerateInterpolator;
          import android.widget.FrameLayout;
          import android.widget.ImageView;

          /*
           * ATEEM — Quiet Luxury splash.
           * Slow fade-in + gentle scale on the mark, one very soft gold
           * shimmer sweep, then a soft fade-out into MainActivity. Meant to
           * feel like a fashion house opening its doors, not a loading screen.
           */
          public class SplashActivity extends Activity {

              private final int IVORY_BG = Color.parseColor("#F5F1E8");
              private boolean launched = false;

              @SuppressLint("ResourceType")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  Window window = getWindow();
                  window.setStatusBarColor(IVORY_BG);
                  window.setNavigationBarColor(IVORY_BG);

                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(IVORY_BG);

                  int logoResId = getResources().getIdentifier("splash", "drawable", getPackageName());
                  if (logoResId == 0) {
                      logoResId = getResources().getIdentifier("ic_launcher_foreground", "mipmap", getPackageName());
                  }

                  ImageView logo = new ImageView(this);
                  logo.setScaleType(ImageView.ScaleType.FIT_CENTER);
                  if (logoResId != 0) logo.setImageResource(logoResId);
                  logo.setAlpha(0f);
                  logo.setScaleX(0.92f);
                  logo.setScaleY(0.92f);
                  root.addView(logo, new FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));

                  /* Very soft gold shimmer — a single thin diagonal sweep, not a glow */
                  View shimmer = new View(this);
                  GradientDrawable shimmerBg = new GradientDrawable(
                      GradientDrawable.Orientation.LEFT_RIGHT,
                      new int[] { Color.argb(0, 184, 147, 106), Color.argb(70, 184, 147, 106), Color.argb(0, 184, 147, 106) });
                  shimmer.setBackground(shimmerBg);
                  shimmer.setRotation(18f);
                  shimmer.setAlpha(0f);
                  int shimmerWidthPx = (int) (80 * getResources().getDisplayMetrics().density);
                  FrameLayout.LayoutParams shimmerParams = new FrameLayout.LayoutParams(
                      shimmerWidthPx, FrameLayout.LayoutParams.MATCH_PARENT);
                  shimmerParams.gravity = Gravity.CENTER;
                  shimmerParams.height = getResources().getDisplayMetrics().heightPixels * 2;
                  root.addView(shimmer, shimmerParams);

                  setContentView(root);
                  root.post(() -> runEntrance(root, logo, shimmer));
              }

              private void runEntrance(FrameLayout root, ImageView logo, View shimmer) {
                  ObjectAnimator fadeIn   = ObjectAnimator.ofFloat(logo, View.ALPHA, 0f, 1f);
                  ObjectAnimator scaleXIn = ObjectAnimator.ofFloat(logo, View.SCALE_X, 0.92f, 1f);
                  ObjectAnimator scaleYIn = ObjectAnimator.ofFloat(logo, View.SCALE_Y, 0.92f, 1f);
                  AnimatorSet entrance = new AnimatorSet();
                  entrance.playTogether(fadeIn, scaleXIn, scaleYIn);
                  entrance.setDuration(900);
                  entrance.setInterpolator(new DecelerateInterpolator());
                  entrance.addListener(new AnimatorListenerAdapter() {
                      @Override public void onAnimationEnd(Animator animation) { runShimmer(root, shimmer); }
                  });
                  entrance.start();
              }

              private void runShimmer(FrameLayout root, View shimmer) {
                  float screenWidth = getResources().getDisplayMetrics().widthPixels;
                  shimmer.setTranslationX(-screenWidth);
                  ObjectAnimator sweepIn  = ObjectAnimator.ofFloat(shimmer, View.ALPHA, 0f, 0.8f);
                  sweepIn.setDuration(120);
                  ObjectAnimator move     = ObjectAnimator.ofFloat(shimmer, View.TRANSLATION_X, -screenWidth, screenWidth);
                  move.setDuration(750);
                  ObjectAnimator sweepOut = ObjectAnimator.ofFloat(shimmer, View.ALPHA, 0.8f, 0f);
                  sweepOut.setStartDelay(550);
                  sweepOut.setDuration(200);
                  AnimatorSet shimmerSet = new AnimatorSet();
                  shimmerSet.playTogether(move, sweepIn, sweepOut);
                  shimmerSet.addListener(new AnimatorListenerAdapter() {
                      @Override public void onAnimationEnd(Animator animation) { holdThenExit(root); }
                  });
                  shimmerSet.start();
              }

              private void holdThenExit(FrameLayout root) {
                  new Handler(Looper.getMainLooper()).postDelayed(() -> fadeOutAndLaunch(root), 250);
              }

              private void fadeOutAndLaunch(FrameLayout root) {
                  ObjectAnimator fadeOut = ObjectAnimator.ofFloat(root, View.ALPHA, 1f, 0f);
                  fadeOut.setDuration(450);
                  fadeOut.addListener(new AnimatorListenerAdapter() {
                      @Override public void onAnimationEnd(Animator animation) { goToMain(); }
                  });
                  fadeOut.start();
              }

              private void goToMain() {
                  if (launched) return;
                  launched = true;
                  startActivity(new Intent(this, MainActivity.class));
                  overridePendingTransition(0, 0);
                  finish();
              }
          }
          EOF

      # 6.7 Rewire the launcher intent-filter from MainActivity to
      # SplashActivity, reusing whatever theme MainActivity already declares
      # so the splash inherits the app's existing launch styling.
      - name: Point the launcher at SplashActivity
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest_path.read_text()

          main_match = re.search(r'<activity\s+android:name="\.MainActivity"[^>]*>.*?</activity>', text, re.DOTALL)
          if not main_match:
              raise SystemExit("MainActivity block not found in AndroidManifest.xml")
          main_block = main_match.group(0)

          if 'SplashActivity' in text:
              print("SplashActivity already wired - skipping.")
          else:
              intent_filter_match = re.search(r'<intent-filter>.*?</intent-filter>', main_block, re.DOTALL)
              intent_filter = intent_filter_match.group(0) if intent_filter_match else ""
              if not intent_filter:
                  raise SystemExit("No launcher intent-filter found on MainActivity")

              theme_match = re.search(r'android:theme="([^"]+)"', main_block)
              theme_attr = ' android:theme="%s"' % theme_match.group(1) if theme_match else ""

              new_main_block = main_block.replace(intent_filter, "")

              splash_block = (
                  '<activity\n'
                  '            android:name=".SplashActivity"\n'
                  '            android:exported="true"\n'
                  '            android:launchMode="singleTask"' + theme_attr + '>\n'
                  '            ' + intent_filter + '\n'
                  '        </activity>\n\n        '
              )

              text = text.replace(main_block, splash_block + new_main_block)
              manifest_path.write_text(text)
              print("SplashActivity is now the launcher entry point.")

          print("---- AndroidManifest.xml (activities) ----")
          for line in text.splitlines():
              if 'activity' in line or 'intent-filter' in line or 'action' in line or 'category' in line:
                  print(line)
          PY

      # 7. Create Native Android shell (Premium Quiet Luxury Design)
      - name: Create native Android shell
        run: |

          mkdir -p android/app/src/main/java/com/ateem/store
          mkdir -p android/app/src/main/res/drawable

          # ==========================================
          # MainActivity.java — Premium Quiet Luxury
          # ==========================================

          cat > android/app/src/main/java/com/ateem/store/MainActivity.java << 'EOF'
          package com.ateem.store;

          import android.annotation.SuppressLint;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewTreeObserver;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.WebView;
          import android.widget.FrameLayout;

          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebViewClient;

          import java.io.BufferedReader;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.nio.charset.StandardCharsets;

          /*
           * ATEEM STORE — Premium Quiet Luxury Edition
           * هوية بصرية هادئة: عاجي دافئ + رمادي دافئ + زيتوني أنيق
           * تصميم بسيط وراقٍ بدون تأثيرات مبالغ فيها
           */

          public class MainActivity
              extends BridgeActivity
              implements NativeNavigation.OnNavTargetListener {

              private NativeNavigation nativeNavigation;
              private NativeHomeScreen nativeHomeScreen;
              private View nativeHomeScreenView;
              private NativeChatOverlay nativeChatOverlay;
              private WebView webView;
              private String ateemContextFlagsJs;
              private String ateemTouchPolishJs;
              private boolean pendingRevealWebView = false;

              /* Quiet Luxury Palette */
              private final int IVORY_BG    = Color.parseColor("#F5F1E8");
              private final int CHARCOAL    = Color.parseColor("#3D3B36");

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  /* Full screen immersive */
                  Window window = getWindow();
                  window.addFlags(WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS);
                  window.setStatusBarColor(Color.TRANSPARENT);
                  window.setNavigationBarColor(IVORY_BG);
                  hideSystemUI();

                  /* WebView setup */
                  webView = getBridge().getWebView();
                  if (webView != null) {
                      webView.setBackgroundColor(IVORY_BG);
                      webView.getSettings().setJavaScriptEnabled(true);
                      webView.setVisibility(View.GONE);

                      ateemContextFlagsJs = loadAsset("inject/ateem_widget_inject.js");
                      ateemTouchPolishJs  = loadAsset("inject/ateem_touch_polish.js");
                      webView.setWebViewClient(new BridgeWebViewClient(getBridge()) {
                          @Override
                          public void onPageStarted(WebView view, String url, android.graphics.Bitmap favicon) {
                              super.onPageStarted(view, url, favicon);
                              /* Must run BEFORE the page's own inline script reads
                                 window.ATEEM_SHOULD_SHOW, or the site's real chat
                                 widget hides itself permanently for that page. */
                              injectAteemContextFlags(view);
                          }

                          @Override
                          public void onPageFinished(WebView view, String url) {
                              super.onPageFinished(view, url);
                              injectAteemContextFlags(view);
                              injectAteemTouchPolish(view);
                              revealWebViewIfPending();
                          }
                      });
                  }

                  /* Bottom Navigation — Quiet Floating Bar */
                  nativeNavigation = new NativeNavigation(this, webView);
                  nativeNavigation.setOnNavTargetListener(this);
                  nativeNavigation.attach();

                  /* Native Home Screen — Premium Quiet */
                  nativeHomeScreen = new NativeHomeScreen(
                      this,
                      this::onAteemChatButtonClick,
                      this::onCategoryOrFooterLinkClick
                  );
                  nativeHomeScreenView = nativeHomeScreen.build();

                  FrameLayout root = nativeNavigation.getRootContainer();
                  if (root != null) {
                      FrameLayout.LayoutParams homeParams = new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                      );
                      root.addView(nativeHomeScreenView, homeParams);
                      nativeHomeScreenView.bringToFront();

                      View navView = nativeNavigation.getNavBarView();
                      if (navView != null) navView.bringToFront();

                      /* ATEEM Chat — fully in-app, loaded from a local asset.
                         Sits above everything (including the bottom nav bar)
                         so it opens the same way no matter what screen is
                         behind it. */
                      nativeChatOverlay = new NativeChatOverlay(this);
                      View chatOverlayView = nativeChatOverlay.build();
                      root.addView(chatOverlayView, homeParams);
                      chatOverlayView.bringToFront();
                  }

                  linkWebViewInsets();
              }

              private void linkWebViewInsets() {
                  final FrameLayout root = nativeNavigation.getRootContainer();
                  if (root == null) return;

                  root.getViewTreeObserver().addOnGlobalLayoutListener(
                      new ViewTreeObserver.OnGlobalLayoutListener() {
                          @Override
                          public void onGlobalLayout() {
                              View navView = nativeNavigation.getNavBarView();
                              if (navView == null || navView.getHeight() == 0) return;
                              root.getViewTreeObserver().removeOnGlobalLayoutListener(this);

                              int bottomInset = navView.getHeight() + nativeNavigation.getNavBottomMargin();
                              nativeNavigation.setWebViewInsets(0, bottomInset);

                              if (nativeChatOverlay != null) {
                                  nativeChatOverlay.setBottomInset(bottomInset);
                              }

                              if (nativeHomeScreenView != null) {
                                  nativeHomeScreenView.setPadding(0, 0, 0, bottomInset);
                              }
                          }
                      }
                  );
              }

              public NativeNavigation getNativeNavigation() { return nativeNavigation; }

              @Override
              public void onHomeSelected() { showNativeHome(); }

              @Override
              public void onWebPathSelected(String path, int index) { showWebView(path); }

              private void showNativeHome() {
                  if (webView != null) webView.setVisibility(View.GONE);
                  if (nativeHomeScreenView != null) nativeHomeScreenView.setVisibility(View.VISIBLE);
              }

              private void showWebView(String path) {
                  pendingRevealWebView = true;
                  nativeNavigation.loadWebUrl(path);
              }

              private void onAteemChatButtonClick() {
                  /* Fully in-app now — no WebView navigation, no dependency
                     on any page having loaded. Just toggle the local
                     overlay, which is always ready. */
                  if (nativeChatOverlay == null) return;
                  if (nativeChatOverlay.isVisible()) {
                      nativeChatOverlay.hide();
                  } else {
                      nativeChatOverlay.show();
                  }
              }

              @Override
              public void onBackPressed() {
                  if (nativeChatOverlay != null && nativeChatOverlay.isVisible()) {
                      nativeChatOverlay.hide();
                      return;
                  }
                  super.onBackPressed();
              }

              private void onCategoryOrFooterLinkClick(String path) {
                  pendingRevealWebView = true;
                  nativeNavigation.openWebPath(path, 1);
              }

              private void revealWebViewIfPending() {
                  if (!pendingRevealWebView) return;
                  pendingRevealWebView = false;
                  if (nativeHomeScreenView != null) nativeHomeScreenView.setVisibility(View.GONE);
                  if (webView != null) webView.setVisibility(View.VISIBLE);
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemUI();
              }

              private void hideSystemUI() {
                  View decorView = getWindow().getDecorView();
                  decorView.setSystemUiVisibility(
                        View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                  );
              }

              private void injectAteemContextFlags(WebView view) {
                  if (view == null || ateemContextFlagsJs == null || ateemContextFlagsJs.isEmpty()) return;
                  view.evaluateJavascript(ateemContextFlagsJs, null);
              }

              private void injectAteemTouchPolish(WebView view) {
                  if (view == null || ateemTouchPolishJs == null || ateemTouchPolishJs.isEmpty()) return;
                  view.evaluateJavascript(ateemTouchPolishJs, null);
              }

              private String loadAsset(String path) {
                  StringBuilder builder = new StringBuilder();
                  try (
                      InputStream is = getAssets().open(path);
                      BufferedReader reader = new BufferedReader(
                          new InputStreamReader(is, StandardCharsets.UTF_8)
                      )
                  ) {
                      String line;
                      while ((line = reader.readLine()) != null) {
                          builder.append(line).append('\n');
                      }
                  } catch (IOException e) { e.printStackTrace(); }
                  return builder.toString();
              }
          }
          EOF

          # ==========================================
          # NativeHeader.java — Premium Minimal Header
          # ==========================================

          cat > android/app/src/main/java/com/ateem/store/NativeHeader.java << 'EOF'
          package com.ateem.store;

          import android.app.Activity;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.graphics.drawable.RippleDrawable;
          import android.content.res.ColorStateList;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import com.bumptech.glide.Glide;
          import com.bumptech.glide.load.engine.DiskCacheStrategy;
          import com.bumptech.glide.load.resource.bitmap.CircleCrop;

          public class NativeHeader {

              /* Bot avatar — used for the header chat button */
              private static final String BOT_AVATAR_URL =
                  "https://i.ibb.co/F4vhYp7Y/file-00000000b6f081f490aa2899443132bd.png";

              public interface OnChatClickListener {
                  void onChatClick();
              }

              private final Activity activity;
              private final OnChatClickListener chatClickListener;
              private View headerRow;

              /* Quiet Luxury Palette — Ivory / Olive / Gold */
              private final int IVORY_BG    = Color.parseColor("#F5F1E8");
              private final int WARM_WHITE  = Color.parseColor("#FEFCF8");
              private final int CHARCOAL    = Color.parseColor("#3D3B36");
              private final int WARM_GRAY   = Color.parseColor("#8A8680");
              private final int OLIVE       = Color.parseColor("#8A9A5B");
              private final int OLIVE_DEEP  = Color.parseColor("#6B7A45");
              private final int GOLD        = Color.parseColor("#B8936A");
              private final int OLIVE_MUTED = Color.parseColor("#E8EBE0");
              private final int DIVIDER     = Color.parseColor("#E8E4DC");

              private Typeface logoTypeface;
              private Typeface labelTypeface;

              public NativeHeader(Activity activity, OnChatClickListener chatClickListener) {
                  this.activity = activity;
                  this.chatClickListener = chatClickListener;
                  this.logoTypeface = Typeface.create("sans-serif-light", Typeface.BOLD);
                  this.labelTypeface = Typeface.create("sans-serif-medium", Typeface.NORMAL);
              }

              public View getHeaderView() { return headerRow; }

              public void attachTo(FrameLayout container) {
                  if (container == null) return;
                  LinearLayout headerLayout = new LinearLayout(activity);
                  headerLayout.setOrientation(LinearLayout.HORIZONTAL);
                  headerLayout.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);
                  headerLayout.setGravity(Gravity.CENTER_VERTICAL);
                  headerLayout.setPadding(dp(20), dp(14), dp(20), dp(10));

                  /* Subtle warm background */
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(Color.argb(245, 254, 252, 248));
                  headerLayout.setBackground(bg);

                  View brand = buildBrand();
                  LinearLayout.LayoutParams brandParams = new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f);
                  headerLayout.addView(brand, brandParams);

                  View actions = buildActions();
                  headerLayout.addView(actions, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT));

                  headerRow = headerLayout;

                  FrameLayout.LayoutParams headerParams = new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.TOP);
                  container.addView(headerRow, headerParams);
                  headerRow.bringToFront();
              }

              public View buildStandalone() {
                  FrameLayout headerFrame = new FrameLayout(activity);
                  headerRow = headerFrame;
                  headerFrame.setPadding(dp(20), dp(12), dp(8), dp(10));

                  /* Clean ivory background */
                  GradientDrawable headerBg = new GradientDrawable();
                  headerBg.setColor(IVORY_BG);
                  headerFrame.setBackground(headerBg);

                  /* Subtle bottom divider */
                  View divider = new View(activity);
                  GradientDrawable divBg = new GradientDrawable();
                  divBg.setColor(DIVIDER);
                  divider.setBackground(divBg);
                  FrameLayout.LayoutParams divParams = new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, dp(1), Gravity.BOTTOM);
                  headerFrame.addView(divider, divParams);

                  View actions = buildActions();
                  FrameLayout.LayoutParams actionsParams = new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT,
                      Gravity.LEFT | Gravity.CENTER_VERTICAL);
                  headerFrame.addView(actions, actionsParams);

                  View brand = buildBrand();
                  FrameLayout.LayoutParams brandParams = new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT,
                      Gravity.RIGHT | Gravity.CENTER_VERTICAL);
                  brandParams.rightMargin = dp(14); // nudge left, clear of the screen edge
                  headerFrame.addView(brand, brandParams);

                  return headerFrame;
              }

              /* Main header brand mark — the app logo image, replacing the
                 old plain "ATEEM" text lockup. Same source as the app icon
                 and splash screen so the mark reads as one consistent logo
                 everywhere in the app. */
              private static final String BRAND_LOGO_URL =
                  "https://i.ibb.co/XfcxMrhC/file-00000000333c824684f0dc4c0dc2955d.png";

              private View buildBrand() {
                  LinearLayout wrap = new LinearLayout(activity);
                  wrap.setOrientation(LinearLayout.VERTICAL);
                  wrap.setGravity(Gravity.RIGHT);

                  ImageView logo = new ImageView(activity);
                  logo.setScaleType(ImageView.ScaleType.FIT_END);
                  logo.setAdjustViewBounds(true);
                  Glide.with(activity)
                      .load(BRAND_LOGO_URL)
                      .diskCacheStrategy(DiskCacheStrategy.ALL)
                      .into(logo);
                  LinearLayout.LayoutParams logoParams = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, dp(40));
                  wrap.addView(logo, logoParams);

                  return wrap;
              }

              private View buildActions() {
                  LinearLayout row = new LinearLayout(activity);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.CENTER_VERTICAL);
                  row.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);

                  /* SHOP label — quiet and refined */
                  TextView shop = new TextView(activity);
                  shop.setText("SHOP");
                  shop.setTextSize(11);
                  shop.setTextColor(WARM_GRAY);
                  shop.setTypeface(labelTypeface);
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.LOLLIPOP) {
                      shop.setLetterSpacing(0.15f);
                  }
                  LinearLayout.LayoutParams shopParams = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  shopParams.leftMargin = dp(14);
                  shop.setPadding(dp(6), dp(6), dp(6), dp(6));
                  row.addView(shop, shopParams);

                  shop.setOnClickListener(v -> {
                      if (activity instanceof MainActivity) {
                          ((MainActivity) activity).getNativeNavigation().navigateToPath("/shop");
                      }
                  });

                  /* Chat Button — Bot Avatar on Deep Olive (matches website identity) */
                  FrameLayout chatBtn = new FrameLayout(activity);
                  GradientDrawable chatBg = new GradientDrawable();
                  chatBg.setShape(GradientDrawable.OVAL);
                  chatBg.setColor(OLIVE_DEEP);
                  chatBg.setStroke(dp(1), Color.argb(38, 184, 147, 106)); // faint gold ring, like the web version

                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.LOLLIPOP) {
                      RippleDrawable ripple = new RippleDrawable(
                          ColorStateList.valueOf(Color.argb(40, 184, 147, 106)), chatBg, null);
                      chatBtn.setBackground(ripple);
                  } else {
                      chatBtn.setBackground(chatBg);
                  }

                  chatBtn.setElevation(dp(3));

                  ImageView chatIcon = new ImageView(activity);
                  chatIcon.setScaleType(ImageView.ScaleType.CENTER_CROP);
                  Glide.with(activity)
                      .load(BOT_AVATAR_URL)
                      .transform(new CircleCrop())
                      .into(chatIcon);
                  FrameLayout.LayoutParams iconParams = new FrameLayout.LayoutParams(dp(46), dp(46), Gravity.CENTER);
                  chatBtn.addView(chatIcon, iconParams);

                  LinearLayout.LayoutParams chatBtnParams = new LinearLayout.LayoutParams(dp(46), dp(46));
                  row.addView(chatBtn, chatBtnParams);

                  chatBtn.setOnClickListener(v -> {
                      if (chatClickListener != null) chatClickListener.onChatClick();
                  });

                  /* Tactile press feedback — a quick scale-down on touch-down,
                     springing back on release, layered on top of the ripple
                     so the button visibly "reacts" the instant it's tapped. */
                  chatBtn.setOnTouchListener((v, event) -> {
                      switch (event.getAction()) {
                          case MotionEvent.ACTION_DOWN:
                              v.animate().scaleX(0.90f).scaleY(0.90f).setDuration(120).start();
                              break;
                          case MotionEvent.ACTION_UP:
                          case MotionEvent.ACTION_CANCEL:
                              v.animate().scaleX(1f).scaleY(1f).setDuration(180)
                                  .setInterpolator(new android.view.animation.OvershootInterpolator(3f))
                                  .start();
                              break;
                      }
                      return false; // let the click listener + ripple still fire normally
                  });

                  return row;
              }

              private int dp(int value) {
                  float density = activity.getResources().getDisplayMetrics().density;
                  return (int)(value * density + 0.5f);
              }
          }
