              /* ============== DYNAMIC OPTION GROUPS ==============
                 One chip row per real attribute the product has in Odoo.
                 A product with zero attributes renders nothing here; a
                 group with a single possible value renders as a read-only
                 chip (no pointless picker) and is auto-selected so the
                 rest of the logic (price/stock/validation) still works. */
              private void renderOptions() {
                  optionsContainer.removeAllViews();
                  optionRowsByGroup.clear();
                  optionButtonsByGroup.clear();

                  for (OptionGroup group : optionGroups) {
                      LinearLayout col = new LinearLayout(activity);
                      col.setOrientation(LinearLayout.VERTICAL);
                      col.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);
                      LinearLayout.LayoutParams colParams = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
