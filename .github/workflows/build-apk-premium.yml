              /* ============== DATA + GRID ============== */
              private void loadProducts() {
                  executor.execute(() -> {
                      try {
                          URL url = new URL(PRODUCTS_URL);
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("GET");
                          conn.setConnectTimeout(15000);
                          conn.setReadTimeout(15000);
                          int code = conn.getResponseCode();
                          InputStream stream = code >= 200 && code < 300
                              ? conn.getInputStream() : conn.getErrorStream();
                          StringBuilder builder = new StringBuilder();
                          try (BufferedReader reader = new BufferedReader(
                                  new InputStreamReader(stream, StandardCharsets.UTF_8))) {
                              String line;
                              while ((line = reader.readLine()) != null) builder.append(line);
                          }
                          JSONObject rootObj = new JSONObject(builder.toString());
                          if (!rootObj.optBoolean("ok", false)) {
                              postError("تعذّر تحميل المنتجات حالياً، حاول لاحقاً.");
                              return;
                          }
                          JSONArray arr = rootObj.optJSONArray("products");
                          List<Product> products = new ArrayList<>();
                          if (arr != null) {
                              for (int i = 0; i < arr.length(); i++) {
                                  JSONObject o = arr.getJSONObject(i);
                                  Product p = new Product();
                                  p.id = o.optInt("id");
                                  p.name = o.optString("name");
                                  p.price = o.optDouble("price", 0);
                                  p.image = o.optString("image");
                                  p.description = o.optString("description");
                                  p.category = extractCategory(o.opt("category"));
                                  products.add(p);
                              }
                          }
                          postProducts(products);
                      } catch (Exception e) {
                          postError("تعذّر الاتصال بالمتجر، تحقق من الإنترنت وحاول مرة أخرى.");
                      }
                  });
              }
          
              /* Odoo many2one fields (like a product's category) commonly arrive over
                 JSON-RPC as a [id, "Name"] tuple, or as the boolean false when unset —
                 never a plain string. Reading it with optString() silently fails in
                 both cases, which is the most common reason a category "disappears"
                 even though it's set correctly in Odoo. This handles all the shapes
                 the /odoo-products response can actually send. */
              private String extractCategory(Object raw) {
                  if (raw == null || raw == JSONObject.NULL) return "";
                  if (raw instanceof Boolean) return ""; // Odoo sends false when empty
                  if (raw instanceof JSONArray) {
                      JSONArray arr = (JSONArray) raw;
                      if (arr.length() >= 2) {
                          Object name = arr.opt(1);
                          return name != null ? String.valueOf(name).trim() : "";
                      }
                      return "";
                  }
                  return String.valueOf(raw).trim();
              }
          
              private void postError(String message) {
                  mainHandler.post(() -> {
                      loadingSpinner.setVisibility(View.GONE);
                      statusLabel.setText(message);
                      statusLabel.setVisibility(View.VISIBLE);
                  });
              }
          
              private void postProducts(List<Product> products) {
                  mainHandler.post(() -> {
                      loadingSpinner.setVisibility(View.GONE);
                      allProducts = products;
                      refreshCategoryList();
                      if (products.isEmpty()) {
                          statusLabel.setText("لا توجد منتجات متاحة حالياً.");
                          statusLabel.setVisibility(View.VISIBLE);
                          return;
                      }
                      applyDisplay();
                  });
              }
          
              private void filterProducts(String key) {
                  activeCategory = key;
                  refreshCategoryList();
                  applyDisplay();
              }
          
              /* Called from the home screen's search bar (via MainActivity)
                 once the user submits a search. An empty string clears the
                 search and shows the active category normally again. */
              public void setSearchQuery(String query) {
                  this.searchQuery = query == null ? "" : query.trim();
                  applyDisplay();
              }
          
              /* Applies the active category filter, the active search query,
                 and the active sort ("ترتيب حسب") together, then renders the
                 grid. Called whenever any of the three changes. */
              private void applyDisplay() {
                  List<Product> base;
                  if (activeCategory.equals("all")) {
                      base = new ArrayList<>(allProducts);
                  } else {
                      base = new ArrayList<>();
                      for (Product p : allProducts) {
                          if (activeCategory.equals(p.category)) base.add(p);
                      }
                  }
                  if (!searchQuery.isEmpty()) {
                      String needle = searchQuery.toLowerCase(Locale.ROOT);
                      List<Product> matched = new ArrayList<>();
                      for (Product p : base) {
                          String name = p.name == null ? "" : p.name.toLowerCase(Locale.ROOT);
                          String desc = p.description == null ? "" : p.description.toLowerCase(Locale.ROOT);
                          if (name.contains(needle) || desc.contains(needle)) matched.add(p);
                      }
                      base = matched;
                  }
                  renderGrid(sortProducts(base));
              }
          
              /* "الأحدث"/"الأقدم" use the product id as a recency proxy (Odoo IDs
                 increase with creation order, and no created-date field is
                 returned by the products endpoint); the price sorts are exact. */
              private List<Product> sortProducts(List<Product> products) {
                  List<Product> sorted = new ArrayList<>(products);
                  switch (activeSort) {
                      case "oldest":
                          Collections.sort(sorted, (a, b) -> Integer.compare(a.id, b.id));
                          break;
                      case "price_high":
                          Collections.sort(sorted, (a, b) -> Double.compare(b.price, a.price));
                          break;
                      case "price_low":
                          Collections.sort(sorted, (a, b) -> Double.compare(a.price, b.price));
                          break;
                      case "newest":
                      default:
                          Collections.sort(sorted, (a, b) -> Integer.compare(b.id, a.id));
                          break;
                  }
                  return sorted;
              }
          
              private void renderGrid(List<Product> products) {
                  if (gridColumn == null) return;
                  gridColumn.removeAllViews();
                  pendingFadeUpViews.clear();
                  if (products.isEmpty()) {
                      statusLabel.setText("لا توجد منتجات في هذه الفئة حالياً.");
                      statusLabel.setVisibility(View.VISIBLE);
                      return;
                  }
                  statusLabel.setVisibility(View.GONE);
                  for (int i = 0; i < products.size(); i += 2) {
                      LinearLayout row = new LinearLayout(activity);
                      row.setOrientation(LinearLayout.HORIZONTAL);
                      row.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);
                      row.setClipChildren(false);
                      row.setClipToPadding(false);
                      row.setPadding(0, dp(7), 0, dp(7));
                      addProductCard(row, products.get(i));
                      if (i + 1 < products.size()) {
                          addProductCard(row, products.get(i + 1));
                      } else {
                          View spacer = new View(activity);
                          row.addView(spacer, new LinearLayout.LayoutParams(0, 0, 1f));
                      }
                      gridColumn.addView(row, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));
                  }
                  /* Root-cause fix for the "products only appear after scroll/touch"
                     bug: a single gridColumn.post() here used to be the only
                     trigger for revealing these fade-up cards. If this screen is
                     still View.GONE at that moment — which happens whenever the
                     product fetch finishes in the background before the user has
                     opened the Shop tab — the cards have width==0/height==0, so
                     checkFadeUpViews() skips every one of them. Nothing but the
                     scroll listener ever called it again, so the cards stayed
                     invisible until the user scrolled or touched the screen.
                     Fix: keep re-checking on every subsequent layout pass (which
                     fires again once the screen actually becomes VISIBLE and is
                     measured for real) until every pending card has been
                     revealed, then detach. No scroll, touch, or simulated
                     interaction involved. */
                  scheduleFadeUpRecheck();
              }
          
              /* Keeps retrying the fade-up reveal across layout passes until every
                 pending card has real dimensions and has been revealed. Self-removes
                 once there is nothing left to check. */
              private void scheduleFadeUpRecheck() {
                  if (gridColumn == null || pendingFadeUpViews.isEmpty()) return;
                  gridColumn.getViewTreeObserver().addOnGlobalLayoutListener(
                      new ViewTreeObserver.OnGlobalLayoutListener() {
                          @Override
                          public void onGlobalLayout() {
                              checkFadeUpViews();
                              if (pendingFadeUpViews.isEmpty() && gridColumn != null) {
                                  gridColumn.getViewTreeObserver().removeOnGlobalLayoutListener(this);
                              }
                          }
                      }
                  );
                  // Also check immediately in case layout already happened.
                  gridColumn.post(this::checkFadeUpViews);
              }
          
              /* ============== SCROLL FADE-UP ANIMATION ==============
                 Native equivalent of the @keyframes fadeUp effect from
                 premium_store.html: cards start invisible and shifted down, then
                 animate to alpha 1 / translationY 0 the moment they enter the
                 visible scroll viewport. Each card animates once. */
              private void checkFadeUpViews() {
                  if (pendingFadeUpViews.isEmpty() || scrollView == null) return;
                  int[] scrollLoc = new int[2];
                  scrollView.getLocationOnScreen(scrollLoc);
                  int viewportTop = scrollLoc[1];
                  int viewportBottom = viewportTop + scrollView.getHeight();
                  // Reveal slightly before the card is fully on screen, like an
                  // IntersectionObserver rootMargin, so the motion feels proactive
                  // rather than lagging behind the finger.
                  int revealMargin = dp(60);
          
                  List<View> ready = null;
                  for (View v : pendingFadeUpViews) {
                      if (v.getWidth() == 0 || v.getHeight() == 0) continue; // not laid out yet
                      int[] loc = new int[2];
                      v.getLocationOnScreen(loc);
                      int viewTop = loc[1];
                      boolean intersects = viewTop < viewportBottom + revealMargin
                          && viewTop + v.getHeight() > viewportTop - revealMargin;
                      if (intersects) {
                          if (ready == null) ready = new ArrayList<>();
                          ready.add(v);
                      }
                  }
                  if (ready != null) {
                      pendingFadeUpViews.removeAll(ready);
                      for (View v : ready) playFadeUp(v);
                  }
              }
          
              private void playFadeUp(View v) {
                  v.animate()
                      .alpha(1f)
                      .translationY(0f)
                      .setDuration(450)
                      .setInterpolator(new DecelerateInterpolator())
                      .setListener(null)
                      .start();
              }
          
              private void addProductCard(LinearLayout parentRow, Product product) {
                  FrameLayout cardWrap = new FrameLayout(activity);
                  LinearLayout.LayoutParams wrapParams = new LinearLayout.LayoutParams(
                      0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f);
                  wrapParams.leftMargin = dp(4); wrapParams.rightMargin = dp(4);
                  cardWrap.setLayoutParams(wrapParams);
          
                  LinearLayout card = new LinearLayout(activity);
                  card.setOrientation(LinearLayout.VERTICAL);
                  GradientDrawable cardBg = new GradientDrawable();
                  cardBg.setColor(WHITE);
                  cardBg.setCornerRadius(dp(20));
                  card.setBackground(cardBg);
                  card.setElevation(dp(2));
                  roundCorners(card, dp(20));
          
                  AspectFrameLayout imageBox = new AspectFrameLayout(activity, 1f / 1.05f);
                  GradientDrawable imgBg = new GradientDrawable();
                  imgBg.setColor(WARM_WHITE);
                  imageBox.setBackground(imgBg);
          
                  ImageView img = new ImageView(activity);
                  img.setScaleType(ImageView.ScaleType.CENTER_CROP);
                  Glide.with(activity).load(product.image)
                      .diskCacheStrategy(DiskCacheStrategy.ALL).centerCrop().into(img);
                  imageBox.addView(img, new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
          
                  card.addView(imageBox, new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));
          
                  LinearLayout info = new LinearLayout(activity);
                  info.setOrientation(LinearLayout.VERTICAL);
                  info.setPadding(dp(14), dp(12), dp(14), dp(14));
          
                  TextView name = new TextView(activity);
                  name.setText(product.name);
                  name.setTextSize(12.5f);
                  name.setTypeface(sansMedium);
                  name.setTextColor(CHARCOAL);
                  name.setMaxLines(1);
                  name.setEllipsize(android.text.TextUtils.TruncateAt.END);
                  info.addView(name);
          
                  LinearLayout priceRow = new LinearLayout(activity);
                  priceRow.setOrientation(LinearLayout.HORIZONTAL);
                  priceRow.setGravity(Gravity.CENTER_VERTICAL);
                  LinearLayout.LayoutParams priceRowParams = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  priceRowParams.topMargin = dp(4);
          
                  TextView price = new TextView(activity);
                  price.setText(formatPrice(product.price));
                  price.setTextSize(14);
                  price.setTypeface(sansBold);
                  price.setTextColor(OLIVE);
                  priceRow.addView(price);
          
                  TextView currency = new TextView(activity);
                  currency.setText(" SDG");
                  currency.setTextSize(10.5f);
                  currency.setTextColor(WARM_GRAY);
                  priceRow.addView(currency);
          
                  info.addView(priceRow, priceRowParams);
                  card.addView(info, new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));
          
                  cardWrap.addView(card, new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));
                  cardWrap.setClipChildren(false);
                  cardWrap.setClipToPadding(false);
          
                  cardWrap.setOnClickListener(v -> {
                      if (clickListener != null) {
                          clickListener.onProductClick(
                              product.id, product.name, product.price, product.image, product.description);
                      }
                  });
          
                  /* Touch "float" feedback — the card lifts a little and its shadow
                     deepens on press, then settles back smoothly on release. */
                  cardWrap.setOnTouchListener((v, event) -> {
                      switch (event.getAction()) {
                          case MotionEvent.ACTION_DOWN:
                              card.animate()
                                  .translationY(-dp(5))
                                  .translationZ(dp(8))
                                  .setDuration(150)
                                  .setInterpolator(new DecelerateInterpolator())
                                  .start();
                              break;
                          case MotionEvent.ACTION_UP:
                          case MotionEvent.ACTION_CANCEL:
                              card.animate()
                                  .translationY(0f)
                                  .translationZ(0f)
                                  .setDuration(220)
                                  .setInterpolator(new OvershootInterpolator(2f))
                                  .start();
                              break;
                      }
                      return false; // let the click listener still fire
                  });
          
                  /* Fade-up entrance state — matches premium_store.html's
                     @keyframes fadeUp (opacity 0 -> 1, translateY 20px -> 0).
                     checkFadeUpViews() animates this in once the card scrolls
                     into the viewport. */
                  cardWrap.setAlpha(0f);
                  cardWrap.setTranslationY(dp(28));
                  pendingFadeUpViews.add(cardWrap);
          
                  parentRow.addView(cardWrap);
              }
          
              private String formatPrice(double price) {
                  DecimalFormat formatter = new DecimalFormat("#,###",
                      new java.text.DecimalFormatSymbols(Locale.US));
                  return formatter.format(price);
              }
          
              /* ============== HELPERS ============== */
              private void roundCorners(View view, int radiusPx) {
                  view.setClipToOutline(true);
                  view.setOutlineProvider(new ViewOutlineProvider() {
                      @Override
                      public void getOutline(View v, Outline outline) {
                          outline.setRoundRect(0, 0, v.getWidth(), v.getHeight(), radiusPx);
                      }
                  });
              }
          
              private int dp(int value) {
                  float density = activity.getResources().getDisplayMetrics().density;
                  return (int)(value * density + 0.5f);
              }
          
              private static class AspectFrameLayout extends FrameLayout {
                  private final float ratio;
                  AspectFrameLayout(Context context, float ratio) {
                      super(context);
                      this.ratio = ratio;
                  }
                  @Override
                  protected void onMeasure(int widthMeasureSpec, int heightMeasureSpec) {
                      int width = android.view.View.MeasureSpec.getSize(widthMeasureSpec);
                      int height = (int)(width / ratio);
                      super.onMeasure(widthMeasureSpec,
                          android.view.View.MeasureSpec.makeMeasureSpec(height, android.view.View.MeasureSpec.EXACTLY));
                  }
              }
          }
