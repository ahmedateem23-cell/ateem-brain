            if (pageType === "product" && window.ATEEM_PRODUCT_SLUG) {
              const current = ATEEM_PRODUCTS.find(p => p.id === window.ATEEM_PRODUCT_SLUG);
              if (current) pageContext = `\nملاحظة: العميل يتصفح الآن صفحة منتج "${current.name}". ركّز على هذا المنتج أولاً.`;
            }
            return `أنت مساعد ذكي فاخر لمتجر ATEEM للأزياء الراقية.
          تتحدث باللغة العربية بأسلوب راقٍ ومحترف ودافئ.
          اجعل ردودك موجزة وأنيقة — لا تتجاوز 3-4 أسطر عادةً.
          قائمة المنتجات:
          ${productLines}
          ${ATEEM_POLICY_TEXT}
          ${pageContext}
          تعليمات: عند ترشيح منتج اذكر رمزه [id] بين أقواس مربعة. لا تخترع منتجات غير موجودة.`;
          }

          let panelIsOpen = false;
          let lastFailedMsg = null;
          const conversationHistory = [];
          const panel     = document.getElementById('ateem-panel');
          const chat      = document.getElementById('ateem-chat');
          const inputEl   = document.getElementById('ateem-input');
          const scrollBtn = document.getElementById('ateem-scroll-bottom');
          const voiceBtn  = document.getElementById('ateem-voice-btn');
          const backdrop  = document.getElementById('ateem-backdrop');

          if (!panel || !chat || !inputEl) {
            console.error('[ATEEM] عناصر أساسية غير موجودة — تم إيقاف تشغيل الودجت.');
          } else {

          function openPanel() {
            panelIsOpen = true;
            document.body.classList.add('ateem-panel-open');
            panel.classList.remove('closing');
            panel.classList.add('active');
            if (backdrop) { backdrop.classList.remove('closing'); backdrop.classList.add('active'); }
            setTimeout(() => { inputEl.focus(); scrollAteemToBottom(true); }, 80);
          }
          function closeAteemPanel() {
            panelIsOpen = false;
            document.body.classList.remove('ateem-panel-open');
            panel.classList.remove('active');
            panel.classList.add('closing');
            if (backdrop) { backdrop.classList.remove('active'); backdrop.classList.add('closing'); }
            window.speechSynthesis && window.speechSynthesis.cancel();
            setTimeout(() => {
              panel.classList.remove('closing');
              if (backdrop) backdrop.classList.remove('closing');
            }, 400);
          }
          window.closeAteemPanel = closeAteemPanel;

          window.openAteemPanel = function () {
            if (panelIsOpen) { closeAteemPanel(); } else { openPanel(); }
          };

          document.addEventListener('click', (e) => {
            if (!panelIsOpen) return;
            const inPanel = panel.contains(e.target);
            if (!inPanel) closeAteemPanel();
          });
          document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && panelIsOpen) closeAteemPanel();
          });

          function scrollAteemToBottom(instant) {
            chat.scrollTo({ top: chat.scrollHeight, behavior: instant ? 'auto' : 'smooth' });
          }
          window.scrollAteemToBottom = scrollAteemToBottom;
          chat.addEventListener('scroll', () => {
            const nearBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 50;
            if (scrollBtn) scrollBtn.classList.toggle('visible', !nearBottom);
          });

          function renderProductCard(p) {
            return `<a href="${p.url}" class="ateem-product-card" target="_blank" rel="noopener">
              <img class="ateem-product-img" src="${p.img}" alt="${p.name}" loading="lazy" onerror="this.style.visibility='hidden'">
              <div class="ateem-product-info">
                <div class="ateem-product-name">${p.name}</div>
                <div class="ateem-product-cat">${p.category}</div>
                <div class="ateem-product-price">${fmtPrice(p)}</div>
              </div>
              <div class="ateem-product-btn">عرض المنتج</div>
            </a>`;
          }

          function renderQuickChips() {
            const replies = ATEEM_QUICK_REPLIES[pageType] || ATEEM_QUICK_REPLIES.home;
            const chips = replies.map(r =>
              `<span class="ateem-quick-chip" onclick="quickAteemReply('${r.replace(/'/g, "\'")}')">${r}</span>`
            ).join('');
            return `<div class="ateem-quick-replies">${chips}</div>`;
          }
          window.quickAteemReply = function (text) {
            inputEl.value = text;
            sendAteemMessage();
          };

          function renderBotReply(text, includeQuickReplies) {
            const idsFound = [];
            const cleanText = text.replace(/\[([a-z0-9-]+)\]/gi, (m, id) => {
              if (ATEEM_PRODUCTS.find(p => p.id === id)) idsFound.push(id);
              return "";
            }).replace(/\s{2,}/g, " ").trim();

            let html = `<div class="ateem-msg-wrap ateem-bot">
              <div class="ateem-bot-msg">${cleanText.replace(/\n/g,'<br>')}</div>
              <div class="ateem-msg-time">${nowTime()}</div>
            </div>`;

            const uniqueIds = [...new Set(idsFound)];
            if (uniqueIds.length) {
              const cards = uniqueIds.map(id => ATEEM_PRODUCTS.find(p => p.id === id)).filter(Boolean).map(renderProductCard).join("");
              html += `<div class="ateem-products-wrap">${cards}</div>`;
            }
            if (includeQuickReplies) html += renderQuickChips();
            return html;
          }

          function renderUserMsg(text) {
            return `<div class="ateem-msg-wrap ateem-user">
              <div class="ateem-user-msg">${text.replace(/\n/g,'<br>')}</div>
              <div class="ateem-msg-time">${nowTime()}</div>
            </div>`;
          }

          function renderError(errMsg) {
            return `<div class="ateem-msg-wrap ateem-bot">
              <div class="ateem-error-msg">
                ⚠️ تعذّر الاتصال بالخادم<br>
                <small style="opacity:.6; font-size:11px">${errMsg}</small>
                <div class="ateem-error-retry" onclick="retryAteemLast()">إعادة المحاولة</div>
              </div>
            </div>`;
          }
          window.retryAteemLast = function () {
            if (lastFailedMsg) { inputEl.value = lastFailedMsg; sendAteemMessage(); }
          };

          async function askGroq(userMessage) {
            conversationHistory.push({ role:"user", content:userMessage });
            const MAX_HISTORY = 8;
            const trimmedHistory = conversationHistory.slice(-MAX_HISTORY);

            const response = await fetch(ATEEM_PROXY_URL, {
              method:"POST",
              headers:{ "Content-Type":"application/json" },
              body:JSON.stringify({ model:GROQ_MODEL,
                messages:[{ role:"system", content:buildSystemPrompt() }, ...trimmedHistory],
                max_tokens:350, temperature:0.7 })
            });
            if (!response.ok) { const e=await response.json().catch(()=>({})); throw new Error(e.error?.message||`HTTP ${response.status}`); }
            const data  = await response.json();
            const reply = data.choices?.[0]?.message?.content?.trim() || "عذراً، لم أتمكن من الرد الآن.";
            conversationHistory.push({ role:"assistant", content:reply });
            return reply;
          }

          async function sendAteemMessage() {
            const msg = inputEl.value.trim();
            if (!msg) return;
            inputEl.value = "";
            lastFailedMsg = msg;
            inputEl.disabled = true;

            chat.insertAdjacentHTML('beforeend', renderUserMsg(msg));
            scrollAteemToBottom();

            const tid = "t_" + Date.now();
            chat.insertAdjacentHTML('beforeend', `<div id="${tid}" class="ateem-typing"><span></span><span></span><span></span></div>`);
            scrollAteemToBottom();

            try {
              const reply = await askGroq(msg);
              document.getElementById(tid)?.remove();
              chat.insertAdjacentHTML('beforeend', renderBotReply(reply, false));
              speakText(reply);
            } catch(e) {
              document.getElementById(tid)?.remove();
              chat.insertAdjacentHTML('beforeend', renderError(e.message));
            }
            scrollAteemToBottom();
            inputEl.disabled = false; inputEl.focus();
          }
          window.sendAteemMessage = sendAteemMessage;

          inputEl.addEventListener('keypress', e => { if (e.key === 'Enter') sendAteemMessage(); });

          const ateemSendBtn = document.querySelector('.ateem-send');
          if (ateemSendBtn) ateemSendBtn.addEventListener('click', sendAteemMessage);

          /* ══ VOICE INPUT + TTS ══ */
          let recognition = null;
          let isRecording  = false;

          function toggleVoice() { isRecording ? stopVoice() : startVoice(); }
          window.toggleVoice = toggleVoice;

          function startVoice() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) { alert('متصفحك لا يدعم التسجيل الصوتي'); return; }
            recognition = new SR();
            recognition.lang = 'ar-SA';
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.onstart = () => {
              isRecording = true;
              if (voiceBtn) voiceBtn.classList.add('recording');
              inputEl.placeholder = '🎙 جارٍ التسجيل...';
            };
            recognition.onresult = (e) => {
              inputEl.value = e.results[0][0].transcript;
              stopVoice();
              sendAteemMessage();
            };
            recognition.onerror = () => stopVoice();
            recognition.onend   = () => stopVoice();
            recognition.start();
          }

          function stopVoice() {
            isRecording = false;
            if (recognition) { recognition.stop(); recognition = null; }
            if (voiceBtn) voiceBtn.classList.remove('recording');
            inputEl.placeholder = 'اكتب رسالتك هنا...';
          }

          async function speakText(text) {
            const clean = text.replace(/<[^>]+>/g, '').replace(/[✦◆\[\]]/g, '').trim();
            if (!clean) return;
            try {
              const response = await fetch(ATEEM_PROXY_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ type: "tts", text: clean })
              });
              if (!response.ok) {
                const errText = await response.text();
                throw new Error("TTS HTTP " + response.status + ": " + errText);
              }
              const audioBlob = await response.blob();
              const audioUrl  = URL.createObjectURL(audioBlob);
              const audio     = new Audio(audioUrl);
              audio.play().catch(err => console.warn("Audio play blocked:", err));
              audio.onended = () => URL.revokeObjectURL(audioUrl);
            } catch (err) {
              console.warn("ElevenLabs TTS failed:", err);
            }
          }

          function initAteemWelcome() {
            chat.innerHTML = `
              <div class="ateem-welcome-banner">
                <div class="ateem-welcome-text">${pageCfg.welcome}</div>
                <div class="ateem-welcome-time">${nowTime()}</div>
              </div>
            ` + renderQuickChips();
          }
          if (document.readyState === 'complete') {
            initAteemWelcome();
          } else {
            window.addEventListener('load', initAteemWelcome);
            setTimeout(() => { if (!chat.innerHTML.trim()) initAteemWelcome(); }, 2000);
          }

          } // end element guard
          }

          })();
          EOF

      # 8. Sync Capacitor
      - name: Sync Capacitor
        run: npx cap sync android


      # 8.5 Add Glide dependency
      - name: Add Glide dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle")
          text = path.read_text()
          MARKER = "ATEEM_GLIDE_DEPENDENCY"
          if MARKER not in text:
              addition = """

          // """ + MARKER + """ - do not remove this marker comment

          dependencies {

              implementation 'com.github.bumptech.glide:glide:4.16.0'

              annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

              implementation 'androidx.core:core:1.12.0'
          }

          """
              text += addition
              path.write_text(text)
              print("Glide dependency appended.")
          else:
              print("Marker already present - skipping.")
          PY


      # 9. Restore release keystore
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/release.keystore


      # 10. Verify keystore
      - name: Verify keystore
        run: |
          test -s android/app/release.keystore
          ls -lh android/app/release.keystore
          file android/app/release.keystore


      # 11. Test release keystore
      - name: Test release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -list \
            -keystore android/app/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias ateemrelease


      # 12. Configure release signing
      - name: Configure release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle")
          text = path.read_text()
          MARKER = "ATEEM_RELEASE_SIGNING_CONFIG"
          if MARKER not in text:
              signing = """

          // """ + MARKER + """ - do not remove this marker comment

          android {

              signingConfigs {

                  ateemRelease {

                      storeFile file(
                          "release.keystore"
                      )

                      storePassword System.getenv(
                          "ATEEM_STORE_PASSWORD"
                      )

                      keyAlias System.getenv(
                          "ATEEM_KEY_ALIAS"
                      )

                      keyPassword System.getenv(
                          "ATEEM_KEY_PASSWORD"
                      )
                  }
              }


              buildTypes {

                  release {

                      signingConfig signingConfigs.ateemRelease

                      minifyEnabled false
                  }
              }
          }

          """
              text += signing
              path.write_text(text)
              print("Release signing config appended.")
          else:
              print("Marker already present - skipping.")
          print("---- build.gradle tail ----")
          print(path.read_text()[-1500:])
          PY


      # 13. Build release APK
      - name: Build release APK
        working-directory: android
        env:
          ATEEM_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ATEEM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ATEEM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Checking signing configuration..."
          test -n "$ATEEM_STORE_PASSWORD"
          test -n "$ATEEM_KEY_ALIAS"
          test -n "$ATEEM_KEY_PASSWORD"
          test -s app/release.keystore
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace


      # 13.5 List build outputs
      - name: List build outputs
        run: |
          echo "=== Searching for any APK files produced ==="
          find android/app/build/outputs -type f -name "*.apk" 2>/dev/null || true
          echo "=== Full outputs directory tree ==="
          find android/app/build/outputs -type f 2>/dev/null || echo "outputs directory does not exist or is empty"


      # 14. Upload APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ateem-store-apk-premium
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
