                      TextView label = new TextView(activity);
                      label.setText(group.name);
                      label.setTextSize(15);
                      label.setTypeface(sansBold);
                      label.setTextColor(CHARCOAL);
                      col.addView(label);

                      LinearLayout row = new LinearLayout(activity);
                      row.setOrientation(LinearLayout.HORIZONTAL);
                      row.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);
                      LinearLayout.LayoutParams rowParams = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                      rowParams.topMargin = dp(12);
                      row.setLayoutParams(rowParams);

                      List<TextView> buttons = new ArrayList<>();
                      for (String value : group.values) {
                          TextView btn = new TextView(activity);
                          btn.setText(value);
                          btn.setTextSize(14);
                          btn.setTypeface(sansBold);
                          btn.setGravity(Gravity.CENTER);
                          btn.setPadding(dp(16), dp(10), dp(16), dp(10));
                          btn.setMinWidth(dp(46));
                          btn.setMinHeight(dp(46));
                          LinearLayout.LayoutParams btnParams = new LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                          btnParams.leftMargin = dp(8);
                          btn.setOnClickListener(v -> {
                              if (!btn.isEnabled()) return;
                              group.selected = value;
                              refreshOptionButtons(group.name);
                              onSelectionChanged();
                          });
                          row.addView(btn, btnParams);
                          buttons.add(btn);
                      }
                      col.addView(row);
                      optionsContainer.addView(col);
                      optionRowsByGroup.put(group.name, row);
                      optionButtonsByGroup.put(group.name, buttons);
                  }

                  for (OptionGroup group : optionGroups) refreshOptionButtons(group.name);
              }

              private void refreshOptionButtons(String groupName) {
                  OptionGroup group = findGroup(groupName);
                  List<TextView> buttons = optionButtonsByGroup.get(groupName);
                  if (group == null || buttons == null) return;

                  for (TextView btn : buttons) {
                      String value = btn.getText().toString();
                      boolean active = value.equals(group.selected);
                      boolean available = valueHasStock(group.name, value);
                      btn.setEnabled(available);
                      btn.setAlpha(available ? 1f : 0.4f);

                      GradientDrawable bg = new GradientDrawable();
                      bg.setCornerRadius(dp(12));
                      if (!available) {
                          bg.setColor(WARM_WHITE);
                          bg.setStroke(dp(1), Color.argb(40, 138, 148, 116));
                          btn.setTextColor(WARM_GRAY);
                          btn.setPaintFlags(btn.getPaintFlags() | android.graphics.Paint.STRIKE_THRU_TEXT_FLAG);
                      } else {
                          btn.setPaintFlags(btn.getPaintFlags() & ~android.graphics.Paint.STRIKE_THRU_TEXT_FLAG);
                          if (active) {
                              bg.setColor(OLIVE);
                              btn.setTextColor(WHITE);
                          } else {
                              bg.setColor(WARM_WHITE);
                              bg.setStroke(dp(1), Color.argb(60, 138, 148, 116));
                              btn.setTextColor(CHARCOAL);
                          }
                      }
                      btn.setBackground(bg);
                  }
              }

              private OptionGroup findGroup(String name) {
                  for (OptionGroup g : optionGroups) if (g.name.equals(name)) return g;
                  return null;
              }

              /* A value is shown disabled/struck-through only when every
                 variant containing it (given whatever's already picked in
                 the other groups) is out of stock — never guessed, always
                 read straight off the variants array from Odoo. */
              private boolean valueHasStock(String groupName, String value) {
                  if (variants.isEmpty()) return true; // no variant matrix at all — flatStock governs, not this
                  for (Variant v : variants) {
                      if (!value.equals(v.values.get(groupName))) continue;
                      if (v.stock <= 0) continue;
                      boolean matchesOtherSelections = true;
                      for (OptionGroup g : optionGroups) {
                          if (g.name.equals(groupName) || g.selected == null) continue;
                          String vVal = v.values.get(g.name);
                          if (vVal != null && !vVal.equals(g.selected)) { matchesOtherSelections = false; break; }
                      }
                      if (matchesOtherSelections) return true;
                  }
                  return false;
              }

              /* Resolves the exact variant matching every currently-selected
                 option value, if any (and if there's a full match at all). */
              private Variant resolveSelectedVariant() {
                  if (variants.isEmpty()) return null;
                  for (OptionGroup g : optionGroups) if (g.selected == null) return null;
                  for (Variant v : variants) {
                      boolean matches = true;
                      for (OptionGroup g : optionGroups) {
                          if (!g.selected.equals(v.values.get(g.name))) { matches = false; break; }
                      }
                      if (matches) return v;
                  }
                  return null;
              }

              /* The real Odoo SKU (product.product id) for whatever's
                 currently selected — this is what must travel to the cart
                 and, eventually, into the order line's product_id, never
                 the product.template id in currentId. Falls back to
                 currentId only for a product with no variant matrix at
                 all, where the template id and its single variant's id
                 are the same product in Odoo's eyes. */
              private int resolveCartSku() {
                  Variant v = resolveSelectedVariant();
                  return v != null ? v.id : currentId;
              }

              /* Fires whenever a chip is tapped — updates price + stock-gated
                 buttons + re-validates every other group's availability
                 against the new combination. */
              private void onSelectionChanged() {
                  for (OptionGroup g : optionGroups) refreshOptionButtons(g.name);

                  Variant v = resolveSelectedVariant();
                  if (v != null) {
                      currentPrice = v.price;
                      if (priceLabel != null) priceLabel.setText(formatPrice(currentPrice) + " SDG");
                  }
                  updatePurchaseAvailability();
              }

              /* True only when the product is actually purchasable right
                 now: every option group (if any) has a value picked, that
                 combination resolves to an in-stock variant — or, for a
                 product with no variant matrix at all, its flat stock is
                 known and > 0. */
              private boolean isSelectionPurchasable() {
                  if (!variants.isEmpty()) {
                      Variant v = resolveSelectedVariant();
                      return v != null && v.stock > 0;
                  }
                  return flatStock != null && flatStock > 0;
              }

              private String buildVariantLabel() {
                  StringBuilder sb = new StringBuilder();
                  for (OptionGroup g : optionGroups) {
                      if (g.selected == null) continue;
                      if (sb.length() > 0) sb.append(" · ");
                      sb.append(g.selected);
                  }
                  return sb.toString();
              }

              private void updatePurchaseAvailability() {
                  boolean purchasable = isSelectionPurchasable();
                  boolean outOfStockAltogether = variants.isEmpty()
                      ? (flatStock != null && flatStock <= 0)
                      : allVariantsOutOfStock();

                  if (addToCartBtnRef != null) {
                      addToCartBtnRef.setText(outOfStockAltogether ? "غير متوفر" : "أضف إلى السلة");
                      addToCartBtnRef.setAlpha(purchasable ? 1f : 0.5f);
                  }
                  if (buyNowBtnRef != null) {
                      buyNowBtnRef.setAlpha(purchasable ? 1f : 0.5f);
                  }
              }

              private boolean allVariantsOutOfStock() {
                  for (Variant v : variants) if (v.stock > 0) return false;
                  return !variants.isEmpty();
              }

