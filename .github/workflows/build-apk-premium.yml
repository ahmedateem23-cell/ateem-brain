              private void onBuyNow(int id, String name, String variantLabel, double price, String image, int quantity) {
                  /* "Buy now" adds the single item to the same cart the
                     checkout screen reads from, refreshes the cart's totals
                     (shipping + any promo already applied), then opens
                     checkout straight away with that total. */
                  NativeCartScreen.addItem(id, name, variantLabel, price, image, quantity);
                  if (nativeCartScreen != null) nativeCartScreen.refresh();
                  if (nativeHomeScreen != null) nativeHomeScreen.refreshCartBadge();
                  double total = nativeCartScreen != null ? nativeCartScreen.getCurrentTotal() : price * quantity;
