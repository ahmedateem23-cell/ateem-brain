              private LinearLayout fieldWrap(String label, View input, TextView error, boolean isLast) {
                  LinearLayout wrap = new LinearLayout(activity);
                  wrap.setOrientation(LinearLayout.VERTICAL);
                  LinearLayout.LayoutParams wrapParams = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  wrapParams.bottomMargin = isLast ? 0 : dp(14);
                  wrap.setLayoutParams(wrapParams);

                  TextView labelView = new TextView(activity);
                  labelView.setText(label);
                  labelView.setTextSize(12.5f);
                  labelView.setTypeface(sansMedium);
                  labelView.setTextColor(WARM_GRAY);
                  LinearLayout.LayoutParams labelParams = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  labelParams.bottomMargin = dp(6);
                  wrap.addView(labelView, labelParams);

                  wrap.addView(input, new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));

                  wrap.addView(error, new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT));

                  /* Clear the error state as soon as the person starts fixing it —
                     mirrors the JS "input" listener in checkout_page.html. */
                  if (input instanceof EditText) {
                      ((EditText) input).addTextChangedListener(new android.text.TextWatcher() {
                          @Override public void beforeTextChanged(CharSequence s, int a, int b, int c) {}
                          @Override public void onTextChanged(CharSequence s, int a, int b, int c) {}
                          @Override public void afterTextChanged(android.text.Editable s) {
                              input.setBackground(inputBackground(false));
                              error.setVisibility(View.GONE);
                          }
                      });
                  }

                  return wrap;
              }

              private TextView errorLabel(String text) {
                  TextView error = new TextView(activity);
                  error.setText(text);
                  error.setTextSize(11.5f);
                  error.setTypeface(sansMedium);
                  error.setTextColor(DANGER);
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  p.topMargin = dp(5);
                  error.setLayoutParams(p);
                  error.setVisibility(View.GONE);
                  return error;
              }

              private Spinner buildCitySpinner() {
                  Spinner spinner = new Spinner(activity);
                  ArrayAdapter<String> adapter = new ArrayAdapter<String>(
                      activity, android.R.layout.simple_spinner_item, CITIES) {
                      @Override
                      public View getView(int position, View convertView, ViewGroup parent) {
                          TextView tv = (TextView) super.getView(position, convertView, parent);
                          styleSpinnerText(tv, position == 0);
                          return tv;
                      }
                      @Override
                      public View getDropDownView(int position, View convertView, ViewGroup parent) {
                          TextView tv = (TextView) super.getDropDownView(position, convertView, parent);
                          styleSpinnerText(tv, position == 0);
                          tv.setPadding(dp(16), dp(12), dp(16), dp(12));
                          tv.setBackgroundColor(WHITE);
                          return tv;
                      }
                  };
                  adapter.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item);
                  spinner.setAdapter(adapter);
                  spinner.setBackground(inputBackground(false));
                  spinner.setPadding(dp(16), dp(14), dp(16), dp(14));
                  return spinner;
              }

              private void styleSpinnerText(TextView tv, boolean placeholder) {
                  tv.setTextSize(14.5f);
                  tv.setTypeface(sansRegular);
                  tv.setTextColor(placeholder ? SOFT_GRAY : CHARCOAL);
                  tv.setGravity(Gravity.RIGHT);
                  tv.setTextDirection(View.TEXT_DIRECTION_RTL);
              }

              private LinearLayout spinnerFieldWrap(String label, Spinner spinner, TextView error) {
                  LinearLayout wrap = new LinearLayout(activity);
                  wrap.setOrientation(LinearLayout.VERTICAL);
                  LinearLayout.LayoutParams wrapParams = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  wrapParams.bottomMargin = dp(14);
                  wrap.setLayoutParams(wrapParams);

                  TextView labelView = new TextView(activity);
                  labelView.setText(label);
                  labelView.setTextSize(12.5f);
                  labelView.setTypeface(sansMedium);
                  labelView.setTextColor(WARM_GRAY);
                  LinearLayout.LayoutParams labelParams = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  labelParams.bottomMargin = dp(6);
                  wrap.addView(labelView, labelParams);

                  wrap.addView(spinner, new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));

                  wrap.addView(error, new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT));

                  return wrap;
              }

              /* ============== ORDER SUMMARY CARD ============== */
              private LinearLayout buildSummaryCard() {
                  LinearLayout card = card();
                  card.addView(cardTitle("ملخص الطلب"));

                  summaryList = new LinearLayout(activity);
                  summaryList.setOrientation(LinearLayout.VERTICAL);
                  LinearLayout.LayoutParams listParams = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  listParams.bottomMargin = dp(4);
                  card.addView(summaryList, listParams);

                  return card;
              }

              private void renderSummary() {
                  if (summaryList == null) return;
                  summaryList.removeAllViews();

                  double subtotal = 0;
                  List<NativeCartScreen.CheckoutLine> lines = NativeCartScreen.getCheckoutLines();
                  for (NativeCartScreen.CheckoutLine line : lines) {
                      double lineTotal = line.price * line.qty;
                      subtotal += lineTotal;
                      String name = line.name == null ? "" : line.name;
                      String meta = (line.meta == null || line.meta.isEmpty()) ? "" : " (" + line.meta + ")";
                      summaryList.addView(summaryRow(name + meta + " × " + line.qty, formatPrice(lineTotal) + " SDG", false));
                  }

                  summaryList.addView(summaryRow("الشحن", formatPrice(SHIPPING_FEE) + " SDG", false));
                  summaryList.addView(divider());
                  summaryList.addView(summaryRow("الإجمالي", formatPrice(currentTotal) + " SDG", true));

                  if (confirmAmountValue != null) {
                      confirmAmountValue.setText(formatPrice(currentTotal) + " SDG");
                  }
              }

              private LinearLayout summaryRow(String label, String value, boolean emphasize) {
                  LinearLayout row = new LinearLayout(activity);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);
                  row.setGravity(Gravity.CENTER_VERTICAL);
                  LinearLayout.LayoutParams rowParams = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  rowParams.topMargin = dp(8);
                  rowParams.bottomMargin = dp(8);
                  row.setLayoutParams(rowParams);

                  TextView labelView = new TextView(activity);
                  labelView.setText(label);
                  labelView.setTextSize(emphasize ? 15f : 13f);
                  labelView.setTypeface(emphasize ? sansBold : sansRegular);
                  labelView.setTextColor(emphasize ? CHARCOAL : WARM_GRAY);
                  LinearLayout.LayoutParams labelParams = new LinearLayout.LayoutParams(
                      0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f);
                  row.addView(labelView, labelParams);

                  TextView valueView = new TextView(activity);
                  valueView.setText(value);
                  valueView.setTextSize(emphasize ? 17f : 13.5f);
                  valueView.setTypeface(sansBold);
                  valueView.setTextColor(emphasize ? OLIVE : CHARCOAL);
                  row.addView(valueView);

                  return row;
              }

