      # 7.5 Create chat-panel injection asset — Premium Dark Edition
      - name: Create ATEEM widget injection asset
        run: |

          mkdir -p android/app/src/main/assets/inject

          cat > android/app/src/main/assets/inject/ateem_widget_inject.js << 'EOF'
          (function ATEEM_WIDGET_INJECT(){
            if (window.__ateemWidgetInjected) { return; }
            window.__ateemWidgetInjected = true;

            var path = window.location.pathname.replace(/\/+$/, "");
            var isHome    = (path === "" || path === "/");
            var isProduct = /^\/shop\/[a-z0-9-]+$/i.test(path);
            window.ATEEM_SHOULD_SHOW = isHome || isProduct;
            window.ATEEM_PAGE_TYPE   = isHome ? "home" : (isProduct ? "product" : "other");
            if (isProduct) window.ATEEM_PRODUCT_SLUG = path.replace("/shop/", "");

            var fontLink = document.createElement('link');
            fontLink.rel = 'stylesheet';
            fontLink.href = "https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,600&family=Montserrat:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500&display=swap";
            document.head.appendChild(fontLink);

            var style = document.createElement('style');
            style.id = 'ateem-widget-style';
            style.textContent = `
          :root {
            --ateem-void:        #0A0A0F;
            --ateem-card:        #141419;
            --ateem-card-light:  #1E1E28;
            --ateem-gold:        #C9A84C;
            --ateem-gold-light:  #E8D5A3;
            --ateem-gold-dim:    rgba(201,168,76,0.15);
            --ateem-white:       #FFFFFF;
            --ateem-cream:       #F0EDE6;
            --ateem-muted:       #8A8A9A;
            --ateem-faint:       #5A5A6A;
            --ateem-navy:        #1B263B;
            --ateem-navy-light:  #2D3E56;
          }

          /* ═══ Premium Panel Animations ═══ */
          @keyframes ateem-panelIn {
            0%   { opacity:0; transform:translateX(-100%) scale(0.95); }
            70%  { transform:translateX(2%) scale(1.01); }
            100% { opacity:1; transform:translateX(0) scale(1); }
          }
          @keyframes ateem-panelOut {
            0%   { opacity:1; transform:translateX(0) scale(1); }
            100% { opacity:0; transform:translateX(-100%) scale(0.95); }
          }
          @keyframes ateem-backdropIn {
            from { opacity:0; }
            to   { opacity:1; }
          }
          @keyframes ateem-backdropOut {
            from { opacity:1; }
            to   { opacity:0; }
          }
          @keyframes ateem-typingDot {
            0%,80%,100% { transform:scale(.5); opacity:.2; }
            40%          { transform:scale(1);  opacity:1; }
          }
          @keyframes ateem-recPulse {
            0%,100% { box-shadow:0 0 0 0 rgba(220,60,60,0.35); }
            50%      { box-shadow:0 0 0 10px rgba(220,60,60,0); }
          }
          @keyframes ateem-statusPulse {
            0%,100% { opacity:1; transform:scale(1); }
            50%      { opacity:.5; transform:scale(0.8); }
          }
          @keyframes ateem-msgAppear {
            from { opacity:0; transform:translateY(12px) scale(0.95); }
            to   { opacity:1; transform:translateY(0) scale(1); }
          }
          @keyframes ateem-glowPulse {
            0%,100% { opacity:0.4; }
            50%      { opacity:0.8; }
          }

          /* ═══ Backdrop Overlay ═══ */
          #ateem-backdrop {
            position:fixed; inset:0; background:rgba(10,10,15,0.6); backdrop-filter:blur(4px);
            z-index:2147483645; display:none; opacity:0;
          }
          #ateem-backdrop.active  { display:block; animation:ateem-backdropIn 0.3s ease forwards; }
          #ateem-backdrop.closing { display:block; animation:ateem-backdropOut 0.25s ease forwards; }

          /* ═══ PANEL — Premium Dark Drawer ═══ */
          #ateem-panel {
            position:fixed;
            left:0; right:auto; top:12px; bottom:12px;
            width:90%; max-width:380px; height:auto;
            margin:0;
            background:linear-gradient(180deg, #141419 0%, #0F0F14 100%);
            backdrop-filter:blur(40px) saturate(150%);
            -webkit-backdrop-filter:blur(40px) saturate(150%);
            border-radius:0 28px 28px 0;
            overflow:hidden;
            z-index:2147483646;
            display:none; flex-direction:column;
            border:none;
            box-shadow:16px 0 80px rgba(0,0,0,0.4), 6px 0 30px rgba(201,168,76,0.08);
            font-family:'IBM Plex Sans Arabic',sans-serif;
            transform:translateX(-110%);
            transform-origin:center left;
            will-change:transform, opacity;
            padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
          }
          #ateem-panel.active  { display:flex; animation:ateem-panelIn 0.42s cubic-bezier(0.22,1,0.36,1) forwards; }
          #ateem-panel.closing { display:flex; animation:ateem-panelOut 0.32s cubic-bezier(0.55,0,1,0.45) forwards; }

          body.ateem-panel-open { overflow:hidden; }

