              public View getHeaderView() { return headerView; }

              /* Quiet Luxury Palette */
              private final int IVORY_BG     = Color.parseColor("#F5F1E8");
              private final int WARM_WHITE   = Color.parseColor("#FEFCF8");
              private final int CREAM        = Color.parseColor("#F0EDE6");
              private final int CHARCOAL     = Color.parseColor("#3D3B36");
              private final int WARM_GRAY    = Color.parseColor("#8A8680");
              private final int SOFT_GRAY    = Color.parseColor("#B5B0A8");
              private final int OLIVE        = Color.parseColor("#8A9A5B");
              private final int OLIVE_LIGHT  = Color.parseColor("#A8B88A");
              private final int OLIVE_MUTED  = Color.parseColor("#E8EBE0");
              private final int WHITE        = Color.parseColor("#FFFFFF");
              private final int DIVIDER      = Color.parseColor("#E8E4DC");

              private final Typeface serifBold  = Typeface.create("serif", Typeface.BOLD);
              private final Typeface sansLight  = Typeface.create("sans-serif-light", Typeface.NORMAL);
              private final Typeface sansMedium = Typeface.create("sans-serif-medium", Typeface.NORMAL);
              private final Typeface sansBold   = Typeface.create("sans-serif", Typeface.BOLD);

              private static class Slide {
                  String brand, title, desc, button, imageUrl;
                  Slide(String brand, String title, String desc, String button, String imageUrl) {
                      this.brand = brand; this.title = title; this.desc = desc;
                      this.button = button; this.imageUrl = imageUrl;
                  }
              }

              private final Slide[] slides = new Slide[] {
                  new Slide("urban street", "أسلوب يعبّر عنك",
                      "ستريتوير، سنيكرز وأكثر من مجرد ملابس", "تسوق الآن",
                      "https://images.unsplash.com/photo-1595065666634-4725aa7e8379?w=900&q=80"),
                  new Slide("luxury collection", "كن الأفضل لتفوز",
                      "أناقة رجالية فاخرة بأسلوب عصري", "اكتشف المزيد",
                      "https://images.unsplash.com/photo-1507680434567-5739c80be1ac?w=900&q=80"),
                  new Slide("new season", "أسلوبك هويتك",
                      "تشكيلة خريف شتاء 2026", "اطلب الآن",
                      "https://images.unsplash.com/photo-1516826957135-700dedea698c?w=900&q=80")
              };

              private static class Category {
                  String label, imageUrl, path;
                  Category(String label, String imageUrl, String path) {
                      this.label = label; this.imageUrl = imageUrl; this.path = path;
                  }
              }

              private final Category[] categories = new Category[] {
                  new Category("SHIRTS", "https://i.ibb.co/39GtkmxV/file-00000000ffb0722faa08b8d847cf7141.png", "/shop/category/shirts-9"),
                  new Category("FOOTWEAR", "https://i.ibb.co/bMKftkK7/file-00000000793c71f686539d36b13ce7a9.png", "/shop/category/footwear-17"),
                  new Category("FORMAL WEAR", "https://i.ibb.co/W4wJRspZ/file-00000000923c71f5bf19575efbaf07e5.png", "/shop/category/formal-wear-18"),
                  new Category("ACCESSORIES", "https://i.ibb.co/gLg05tLH/file-0000000066e471f689fc2a0850067e92.png", "/shop/category/accessories-19")
              };

              public NativeHomeScreen(Activity activity, OnChatClickListener chatClickListener,
                                      OnCategoryClickListener categoryClickListener) {
                  this.activity = activity;
                  this.chatClickListener = chatClickListener;
                  this.categoryClickListener = categoryClickListener;
              }

              public View build() {
                  NestedScrollView scroll = new NestedScrollView(activity);
                  scroll.setFillViewport(true);
                  scroll.setBackgroundColor(IVORY_BG);

                  LinearLayout column = new LinearLayout(activity);
                  column.setOrientation(LinearLayout.VERTICAL);
                  column.setBackgroundColor(IVORY_BG);
                  scroll.addView(column, new ViewGroup.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));

                  /* 1) Premium Minimal Header */
                  NativeHeader header = new NativeHeader(activity,
                      () -> { if (chatClickListener != null) chatClickListener.onChatClick(); });
                  headerView = header.buildStandalone();
                  column.addView(headerView, new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));

                  /* 2) Quiet Elegant Banner */
                  column.addView(buildBanner(), bannerContainerParams());

                  /* 3) Collections Title + Quiet Grid */
                  column.addView(buildCollectionsHeader());
                  column.addView(buildCollectionsGrid());

                  /* 4) Quiet Footer */
                  column.addView(buildFooter());

                  return scroll;
              }

              private LinearLayout.LayoutParams bannerContainerParams() {
                  LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  params.leftMargin = dp(16); params.rightMargin = dp(16); params.topMargin = dp(12);
                  return params;
              }

              /* ============== QUIET ELEGANT BANNER ============== */
              private View buildBanner() {
                  FrameLayout wrap = new FrameLayout(activity);
                  wrap.setClipChildren(false);
                  wrap.setClipToPadding(false);

                  /* Main banner card — clean and quiet.
                     Ratio raised from 4:3 to 3:2 to trim ~11% off the banner's
                     height (a calmer, more minimal proportion) without touching
                     the image, text, buttons, or typography. */
                  AspectFrameLayout frame = new AspectFrameLayout(activity, 3f / 2f);
                  roundCorners(frame, dp(20));
                  frame.setBackgroundColor(CREAM);
                  frame.setElevation(dp(3));

                  bannerImage = new ImageView(activity);
                  bannerImage.setScaleType(ImageView.ScaleType.CENTER_CROP);
                  frame.addView(bannerImage, new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  /* Soft bottom scrim for text — concentrated behind the text zone only */
                  View overlay = new View(activity);
                  GradientDrawable overlayBg = new GradientDrawable(
                      GradientDrawable.Orientation.TOP_BOTTOM,
                      new int[] {
                          Color.TRANSPARENT,
                          Color.TRANSPARENT,
                          Color.argb(60, 20, 18, 15),
                          Color.argb(185, 20, 18, 15)
                      });
                  overlayBg.setGradientType(GradientDrawable.LINEAR_GRADIENT);
                  overlay.setBackground(overlayBg);
                  frame.addView(overlay, new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  /* Subtle border */
                  View borderView = new View(activity);
                  GradientDrawable borderBg = new GradientDrawable();
                  borderBg.setColor(Color.TRANSPARENT);
                  borderBg.setStroke(dp(1), Color.argb(100, 200, 196, 186));
                  borderBg.setCornerRadius(dp(20));
                  borderView.setBackground(borderBg);
                  frame.addView(borderView, new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  /* Text column */
                  LinearLayout textCol = new LinearLayout(activity);
                  textCol.setOrientation(LinearLayout.VERTICAL);
                  textCol.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);
                  textCol.setPadding(dp(22), dp(14), dp(22), dp(22));

                  bannerBrandLabel = new TextView(activity);
                  bannerBrandLabel.setTextSize(9);
                  bannerBrandLabel.setTextColor(Color.argb(180, 240, 236, 228));
                  bannerBrandLabel.setTypeface(sansMedium);
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.LOLLIPOP)
                      bannerBrandLabel.setLetterSpacing(0.2f);
                  bannerBrandLabel.setShadowLayer(dp(3), 0, dp(1), Color.argb(90, 0, 0, 0));
                  textCol.addView(bannerBrandLabel);

                  bannerTitle = new TextView(activity);
                  bannerTitle.setTextSize(24);
                  bannerTitle.setTextColor(WHITE);
                  bannerTitle.setTypeface(serifBold);
                  bannerTitle.setLineSpacing(0f, 1.05f);
                  bannerTitle.setShadowLayer(dp(6), 0, dp(2), Color.argb(110, 0, 0, 0));
                  LinearLayout.LayoutParams titleParams = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  titleParams.topMargin = dp(6);
                  textCol.addView(bannerTitle, titleParams);

                  bannerDesc = new TextView(activity);
                  bannerDesc.setTextSize(12);
                  bannerDesc.setTextColor(Color.argb(180, 255, 255, 255));
                  bannerDesc.setLineSpacing(dp(2), 1f);
                  bannerDesc.setShadowLayer(dp(4), 0, dp(1), Color.argb(90, 0, 0, 0));
                  LinearLayout.LayoutParams descParams = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  descParams.topMargin = dp(5);
                  descParams.bottomMargin = dp(14);
                  textCol.addView(bannerDesc, descParams);

                  /* Quiet CTA Button — Olive pill */
                  TextView button = new TextView(activity);
                  button.setText("تسوق الآن");
                  button.setTextSize(10);
                  button.setTextColor(WHITE);
                  button.setTypeface(sansMedium);
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.LOLLIPOP)
                      button.setLetterSpacing(0.06f);
                  GradientDrawable btnBg = new GradientDrawable();
                  btnBg.setColor(OLIVE);
                  btnBg.setCornerRadius(dp(20));
                  button.setBackground(btnBg);
                  button.setPadding(dp(18), dp(8), dp(18), dp(8));
                  LinearLayout.LayoutParams btnParams = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  textCol.addView(button, btnParams);

                  FrameLayout.LayoutParams textColParams = new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.BOTTOM);
                  frame.addView(textCol, textColParams);

                  /* Dots indicator */
                  dotsRow = new LinearLayout(activity);
                  dotsRow.setOrientation(LinearLayout.HORIZONTAL);
                  dotsRow.setGravity(Gravity.CENTER_HORIZONTAL);
                  for (int i = 0; i < slides.length; i++) {
                      View dot = new View(activity);
                      GradientDrawable dotBg = new GradientDrawable();
                      dotBg.setShape(GradientDrawable.OVAL);
                      dotBg.setColor(Color.argb(70, 255, 255, 255));
                      dot.setBackground(dotBg);
                      LinearLayout.LayoutParams dotParams = new LinearLayout.LayoutParams(dp(5), dp(5));
                      dotParams.leftMargin = dp(3); dotParams.rightMargin = dp(3);
                      dotsRow.addView(dot, dotParams);
                      dots.add(dot);
                      final int index = i;
                      dot.setOnClickListener(v -> goToSlide(index));
                  }
                  LinearLayout.LayoutParams dotsParams = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  dotsParams.topMargin = dp(12);
                  dotsParams.gravity = Gravity.CENTER_HORIZONTAL;
                  textCol.addView(dotsRow, dotsParams);

                  wrap.addView(frame, new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));

                  applySlide(0);
                  startAutoSlide();

                  return wrap;
              }

              private void applySlide(int index) {
                  Slide slide = slides[index];
                  bannerBrandLabel.setText(slide.brand.toUpperCase());
                  bannerTitle.setText(slide.title);
                  bannerDesc.setText(slide.desc);
                  Glide.with(activity).load(slide.imageUrl)
                      .diskCacheStrategy(DiskCacheStrategy.ALL).centerCrop().into(bannerImage);

                  for (int i = 0; i < dots.size(); i++) {
                      View dot = dots.get(i);
                      GradientDrawable dotBg = new GradientDrawable();
                      dotBg.setShape(GradientDrawable.OVAL);
                      boolean isActive = (i == index);
                      dotBg.setColor(isActive ? OLIVE : Color.argb(50, 255, 255, 255));
                      dot.setBackground(dotBg);
                      ViewGroup.LayoutParams lp = dot.getLayoutParams();
                      if (lp instanceof LinearLayout.LayoutParams) {
                          ((LinearLayout.LayoutParams) lp).width = isActive ? dp(14) : dp(5);
                          dot.setLayoutParams(lp);
                      }
                  }
              }

              private void goToSlide(int index) {
                  currentSlide = index;
                  applySlide(currentSlide);
                  restartAutoSlide();
              }

              private void startAutoSlide() {
                  bannerRunnable = () -> {
                      currentSlide = (currentSlide + 1) % slides.length;
                      applySlide(currentSlide);
                      bannerHandler.postDelayed(bannerRunnable, 5000);
                  };
                  bannerHandler.postDelayed(bannerRunnable, 5000);
              }

              private void restartAutoSlide() {
                  if (bannerRunnable != null) bannerHandler.removeCallbacks(bannerRunnable);
                  startAutoSlide();
              }

              /* ============== QUIET COLLECTIONS ============== */
              private View buildCollectionsHeader() {
                  LinearLayout row = new LinearLayout(activity);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.CENTER_VERTICAL);
