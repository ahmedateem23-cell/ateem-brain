                  return btn;
              }

              private android.graphics.drawable.Drawable makeStrokeIcon(String iconType, boolean filled) {
                  android.graphics.Path path = "heart".equals(iconType) ? buildHeartPath() : buildArrowPath();
                  int color = filled ? GOLD : CHARCOAL;
                  android.graphics.Paint.Style style = filled
                      ? android.graphics.Paint.Style.FILL_AND_STROKE
                      : android.graphics.Paint.Style.STROKE;
                  return new android.graphics.drawable.ShapeDrawable(new android.graphics.drawable.shapes.PathShape(
                      path, 24, 24)) {{
                      getPaint().setColor(color);
                      getPaint().setStyle(style);
                      getPaint().setStrokeWidth(2.2f);
                      getPaint().setStrokeCap(android.graphics.Paint.Cap.ROUND);
                      getPaint().setStrokeJoin(android.graphics.Paint.Join.ROUND);
                      getPaint().setAntiAlias(true);
                  }};
              }

              private android.graphics.Path buildArrowPath() {
                  android.graphics.Path p = new android.graphics.Path();
                  p.moveTo(15, 6);
                  p.lineTo(9, 12);
                  p.lineTo(15, 18);
                  return p;
              }

              /* Classic two-lobe heart, drawn with cubic curves inside the
                 same 24x24 box as the other icons. */
              private android.graphics.Path buildHeartPath() {
                  android.graphics.Path p = new android.graphics.Path();
                  p.moveTo(12, 21);
                  p.cubicTo(3, 14, 1, 9.5f, 4.5f, 6.2f);
                  p.cubicTo(7.2f, 3.7f, 11, 5, 12, 8.3f);
                  p.cubicTo(13, 5, 16.8f, 3.7f, 19.5f, 6.2f);
                  p.cubicTo(23, 9.5f, 21, 14, 12, 21);
                  p.close();
                  return p;
              }

