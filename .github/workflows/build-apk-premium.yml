                  item.setTextColor(isActive ? OLIVE : CHARCOAL);
                  item.setGravity(Gravity.RIGHT);
                  item.setPadding(dp(14), dp(11), dp(14), dp(11));
                  item.setTag(key);
                  if (isActive) {
                      GradientDrawable itemBg = new GradientDrawable();
                      itemBg.setColor(Color.argb(24, 138, 154, 91));
                      itemBg.setCornerRadius(dp(10));
                      item.setBackground(itemBg);
