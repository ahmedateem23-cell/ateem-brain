              /* ============== VALIDATION + CONFIRM ============== */
              private void clearErrors() {
                  if (nameInput != null) nameInput.setBackground(inputBackground(false));
                  if (phoneInput != null) phoneInput.setBackground(inputBackground(false));
                  if (addressInput != null) addressInput.setBackground(inputBackground(false));
                  if (citySpinner != null) citySpinner.setBackground(inputBackground(false));
                  if (errName != null) errName.setVisibility(View.GONE);
                  if (errPhone != null) errPhone.setVisibility(View.GONE);
                  if (errCity != null) errCity.setVisibility(View.GONE);
                  if (errAddress != null) errAddress.setVisibility(View.GONE);
              }

              private void resetConfirmButton() {
                  if (confirmBtn == null) return;
                  confirmBtn.setEnabled(true);
                  confirmBtn.setText("تأكيد الطلب");
                  GradientDrawable btnBg = new GradientDrawable();
                  btnBg.setColor(OLIVE);
                  btnBg.setCornerRadius(dp(16));
                  confirmBtn.setBackground(btnBg);
              }

              private void onConfirmTapped() {
                  clearErrors();
                  boolean isValid = true;

                  if (nameInput.getText().toString().trim().isEmpty()) {
                      nameInput.setBackground(inputBackground(true));
                      errName.setVisibility(View.VISIBLE);
                      isValid = false;
                  }
                  if (phoneInput.getText().toString().trim().isEmpty()) {
                      phoneInput.setBackground(inputBackground(true));
                      errPhone.setVisibility(View.VISIBLE);
                      isValid = false;
                  }
                  if (citySpinner.getSelectedItemPosition() <= 0) {
                      citySpinner.setBackground(inputBackground(true));
                      errCity.setVisibility(View.VISIBLE);
                      isValid = false;
                  }
                  if (addressInput.getText().toString().trim().isEmpty()) {
                      addressInput.setBackground(inputBackground(true));
                      errAddress.setVisibility(View.VISIBLE);
                      isValid = false;
                  }

                  if (!isValid) {
                      Toast.makeText(activity, "الرجاء إكمال بيانات التوصيل", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  confirmBtn.setEnabled(false);
                  confirmBtn.setText("جاري المعالجة...");
                  GradientDrawable processingBg = new GradientDrawable();
                  processingBg.setColor(OLIVE_DARK);
                  processingBg.setCornerRadius(dp(16));
                  confirmBtn.setBackground(processingBg);

                  submitOrder(
                      nameInput.getText().toString().trim(),
                      phoneInput.getText().toString().trim(),
                      addressInput.getText().toString().trim() + "، " + citySpinner.getSelectedItem().toString(),
                      selectedPayment
                  );
              }

              /* Real order creation — same /odoo-create-order endpoint the standalone
                 checkout_page.html posts to (see API_BASE there): a genuine
                 sale.order gets created in Odoo, "بنكك"/"فوري" are left as an
                 unconfirmed quotation with a one-tap confirm link sent to the
                 store's Telegram (confirmed manually only after the money is
                 actually seen to have arrived), while "cod" is confirmed right
                 away. Runs off the main thread like every other network call in
                 this app (see NativeShopScreen.loadProducts / detailExecutor). */
              private void submitOrder(String name, String phone, String address, String paymentMethod) {
                  orderExecutor.execute(() -> {
                      try {
                          JSONObject customer = new JSONObject();
                          customer.put("name", name);
                          customer.put("phone", phone);
                          customer.put("address", address);

                          JSONArray items = new JSONArray();
                          for (NativeCartScreen.CheckoutLine line : NativeCartScreen.getCheckoutLines()) {
                              JSONObject item = new JSONObject();
                              item.put("sku", line.sku);
                              item.put("name", line.name);
                              item.put("meta", line.meta == null ? "" : line.meta);
                              item.put("qty", line.qty);
                              item.put("price", line.price);
                              items.put(item);
                          }

                          JSONObject payload = new JSONObject();
                          payload.put("customer", customer);
                          payload.put("items", items);
                          payload.put("paymentMethod", paymentMethod);

                          /* Electronic payments (بنكك/فوري) stay unconfirmed until
                             Ahmed taps the Telegram button, so the customer only
                             finds out via a push notification then — grab the
                             device's FCM token here (off the main thread, we're
                             already inside orderExecutor) and send it along so
                             the worker knows who to notify later. COD is confirmed
                             immediately and needs no follow-up push. A token
                             fetch failure (no Google Play services, offline,
                             etc.) never blocks placing the order. */
                          if (!"cod".equals(paymentMethod)) {
                              try {
                                  String fcmToken = Tasks.await(FirebaseMessaging.getInstance().getToken());
                                  if (fcmToken != null) payload.put("fcmToken", fcmToken);
                              } catch (Exception fcmErr) {
                                  // best-effort — order still goes through without it
                              }
                          }

                          URL url = new URL(ORDER_URL);
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("POST");
                          conn.setRequestProperty("Content-Type", "application/json; charset=utf-8");
                          conn.setConnectTimeout(15000);
                          conn.setReadTimeout(15000);
                          conn.setDoOutput(true);
                          try (OutputStream os = conn.getOutputStream()) {
                              os.write(payload.toString().getBytes(StandardCharsets.UTF_8));
                          }

                          int code = conn.getResponseCode();
                          InputStream stream = code >= 200 && code < 300
                              ? conn.getInputStream() : conn.getErrorStream();
                          StringBuilder builder = new StringBuilder();
                          try (BufferedReader reader = new BufferedReader(
                                  new InputStreamReader(stream, StandardCharsets.UTF_8))) {
                              String line;
                              while ((line = reader.readLine()) != null) builder.append(line);
                          }

                          JSONObject result = new JSONObject(builder.toString());
                          if (code >= 200 && code < 300 && result.optBoolean("ok", false)) {
                              String orderName = result.optString("orderName", "");
                              String status = result.optString("status", "confirmed");
                              mainHandler.post(() -> showSuccess(orderName, status));
                          } else {
                              String errorMsg = result.optString("error", "خطأ غير معروف");
                              mainHandler.post(() -> onSubmitFailed(errorMsg));
                          }
                      } catch (Exception e) {
                          mainHandler.post(() -> onSubmitFailed(String.valueOf(e.getMessage())));
                      }
                  });
              }

              private void onSubmitFailed(String reason) {
                  resetConfirmButton();
                  Toast.makeText(activity, "حصل خطأ أثناء إرسال الطلب، حاول تاني. (" + reason + ")", Toast.LENGTH_LONG).show();
              }

              private void showSuccess(String orderName, String status) {
                  String label = (orderName == null || orderName.isEmpty()) ? "" : orderName;
                  if (successOrderIdView != null) {
                      successOrderIdView.setText(label.isEmpty() ? "" : "رقم الطلب: " + label);
                  }
                  if (successDescView != null) {
                      successDescView.setText("pending_payment_confirmation".equals(status)
                          ? "استلمنا طلبك، وسيتم تأكيده بعد التحقق من وصول المبلغ."
                          : "سنقوم بالتواصل معك قريباً لتأكيد التفاصيل وترتيب التوصيل");
                  }
                  if (successOverlay != null) {
                      successOverlay.setVisibility(View.VISIBLE);
                      successOverlay.setAlpha(0f);
                      successOverlay.animate().alpha(1f).setDuration(220).start();
                  }
                  if (orderConfirmedListener != null) {
                      orderConfirmedListener.onOrderConfirmed(label, currentTotal);
                  }
              }

