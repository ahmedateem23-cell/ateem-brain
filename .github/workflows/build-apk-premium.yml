                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.CENTER_VERTICAL);
                  row.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);

                  /* SHOP label — quiet and refined */
                  TextView shop = new TextView(activity);
                  shop.setText("SHOP");
                  shop.setTextSize(11);
                  shop.setTextColor(WARM_GRAY);
                  shop.setTypeface(labelTypeface);
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.LOLLIPOP) {
                      shop.setLetterSpacing(0.15f);
                  }
                  LinearLayout.LayoutParams shopParams = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  shopParams.leftMargin = dp(14);
                  shop.setPadding(dp(6), dp(6), dp(6), dp(6));
                  row.addView(shop, shopParams);

                  shop.setOnClickListener(v -> {
                      if (activity instanceof MainActivity) {
                          ((MainActivity) activity).getNativeNavigation().navigateToPath("/shop");
                      }
                  });

                  /* Chat Button — Bot Avatar on Deep Olive (matches website identity) */
                  FrameLayout chatBtn = new FrameLayout(activity);
                  GradientDrawable chatBg = new GradientDrawable();
                  chatBg.setShape(GradientDrawable.OVAL);
                  chatBg.setColor(OLIVE_DEEP);
                  chatBg.setStroke(dp(1), Color.argb(38, 184, 147, 106)); // faint gold ring, like the web version

                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.LOLLIPOP) {
                      RippleDrawable ripple = new RippleDrawable(
                          ColorStateList.valueOf(Color.argb(40, 184, 147, 106)), chatBg, null);
                      chatBtn.setBackground(ripple);
                  } else {
                      chatBtn.setBackground(chatBg);
                  }

                  chatBtn.setElevation(dp(3));

                  ImageView chatIcon = new ImageView(activity);
                  chatIcon.setScaleType(ImageView.ScaleType.CENTER_CROP);
                  Glide.with(activity)
                      .load(BOT_AVATAR_URL)
                      .transform(new CircleCrop())
                      .into(chatIcon);
                  FrameLayout.LayoutParams iconParams = new FrameLayout.LayoutParams(dp(46), dp(46), Gravity.CENTER);
                  chatBtn.addView(chatIcon, iconParams);

                  LinearLayout.LayoutParams chatBtnParams = new LinearLayout.LayoutParams(dp(46), dp(46));
                  row.addView(chatBtn, chatBtnParams);

                  chatBtn.setOnClickListener(v -> {
                      if (chatClickListener != null) chatClickListener.onChatClick();
                  });

                  /* Tactile press feedback — a quick scale-down on touch-down,
                     springing back on release, layered on top of the ripple
                     so the button visibly "reacts" the instant it's tapped. */
                  chatBtn.setOnTouchListener((v, event) -> {
                      switch (event.getAction()) {
                          case MotionEvent.ACTION_DOWN:
                              v.animate().scaleX(0.90f).scaleY(0.90f).setDuration(120).start();
                              break;
                          case MotionEvent.ACTION_UP:
                          case MotionEvent.ACTION_CANCEL:
                              v.animate().scaleX(1f).scaleY(1f).setDuration(180)
                                  .setInterpolator(new android.view.animation.OvershootInterpolator(3f))
                                  .start();
                              break;
                      }
                      return false; // let the click listener + ripple still fire normally
                  });

                  return row;
              }

              private int dp(int value) {
                  float density = activity.getResources().getDisplayMetrics().density;
                  return (int)(value * density + 0.5f);
              }
          }
