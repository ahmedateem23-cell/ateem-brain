          # AteemFirebaseMessagingService.java — Push notification for
          # "order confirmed" pings from the Cloudflare worker via FCM.
          # ==========================================

          cat > android/app/src/main/java/com/ateem/store/AteemFirebaseMessagingService.java << 'EOF'
          package com.ateem.store;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Build;

          import androidx.core.app.NotificationCompat;

          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;

          /*
           * Receives the "order confirmed" push sent by the ateem-proxy worker
           * right after a bankak/fawry order is manually confirmed. The order
           * itself already lives in Odoo — this is just a friendly ping so the
           * customer doesn't have to wonder if it went through.
           */
          public class AteemFirebaseMessagingService extends FirebaseMessagingService {

              private static final String CHANNEL_ID = "ateem_order_updates";

              @Override
              public void onMessageReceived(RemoteMessage remoteMessage) {
                  super.onMessageReceived(remoteMessage);

                  String title = "ATEEM STORE";
                  String body = "";
                  if (remoteMessage.getNotification() != null) {
                      if (remoteMessage.getNotification().getTitle() != null) {
                          title = remoteMessage.getNotification().getTitle();
                      }
                      if (remoteMessage.getNotification().getBody() != null) {
                          body = remoteMessage.getNotification().getBody();
                      }
                  }

                  showNotification(title, body);
              }

              private void showNotification(String title, String body) {
                  NotificationManager manager =
                      (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (manager == null) return;

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = manager.getNotificationChannel(CHANNEL_ID);
                      if (channel == null) {
                          channel = new NotificationChannel(
                              CHANNEL_ID, "تحديثات الطلبات", NotificationManager.IMPORTANCE_HIGH);
                          channel.setDescription("إشعارات تأكيد الطلبات من ATEEM STORE");
                          channel.enableLights(true);
                          channel.setLightColor(Color.parseColor("#7A8450"));
                          manager.createNotificationChannel(channel);
                      }
                  }

                  Intent launchIntent = new Intent(this, MainActivity.class);
                  launchIntent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  int piFlags = PendingIntent.FLAG_UPDATE_CURRENT;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      piFlags |= PendingIntent.FLAG_IMMUTABLE;
                  }
                  PendingIntent pendingIntent = PendingIntent.getActivity(
                      this, 0, launchIntent, piFlags);

                  NotificationCompat.Builder builder = new NotificationCompat.Builder(this, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .setContentTitle(title)
                      .setContentText(body)
                      .setStyle(new NotificationCompat.BigTextStyle().bigText(body))
                      .setAutoCancel(true)
                      .setContentIntent(pendingIntent)
                      .setPriority(NotificationCompat.PRIORITY_HIGH);

                  manager.notify((int) System.currentTimeMillis(), builder.build());
              }
          }
