              private void refreshSortOptionStyles() {
                  if (sortPanel == null) return;
                  for (int i = 0; i < sortPanel.getChildCount(); i++) {
                      View child = sortPanel.getChildAt(i);
                      if (!(child instanceof TextView)) continue;
                      TextView item = (TextView) child;
                      String key = String.valueOf(item.getTag());
                      boolean isActive = key.equals(activeSort);
                      item.setTypeface(isActive ? sansBold : Typeface.DEFAULT);
                      item.setTextColor(isActive ? OLIVE : CHARCOAL);
                      if (isActive) {
                          GradientDrawable itemBg = new GradientDrawable();
                          itemBg.setColor(Color.argb(24, 138, 154, 91));
                          itemBg.setCornerRadius(dp(10));
                          item.setBackground(itemBg);
                      } else {
                          item.setBackground(null);
                      }
                  }
              }
          
