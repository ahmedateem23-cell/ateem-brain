           * ترجمة native لتصميم checkout_page.html: هيدر (رجوع + عنوان) + بطاقة
           * بيانات التوصيل (اسم، هاتف، مدينة، عنوان) + بطاقة ملخص الطلب (نفس عناصر
           * السلة + الشحن + الإجمالي) + بطاقة طريقة الدفع (تحويل بنكاك/فوري مع نسخ
           * الرقم) + شريط تأكيد سفلي + شاشة نجاح بعد التأكيد. لا WebView إطلاقًا —
           * Views أصلية بالكامل، ونفس هوية الألوان/الخطوط المستخدمة في بقية الشاشات.
           */
          public class NativeCheckoutScreen {

