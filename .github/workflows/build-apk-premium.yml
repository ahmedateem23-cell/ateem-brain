            { id:"tropical-breeze-shirt-25", name:"Tropical Breeze Shirt", category:"قمصان", price:55000, currency:"SDG", img:"https://i.ibb.co/4wDp1dNm/file-00000000830c71f48af8c852c4e333a4.png", url:"https://ateem-store.odoo.com/shop/tropical-breeze-shirt-25" },
            { id:"olive-botanica-shirt-29", name:"Olive Botanica Shirt", category:"قمصان", price:95000, currency:"SDG", img:"https://i.ibb.co/SDsmMp3Y/file-000000006e8471f4abdb0224e3744601.png", url:"https://ateem-store.odoo.com/shop/olive-botanica-shirt-29" },
            { id:"prestige-olive-tee-28", name:"Prestige Olive Tee", category:"تيشيرتات", price:70000, currency:"SDG", img:"https://i.ibb.co/LzQ1Vq1D/file-00000000e44871f48226a06acb6d5829.png", url:"https://ateem-store.odoo.com/shop/prestige-olive-tee-28" },
            { id:"modern-tee-26", name:"Modern Tee", category:"تيشيرتات", price:48000, currency:"SDG", img:"https://i.ibb.co/4gS6fshQ/file-000000008ffc71f4a6651f40a6dcee06.png", url:"https://ateem-store.odoo.com/shop/modern-tee-26" },
            { id:"botanical-luxe-tee-30", name:"Botanical Luxe Tee", category:"تيشيرتات", price:70000, currency:"SDG", img:"https://i.ibb.co/Kj3sX5JJ/file-00000000681871f48d2db3d9a7aecfa4.png", url:"https://ateem-store.odoo.com/shop/botanical-luxe-tee-30" },
            { id:"elite-performance-tee-27", name:"Elite Performance Tee", category:"تيشيرتات", price:66000, currency:"SDG", img:"https://i.ibb.co/cSY6t7m5/file-00000000ce0871f4afa59ce040de4e8c.png", url:"https://ateem-store.odoo.com/shop/elite-performance-tee-27" },
            { id:"luxury-men-s-watch-32", name:"Luxury Men's Watch", category:"إكسسوارات", price:110000, currency:"SDG", img:"https://i.ibb.co/7Np7jwyy/file-00000000aaa072439c6791af42215f0d.png", url:"https://ateem-store.odoo.com/shop/luxury-men-s-watch-32" },
            { id:"luxury-men-s-sunglasses-31", name:"Luxury Men's Sunglasses", category:"إكسسوارات", price:36000, currency:"SDG", img:"https://i.ibb.co/8nxYSGv1/file-000000003158724396a2ced32048b52a.png", url:"https://ateem-store.odoo.com/shop/luxury-men-s-sunglasses-31" }
          ];

          const ATEEM_POLICY_TEXT = `
          سياسات متجر ATEEM:
          - التوصيل: داخل المدن الرئيسية 2-4 أيام عمل، وباقي المناطق 4-7 أيام عمل.
          - الاستبدال: خلال 14 يومًا من تاريخ الاستلام بشرط الحالة الأصلية مع الفاتورة.
          - الترجيع: خلال 7 أيام من الاستلام للمنتجات غير المستخدمة.
          `;

          const ATEEM_PROXY_URL = "https://ateem-proxy.ahmedatim23.workers.dev/";
          const GROQ_MODEL = "openai/gpt-oss-120b";

          /* ═══ Order notifications via Telegram ═══
             No token or chat id lives in the app at all. The app calls our
             own Cloudflare Worker proxy, which holds the Telegram secrets
             server-side and forwards the notification. Nothing sensitive
             is ever committed to git or shipped inside the APK. */

          function extractOrderJson(text) {
            const match = text.match(/\[ORDER_JSON\]([\s\S]*?)\[\/ORDER_JSON\]/);
            if (!match) return { displayText: text, orderData: null };
            let orderData = null;
            try { orderData = JSON.parse(match[1]); } catch (e) { orderData = null; }
            const displayText = text.replace(match[0], "").trim();
            return { displayText, orderData };
          }

          async function sendTelegramOrderNotification(order) {
            try {
              await fetch(ATEEM_PROXY_URL + "telegram-order", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(order)
              });
            } catch (e) {
              console.warn("Telegram order notification failed:", e);
            }
          }

          function fmtPrice(p) { return p.price.toLocaleString('en-US') + " " + p.currency; }
          function nowTime() { return new Date().toLocaleTimeString('ar-SA', { hour:'2-digit', minute:'2-digit' }); }

          function buildSystemPrompt() {
            const productLines = ATEEM_PRODUCTS.map(p =>
              `- [${p.id}] ${p.name} | الفئة: ${p.category} | السعر: ${fmtPrice(p)}`
            ).join("\n");
            return `أنت مساعد ذكي فاخر لمتجر ATEEM للأزياء الراقية.
          تتحدث باللغة العربية بأسلوب راقٍ ومحترف ودافئ.
          اجعل ردودك موجزة وأنيقة — لا تتجاوز 3-4 أسطر عادةً.
          قائمة المنتجات:
          ${productLines}
          ${ATEEM_POLICY_TEXT}
          تعليمات: عند ترشيح منتج اذكر رمزه [id] بين أقواس مربعة. لا تخترع منتجات غير موجودة.

          تعليمات إتمام الطلب:
          - إذا أبدى العميل رغبته الجدية بالشراء، اجمع منه بأسلوب طبيعي ومختصر: الاسم الكامل، المنتج المطلوب (والمقاس إن وجد)، العنوان الكامل، ورقم الهاتف.
          - لا تطلبها كلها دفعة واحدة في رسالة واحدة جافة؛ اسأل بشكل محادثة طبيعية على مراحل قصيرة.
          - الدفع دائمًا عند الاستلام فقط — لا تذكر أي طريقة دفع أخرى.
          - بمجرد اكتمال البيانات الأربع وتأكيد العميل النهائي على الطلب، أرسل رسالة تأكيد ودّية للعميل، ثم أضف في نهاية نفس الرسالة (بعدها مباشرة، بدون أي نص إضافي بعده) وسمًا مخفيًا بهذا الشكل بالضبط:
          [ORDER_JSON]{"name":"...","product":"...","size":"...","address":"...","phone":"..."}[/ORDER_JSON]
          - استخدم "" للحقول غير المتوفرة (مثل المقاس إن لم يذكره العميل). لا تُرسل هذا الوسم إلا مرة واحدة لكل طلب مكتمل ومؤكد فعليًا من العميل.`;
          }

          let panelIsOpen = false;
          let lastFailedMsg = null;
          const conversationHistory = [];
          const panel     = document.getElementById('ateem-panel');
          const chat      = document.getElementById('ateem-chat');
          const inputEl   = document.getElementById('ateem-input');
          const scrollBtn = document.getElementById('ateem-scroll-bottom');
          const voiceBtn  = document.getElementById('ateem-voice-btn');
          const backdrop  = document.getElementById('ateem-backdrop');

          function notifyNativeClosed() {
            if (window.AteemNative && window.AteemNative.onCloseRequested) {
              window.AteemNative.onCloseRequested();
            }
          }

          /* Called by the native Android side (NativeChatOverlay.show()) every
             time the WebView is revealed — this is the ONLY way the panel
             opens, there is no in-page button since the native header owns
             that button. */
          /* Keep the panel's real bottom edge locked to the visible viewport
             (not just the nav-bar inset from native), so the keyboard can
             never push the header off the top of the screen. */
          if (window.visualViewport) {
            const vv = window.visualViewport;
            let vvTicking = false;
            function syncKeyboardInset() {
              vvTicking = false;
              const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
              document.documentElement.style.setProperty('--ateem-kb-inset', kb + 'px');
            }
            function queueSync() { if (!vvTicking) { vvTicking = true; requestAnimationFrame(syncKeyboardInset); } }
            vv.addEventListener('resize', queueSync);
            vv.addEventListener('scroll', queueSync);
            syncKeyboardInset();
          }

          function openPanel() {
            panelIsOpen = true;
            panel.classList.remove('closing');
            panel.classList.add('active');
            if (backdrop) { backdrop.classList.remove('closing'); backdrop.classList.add('active'); }
            setTimeout(() => { inputEl.focus(); scrollAteemToBottom(true); }, 300);
          }
          window.ateemOpenPanel = openPanel;

          function closeAteemPanel() {
            panelIsOpen = false;
            panel.classList.remove('active');
            panel.classList.add('closing');
            if (backdrop) { backdrop.classList.remove('active'); backdrop.classList.add('closing'); }
            window.speechSynthesis && window.speechSynthesis.cancel();
            setTimeout(() => {
              panel.classList.remove('closing');
              if (backdrop) backdrop.classList.remove('closing');
              notifyNativeClosed();
            }, 350);
          }
          window.closeAteemPanel = closeAteemPanel;

          if (backdrop) backdrop.addEventListener('click', () => { if (panelIsOpen) closeAteemPanel(); });
          panel.addEventListener('click', (e) => e.stopPropagation());
          document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && panelIsOpen) closeAteemPanel(); });

          function scrollAteemToBottom(instant) {
            chat.scrollTo({ top: chat.scrollHeight, behavior: instant ? 'auto' : 'smooth' });
          }
          window.scrollAteemToBottom = scrollAteemToBottom;
          chat.addEventListener('scroll', () => {
            const nearBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 50;
            if (scrollBtn) scrollBtn.classList.toggle('visible', !nearBottom);
          });

          function renderProductCard(p) {
            return `<a href="${p.url}" class="ateem-product-card" target="_blank" rel="noopener">
              <img class="ateem-product-img" src="${p.img}" alt="${p.name}" loading="lazy" onerror="this.style.visibility='hidden'">
              <div class="ateem-product-info">
                <div class="ateem-product-name">${p.name}</div>
                <div class="ateem-product-cat">${p.category}</div>
                <div class="ateem-product-price">${fmtPrice(p)}</div>
              </div>
              <div class="ateem-product-btn">عرض المنتج</div>
            </a>`;
          }

          function renderQuickChips() {
            const replies = ATEEM_QUICK_REPLIES.home;
            const chips = replies.map(r =>
              `<span class="ateem-quick-chip" onclick="quickAteemReply('${r.replace(/'/g, "\\'")}')">${r}</span>`
            ).join('');
            return `<div class="ateem-quick-replies">${chips}</div>`;
          }
          window.quickAteemReply = function (text) {
            inputEl.value = text;
            sendAteemMessage();
          };

          function renderBotReply(text, includeQuickReplies) {
            const idsFound = [];
            const cleanText = text.replace(/\[([a-z0-9-]+)\]/gi, (m, id) => {
              if (ATEEM_PRODUCTS.find(p => p.id === id)) idsFound.push(id);
              return "";
            }).replace(/\s{2,}/g, " ").trim();

            let html = `<div class="ateem-msg-wrap ateem-bot">
              <div class="ateem-bot-msg">${cleanText.replace(/\n/g,'<br>')}</div>
              <div class="ateem-msg-time">${nowTime()}</div>
            </div>`;

            const uniqueIds = [...new Set(idsFound)];
            if (uniqueIds.length) {
              const cards = uniqueIds.map(id => ATEEM_PRODUCTS.find(p => p.id === id)).filter(Boolean).map(renderProductCard).join("");
              html += `<div class="ateem-products-wrap">${cards}</div>`;
            }
            if (includeQuickReplies) html += renderQuickChips();
            return html;
          }

          function renderUserMsg(text) {
            return `<div class="ateem-msg-wrap ateem-user">
              <div class="ateem-user-msg">${text.replace(/\n/g,'<br>')}</div>
              <div class="ateem-msg-time">${nowTime()}</div>
            </div>`;
          }

          function renderError(errMsg) {
            return `<div class="ateem-msg-wrap ateem-bot">
              <div class="ateem-error-msg">
                ⚠️ تعذّر الاتصال بالخادم<br>
                <small style="opacity:.6; font-size:10.5px">${errMsg}</small>
                <div class="ateem-error-retry" onclick="retryAteemLast()">إعادة المحاولة</div>
              </div>
            </div>`;
          }
          window.retryAteemLast = function () {
            if (lastFailedMsg) { inputEl.value = lastFailedMsg; sendAteemMessage(); }
          };

          async function askGroq(userMessage) {
            conversationHistory.push({ role:"user", content:userMessage });
            const MAX_HISTORY = 8;
            const trimmedHistory = conversationHistory.slice(-MAX_HISTORY);

            const response = await fetch(ATEEM_PROXY_URL, {
              method:"POST",
              headers:{ "Content-Type":"application/json" },
              body:JSON.stringify({ model:GROQ_MODEL,
                messages:[{ role:"system", content:buildSystemPrompt() }, ...trimmedHistory],
                max_tokens:350, temperature:0.7 })
            });
            if (!response.ok) { const e=await response.json().catch(()=>({})); throw new Error(e.error?.message||`HTTP ${response.status}`); }
            const data  = await response.json();
            const reply = data.choices?.[0]?.message?.content?.trim() || "عذراً، لم أتمكن من الرد الآن.";
            conversationHistory.push({ role:"assistant", content:reply });
            return reply;
          }

          async function sendAteemMessage() {
            const msg = inputEl.value.trim();
            if (!msg) return;
            inputEl.value = "";
            lastFailedMsg = msg;
            inputEl.disabled = true;

            chat.insertAdjacentHTML('beforeend', renderUserMsg(msg));
            scrollAteemToBottom();

            const tid = "t_" + Date.now();
            chat.insertAdjacentHTML('beforeend', `<div id="${tid}" class="ateem-typing"><span></span><span></span><span></span></div>`);
            scrollAteemToBottom();

            try {
              const reply = await askGroq(msg);
              document.getElementById(tid)?.remove();
              const { displayText, orderData } = extractOrderJson(reply);
              chat.insertAdjacentHTML('beforeend', renderBotReply(displayText, false));
              speakText(displayText);
              if (orderData) sendTelegramOrderNotification(orderData);
            } catch(e) {
              document.getElementById(tid)?.remove();
              chat.insertAdjacentHTML('beforeend', renderError(e.message));
            }
            scrollAteemToBottom();
            inputEl.disabled = false; inputEl.focus();
          }
          window.sendAteemMessage = sendAteemMessage;

          inputEl.addEventListener('keypress', e => { if (e.key === 'Enter') sendAteemMessage(); });
          const ateemSendBtn = document.querySelector('.ateem-send');
          if (ateemSendBtn) ateemSendBtn.addEventListener('click', sendAteemMessage);

          let recognition = null;
          let isRecording  = false;

          function toggleVoice() { isRecording ? stopVoice() : startVoice(); }
          window.toggleVoice = toggleVoice;

          function startVoice() {
            /* Ask for the OS-level RECORD_AUDIO permission only now, the
               moment the user taps the record icon — not on app launch. */
            if (window.AteemNative && window.AteemNative.requestMicPermission) {
              window.AteemNative.requestMicPermission();
            }
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) { alert('متصفحك لا يدعم التسجيل الصوتي'); return; }
            recognition = new SR();
            recognition.lang = 'ar-SA';
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.onstart = () => {
              isRecording = true;
              if (voiceBtn) voiceBtn.classList.add('recording');
              inputEl.placeholder = '🎙 جارٍ التسجيل...';
            };
            recognition.onresult = (e) => {
              inputEl.value = e.results[0][0].transcript;
              stopVoice();
              sendAteemMessage();
            };
            recognition.onerror = () => stopVoice();
            recognition.onend   = () => stopVoice();
            recognition.start();
          }

          function stopVoice() {
            isRecording = false;
            if (recognition) { recognition.stop(); recognition = null; }
            if (voiceBtn) voiceBtn.classList.remove('recording');
            inputEl.placeholder = 'اكتب رسالتك هنا...';
          }

          async function speakText(text) {
            const clean = text.replace(/<[^>]+>/g, '').replace(/[✦◆\[\]]/g, '').trim();
            if (!clean) return;
            try {
              const response = await fetch(ATEEM_PROXY_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ type: "tts", text: clean })
              });
              if (!response.ok) {
                const errText = await response.text();
                throw new Error("TTS HTTP " + response.status + ": " + errText);
              }
              const audioBlob = await response.blob();
              const audioUrl  = URL.createObjectURL(audioBlob);
              const audio     = new Audio(audioUrl);
              audio.play().catch(err => console.warn("Audio play blocked:", err));
              audio.onended = () => URL.revokeObjectURL(audioUrl);
            } catch (err) {
              console.warn("ElevenLabs TTS failed:", err);
            }
          }

          function initAteemWelcome() {
            chat.innerHTML = `
              <div class="ateem-welcome-banner">
                <div class="ateem-welcome-text">${pageCfg.welcome}</div>
                <div class="ateem-welcome-time">${nowTime()}</div>
              </div>
            ` + renderQuickChips();
          }
          initAteemWelcome();
          </script>
          </body>
          </html>
          EOF

      # 8. Sync Capacitor
      - name: Sync Capacitor
        run: npx cap sync android


      # 8.5 Add Glide dependency
      - name: Add Glide dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle")
          text = path.read_text()
          MARKER = "ATEEM_GLIDE_DEPENDENCY"
          if MARKER not in text:
              addition = """

          // """ + MARKER + """ - do not remove this marker comment

          dependencies {

              implementation 'com.github.bumptech.glide:glide:4.16.0'

              annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

              implementation 'androidx.core:core:1.12.0'
          }

          """
              text += addition
              path.write_text(text)
              print("Glide dependency appended.")
          else:
              print("Marker already present - skipping.")
          PY


      # 9. Restore release keystore
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/release.keystore


      # 10. Verify keystore
      - name: Verify keystore
        run: |
          test -s android/app/release.keystore
          ls -lh android/app/release.keystore
          file android/app/release.keystore


      # 11. Test release keystore
      - name: Test release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -list \
            -keystore android/app/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias ateemrelease


      # 12. Configure release signing
      - name: Configure release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle")
          text = path.read_text()
          MARKER = "ATEEM_RELEASE_SIGNING_CONFIG"
          if MARKER not in text:
              signing = """

          // """ + MARKER + """ - do not remove this marker comment

          android {

              signingConfigs {

                  ateemRelease {

                      storeFile file(
                          "release.keystore"
                      )

                      storePassword System.getenv(
                          "ATEEM_STORE_PASSWORD"
                      )

                      keyAlias System.getenv(
                          "ATEEM_KEY_ALIAS"
                      )

                      keyPassword System.getenv(
                          "ATEEM_KEY_PASSWORD"
                      )
                  }
              }


              buildTypes {

                  release {

                      signingConfig signingConfigs.ateemRelease

                      minifyEnabled false
                  }
              }
          }

          """
              text += signing
              path.write_text(text)
              print("Release signing config appended.")
          else:
              print("Marker already present - skipping.")
          print("---- build.gradle tail ----")
          print(path.read_text()[-1500:])
          PY


      # 13. Build release APK
      - name: Build release APK
        working-directory: android
        env:
          ATEEM_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ATEEM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ATEEM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Checking signing configuration..."
          test -n "$ATEEM_STORE_PASSWORD"
          test -n "$ATEEM_KEY_ALIAS"
          test -n "$ATEEM_KEY_PASSWORD"
          test -s app/release.keystore
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace


      # 13.5 List build outputs
      - name: List build outputs
        run: |
          echo "=== Searching for any APK files produced ==="
          find android/app/build/outputs -type f -name "*.apk" 2>/dev/null || true
          echo "=== Full outputs directory tree ==="
          find android/app/build/outputs -type f 2>/dev/null || echo "outputs directory does not exist or is empty"


      # 14. Upload APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ateem-store-apk-premium
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
