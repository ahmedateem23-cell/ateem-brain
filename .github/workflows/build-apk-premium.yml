              public void setProduct(int id, String name, double price, String image, String description) {
                  this.currentId = id;
                  this.currentName = name != null ? name : "";
                  this.currentPrice = price;
                  this.currentImage = image;
                  this.quantity = 1;
                  this.liked = false;

                  optionGroups.clear();
                  variants.clear();
                  flatStock = null;
                  if (optionsContainer != null) optionsContainer.removeAllViews();

                  if (nameLabel != null) nameLabel.setText(currentName);
                  if (priceLabel != null) priceLabel.setText(formatPrice(price) + " SDG");
                  if (descLabel != null) {
                      descLabel.setText(TextUtils.isEmpty(description) ? "" : description);
                      descLabel.setVisibility(TextUtils.isEmpty(description) ? View.GONE : View.VISIBLE);
                  }
                  if (qtyValue != null) qtyValue.setText("1");
                  if (productImage != null && image != null) {
                      Glide.with(activity).load(image)
                          .diskCacheStrategy(DiskCacheStrategy.ALL)
                          .centerCrop()
                          .into(productImage);
                  }
                  /* Buttons stay disabled-looking (via updatePurchaseAvailability)
                     until the real options/variants/stock come back — never
                     purchasable on guessed data. */
                  updatePurchaseAvailability();
                  fetchProductDetail(id);
              }

              /* Pulls real attributes + variants + stock for this exact
                 product from Odoo (via the Worker) and rebuilds the
                 selectors from that — never inferred from the name/desc. */
              private void fetchProductDetail(int id) {
                  detailExecutor.execute(() -> {
                      try {
                          URL url = new URL(PRODUCT_DETAIL_URL + id);
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("GET");
                          conn.setConnectTimeout(12000);
                          conn.setReadTimeout(12000);
                          BufferedReader reader = new BufferedReader(
                              new InputStreamReader(conn.getInputStream(), StandardCharsets.UTF_8));
                          StringBuilder sb = new StringBuilder();
                          String line;
                          while ((line = reader.readLine()) != null) sb.append(line);
                          reader.close();

                          JSONObject root = new JSONObject(sb.toString());
                          if (!root.optBoolean("ok", false)) return;
                          JSONObject p = root.optJSONObject("product");
                          if (p == null || p.optInt("id") != id) return; // stale response for a screen the user already left

                          List<OptionGroup> newGroups = new ArrayList<>();
                          JSONArray optsArr = p.optJSONArray("options");
                          if (optsArr != null) {
                              for (int i = 0; i < optsArr.length(); i++) {
                                  JSONObject o = optsArr.getJSONObject(i);
                                  OptionGroup g = new OptionGroup();
                                  g.name = o.optString("name");
                                  g.values = new ArrayList<>();
                                  JSONArray valsArr = o.optJSONArray("values");
                                  if (valsArr != null) {
                                      for (int j = 0; j < valsArr.length(); j++) g.values.add(valsArr.getString(j));
                                  }
                                  if (g.values.size() == 1) g.selected = g.values.get(0); // single option — nothing to pick
                                  if (!g.values.isEmpty()) newGroups.add(g);
                              }
                          }

                          List<Variant> newVariants = new ArrayList<>();
                          JSONArray variantsArr = p.optJSONArray("variants");
                          if (variantsArr != null) {
                              for (int i = 0; i < variantsArr.length(); i++) {
                                  JSONObject vo = variantsArr.getJSONObject(i);
                                  Variant v = new Variant();
                                  v.id = vo.optInt("id");
                                  v.price = vo.optDouble("price", currentPrice);
                                  v.stock = vo.optInt("stock", 0);
                                  v.values = new HashMap<>();
                                  JSONObject valuesObj = vo.optJSONObject("values");
                                  if (valuesObj != null) {
                                      Iterator<String> keys = valuesObj.keys();
                                      while (keys.hasNext()) {
                                          String k = keys.next();
                                          v.values.put(k, valuesObj.optString(k));
                                      }
                                  }
                                  newVariants.add(v);
                              }
                          }

                          Integer newFlatStock = p.isNull("stock") ? null : p.optInt("stock");

                          detailMainHandler.post(() -> {
                              if (currentId != id) return; // user already navigated away
                              optionGroups.clear();
                              optionGroups.addAll(newGroups);
                              variants.clear();
                              variants.addAll(newVariants);
                              flatStock = newFlatStock;
                              if (optionsContainer != null) renderOptions();
                              onSelectionChanged();
                          });
                      } catch (Exception e) {
                          /* Network hiccup — leave the screen exactly as it
                             was (buttons stay disabled) rather than showing
                             a wrong purchasable state. */
                      }
                  });
              }

              private int maxSelectableQuantity() {
                  if (!variants.isEmpty()) {
                      Variant v = resolveSelectedVariant();
                      return v != null ? Math.max(1, v.stock) : 1;
                  }
                  return flatStock != null ? Math.max(1, flatStock) : 99;
              }

              private String missingSelectionMessage() {
                  for (OptionGroup g : optionGroups) {
                      if (g.selected == null) return "اختر " + g.name + " أولاً";
                  }
                  return "هذا المنتج غير متوفر حالياً";
              }

              private String formatPrice(double price) {
                  DecimalFormat formatter = new DecimalFormat("#,###",
                      new java.text.DecimalFormatSymbols(Locale.US));
                  return formatter.format(price);
              }

              /* ============== HELPERS ============== */
              private void roundCorners(View view, int radiusPx) {
                  view.setClipToOutline(true);
                  view.setOutlineProvider(new ViewOutlineProvider() {
                      @Override
                      public void getOutline(View v, Outline outline) {
                          outline.setRoundRect(0, 0, v.getWidth(), v.getHeight(), radiusPx);
                      }
                  });
              }

              private int dp(int value) {
                  float density = activity.getResources().getDisplayMetrics().density;
                  return (int)(value * density + 0.5f);
              }
          }
