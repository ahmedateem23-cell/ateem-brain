              private void onOrderConfirmed(String orderId, double total) {
                  /* Mirrors the localStorage cart-clear in checkout_page.html
                     once an order is placed — the in-app cart empties too,
                     and the home header's cart badge reflects it right away
                     even while the success screen is still showing. */
                  NativeCartScreen.clearCart();
                  if (nativeCartScreen != null) nativeCartScreen.refresh();
                  if (nativeHomeScreen != null) nativeHomeScreen.refreshCartBadge();
                  checkoutOrderJustConfirmed = true;
              }

              private void showNativeCheckout(double total) {
                  if (nativeCheckoutScreenView == null) return;
                  if (webView != null) webView.setVisibility(View.GONE);
                  if (nativeHomeScreenView != null) nativeHomeScreenView.setVisibility(View.GONE);
                  if (nativeShopScreenView != null) nativeShopScreenView.setVisibility(View.GONE);
                  if (nativeCartScreenView != null) nativeCartScreenView.setVisibility(View.GONE);
                  nativeCheckoutScreenView.setVisibility(View.VISIBLE);
                  nativeCheckoutScreenView.bringToFront();

                  /* Checkout owns its own sticky confirm bar at the bottom,
                     same as the cart screen it's opened from, so the
                     floating bottom nav steps aside here too. */
                  View navView = nativeNavigation.getNavBarView();
                  if (navView != null) navView.setVisibility(View.GONE);
                  nativeCheckoutScreenView.setPadding(0, 0, 0, 0);

                  if (nativeCheckoutScreen != null) nativeCheckoutScreen.onScreenShown(total);
              }

              private void onCheckoutBack() {
                  if (nativeCheckoutScreenView != null) nativeCheckoutScreenView.setVisibility(View.GONE);
                  if (checkoutOrderJustConfirmed) {
                      checkoutOrderJustConfirmed = false;
                      showNativeHome();
                  } else {
                      showNativeCart();
                  }
              }

              private void showWebView(String path) {
                  pendingRevealWebView = true;
                  if (nativeHomeScreenView != null) nativeHomeScreenView.setVisibility(View.GONE);
                  if (nativeShopScreenView != null) nativeShopScreenView.setVisibility(View.GONE);
                  if (nativeCartScreenView != null) nativeCartScreenView.setVisibility(View.GONE);
                  if (nativeCheckoutScreenView != null) nativeCheckoutScreenView.setVisibility(View.GONE);
                  /* Bar only hides on the cart/checkout pages — restore it
                     here in case we're arriving from one of those (e.g.
                     tapping "حسابي" while on the cart tab). */
                  View navView = nativeNavigation.getNavBarView();
                  if (navView != null) navView.setVisibility(View.VISIBLE);
                  nativeNavigation.loadWebUrl(path);
              }

              private void onAteemChatButtonClick() {
                  /* Fully in-app now — no WebView navigation, no dependency
                     on any page having loaded. Just toggle the local
                     overlay, which is always ready. */
                  if (nativeChatOverlay == null) return;
                  if (nativeChatOverlay.isVisible()) {
                      nativeChatOverlay.hide();
                  } else {
                      nativeChatOverlay.show();
                  }
              }

              @Override
              public void onBackPressed() {
                  if (nativeChatOverlay != null && nativeChatOverlay.isVisible()) {
                      nativeChatOverlay.hide();
                      return;
                  }
                  if (nativeProductDetailScreenView != null
                          && nativeProductDetailScreenView.getVisibility() == View.VISIBLE) {
                      onProductDetailBack();
                      return;
                  }
                  if (nativeCheckoutScreenView != null
                          && nativeCheckoutScreenView.getVisibility() == View.VISIBLE) {
                      onCheckoutBack();
                      return;
                  }
                  super.onBackPressed();
              }

              private void onCategoryOrFooterLinkClick(String path) {
                  /* The new home screen's header cart button and search bar
                     hand in "/shop/cart" and "/shop" — both are native tabs
                     already handled by the bottom nav, so route them through
                     the same tab-switch logic (navigateToPath) instead of
                     forcing a WebView load. Keeps the cart badge and bottom
                     nav highlight in sync no matter which button was tapped. */
                  if ("/".equals(path) || "/shop".equals(path)
                          || "/shop/cart".equals(path) || "/my/account".equals(path)) {
                      nativeNavigation.navigateToPath(path);
                      return;
                  }
                  pendingRevealWebView = true;
                  nativeNavigation.openWebPath(path, 1);
              }

              private void revealWebViewIfPending() {
                  if (!pendingRevealWebView) return;
                  pendingRevealWebView = false;
                  if (nativeHomeScreenView != null) nativeHomeScreenView.setVisibility(View.GONE);
                  if (nativeShopScreenView != null) nativeShopScreenView.setVisibility(View.GONE);
                  if (nativeCartScreenView != null) nativeCartScreenView.setVisibility(View.GONE);
                  if (nativeCheckoutScreenView != null) nativeCheckoutScreenView.setVisibility(View.GONE);
                  if (webView != null) webView.setVisibility(View.VISIBLE);
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemUI();
              }

              private void hideSystemUI() {
                  View decorView = getWindow().getDecorView();
                  decorView.setSystemUiVisibility(
                        View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                  );
              }

              private void injectAteemContextFlags(WebView view) {
                  if (view == null || ateemContextFlagsJs == null || ateemContextFlagsJs.isEmpty()) return;
                  view.evaluateJavascript(ateemContextFlagsJs, null);
              }

              private void injectAteemTouchPolish(WebView view) {
                  if (view == null || ateemTouchPolishJs == null || ateemTouchPolishJs.isEmpty()) return;
                  view.evaluateJavascript(ateemTouchPolishJs, null);
              }

              private String loadAsset(String path) {
                  StringBuilder builder = new StringBuilder();
                  try (
                      InputStream is = getAssets().open(path);
                      BufferedReader reader = new BufferedReader(
                          new InputStreamReader(is, StandardCharsets.UTF_8)
                      )
                  ) {
                      String line;
                      while ((line = reader.readLine()) != null) {
                          builder.append(line).append('\n');
                      }
                  } catch (IOException e) { e.printStackTrace(); }
                  return builder.toString();
              }
          }
