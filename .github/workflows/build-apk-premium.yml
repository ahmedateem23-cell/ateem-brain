          package com.ateem.store;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.graphics.Color;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          /*
           * ATEEM Chat — Fully In-App Edition
           * The chat panel (header avatar, messages, quick replies, product
           * cards, voice input, TTS) is bundled as a local HTML/CSS/JS asset
           * at android/app/src/main/assets/ateem_chat/chat.html and rendered
           * in a small transparent WebView that lives on top of the native
           * shell. It never loads anything from ateem-store.com, so it opens
           * instantly and works the same whether the user is on the native
           * home screen or browsing a shop page.
           */
          public class NativeChatOverlay {
              /* WebChromeClient/PermissionRequest below grant the chat
                 page's voice input access to the mic: even with the
                 manifest + runtime RECORD_AUDIO permission in place, a
                 plain WebViewClient still silently blocks the page's own
                 getUserMedia/SpeechRecognition permission prompt unless a
                 WebChromeClient explicitly grants it. */

              private final Activity activity;
              private WebView webView;
              private boolean isVisible = false;
              private boolean pageReady = false;
              private int bottomInsetPx = 0;
              private int topInsetPx = 0;

              public NativeChatOverlay(Activity activity) {
                  this.activity = activity;
              }

              @SuppressLint("SetJavaScriptEnabled")
              public View build() {
                  webView = new WebView(activity);
                  webView.setBackgroundColor(Color.TRANSPARENT);
                  /* Transparent hardware-accelerated WebViews can render behind
                     sibling native views regardless of add/bringToFront order —
                     a known WebView quirk. Forcing LAYER_TYPE_SOFTWARE used to
                     be the workaround here, but it made every scroll/keystroke
                     inside the bot render on the CPU instead of the GPU, which
                     is what made the bot feel heavy while browsing and typing.
                     Elevation solves the same stacking problem while keeping
                     the WebView hardware-accelerated. */
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.LOLLIPOP) {
                      webView.setElevation(9999f);
                  }
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          pageReady = true;
                          applyBottomInset();
                          applyTopInset();
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          activity.runOnUiThread(() -> {
                              for (String resource : request.getResources()) {
                                  if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(resource)) {
                                      request.grant(new String[]{ PermissionRequest.RESOURCE_AUDIO_CAPTURE });
                                      return;
                                  }
                              }
                              request.deny();
                          });
                      }
                  });
                  webView.addJavascriptInterface(new JsBridge(), "AteemNative");
                  webView.setVisibility(View.GONE);
                  webView.loadUrl("file:///android_asset/ateem_chat/chat.html");
                  return webView;
              }

              public View getView() { return webView; }

              public boolean isVisible() { return isVisible; }

              /* Tells the panel exactly how tall the main header is, so its
                 top edge starts right below it instead of a fixed guess
                 that leaves an uneven gap on some screens. */
              public void setTopInset(int px) {
                  topInsetPx = px;
                  applyTopInset();
              }

              /* Android view measurements (getHeight(), dp() helpers, etc.)
                 are raw device pixels — already multiplied by the screen's
                 density. The WebView's CSS pixels are density-independent,
                 so injecting the raw device-pixel number directly as a CSS
                 "px" value made the gap several times too large on any
                 screen with density > 1 (e.g. 3x on an xxhdpi phone). This
                 divides back down to CSS px before it ever reaches the DOM. */
              private float cssPx(int devicePx) {
                  float density = activity.getResources().getDisplayMetrics().density;
                  return density > 0 ? devicePx / density : devicePx;
              }

              private void applyTopInset() {
                  if (webView == null || !pageReady) return;
                  webView.evaluateJavascript(
                      "(function(){ document.documentElement.style.setProperty('--ateem-top-inset','"
                          + cssPx(topInsetPx) + "px'); })();",
                      null
                  );
              }

              /* Tells the panel exactly how tall the bottom nav bar is, so
                 its bottom edge always ends a comfortable margin above it
                 instead of a fixed guess that can overlap on some screens. */
              public void setBottomInset(int px) {
                  bottomInsetPx = px;
                  applyBottomInset();
              }

              private void applyBottomInset() {
                  if (webView == null || !pageReady) return;
                  webView.evaluateJavascript(
                      "(function(){ document.documentElement.style.setProperty('--ateem-bottom-inset','"
                          + cssPx(bottomInsetPx) + "px'); })();",
                      null
                  );
              }

              public void show() {
                  if (webView == null) return;
                  isVisible = true;
                  webView.bringToFront();
                  webView.setVisibility(View.VISIBLE);
                  webView.evaluateJavascript(
                      "(function(){ if (window.ateemOpenPanel) window.ateemOpenPanel(); })();",
                      null
                  );
              }

              public void hide() {
                  if (webView == null) return;
                  isVisible = false;
                  webView.setVisibility(View.GONE);
              }

              /* Called from the local chat.html once its own close
                 animation finishes, so the WebView is only hidden after
                 the panel/backdrop have visually faded out. */
              private class JsBridge {
                  @JavascriptInterface
                  public void onCloseRequested() {
                      activity.runOnUiThread(NativeChatOverlay.this::hide);
                  }

                  /* Called from chat.html the moment the user taps the
                     record/mic icon — this is the only place RECORD_AUDIO
                     is ever requested, so the OS permission prompt never
                     appears on app launch, only on first mic tap. */
                  @JavascriptInterface
                  public void requestMicPermission() {
                      activity.runOnUiThread(() -> {
                          if (androidx.core.content.ContextCompat.checkSelfPermission(
                                  activity, android.Manifest.permission.RECORD_AUDIO)
                                  != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                              androidx.core.app.ActivityCompat.requestPermissions(
                                  activity,
                                  new String[]{ android.Manifest.permission.RECORD_AUDIO },
                                  4802
                              );
                          }
                      });
                  }
              }
          }
