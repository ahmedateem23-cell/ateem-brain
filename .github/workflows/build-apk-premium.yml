                  item.setOnClickListener(v -> {
                      activeSort = key;
                      closeSortDropdown();
                      applyDisplay();
                  });
                  item.setLayoutParams(new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));
                  return item;
