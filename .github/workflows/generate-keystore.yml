name: Generate Keystore (one-time)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias ateemrelease \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "MyTempPass123" \
            -keypass "MyTempPass123" \
            -dname "CN=Ateem, OU=Ateem, O=Ateem, L=Khartoum, S=Khartoum, C=SD"

          base64 -w 0 release.keystore > keystore_base64.txt

      - name: Upload keystore files
        uses: actions/upload-artifact@v4
        with:
          name: keystore-files
          path: |
            release.keystore
            keystore_base64.txt
