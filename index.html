<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>ATEEM STORE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=IBM+Plex+Sans+Arabic:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F5F0E8;
    --cream-deep:#EDE7DC;
    --gold:#B8936A;
    --gold-light:#D4A97A;
    --gold-pale:#E8D5C0;
    --ink-soft:#3D3020;
    --ink-muted:#7A6850;
    --ink-faint:#B5A99A;
    --navy:#1B263B;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    width:100%;
    height:100%;
    background:var(--cream);
  }

  #splash{
    direction:rtl;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:fixed;
    inset:0;
    z-index:99999;
    overflow:hidden;
    background:linear-gradient(160deg, #F5F0E8 0%, #EDE7DC 40%, #E8D5C0 100%);
    transition: opacity 0.5s cubic-bezier(0.4,0,0.2,1),
                transform 0.5s cubic-bezier(0.4,0,0.2,1),
                filter 0.5s cubic-bezier(0.4,0,0.2,1);
  }

  #splash.exit{
    opacity:0;
    transform:scale(0.96) translateY(-10px);
    filter:blur(4px);
  }

  #splash::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:radial-gradient(ellipse at 50% 30%, rgba(184,147,106,0.08) 0%, transparent 60%);
  }

  .decor{position:absolute;pointer-events:none;border-radius:50%;}
  .decor-top-right{
    top:-40px;right:-40px;width:180px;height:180px;
    border:1px solid rgba(184,147,106,0.12);
  }
  .decor-bottom-left{
    bottom:-60px;left:-60px;width:220px;height:220px;
    border:1px solid rgba(184,147,106,0.10);
  }
  .decor-line{
    position:absolute;pointer-events:none;
    top:35%;left:10%;right:10%;height:1px;
    background:linear-gradient(90deg, transparent, rgba(184,147,106,0.08), transparent);
  }

  .logo-wrap{
    width:120px;height:120px;
    border-radius:50%;
    border:2.5px solid rgba(184,147,106,0.35);
    box-shadow:0 8px 32px rgba(27,38,59,0.12), 0 0 0 8px rgba(184,147,106,0.06);
    overflow:hidden;
    background:#fff;
    opacity:0;
    transform:scale(0.7) translateY(20px);
    animation: logoIn 0.8s cubic-bezier(0.22,1,0.36,1) 0.2s forwards;
  }
  .logo-wrap img{
    width:100%;height:100%;object-fit:cover;
  }
  @keyframes logoIn{
    to{ opacity:1; transform:scale(1) translateY(0); }
  }

  .brand-name{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-size:42px;
    font-weight:300;
    letter-spacing:0.35em;
    color:var(--ink-soft, #1A1A1A);
    margin-top:28px;
    text-transform:uppercase;
    opacity:0;
    transform:translateY(16px);
    animation: fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) 0.6s forwards;
  }

  .tagline{
    font-family:'IBM Plex Sans Arabic', Tajawal, sans-serif;
    font-size:14px;
    font-weight:300;
    letter-spacing:0.08em;
    color:var(--ink-muted);
    margin-top:10px;
    opacity:0;
    transform:translateY(12px);
    animation: fadeUp 0.6s cubic-bezier(0.22,1,0.36,1) 0.9s forwards;
  }

  @keyframes fadeUp{
    to{ opacity:1; transform:translateY(0); }
  }

  .divider{
    width:48px;height:1.5px;
    margin-top:18px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    border-radius:1px;
    opacity:0;
    transform:scaleX(0);
    transform-origin:center;
    animation: dividerIn 0.5s cubic-bezier(0.22,1,0.36,1) 1.1s forwards;
  }
  @keyframes dividerIn{
    to{ opacity:1; transform:scaleX(1); }
  }

  .dots{
    display:flex;
    gap:6px;
    margin-top:32px;
    opacity:0;
    animation: fadeIn 0.4s ease 1.4s forwards;
  }
  .dots span{
    width:6px;height:6px;border-radius:50%;
    background:var(--gold);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .dots span:nth-child(1){animation-delay:0s;}
  .dots span:nth-child(2){animation-delay:0.2s;}
  .dots span:nth-child(3){animation-delay:0.4s;}
  @keyframes pulse{
    0%,80%,100%{ opacity:0.3; transform:scale(0.8); }
    40%{ opacity:1; transform:scale(1); }
  }
  @keyframes fadeIn{
    to{ opacity:1; }
  }

  .loading-text{
    font-family:'IBM Plex Sans Arabic', sans-serif;
    font-size:11px;
    font-weight:300;
    color:var(--ink-faint);
    margin-top:12px;
    letter-spacing:0.1em;
    opacity:0;
    animation: fadeIn07 0.5s ease 1.5s forwards;
  }
  @keyframes fadeIn07{
    to{ opacity:0.7; }
  }
</style>
</head>
<body>
  <div id="splash">
    <div class="decor decor-top-right"></div>
    <div class="decor decor-bottom-left"></div>
    <div class="decor-line"></div>

    <div class="logo-wrap">
      <img src="assets/logo.png" alt="ATEEM Logo" />
    </div>

    <div class="brand-name">ATEEM</div>
    <div class="tagline">أناقة رجالية راقية</div>
    <div class="divider"></div>

    <div class="dots">
      <span></span><span></span><span></span>
    </div>
    <div class="loading-text">جارٍ التحميل...</div>
  </div>

  <script>
    // إخفاء شريط الحالة فوراً (يفضل مخفي حتى بعد الانتقال لموقع المتجر)
    (function hideStatusBar() {
      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.StatusBar) {
        window.Capacitor.Plugins.StatusBar.hide();
      } else {
        document.addEventListener('deviceready', function () {
          if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.StatusBar) {
            window.Capacitor.Plugins.StatusBar.hide();
          }
        });
      }
    })();

    var SHOW_DURATION_MS = 2800;
    var EXIT_DURATION_MS = 500;
    var DESTINATION_URL = "https://www.ateem-store.com";

    setTimeout(function () {
      var splash = document.getElementById('splash');
      splash.classList.add('exit');
      setTimeout(function () {
        window.location.replace(DESTINATION_URL);
      }, EXIT_DURATION_MS);
    }, SHOW_DURATION_MS);
  </script>
</body>
</html>
